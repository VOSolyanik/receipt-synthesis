# Fiscal rules per jurisdiction — LAW, not policy.
#
# VAT rates, VAT letter codes, identifier formats and their checksums, receipt
# layout constants and fiscal QR payloads. Derived from public sources: Ukrainian
# cash register law (ЗУ «Про застосування РРО...»), Tax Code VAT rates, and the
# published fiscal document formats of PL / DE / ES.
#
# The UA layout constants below were additionally verified against the author's
# own ПРРО receipts — an explicitly permitted source, see the provenance rules in
# docs/architecture.md#provenance. Confirmed facts are listed under
# `verified_against_own_receipts`; only layout facts are carried over, never the
# concrete values printed on a real receipt.
#
# Kept separate from policy.yaml on purpose: policy.yaml describes a benefit
# plan and may be loaded by downstream consumers; this file is fiscal law and
# concerns document generation only.

version: 1

jurisdictions:

  # ---------------------------------------------------------------- Ukraine --
  UA:
    language: uk
    currency: UAH
    date_format: "%d.%m.%Y"
    # ПРРО software prints the time with dashes, not colons: 11-50-17.
    time_format: "%H-%M-%S"

    number_format:
      # Vendors differ: some ПРРО print 2 500.00, others 2 500,00. Pick per
      # rendered document so the model sees both.
      decimal_separator_variants: [".", ","]
      # No-break space (U+00A0) between thousands. Not the narrow one (U+202F): what
      # was verified against own receipts is "a space", and the vendored fonts cover
      # both, so claiming the narrow variant would assert more than was observed.
      thousands_separator: " "

    vat_rates:
      standard: 20.0
      reduced: 7.0      # medicines, medical devices (Tax Code art. 193.1)
      agri: 14.0
      zero: 0.0

    # ПДВ-літера — the VAT letter printed at the end of each line item on a
    # Ukrainian fiscal receipt, with a legend in the tax block at the bottom.
    # The letter -> tax-group mapping is assigned by the SELLER and printed on
    # the receipt, so this is a conventional mapping rather than a statutory one
    # (unlike PL, where PTU letters are fixed by law).
    #
    # EVERY LETTER HERE BELONGS TO A SELLER THAT IS REGISTERED FOR ПДВ. A seller that is
    # not prints no letter at all — see the note beside `Г` — and the status itself is a
    # property of the vendor, in config/vendors.json.
    vat_letters:
      А: { rate: 20.0, name: "ПДВ" }
      Б: { rate: 20.0, name: "ПДВ + АЗ" }   # АЗ — акцизний збір / excise duty
      В: { rate: 7.0,  name: "ПДВ" }
      # THE ZERO-RATE GROUP OF A REGISTERED PAYER, AND NOT THE ANSWER FOR A NON-PAYER.
      # A seller with no ПДВ registration prints no letter on the line and no tax row under
      # the totals — 👁 observed, and "Без ПДВ" appears on no open sample even though it is
      # 📄 named as permissible practice. Using `Г` for such a seller would print a
      # "ПДВ Г=0,00%" row that no real receipt of that kind carries. The three sources that
      # disagree about the non-payer's letter are recorded in config/generation.yaml.
      Г: { rate: 0.0,  name: "Без ПДВ" }

    # Label of a row in the tax summary block, e.g. "ПДВ А=20,00%". The AMOUNT IS NOT PART OF
    # IT: it is printed in the same right-hand column as every other amount on the receipt,
    # and folding it into this string is what used to leave the VAT amounts out of column.
    #
    # THE EQUALS SIGN AND THE TWO DECIMALS ARE BOTH 👁 OBSERVED, on every open sample that
    # carries the row: `ПДВ А=20,00%` (2/2 drawn specimens) and `ПДВ В=20,00%` (8/8 petrol
    # receipts) — 10/10 with both. `{rate_2dp}` renders two decimals with THIS DOCUMENT's
    # own decimal separator, drawn per document from `number_format` above, so the rate reads
    # the same way as the amounts printed beside it; the one specimen whose line amounts are
    # legible prints them with a comma too. `{rate:g}` is the bare number, still used by the
    # jurisdictions where no such row has been observed.
    tax_line_label_format: "{name} {letter}={rate_2dp}%"
    # The letter is appended to the line item itself, e.g.
    # "Regular ticket    2 500.00 А".
    line_item_letter_position: suffix

    # Which VAT letter a line item takes, by item kind (policy.yaml vocabulary).
    # Medicines and medical devices are the reduced 7% group; food supplements are
    # standard 20%.
    #
    # A vitamin complex may be registered EITHER as a medicinal product or as a
    # dietary supplement, and real receipts show both — hence a list, drawn from
    # per document. This is what stops the VAT letter from being a shortcut to the
    # coverage label, since vitamin complexes are covered and medicines are not.
    item_vat_letter:
      medicine: В
      medical_device: В
      vitamin_complex: [В, А]
      mineral_supplement: А
      sports_nutrition: А
      probiotic: А
      default: А

    identifiers:
      # THE SELLER BLOCK CARRIES UP TO TWO IDENTIFIER LINES, AND THEY ARE NOT ALTERNATIVES.
      #
      #   ІД — identification code. OPTIONAL, and in fact the minority case: 👁 1/3.
      #        legal entity -> ЄДРПОУ, 8 digits · sole trader -> РНОКПП, 10 digits.
      #   ПН — VAT-payer number. Printed ONLY by a seller registered for ПДВ.
      #        legal entity -> 12 digits · sole trader -> the same 10-digit РНОКПП.
      #
      # THE LENGTH FOLLOWS THE TYPE OF PERSON, NOT THE PREFIX. That is the whole of the rule,
      # and it is what the older reading got wrong by hanging a length on each prefix.
      #
      # A CONFLICT BETWEEN SOURCES, RECORDED AS ONE — the same shape as the non-payer's VAT
      # letter at the head of config/generation.yaml, and settled the same way:
      #
      #   📄 The Положення про форму та зміст розрахункових документів (наказ Мінфіну № 13,
      #      редакція 11.01.2025), розділ II п. 2, describes the two lines separately: a
      #      registered payer prints its individual VAT-payer number preceded by «ПН»; a seller
      #      that is not a payer prints its tax number — or a passport series and number —
      #      preceded by «ІД». 📄 A published table of the form then carries them as lines 4 and
      #      5 with ALTERNATIVE example values, «ПН 123456789012» or «ІД 2345678901» — invented
      #      sequences printed in that source, not values off any real document — from which it
      #      is natural, and wrong, to read the two lines as mutually exclusive.
      #   📄 A second published commentary (04.06.2026) states the split in the same shape: the
      #      VAT-payer number is printed for payers and the tax number for non-payers.
      #   👁 Real ПРРО output DISAGREES, and decisively. On the receipts examined: «ПН» appears
      #      on 3 of 3; a receipt of a registered COMPANY prints «ПН» AND «ІД» together; and a
      #      registered SOLE TRADER prints «ПН» carrying its ten-digit РНОКПП — the same number
      #      its «ІД» line would carry — with the VAT block present as usual. So a payer is not
      #      a seller without a tax number; it is a seller with one more line.
      #
      # 🔴 OBSERVATION WINS, because the dataset's job is to look like what a verifier receives.
      # The samples are ПРРО vendor-software output examined by the author. Counts, stated as
      # they were established and not rounded up: 👁 «ПН» 3/3 · 👁 «ІД» 1/3 · 👁 the ПН-before-ІД
      # order 1/1 of the receipts carrying both · 👁 the prefix relation below 1/1.
      #
      # 🔴 «ІД» IS THE MINORITY CASE, AND THIS GENERATOR PRINTS IT ANYWAY. 👁 1/3 — two of the
      # three receipts carry no «ІД» at all. It is printed on every document all the same,
      # because it is the SUPERSET: the field is present, so an extraction step has something to
      # look for, and a dataset that omitted it could not exercise the field at all. The cost is
      # that the dataset OVERSTATES how often «ІД» appears, which is a sim-to-real gap and is
      # declared as one in config/labelling-schema.yaml under `known_limitations` — a consumer
      # must not infer a real-world frequency from this corpus.
      #
      # 🔴 THE AXIS OF VARIATION IS THE ПРРО SOFTWARE PROVIDER, NOT THE SELLER. Three receipts,
      # three different providers, and exactly one of the three prints «ІД». Layout, line order
      # and which optional requisites appear are each provider's own. So this is NOT a property
      # of the vendor and must not become a flag on a vendor entry — that would model the wrong
      # level. The variant belongs in a second template, and it is named as a gap below.
      #
      # WHAT IS MISSING, AS ONE GAP: a second provider template that prints NO «ІД» line. Until
      # it exists the corpus shows one provider's set of optional requisites. `Seller.tax_code`
      # is already `None`-able for exactly this, so the template is the whole of the work.
      #
      # NONE OF THE THREE TEMPLATES REGISTERED TODAY IS THAT ONE. They vary the paper width and
      # the kind of registrar, which are different axes: every one of them prints «ІД». The gap
      # is unchanged by their arrival, and it is not narrower for there being more templates.
      #
      # ЄДРПОУ — legal entity registry code. Its identification code, printed under «ІД».
      edrpou: { length: 8, type: numeric, checksum: edrpou, label: "ІД" }
      # РНОКПП (formerly called ІПН) — individual taxpayer number, a sole trader's
      # identification code, printed under the SAME «ІД» prefix as a company's ЄДРПОУ: the
      # prefix names the requisite, not the register the number came from. This entry used to
      # carry «ІПН», which is the old name of the number itself and not a prefix the form
      # defines — so every sole-trader receipt printed a line the Положення does not describe.
      rnokpp: { length: 10, type: numeric, checksum: rnokpp, label: "ІД" }
      # ПН — VAT-payer number, printed only by a registered payer.
      #
      # `legal_entity_length` rather than `length`, because there is no single length: a sole
      # trader's «ПН» is its РНОКПП, so the number is ten digits and is the same value its «ІД»
      # line carries. A key named `length` would have quietly meant "for a company only".
      #
      # 👁 CONSISTENCY WITH «ІД» — 1/1, WHICH IS ONE DOCUMENT. On the one receipt that carries
      # both lines, the «ІД» value is the FIRST EIGHT DIGITS of the twelve-digit «ПН», and that
      # is what the builder constructs, so the two lines agree by construction instead of by
      # luck. The count is 1 of 1 because only one observed receipt carries both — it is not a
      # rate, and no source states the relation as a requirement. Independent numbers would
      # contradict the one document there is. For a sole trader the relation is IDENTITY rather
      # than prefix: one ten-digit number under both prefixes.
      vat_number: { legal_entity_length: 12, type: numeric, checksum: none, label: "ПН" }
      # ФН — fiscal number of the registrar. NO `label` HERE, and that is the point: the
      # printed prefix depends on the KIND of registrar — 👁 a ПРРО prints «ФН ПРРО», a
      # hardware РРО prints «ФН» — so it lives once, per kind, under `receipt.registrars`
      # below. A label here as well would be a second source of truth for the same string.
      fiscal_device_number: { length: 10, type: numeric, checksum: none }
      # ЗН — заводський номер: the factory/serial number of a classic hardware РРО. Printed
      # ONLY by a hardware registrar — see `registrars` below for why it is not a pair with ФН.
      device_serial: { pattern: "[A-Z]{2}[0-9]{8}", label: "ЗН" }
      # МФО — the six-digit code that identifies a BANK, 📄 assigned in the National Bank's
      # register of participants and carried inside every Ukrainian IBAN.
      #
      # HERE RATHER THAN UNDER A DOCUMENT CLASS, because two classes print it — a payment
      # confirmation names the issuer's and a statement names the account's — and the code is a
      # fact about the jurisdiction, not about either document. NO `label`, deliberately: the
      # caption travels with the position it is printed in and each class states its own, so a
      # label here would be a second source of truth for the same string. The same reasoning is
      # spelled out at `fiscal_device_number` above.
      bank_code: { pattern: "[0-9]{6}" }

    receipt:
      title: "ФІСКАЛЬНИЙ ЧЕК"

      # WHAT DISTINGUISHES ONE KIND OF CASH REGISTER FROM ANOTHER, in the requisites it prints.
      #
      # ⚠️ «ЗН» AND «ФН» ARE NOT A PAIR, and treating them as one is the error this block
      # exists to prevent. 👁 The ПРРО receipts examined print «ФН ПРРО <номер>» and carry no
      # «ЗН» at all (1/1 of the observed software receipts); 👁 the two published samples of a
      # hardware РРО print «ЗН» AND «ФН» together (2/2). So the SET of fiscal identity lines
      # follows the kind of registrar, and printing both on every document would be a requisite
      # combination no observed receipt of either kind carries.
      #
      # `maker_pool` IS THE OTHER HALF OF 📄 LINE 35 OF THE FORM, which reads, verbatim:
      #
      #     «Найменування або графічне зображення виробника, перед яким друкується напис
      #      «ФІСКАЛЬНИЙ ЧЕК»»
      #
      # ONE requisite, and the wording comes BEFORE the name — so the order this generator prints
      # them in is 📄 primary law and not merely 👁 the 11 of 11 open receipts that agree with it.
      #
      # 🔴 THE NORM SAYS «ВИРОБНИКА» AND NOTHING MORE, and the distinction matters because it is
      # easy to over-read. The primary text does NOT say whose maker — it does not distinguish a
      # device manufacturer from a ПРРО software provider. Published commentary glosses the line as
      # «найменування виробника ПРРО» when discussing a ПРРО, and that gloss is a COMMENTATOR'S
      # reading rather than the rule's words. What the rule licenses on its own is narrow: a maker
      # is named. That there is no other candidate value for a ПРРО — software has no factory — is
      # an inference, and it is the inference this generator acts on. Recorded so a reader does not
      # take the split below for something the norm states.
      #
      # TWO POOLS, BECAUSE THE TWO KINDS OF REGISTER HAVE DIFFERENT MAKERS. A hardware register is
      # built by a manufacturer entered in a published state register; a ПРРО is published by a
      # software provider. `maker_pool` NAMES A BLOCK OF config/vendors.json rather than listing
      # names here: a mark is DATA and belongs in the data file, while which pool a kind of
      # register draws from is a layout fact about the document and belongs here. One fact, one
      # file — the names are not restated in this file at any point.
      #
      # 🔴 NO INVENTED NAMES, AND THIS WAS TRIED THE OTHER WAY FIRST. An earlier version of this
      # block carried invented maker names, and it was withdrawn against the rule at the head of
      # config/generation.yaml: publicness is verifiable and inventedness is not, so the file
      # admits no invented-mark class at all. The attempt is worth one line rather than none,
      # because it demonstrated the rule instead of testing it — of seven invented candidates,
      # five collided with an existing mark once the DISTINCTIVE WORD was searched rather than the
      # full name, two of them active in electronics. And a search establishes only that a name is
      # not PROMINENT, never that it is free, so the block would have shipped resting on a check
      # that cannot bear the weight. Public marks need no such check, which is the whole of why
      # the rule prefers them; nothing here carries a verification note for that reason.
      #
      # 🔴 NO TITLE SUFFIX IS PRINTED, AND THAT IS A GAP RATHER THAN A DECISION AGAINST THE
      # OBSERVATION. 👁 A ПРРО does tag the title with a short abbreviation — the observation stands
      # and is recorded under `verified_against_own_receipts` below. What is missing is the PAIRING:
      # no published source says which provider prints which tag, and it was looked for. Printing a
      # tag beside a NAMED provider would therefore assert a pairing nobody established — the same
      # class of unverified claim as an invented name, and the reason it is not simply carried over
      # from the old `title_suffixes` list, which paired its tags with nothing at all because no
      # maker was printed then. So `title_suffix` is a field a vendor entry MAY carry and none does;
      # the mechanism is wired and tested, and the corpus prints the bare wording until a pairing is
      # evidenced. The tag and the name come from ONE entry when a suffix exists, so the paper can
      # never show one provider's tag above another provider's name.
      #
      # 🔴 «МАС» IS DELIBERATELY NOT PRINTED, on either kind. 📄 The published table of the form
      # numbers it line 30 and marks it as the hardware-РРО line, so it is a genuine requisite
      # of that archetype and its absence is a known gap rather than an oversight. But no source
      # available here shows a printed one — not its alphabet, not its length, not whether the
      # label is «МАС:» or «МАС » — so the only way to print it is to invent the format, and an
      # invented format would sit on every image of the archetype where a consumer could read it
      # as evidence of what a real МАС looks like. The standing rule of this repository is that
      # a requisite whose printed form has not been observed is not invented; what is claimed
      # here is narrow — the line is absent because its shape is unknown, not because the form
      # omits it.
      registrars:
        # ПРРО — програмний реєстратор розрахункових операцій, the software cash register.
        prro:
          fiscal_number_label: "ФН ПРРО"
          prints_device_serial: false
          # 📄 Line 31 of the form, the online/offline marker, is a ПРРО requisite.
          prints_mode_marker: true
          receipt_number_format: alphanumeric
          # `fiscal_software` in config/vendors.json — publicly marketed ПРРО providers.
          maker_pool: fiscal_software
        # РРО — the classic hardware register, which is what «ЗН» belongs to.
        rro:
          fiscal_number_label: "ФН"
          prints_device_serial: true
          prints_mode_marker: false
          receipt_number_format: sequential
          # `fiscal_hardware` in config/vendors.json — manufacturers in the published
          # Державний реєстр РРО, the state register of approved cash registers.
          maker_pool: fiscal_hardware

      # The four amount lines under the items, in printed order — 📄 lines 20 to 24 of the
      # published form, where СУМА and ДО СПЛАТИ are separate requisites and differ by the two
      # between them. Here rather than in the template because they are layout constants of a
      # jurisdiction, like the acquiring-block labels and the tax-row label beside them, and
      # because ONE OF THEM VARIES BETWEEN SOURCES and only a config value can carry that:
      #
      #   👁 the observed receipt prints ЗАОКРУГЛЕННЯ;
      #   📄 the published table of the form writes the same line as ОКРУГЛЕННЯ.
      #
      # Observation wins, on the same reasoning as the VAT block (see config/generation.yaml).
      # A literal in the markup could not have recorded the alternative at all.
      totals_labels:
        total: "СУМА"
        discount: "ЗНИЖКА"
        rounding: "ЗАОКРУГЛЕННЯ"
        amount_due: "ДО СПЛАТИ"

      footer: "ДЯКУЄМО ЗА ПОКУПКУ"
      # A non-fiscal look-alike must carry this line — classification trap
      # (docs/architecture.md#document-archetypes, templates 12 and 13).
      non_fiscal_marker: "НЕ ФІСКАЛЬНИЙ ЧЕК"
      # The paper widths a Ukrainian thermal roll comes in. One template per width, and the
      # stylesheet of each states its own width in pixels: the test suite checks that every
      # width a template declares is one of these, so a template at a width no roll is sold
      # in fails rather than merely looking odd.
      widths_mm: [58, 80]
      # Receipt number as printed after "ЧЕК №". THE FORMAT FOLLOWS THE KIND OF REGISTRAR, and
      # which kind takes which is stated once, under `registrars.*.receipt_number_format` above.
      # Both the alphabet and the length come from the pattern, so this is the only place either
      # is written down — a length repeated in code is how the two drift apart.
      receipt_number:
        # 👁 Modern ПРРО issue a short alphanumeric id, not a sequential number.
        alphanumeric: { pattern: "[A-Za-z0-9]{11}" }
        # 👁 A classic hardware РРО counts its receipts, so the number is short and sequential.
        sequential: { pattern: "[0-9]{4,6}" }
      # Online ПРРО print a mode marker.
      mode_markers: ["Онлайн", "Офлайн"]

    # Card acquiring block, printed between the items and the totals when the
    # receipt was paid by card. RRN is the deduplication key
    # (docs/architecture.md#imperfection-catalogue).
    acquiring_block:
      fields:
        # Acquirer names come from `acquirers` in config/vendors.json and are drawn per
        # document. There used to be an `example` here naming a bank whose legal form ceased
        # to exist in 2021; nothing read it once the names moved, so it was dead data
        # contradicting live data in the same file.
        - { key: acquirer,      label: "Екв." }
        - { key: terminal_id,   label: "Термінал:",      pattern: "[A-Z][0-9]{7}" }
        # ⚠️ ONLY THE FIRST VALUE IS REACHABLE TODAY. `content_builder` takes `values[0]`,
        # so «ПОВЕРНЕННЯ» is printed on no document — as is «ГОТІВКА» below, for the same
        # reason. The vocabulary is declared here because it is what the form permits; the
        # draw that would use it is unwritten work, and a cash receipt in particular is not
        # a relabelling of this line — 👁 it carries no acquiring block at all.
        - { key: operation,     label: "",               values: ["ПРОДАЖ", "ПОВЕРНЕННЯ"] }
        - { key: card_masked,   label: "ЕПЗ",            pattern: "[0-9]{4}X{8}[0-9]{4}" }
        - { key: auth_code,     label: "Код авт.:",      pattern: "[0-9]{6}" }
        - { key: rrn,           label: "RRN:",           pattern: "[0-9]{12}" }
      # ⚠️ Second value unreachable — see the note on `operation` above.
      payment_method_labels: ["БЕЗГОТІВКОВА", "ГОТІВКА"]

    # =========================================================================
    # Bank payment confirmation — квитанція про оплату
    # =========================================================================
    #
    # A DIFFERENT DOCUMENT CLASS, NOT A VARIANT OF THE RECEIPT ABOVE. It is issued by a bank
    # rather than by a cash register, it carries no fiscal identity of any kind, and 👁 it
    # carries NO LIST OF ITEMS: what was bought is not on it.
    #
    # 📄 THE REQUISITES ARE LAW, which is why they are in this file. The National Bank's
    # instruction on non-cash settlements (Resolution 163 of 29.07.2022, as amended), clause
    # 37-3, lists what information about the acceptance of a payment instruction must be given:
    # the date and number of the instruction · the payer's unique identifier or name, code and
    # account number · the name of the payer's payment service provider · the amount of the
    # payment operation · the payment purpose · the same three for the recipient · the date of
    # acceptance for execution. 📄 A list of goods is not among them, and neither is a payment
    # form or an RRN.
    #
    # 👁 THE OBSERVED SET IS WIDER THAN THE LAW'S AND ALSO NARROWER, and every count below comes
    # from eight A4 confirmations of three banks. Wider: a stamp, a signature, a masked card, an
    # authorization code, a terminal identifier, an amount in words, a verification footer. And
    # narrower: 👁 0/8 print the one requisite the law names by wording — the date of acceptance
    # for execution.
    #
    # 🔴 ONE LAYOUT, AND THE LIMIT IS NAMED RATHER THAN HIDDEN. Three banks were observed and
    # they have three different layouts. This block describes ONE, and what varies inside it is
    # the SET OF FIELDS — which follows how the payment was initiated, and is what an extraction
    # step has to cope with. Visual layout diversity between issuers is a declared gap, not a
    # thing this block models; see `known_limitations` in config/labelling-schema.yaml.
    payment_confirmation:
      # 👁 THE TITLE IS NOT A TYPE MARKER, and this is the strongest form of that finding: two
      # documents of ONE bank name their own type differently, and on one image the app's screen
      # heading and the document heading inside it disagree while carrying the same number. A
      # classifier keying on either string is keying on a coin toss.
      titles: ["Квитанція", "Платіжна інструкція"]

      # 📄 THE PAPER IS A4 — ISO 216, 210 × 297 mm — and not a till roll. 👁 8/8 of the observed
      # confirmations are A4 documents, which is why this class needs its own paper fact rather
      # than an entry in `receipt.widths_mm`: those are the widths a thermal roll is SOLD in, and
      # a bank prints on a page. The rendered pixel width follows from this size and is in the
      # archetype's stylesheet, which is where every paper width in this repository lives.
      page: { width_mm: 210, height_mm: 297 }

      # 👁 8/8 carry the bank's own document number, 📄 and clause 37-3 makes the number of the
      # payment instruction mandatory. It is ALSO the key of the official check services, which
      # is what makes it the deduplication key of this class rather than the authorization code.
      # Three formats were observed; all three are drawn from, because a consumer validating the
      # field by shape needs all of them.
      document_code:
        label: "Номер документа"
        formats:
          # 👁 four groups of four.
          - { pattern: "[0-9]{4}", groups: 4, separator: "-" }
          # 👁 a letter prefix followed by an unbroken run of digits.
          - { pattern: "[A-Z]{2}[0-9]{10}", groups: 1, separator: "" }
          # 👁 eight to ten bare digits.
          - { pattern: "[0-9]{8,10}", groups: 1, separator: "" }

      # WHICH DATE CAPTION IS PRINTED. The label side of the concept named in
      # config/policy.yaml, `period.payment_date`; the mapping of captions onto that concept —
      # including the three captions that must NEVER be read as it — is
      # `document_types.payment_confirmation.payment_date` in config/labelling-schema.yaml.
      # Only accepted captions appear here, because a generator that printed a refused one
      # would be printing a document whose payment date the contract says cannot be read.
      date_captions: ["Дата виконання", "Дата проведення", "Дата операції"]
      # ⚠️ A TIME FORMAT OF ITS OWN, AND NOT THE JURISDICTION'S. `date_format` above is shared —
      # a date is written the same way on every Ukrainian document — but the jurisdiction's
      # `time_format` separates with DASHES, and that entry is 👁 an observation about ПРРО
      # RECEIPTS ("time separated by dashes, not colons" in `verified_against_own_receipts`). It
      # is a quirk of till printers. A bank writes a time with colons, so this class states its
      # own format rather than inheriting a fact established about another class of document.
      time_format: "%H:%M:%S"

      # 👁 THE MONEY SPLITS, ON EVERY DOCUMENT: 0/8 print a single amount. 8/8 print the
      # operation amount and the fee as separate fields, and 1/8 also prints their sum in the
      # largest type on the page.
      #
      # 📄 THE AMOUNT OF THE OPERATION IS THE TRANSFER AMOUNT — clause 37-3 names it and does
      # not name the fee at all. 🔴 So the most salient number on the page is NOT the amount of
      # the operation, and an extractor trained to take the largest number takes the wrong one.
      # That divergence is deliberate and measurable; see the label entries in
      # config/labelling-schema.yaml.
      amount_captions: ["Сума", "Сума операції", "Сума (грн)", "Сума переказу"]
      fee_captions: ["Комісія", "Комісія (грн)", "Сума комісії"]
      total_caption: "Загальна сума"
      # 👁 5/8, under three different captions — and one of those is no caption at all, the
      # words following the digits in brackets. Only the captioned forms are printed here.
      amount_in_words_captions: ["Сума словами", "Сума літерами"]

      purpose_label: "Призначення платежу"

      # The two parties. 👁 6/8 lay them out as the largest block of the document, in two
      # columns. ⚠️ The code length distinguishes the KIND OF CODE and not the kind of party:
      # 10 digits is a РНОКПП, which a natural person AND a sole trader both have, so "ten
      # digits means not a business" is false — 👁 a sole trader payee with a ten-digit code was
      # observed. 8 digits is a ЄДРПОУ. Both are already in `identifiers` above and are not
      # restated here.
      parties:
        payer_label: "Платник"
        payee_label: "Отримувач"
        account_label: "IBAN"
        code_label: "Код"
        bank_label: "Банк отримувача"
        # 👁 A third numeric code appears on the same document under its own caption — the МФО,
        # six digits — so one confirmation may print three unlabelled-by-type numbers of three
        # lengths (10, 8, 6) and an extractor has to tell them apart by caption AND length. The
        # code's own shape is `identifiers.bank_code` above: it identifies a bank rather than this
        # document, and a second class now prints it.
        bank_code_label: "Код банку"
        # 👁 2/8 have at least one empty field, in TWO mechanically different forms: a hyphen
        # printed AS the value, and a caption with nothing under it. They are not one situation
        # — OCR returns the string "-" for the first and nothing for the second — so both are
        # produced. This is the hyphen form.
        empty_value: "-"

      # The Ukrainian IBAN, 📄 ISO 13616 with a country length of 29: "UA", two check digits
      # computed mod 97-10, the six-digit МФО of the bank, then a nineteen-character account.
      iban: { country: "UA", length: 29, bank_code_length: 6 }

      # 🔴 HOW THE PAYMENT WAS INITIATED IS WHAT DECIDES THE FIELD SET — not the family of the
      # document, which is the conclusion this block was rewritten on. 👁 3/8 confirmations
      # carry a masked card AND an authorization code AND a payment purpose at once, so
      # "quittance with a purpose" against "card slip with an authorization code" is not a real
      # division. What actually varies:
      #
      #   card       👁 4/8 — a card operation: an authorization code and a card number are
      #                     printed, and so is the purpose.
      #   transfer   👁 3/8 — a transfer by account details: NO authorization code and no card
      #                     number, because there was no card operation to authorize.
      #   acquiring  👁 1/8 — internet acquiring: a card and an authorization code, but NO
      #                     payment purpose field at all, and the payer is not identified.
      #
      # The shares are draw inputs and live in config/generation.yaml; what each mode PRINTS is
      # a layout fact and lives here.
      initiation:
        card:
          prints_auth_code: true
          prints_card: true
          prints_purpose: true
          identifies_payer: true
        transfer:
          prints_auth_code: false
          prints_card: false
          prints_purpose: true
          identifies_payer: true
        acquiring:
          prints_auth_code: true
          prints_card: true
          prints_purpose: false
          identifies_payer: false

      # 👁 4/4 of the card operations print six digits. 📄 The term is defined by the National
      # Bank's regulation on the issue and acquiring of payment instruments (Resolution 164 of
      # 29.07.2022, as amended), which does NOT list the requisites of such a document.
      #
      # ⚠️ IT IS NOT A DEDUPLICATION KEY, and the temptation to use it as one is why the reason
      # is written down: six digits is a space of a million, and the code is unique only within
      # an issuer and a time window. The document number above is the key that is 👁 8/8 present
      # and 📄 mandatory.
      auth_code: { label: "Код авторизації", pattern: "[0-9]{6}" }

      # 👁 RRN IS NOT ON THIS DOCUMENT — 0/8 — and it is not an omission of this block. It is a
      # requisite of the CARD OPERATION as printed inside a fiscal receipt, where this
      # repository does print it (`acquiring_block` above, 👁 1/1 of the observed sole trader's
      # receipts). ⛔ The same holds for a payment form (cash / card): 0/8, and it is a receipt
      # requisite carried over by mistake.

      # 👁 CARD MASKING IS NOT UNIFORM AND THERE IS NO NORM FOR IT. 6/8 print a card number,
      # under SIX different schemes — nearly as many as there are documents — and ⛔ neither the
      # instruction on non-cash settlements nor the regulation on payment instruments states
      # any requirement about it. 🔴 One observed document prints a recipient's card with NO
      # masking at all, which confirms the absence of a norm from the opposite direction.
      #
      # Every scheme is drawn from, INCLUDING the unmasked one: a consumer whose regular
      # expression is "six digits, asterisks, four digits" covers a minority of the field.
      card:
        label: "Картка"
        # `head` and `tail` are how many digits stay visible; `mask` is the character used for
        # the rest, and `grouped` prints the number in four groups of four.
        masking_schemes:
          - { head: 6, tail: 2, mask: "*", grouped: false }
          - { head: 4, tail: 4, mask: "*", grouped: false }
          - { head: 6, tail: 4, mask: "*", grouped: false }
          - { head: 4, tail: 4, mask: "*", grouped: true, name_scheme: true }
          - { head: 4, tail: 4, mask: "·", grouped: true, name_scheme: true }
          # 🔴 The unmasked form, observed on a RECIPIENT's card.
          - { head: 16, tail: 0, mask: "*", grouped: true }
        # Printed in brackets after the number by the two grouped schemes. Public marks of the
        # card schemes, as any Ukrainian card carries one of them.
        schemes: ["Visa", "Mastercard"]

      # 👁 5/8 carry a device or initiating-system field, under FIVE different captions, and
      # 🔴 the values under them are of three incompatible kinds — a system named in words, a
      # merchant's internet domain, and an uppercase mnemonic code. One contract field
      # therefore covers three different things.
      #
      # ⛔ THE DOMAIN KIND IS NOT REPRODUCED, and the reason is provenance rather than
      # difficulty: a domain printed beside a named payee asserts that the payee owns it, and
      # this repository does not print unverifiable claims about real firms. The two remaining
      # kinds carry no such claim. Declared here so the corpus is known to be narrower than the
      # observation on this field.
      terminal:
        captions:
          - { label: "Термінал", value_kind: mnemonic }
          - { label: "Ідентифікатор платіжного пристрою", value_kind: mnemonic }
          - { label: "Ідентифікатор системи/пристрою", value_kind: mnemonic }
          - { label: "Назва системи-ініціатора", value_kind: system_name }
        mnemonic: { pattern: "[A-Z]{4}[0-9]{4}" }

      # 👁 The stamp is the ONE constant of this class — 8/8, usually bottom right. The
      # signature beside it is 7/8, the exception being a document with an empty signature line.
      # 👁 5/8 also print the signatory's post in words.
      signature:
        stamp_caption: "БАНК"
        signature_label: "Підпис"
        post_labels: ["Операційний директор", "Директор департаменту операційного сервісу"]
        # 👁 3/8 carry a note about the qualified electronic signature; 👁 2/8 of one bank print
        # a note saying the operation was performed automatically INSTEAD. Two mechanisms, and
        # they must not be confused with the verification footer below: this one answers "is the
        # signature under the file intact", that one answers "did this payment happen".
        electronic_notes:
          - "Документ підписано кваліфікованим електронним підписом представника банку. Перевірка підпису: ca.diia.gov.ua/verify"
          - "Операцію виконано автоматично, підпис не вимагається"

      # 👁 THE VERIFICATION FOOTER IS NOT A CONSTANT — 3/8. That directly refutes the assumption
      # that every such document carries one.
      #
      # ⚠️ The host is the STATE cross-bank check service rather than any bank's own page, and
      # that is a narrowing: 👁 the observed footers name each bank's own address, and pairing a
      # bank with a URL would be this file asserting that pairing. 📄 The state service is the
      # one that checks a document by its code across the banks connected to it.
      verification_footer:
        present_caption: "Перевірка документа"
        steps: "Відкрийте check.gov.ua, виберіть тип документа та введіть його номер"

      # 👁 2/8 carry a QR and BOTH of them are marketing — an invitation to install the bank's
      # application. 👁 0/8 carry a verification QR: checking a document is done by its code as
      # text, never by the QR.
      #
      # ✅ This is a stronger refutation of "a QR means the document is fiscal" than the fiscal
      # case is. On a receipt the QR at least encodes a request to the tax service; here it has
      # nothing to do with the operation at all.
      qr:
        # 👁 The QR came with supporting text on both documents that had one — an invitation to
        # install the bank's application. A bare QR with nothing beside it is not what was seen,
        # and the text is what makes its purpose legible to a reader of the image.
        marketing_caption: "Завантажте застосунок банку за QR-кодом"
        marketing_payloads:
          - "https://example.com/app"
          - "https://example.com/mobile"

    bank_statement:
      # 👁 ONE CORPORATE CURRENT-ACCOUNT STATEMENT was observed — 4 pages, 89 operations, a
      # period of one day — and this block is its arrangement. ⚠️ «Банківська виписка» is not one
      # layout but at least three: this corporate form, a personal CARD statement (📄 the
      # monobank open-API statement element carries a per-operation `balance`, and a card
      # statement prints cashback), and 📄 a bank's own "open statement" cut down to four columns.
      # Mixing them would reproduce a document that does not exist, so ONE is built and the other
      # two are declared gaps in config/labelling-schema.yaml.
      #
      # 🔴 NO RUNNING BALANCE PER ROW, and it is the sharpest of the three differences: the
      # observed corporate table has no balance column at all, while a card statement has one on
      # every line. The turnover block below is where this form states its balances, twice — at
      # the start of the period and at the end — and nowhere else.
      running_balance: false

      # 📄 A4 LANDSCAPE — ISO 216, 297 × 210 mm. ⛔ THE ORIENTATION WAS NOT ESTABLISHED: only a
      # preview of the first page was seen, and it carries no measurement. It is chosen from what
      # the columns require — seven columns, two of them free text — and a portrait page fits
      # them only by making the free text unreadable, which would remove the difficulty this
      # class exists to pose. Declared here rather than left implicit in a stylesheet, like the
      # confirmation's page size above.
      page: { width_mm: 297, height_mm: 210 }

      # The header, 👁 in the observed order. `Заключна виписка` — a CLOSING statement, the form
      # issued for a period that has ended — is the observed wording and the only one seen.
      header:
        title: "Заключна виписка за період з {start} по {end}"
        # 👁 The observed header identified the bank by its ЄДРПОУ. This template prints the
        # МФО under «Код банку» instead, which is 👁 the same identifier and caption the
        # confirmation archetype prints for an issuer: two archetypes of one repository
        # identifying the same bank by two different codes would be a difference nothing
        # supports, and the bank code is already drawn rather than taken from any register. Its
        # shape is `identifiers.bank_code` above, shared with that class.
        bank_code_label: "Код банку"
        client_label: "Клієнт"
        # ⚠️ THE ACCOUNT HOLDER IS THE CLAIMANT, so the code beside the name is a РНОКПП — 👁 the
        # observed statement was a company's and printed a ЄДРПОУ. This is not a layout choice:
        # a statement is evidence that THIS person's money left THIS person's account, and a
        # company's statement would evidence nothing about the persona filing the claim. ⛔ A
        # personal current-account statement in exactly this arrangement was not observed; what
        # was observed is the arrangement. Declared in config/labelling-schema.yaml.
        client_code_label: "РНОКПП"
        account_label: "Поточний рахунок"
        currency_label: "валюта"
        # 📄 ISO 4217: the alphabetic code and its numeric code, as the observed header prints
        # both separated by a slash.
        currency_code: "UAH/980"
        last_operation_label: "Дата останньої операції"

      # 🔴 THE FOUR TURNOVER TOTALS, 👁 in a framed block immediately under the header, and 👁 the
      # most prominent numbers on the document. They are PRINTED AND NEVER LABELLED — the label
      # of a statement carries one transaction, not the document — and printing them is the whole
      # point: without them, finding the relevant transaction among twenty rows is artificially
      # easy and any accuracy measured on the class is inflated. 👁 Each turnover carries its
      # operation count beside it.
      #
      # They RECONCILE with the rows: the closing balance is the opening balance plus the credit
      # turnover less the debit turnover, and each turnover is the sum of the rows on its side.
      # 👁 The observed figures satisfy this exactly, which is why `content_builder` derives all
      # four from the rows instead of drawing them.
      totals:
        opening_label: "вхідний залишок"
        closing_label: "вихідний залишок"
        credit_label: "разом за кредитом"
        debit_label: "разом за дебетом"
        operations_label: "Операцій"

      # The columns of the operations table, 👁 in the observed order and wording, with ONE
      # departure named below.
      #
      # 🔴 THE DEPARTURE: the observed table has a SINGLE unsigned «Сума» column, so a reader of
      # that page cannot tell a debit row from a credit row at all — the direction is stated only
      # in the turnover block, for the period as a whole. A label field must be readable from the
      # image it labels, and `direction` is a label field, so the amount is printed in one of TWO
      # money columns and which column it is in is the direction. 📄 That is the ledger-extract
      # form the document's own turnover captions are written in («разом за дебетом», «разом за
      # кредитом»), and it is a general layout of an account statement rather than an invention
      # of this file; ⛔ but it is not what the one observed table did, and the alternatives —
      # a sign on the amount, or a one-letter Дт/Кт column — were rejected: the first gives this
      # class a money convention no other class has, and the second is grounded in nothing at all.
      #
      # ⚠️ THE COUNTERPARTY IS FOUR FIELDS, not one, 👁 laid out as two columns of two stacked
      # lines each. All four are printed; only the NAME is labelled, because that is the single
      # field the consumer's requirement asks a statement for. The other three are printed
      # unlabelled for the same reason the turnover totals are.
      columns:
        number: "Номер документа"
        # 👁 One caption over both values, printed on two lines. See `payment_date` in
        # config/labelling-schema.yaml for what this date means and why it is derived here rather
        # than inherited from the confirmation's caption order.
        datetime: "Дата та час операції"
        debit: "Дебет"
        credit: "Кредит"
        purpose: "Призначення платежу"
        counterparty: "Реквізити контрагента"
        counterparty_name: "Найменування"
        # 👁 The observed caption is «ЄДРПОУ», which holds only while every counterparty is a
        # legal entity. A sole trader carries a РНОКПП of ten digits, and ten digits under an
        # ЄДРПОУ caption would be a false caption — so the column is captioned as the
        # confirmation captions the same value. The narrowing is declared rather than silent.
        counterparty_code: "Код"
        counterparty_account: "Рахунок"
        counterparty_bank: "Банк"
      # A bank writes a time with colons. Stated for this class for the same reason the
      # confirmation states it: the jurisdiction's `time_format` above separates with dashes,
      # which is 👁 an observation about till printers and not about bank documents.
      time_format: "%H:%M"

      # 👁 The per-row operation number appears in two shapes on one document: a short number of
      # three or four digits, and a longer prefixed form used for payments involving private
      # individuals. Both are drawn from, because a consumer validating the field by shape needs
      # both — and 🔴 this number is the label's POINTER at the labelled row, so two rows carrying
      # the same one would point at both.
      #
      # UNIQUENESS COMES FROM `serial_digits`, and it is not a trick: 👁 the short form IS a
      # sequential number — a client's own document numbering — so the trailing digits across the
      # page are one counter and cannot repeat. A drawn number DID repeat: `631` appeared on two
      # rows of a render before this was a counter. A rejection loop was rejected as the fix,
      # because the number of values it takes from the generator depends on which collisions
      # occurred, and every later draw in the run would shift with them.
      #
      # `prefix` is a literal, `pattern` is drawn per row and may be empty, and `serial_digits` is
      # how many trailing digits the counter fills. Only the `@` is carried over from the observed
      # form; everything after it is drawn or counted, because a verbatim token off a real document
      # would be a value from a real document and this repository prints none.
      operation_number:
        formats:
          - { prefix: "", pattern: "", serial_digits: 3 }
          - { prefix: "", pattern: "", serial_digits: 4 }
          - { prefix: "@", pattern: "[0-9]{1}[A-Z]{2}", serial_digits: 6 }

    # Fiscal QR: the public receipt-verification URL of the tax authority.
    qr:
      fiscal_payload: "https://cabinet.tax.gov.ua/cashregs/check?id={receipt_number}&date={date:%Y%m%d}&time={time:%H%M%S}&fn={fiscal_device_number}&sm={total:.2f}"
      # Decorative / marketing QR used as a trap: a QR that is not fiscal at all.
      decorative_payloads:
        - "https://example.com/loyalty"
        - "https://example.com/feedback"

    # Layout facts confirmed against the author's own ПРРО receipts, 2026-07-26.
    # Listed so the provenance of each non-obvious detail is auditable.
    verified_against_own_receipts:
      - "VAT letter А = 20%, printed as suffix on the line item"
      - "tax summary line reads 'ПДВ А 20% <amount>'"
      - "ПН is 12 digits, ІД (ЄДРПОУ) is 8 digits, ФН ПРРО is 10 digits"
      # Extends the line above rather than replacing it: that line was right, and what it did
      # not say is which person the lengths belong to. ІД carries an ЄДРПОУ (8) for a legal
      # entity and a РНОКПП (10) for a sole trader, so the length follows the TYPE OF PERSON and
      # not the prefix. See `identifiers` above for the two lines appearing together.
      - "ІД carries ЄДРПОУ (8 digits) for a legal entity, РНОКПП (10 digits) for a sole trader"
      # The other half of the same refutation, and the headline of it: the entry above qualifies
      # the ІД length, and «ПН is 12 digits» needed qualifying too. A REGISTERED SOLE TRADER
      # prints ПН with TEN digits — its own РНОКПП, the same number its ІД line carries. So
      # neither prefix has a length of its own; both follow the type of person.
      - "ПН is 12 digits for a legal entity but 10 for a sole trader — its РНОКПП, the same number as its ІД"
      - "receipt number is an 11-character alphanumeric id, not sequential"
      - "time separated by dashes, not colons: 01.03.2026 09-14-22"
      # 👁 The observation stands. THE GENERATOR DOES NOT REPRODUCE IT, and the reason is stated
      # under `registrars` above: no published source pairs a tag with a provider, and the maker
      # is now named on the paper, so a tag beside it would assert a pairing nobody established.
      - "title may carry a provider suffix: 'ФІСКАЛЬНИЙ ЧЕК WFP'"
      - "acquiring block: Екв. / Термінал / ПРОДАЖ / ЕПЗ / Код авт. / RRN"
      - "amounts use a space as thousands separator; decimal separator varies by vendor"

  # ----------------------------------------------------------------- Poland --
  PL:
    language: pl
    currency: PLN
    date_format: "%d.%m.%Y"
    time_format: "%H:%M"

    number_format:
      decimal_separator_variants: [","]
      thousands_separator: " "

    vat_rates: { standard: 23.0, reduced_1: 8.0, reduced_2: 5.0, zero: 0.0 }

    # PTU letters — statutory in Poland, unlike UA where the seller assigns them.
    vat_letters:
      A: { rate: 23.0, name: "PTU" }
      B: { rate: 8.0,  name: "PTU" }
      C: { rate: 5.0,  name: "PTU" }
      D: { rate: 0.0,  name: "PTU" }
      E: { rate: 0.0,  name: "PTU zw." }   # zwolniony — VAT exempt

    tax_line_label_format: "{name} {letter} {rate:g}%"
    line_item_letter_position: suffix

    item_vat_letter:
      medicine: C
      medical_device: C
      vitamin_complex: [C, A]
      mineral_supplement: A
      sports_nutrition: A
      probiotic: A
      default: A

    identifiers:
      nip: { length: 10, type: numeric, checksum: nip, label: "NIP" }
      regon: { length: 9, type: numeric, checksum: regon, label: "REGON" }

    receipt:
      title: "PARAGON FISKALNY"
      title_suffixes: [""]
      footer: "DZIĘKUJEMY ZA ZAKUPY"
      non_fiscal_marker: "NIEFISKALNY"
      widths_mm: [57, 80]
      receipt_number:
        sequential: { pattern: "[0-9]{4,6}" }

  # ---------------------------------------------------------------- Germany --
  DE:
    language: de
    currency: EUR
    date_format: "%d.%m.%Y"
    time_format: "%H:%M"

    number_format:
      decimal_separator_variants: [","]
      thousands_separator: "."

    vat_rates: { standard: 19.0, reduced: 7.0, zero: 0.0 }

    vat_letters:
      A: { rate: 19.0, name: "MwSt" }
      B: { rate: 7.0,  name: "MwSt" }

    tax_line_label_format: "{name} {letter} {rate:g}%"
    line_item_letter_position: suffix

    # Note: medicines carry the STANDARD rate in Germany (19%), unlike Ukraine
    # and Poland. Counter-intuitive next to the UA rule, but correct.
    item_vat_letter:
      medicine: A
      medical_device: A
      vitamin_complex: B      # supplements are food (7%) in Germany
      mineral_supplement: B
      sports_nutrition: B
      probiotic: B
      default: A

    identifiers:
      ust_idnr: { pattern: "DE[0-9]{9}", label: "USt-IdNr." }
      steuernummer: { pattern: "[0-9]{2}/[0-9]{3}/[0-9]{5}", label: "Steuernummer" }

    receipt:
      title: "KASSENBON"
      title_suffixes: [""]
      footer: "VIELEN DANK FÜR IHREN EINKAUF"
      non_fiscal_marker: "KEIN STEUERBELEG"
      widths_mm: [58, 80]
      receipt_number:
        sequential: { pattern: "[0-9]{4,6}" }

    # TSE (technische Sicherheitseinrichtung) QR mandated by KassenSichV.
    # Simplified payload; field order follows the published DSFinV-K layout.
    qr:
      fiscal_payload: "V0;{device_serial};Kassenbeleg-V1;Beleg^{total:.2f}_0.00_0.00_0.00_0.00^{total:.2f}:Bar;{tx_start};{tx_end};ecdsa-plain-SHA256;{signature}"

  # ------------------------------------------------------------------ Spain --
  ES:
    language: es
    currency: EUR
    date_format: "%d/%m/%Y"
    time_format: "%H:%M"

    number_format:
      decimal_separator_variants: [","]
      thousands_separator: "."

    vat_rates: { standard: 21.0, reduced: 10.0, super_reduced: 4.0, zero: 0.0 }

    # Spanish tickets normally print the rate itself rather than a letter code;
    # letters are kept so the internal interface stays uniform.
    vat_letters:
      A: { rate: 21.0, name: "IVA" }
      B: { rate: 10.0, name: "IVA" }
      C: { rate: 4.0,  name: "IVA" }

    tax_line_label_format: "{name} {rate:g}%"
    line_item_letter_position: none

    item_vat_letter:
      medicine: C
      medical_device: C
      vitamin_complex: B
      mineral_supplement: B
      sports_nutrition: B
      probiotic: B
      default: A

    identifiers:
      nif: { pattern: "[0-9]{8}[A-Z]", checksum: nif, label: "NIF" }
      cif: { pattern: "[A-HJNP-SUVW][0-9]{7}[0-9A-J]", checksum: cif, label: "CIF" }

    receipt:
      title: "FACTURA SIMPLIFICADA"
      title_suffixes: [""]
      footer: "GRACIAS POR SU COMPRA"
      non_fiscal_marker: "SIN VALOR FISCAL"
      widths_mm: [58, 80]
      receipt_number:
        sequential: { pattern: "[0-9]{4,6}" }

  # ------------------------------------------------------- EU (cross-border) --
  EU:
    language: en
    currency: EUR
    date_format: "%Y-%m-%d"
    time_format: "%H:%M"

    number_format:
      decimal_separator_variants: ["."]
      thousands_separator: ","

    vat_rates: { standard: 21.0, reduced: 9.0, zero: 0.0 }
    tax_line_label_format: "VAT {rate:g}%"
    line_item_letter_position: none

    identifiers:
      iban: { pattern: "[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}", checksum: iban, label: "IBAN" }
      bic: { pattern: "[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?", label: "BIC" }

    receipt:
      title: "VAT INVOICE"
      title_suffixes: [""]
      footer: ""
      non_fiscal_marker: "NOT A FISCAL DOCUMENT"
