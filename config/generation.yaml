       "Ковальчук", "Ковтун", "Козак", "Колесник", "Коломієць", "Корнієнко",
       "Костенко", "Костюк", "Кравець", "Кравченко", "Кравчук", "Кузьменко",
       "Кулик", "Кушнір", "Левченко", "Лисенко", "Литвиненко", "Мазур",
       "Макаренко", "Мартиненко", "Мартинюк", "Марченко", "Марчук", "Мельник",
       "Мельничук", "Міщенко", "Мороз", "Москаленко", "Назаренко", "Нестеренко",
       "Олійник", "Павленко", "Павлюк", "Панченко", "Петренко", "Пилипенко",
