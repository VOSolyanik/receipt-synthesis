# =============================================================================
# Basket shape
# =============================================================================

basket:
  # How many of an article a receipt lists, as a weighted pool drawn from directly. An
  # assumption, not a measurement: nothing here was fitted to observed baskets, and the
  # weighting toward one is ordinary shopping knowledge — a shopper buying two identical
  # packs is less common than buying one. It affects how a document looks, never what a
  # label says.
  #
  # `content_builder.estimated_line_value` sizes a basket from the MEAN of this pool, so
  # editing it moves the planner's estimate of how many lines overrun an annual balance.
  quantity_choices: [1, 1, 1, 2]

  # How many non-covered lines a mixed basket carries. Usually one — the carrier bag, the
  # tube of cream — because that is what the imperfection catalogue describes: a
  # non-qualifying item inside an otherwise qualifying purchase. A floor, not a ceiling:
  # a low coverage target needs more non-covered money than one line can plausibly hold,
  # and the builder adds lines until the target is reachable.
  excluded_line_counts: [1, 1, 2]


# =============================================================================
# Mixed-basket coverage targets
# =============================================================================

mixed_basket:
  # What fraction of a mixed basket is meant to be covered, drawn uniformly.
  #
  # Bounded away from both ends. At 1.0 there would be no non-covered line and the claim
  # would not be partially covered at all; at 0 there would be no covered line, which
  # `policy_engine` labels `rejected` — a different verdict from the one being planned.
  #
  # Strings, not YAML floats: 0.35 in YAML is a binary double, and these are converted to
  # `Decimal` for money arithmetic. Parsing the decimal text keeps the value exact.
  #
  # An ASPIRATION, not a dial — see the note at the head of this file. Read the realized
  # coverage off `covered_fraction` in the ground truth, never off this list.
  coverage_targets:
    ["0.30", "0.35", "0.40", "0.45", "0.50", "0.55", "0.60", "0.65", "0.70", "0.75", "0.80", "0.85", "0.90"]


# =============================================================================
# Personal names
# =============================================================================
#
# The surnames from which a personal name is composed, keyed by document language. Used for
# a sole trader printed on a receipt (`content_builder.sole_trader_name`) and for a
# persona's own name (`persona_generator`), which is not printed today but will be, as the
# payer on a payment confirmation. Given names and patronymics still come from `Faker`;
# only the surname is drawn from here.
#
# WHY THE SURNAME POOL IS NARROWED. This dataset is published, so a name on a rendered
# receipt is read as it appears, whatever mechanism produced it. `ФОП Бандера О. А.` is a
# name this generator actually drew: the surname came from a public list, the initials were
# drawn independently of it, and no real person was designated — and it still reads as a
# statement, because the surname is rare and loaded, so it points.
#
# THE PROPERTY THAT DECIDES IS RARITY TOGETHER WITH RECOGNISABILITY — not whether a surname
# belongs to real people. Every Ukrainian surname does, and a sole trader has to look real,
# so "avoid real surnames" is neither achievable nor wanted. What is wanted is that the name
# should not point at a PARTICULAR person, and a surname carried by a hundred thousand
# people cannot: `ФОП Коваленко О. І.` points at nobody, although public Коваленки certainly
# exist. The surname is noise rather than signal, and that is the whole mechanism.
#
# SO THIS IS A PROPERTY OF THE SAMPLE, NOT A REGISTER OF EXCEPTIONS. A denylist of loaded
# names is the wrong shape twice over: any sample of Ukrainian surnames contains politicians,
# writers and historical figures, so the list is never finished — and every surname NOT on it
# silently becomes a claim that it was checked and found safe. A narrowed pool needs no
# maintenance and makes no claim about any single entry. This repository removed exactly that
# denylist construction from its vendor names; it is not reintroduced here.
#
# SOURCE AND THRESHOLD. The list below is the Ukrainian Wikipedia project list of the most
# common surnames in Ukraine, whose declared inclusion threshold is at least 20,000 bearers
# among Ukrainian citizens, compiled from the surname-distribution map of the Ukrainian
# genealogy society «Рідні» (ridni.org):
#   https://uk.wikipedia.org/wiki/Вікіпедія:Проєкт:Україна/Список_найпоширеніших_прізвищ_в_Україні
# That threshold is the point, and it is why the source was chosen: it is a published lower
# bound on frequency for EVERY entry, so the set contains nothing rare. For scale, the same
# data puts the head of the distribution at Мельник 107,878 bearers, Шевченко 106,340,
# Коваленко 88,632, Бондаренко 88,133, Бойко 83,195.
#
# THREE ENTRIES OF THAT SOURCE ARE OMITTED — Іванов/Іванова, Попов/Попова, Ковальова — for a
# mechanical reason and not a judgement about the names: they are the only ones that inflect
# for sex. Without them the pool is one list that can be drawn from whatever the person's
# sex, because every surname below is identical in the masculine and feminine nominative.
#
# NOTHING IS EXCLUDED FOR BEING ICONIC, and the closest calls are deliberate. Шевченко,
# Кравчук and Тимошенко are all present and all are borne by very widely known Ukrainians.
# They stay because the criterion above is the criterion: each is carried by tens of
# thousands of people, so none of them points the way a rare surname does. Removing them
# would start the register this block exists to avoid, and would leave the next reader
# obliged to read every remaining entry as vetted, which none of them is.
#
# LANGUAGES WITH NO ENTRY HERE fall back to `Faker`'s own surname pool for that locale —
# see `content_builder.personal_surname`. Only Ukrainian documents are rendered today, and
# a narrowed set for pl/de/es arrives with the templates that print those names.

personal_names:
  surnames:
    uk:
      ["Бабенко", "Білоус", "Бойко", "Бондар", "Бондаренко", "Василенко",
