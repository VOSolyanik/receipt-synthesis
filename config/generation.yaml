      fiction_title: ["Тіні над затокою", "Останній потяг на північ", "Сад із каменю", "Літо без телефону", "Сім листів з півдня"]
    travel:
      city: ["Львів", "Одеса", "Харків", "Дніпро", "Вінниця", "Ужгород"]

    # --- sport
    group_class:
      # Nominative: policy.yaml prints "Групове заняття {activity}".
      activity: ["йога", "пілатес", "аеробіка", "функціональне тренування", "стретчинг"]
