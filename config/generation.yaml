# =============================================================================
# Item kinds that cannot be printed
# =============================================================================
#
# A DECLARED HOLE, not a silent one. Skipping a template for want of a vocabulary is exactly
# what this file was written to end — so a kind that cannot be printed is named here, with
# the reason, and the test suite checks BOTH directions: every template of every other kind
# fills, and every kind named here genuinely cannot be filled. A stale entry hiding a kind
# that works fails just as loudly as a missing one.
#
# THE CAUSE IS THE KEYING, NOT THE MARKET. A vocabulary is keyed by item kind and then by
# placeholder name, so a draw cannot see which of the kind's templates it is filling: when one
# kind carries templates for different articles — `Планшет {brand}` and `Камера {brand}` in
# the same kind — a mark drawn for one is printed on the other. Not because no public house
# makes both, which would be an appeal to the market and is in any case false, but because
# this file cannot express which article a mark was chosen for.
#
# THE FIX IS A BRANDLESS TEMPLATE FORM, and `hygiene` HAS NOW HAD IT. Its two templates read
# `Гель для душу 250 мл` and `Зубна паста 75 мл` instead of naming a house, which removes the
# pool and with it the defect; 👁 it is also how Ukrainian receipts most often print such
# articles. The kind is out of the list below and is drawn like any other, so the four excluded
# kinds of `vitamins_nutrition` all reach the dataset and KL-02 in
# config/labelling-schema.yaml no longer carries a narrowing.
#
# `electronics` HAS NOT HAD IT, and the reason is not cost — the edit is one line, the same
# one. It is that the JUSTIFICATION does not transfer: the brandless form is grounded for
# hygiene articles, which real receipts print that way, and not for consumer electronics,
# where a real line names a brand and a model. Applying it there would buy nothing — the
# category has no archetype, so the kind reaches no dataset either way — in exchange for
# putting an unevidenced line shape into the label space. It stays declared below.

unprintable_item_kinds:
  electronics: >
    One pool, keyed by kind, must serve both "Планшет {brand}" and "Камера {brand}" — so any
    mark drawn for one is also printed on the other. Needs a brandless template form in
    policy.yaml.


# =============================================================================
# Retail prices
# =============================================================================
#
# Range per item kind, bounds included, in whole currency units — hryvnias, the same scale
# `annual_limit` uses in policy.yaml. One scale across both files on purpose: the two are
# read and edited by the same person in the same sitting, and a second scale distinguished
# only by a field name is a two-order-of-magnitude error that breaks nothing. It prints an
# implausible receipt and waits. The storage unit is the code's business — `content_builder`
# converts to whole kopiykas for the draw — and it must not leak into the file a human edits.
#
# "BOUNDS INCLUDED" IS ABOUT THE RANGE, NOT ABOUT EVERY DRAW OVER IT. The upper bound is a
# price a line may be clamped to; the line-item draw steps in ten kopiykas over a half-open
# interval and so stops one step below it. Nothing depends on the endpoint. See
# `config.price_range`, which says the same thing where the callers are visible.
#
# Written as strings so the values reach `Decimal` as decimal text. A `Decimal` built from
# "2000.00" is exactly as precise as a count of minor units, which is the whole of what the
# integers were there to protect; a bare YAML `2000.00` would be parsed as a binary double
# first and the precision would already be gone. The loader refuses a value with more than
# two decimal places rather than truncating it.
#
# Plausible Ukrainian retail levels — general knowledge of the market, not a catalogue.
# UAH-only for now, and honestly so: every archetype this generator has is Ukrainian. Per
# jurisdiction ranges arrive with the first non-UA archetype; adding an empty PL/DE/ES
# structure now would be a shape nobody had filled.
#
# The RANGE matters more than the midpoint: `content_builder._repriced` clamps a non-covered
# line into its kind's range when steering a basket toward a coverage target, so a range
# that is too narrow makes the target unreachable and a range that is too wide prints an
# implausible article.

price_ranges:
  currency: UAH

  # Fallback for a kind with no entry of its own. Present so that adding an item kind to
  # policy.yaml does not immediately break generation — but a kind that stays on the
  # default is a kind whose prices nobody thought about.
  default: ["100.00", "500.00"]

  ranges:
    # --- medical_insurance
    insurance_premium:     ["2000.00", "8000.00"]
    family_member_premium: ["2000.00", "7000.00"]
    property_insurance:    ["800.00", "4000.00"]
    travel_insurance:      ["300.00", "1500.00"]

    # --- language_courses
    language_lessons:  ["1500.00", "6000.00"]
    placement_test:    ["200.00", "500.00"]
    language_exam:     ["6000.00", "9000.00"]
    missed_lesson_fee: ["300.00", "800.00"]
    textbook:          ["400.00", "1200.00"]
    stationery:        ["15.00", "80.00"]

    # --- professional_development
    online_course:       ["1000.00", "9000.00"]
    certification_exam:  ["4000.00", "12000.00"]
    conference_ticket:   ["2500.00", "12000.00"]
    professional_book:   ["450.00", "1500.00"]
    workshop_materials:  ["200.00", "800.00"]
    hardware:            ["15000.00", "60000.00"]
    entertainment_book:  ["250.00", "600.00"]
    travel:              ["800.00", "5000.00"]

    # --- sport
    gym_membership:    ["1200.00", "6000.00"]
    pool_membership:   ["900.00", "4500.00"]
    group_class:       ["200.00", "1500.00"]
    personal_training: ["500.00", "1200.00"]
