# =============================================================================
# Retail prices
# =============================================================================
#
# Inclusive range per item kind, in whole currency units — hryvnias, the same scale
# `annual_limit` uses in policy.yaml. One scale across both files on purpose: the two are
# read and edited by the same person in the same sitting, and a second scale distinguished
# only by a field name is a two-order-of-magnitude error that breaks nothing. It prints an
# implausible receipt and waits. The storage unit is the code's business — `content_builder`
# converts to whole kopiykas for the draw — and it must not leak into the file a human edits.
#
# Written as strings so the values reach `Decimal` as decimal text. A `Decimal` built from
# "2000.00" is exactly as precise as a count of minor units, which is the whole of what the
# integers were there to protect; a bare YAML `2000.00` would be parsed as a binary double
# first and the precision would already be gone. The loader refuses a value with more than
# two decimal places rather than truncating it.
#
# Plausible Ukrainian retail levels — general knowledge of the market, not a catalogue.
# UAH-only for now, and honestly so: every archetype this generator has is Ukrainian. Per
# jurisdiction ranges arrive with the first non-UA archetype; adding an empty PL/DE/ES
# structure now would be a shape nobody had filled.
#
# The RANGE matters more than the midpoint: `content_builder._repriced` clamps a non-covered
# line into its kind's range when steering a basket toward a coverage target, so a range
# that is too narrow makes the target unreachable and a range that is too wide prints an
# implausible article.

price_ranges:
  currency: UAH

  # Fallback for a kind with no entry of its own. Present so that adding an item kind to
  # policy.yaml does not immediately break generation — but a kind that stays on the
  # default is a kind whose prices nobody thought about.
  default: ["100.00", "500.00"]

  ranges:
    # --- medical_insurance
    insurance_premium:     ["2000.00", "8000.00"]
    family_member_premium: ["2000.00", "7000.00"]
    property_insurance:    ["800.00", "4000.00"]
    travel_insurance:      ["300.00", "1500.00"]

    # --- language_courses
    language_lessons:  ["1500.00", "6000.00"]
    placement_test:    ["200.00", "500.00"]
    language_exam:     ["6000.00", "9000.00"]
    missed_lesson_fee: ["300.00", "800.00"]
    textbook:          ["400.00", "1200.00"]
    stationery:        ["15.00", "80.00"]

    # --- professional_development
    online_course:       ["1000.00", "9000.00"]
    certification_exam:  ["4000.00", "12000.00"]
    conference_ticket:   ["2500.00", "12000.00"]
    professional_book:   ["450.00", "1500.00"]
    workshop_materials:  ["200.00", "800.00"]
    hardware:            ["15000.00", "60000.00"]
    entertainment_book:  ["250.00", "600.00"]
    travel:              ["800.00", "5000.00"]

    # --- sport
    gym_membership:    ["1200.00", "6000.00"]
    pool_membership:   ["900.00", "4500.00"]
    group_class:       ["200.00", "1500.00"]
    personal_training: ["500.00", "1200.00"]
    equipment_rent:    ["50.00", "400.00"]
    sport_apparel:     ["400.00", "2000.00"]
    sports_nutrition:  ["600.00", "2500.00"]
    food_drink:        ["20.00", "120.00"]

    # --- mental_health
    therapy_session:  ["900.00", "2500.00"]
    family_therapy:   ["1500.00", "3500.00"]
    psych_assessment: ["800.00", "2000.00"]
    group_therapy:    ["600.00", "1500.00"]
    coaching:         ["1000.00", "3000.00"]
    self_help_book:   ["300.00", "900.00"]

    # --- vitamins_nutrition
    vitamin_complex:    ["180.00", "950.00"]
    mineral_supplement: ["90.00", "420.00"]
    nutritionist_visit: ["600.00", "1500.00"]
    medicine:           ["40.00", "600.00"]
    medical_device:     ["120.00", "1800.00"]
    cosmetics:          ["150.00", "700.00"]
    hygiene:            ["50.00", "250.00"]
    probiotic:          ["200.00", "600.00"]
    lab_test:           ["250.00", "900.00"]

    # --- hobby
    hobby_class:      ["400.00", "2000.00"]
    hobby_materials:  ["150.00", "1200.00"]
    club_membership:  ["200.00", "1000.00"]
    instrument_rent:  ["300.00", "1500.00"]
    hobby_tool:       ["1000.00", "12000.00"]
    electronics:      ["8000.00", "40000.00"]
    alcohol:          ["250.00", "900.00"]


# =============================================================================
# Basket shape
# =============================================================================

basket:
  # How many of an article a receipt lists, as a weighted pool drawn from directly. An
  # assumption, not a measurement: nothing here was fitted to observed baskets, and the
  # weighting toward one is ordinary shopping knowledge — a shopper buying two identical
  # packs is less common than buying one. It affects how a document looks, never what a
  # label says.
  #
  # `content_builder.estimated_line_value` sizes a basket from the MEAN of this pool, so
  # editing it moves the planner's estimate of how many lines overrun an annual balance.
  quantity_choices: [1, 1, 1, 2]

  # How many non-covered lines a mixed basket carries. Usually one — the carrier bag, the
  # tube of cream — because that is what the imperfection catalogue describes: a
  # non-qualifying item inside an otherwise qualifying purchase. A floor, not a ceiling:
  # a low coverage target needs more non-covered money than one line can plausibly hold,
  # and the builder adds lines until the target is reachable.
  excluded_line_counts: [1, 1, 2]


# =============================================================================
# Mixed-basket coverage targets
# =============================================================================

mixed_basket:
  # What fraction of a mixed basket is meant to be covered, drawn uniformly.
  #
  # Bounded away from both ends. At 1.0 there would be no non-covered line and the claim
  # would not be partially covered at all; at 0 there would be no covered line, which
  # `policy_engine` labels `rejected` — a different verdict from the one being planned.
  #
  # Strings, not YAML floats: 0.35 in YAML is a binary double, and these are converted to
  # `Decimal` for money arithmetic. Parsing the decimal text keeps the value exact.
  #
  # An ASPIRATION, not a dial — see the note at the head of this file. Read the realized
  # coverage off `covered_fraction` in the ground truth, never off this list.
  coverage_targets:
    ["0.30", "0.35", "0.40", "0.45", "0.50", "0.55", "0.60", "0.65", "0.70", "0.75", "0.80", "0.85", "0.90"]
