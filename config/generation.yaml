# =============================================================================
# Euro price ranges — the per-jurisdiction block the header above promised
# =============================================================================
#
# The `price_ranges` header says: "Per jurisdiction ranges arrive with the first non-UA
# archetype". This is that arrival — `eu_platform_receipt` prices its lines from here.
#
# ONLY THE KINDS A EURO-PRICED ARCHETYPE CAN SELL, AND DELIBERATELY NO DEFAULT. The UAH
# block's default exists because every Ukrainian category draws from it; a euro default
# would let a kind nobody priced in euros fall through to a number that merely looks like
# a price. `config.price_range` refuses a missing kind here instead. The five kinds below
# are the union of the two EU vendor profiles (`online_learning_platform`,
# `general_retailer`) intersected with what `professional_development` names.
#
# 🔴 EACH RANGE NESTS INSIDE ITS UAH SIBLING AT THE VENDORED RATE, AND THAT IS ARITHMETIC
# THE PLANNER LEANS ON, not a stylistic echo. `claim_planner` sizes a limit-exhausting
# basket with `content_builder.estimated_line_value`, which reads the UAH ranges — it runs
# before a vendor or an archetype is chosen, so it cannot know the claim will price in
# euros. The sizing stays conservative exactly as long as a euro line is worth at least
# its UAH sibling's lower bound: eur_low × 45.00 ≥ uah_low, and eur_high × 45.00 ≤
# uah_high keeps the basket inside the same plausibility band the category was tuned to.
# Per kind, at the vendored 45.00 (config/fx-rates.yaml):
#
#   online_course       23.00–200.00  → 1 035.00–9 000.00 against [1 000, 9 000]
#   certification_exam  89.00–266.00  → 4 005.00–11 970.00 against [4 000, 12 000]
#   professional_book   10.00–33.00   →   450.00–1 485.00 against [450, 1 500]
#   entertainment_book   5.60–13.00   →   252.00–585.00   against [250, 600]
#   hardware           334.00–1333.00 → 15 030.00–59 985.00 against [15 000, 60 000]
#
# The nesting is pinned by a test (tests/test_platform_receipt.py), so an edit to either
# side that breaks it goes red instead of quietly making exhausted-limit plans miss.
#
# Prices draw in ten-cent steps, as the UAH draw does in ten-kopiyka steps — one grid,
# two currencies. The .99 retail convention is therefore absent from euro prices; a
# narrowness of the corpus, accepted for one draw mechanism rather than two.
price_ranges_eur:
  currency: EUR
  ranges:
    online_course:      ["23.00", "200.00"]
    certification_exam: ["89.00", "266.00"]
    professional_book:  ["10.00", "33.00"]
    entertainment_book: ["5.60", "13.00"]
    hardware:           ["334.00", "1333.00"]


# =============================================================================
# Basket shape
# =============================================================================

basket:
  # How many of an article a receipt lists, as a weighted pool drawn from directly. An
  # assumption, not a measurement: nothing here was fitted to observed baskets, and the
  # weighting toward one is ordinary shopping knowledge — a shopper buying two identical
  # packs is less common than buying one. It affects how a document looks, never what a
  # label says.
  #
  # `content_builder.estimated_line_value` sizes a basket from the MEAN of this pool, so
  # editing it moves the planner's estimate of how many lines overrun an annual balance.
  quantity_choices: [1, 1, 1, 2]

  # How many non-covered lines a mixed basket carries. Usually one — the carrier bag, the
  # tube of cream — because that is what the imperfection catalogue describes: a
  # non-qualifying item inside an otherwise qualifying purchase. A floor, not a ceiling:
  # a low coverage target needs more non-covered money than one line can plausibly hold,
  # and the builder adds lines until the target is reachable.
  excluded_line_counts: [1, 1, 2]


# =============================================================================
# Mixed-basket coverage targets
# =============================================================================

mixed_basket:
  # What fraction of a mixed basket is meant to be covered, drawn uniformly.
  #
  # Bounded away from both ends. At 1.0 there would be no non-covered line and the claim
  # would not be partially covered at all; at 0 there would be no covered line, which
  # `policy_engine` labels `rejected` — a different verdict from the one being planned.
  #
  # Strings, not YAML floats: 0.35 in YAML is a binary double, and these are converted to
  # `Decimal` for money arithmetic. Parsing the decimal text keeps the value exact.
  #
  # An ASPIRATION, not a dial — see the note at the head of this file. Read the realized
  # coverage off `covered_fraction` in the ground truth, never off this list.
  coverage_targets:
    ["0.30", "0.35", "0.40", "0.45", "0.50", "0.55", "0.60", "0.65", "0.70", "0.75", "0.80", "0.85", "0.90"]


# =============================================================================
# Bank payment confirmation — the draw inputs
# =============================================================================
#
# What the document PRINTS is law and layout, and lives under `payment_confirmation` in
# config/fiscal-rules.yaml. What is here is the same three questions this file answers for a
# receipt: which words fill a free-text field, what an amount plausibly is, and how often each
# variant is drawn.
#
# ⚠️ THE SHARES BELOW ARE OBSERVED FREQUENCIES USED AS DRAW WEIGHTS, over a sample of eight
# documents. That is a small sample and it is the whole of the evidence: a share written here is
# what makes a variant appear in the corpus at roughly the rate it was seen, not a measurement
# anybody should quote. The one that matters is the fee, because assuming it away is what a
# reader does by default.
payment_confirmation:
  # 👁 3 of 8 documents carry a NON-ZERO fee — about 37%, which is not an edge case. Generating
  # it at zero would put a field on every image that discriminates nothing, and would hide the
  # one divergence this class is built to expose: the largest number on the page is the total,
  # and the amount of the operation is the smaller transfer.
  #
  # NOTE THE CONTRAST WITH THE RECEIPT'S DISCOUNT, which stays zero. A discount applies to a
  # basket, so a non-zero one would need a rule for splitting it across covered and non-covered
  # lines and policy.yaml has none. A fee is charged on the payment, is never part of the
  # basket, and is not reimbursable — so it raises no question the policy is silent about.
  nonzero_fee_share: 0.37
  # Strings, converted to `Decimal` — 0.37 above is a weight and stays a float, while anything
  # that becomes money is parsed from text so it is exact.
  fee_range: ["5.00", "60.00"]

  # What a transfer a person makes toward a benefit is worth. An assumption in the same sense
  # as `price_ranges` above, chosen to sit inside the annual limits of policy.yaml so the
  # documents look like the claims they belong to. Nothing derives a label from the range
  # itself.
  transfer_amount_range: ["400.00", "9000.00"]

  # 👁 1/8 print the sum of the transfer and the fee, in the largest type on the page. The
  # other 7 print the two amounts side by side and NO total, so ⛔ whether the printed amount
  # includes the fee cannot be established from those documents at all.
  prints_total_share: 0.125
  # 👁 5/8 spell an amount out in words under a caption.
  amount_in_words_share: 0.625
  # 👁 2/8 carry a QR, both of them marketing.
  qr_share: 0.25
  # 👁 3/8 carry a verification footer, which refutes "every such document has one".
  verification_footer_share: 0.375
  # 👁 5/8 carry a device or initiating-system field.
  terminal_share: 0.625
  # 👁 7/8 carry a handwritten signature beside the stamp; the stamp itself is 8/8 and is not a
  # draw. The exception observed was an empty signature line, so the absent case still prints
  # its caption.
  signature_share: 0.875
  # 👁 5/8 name the signatory's post in words.
  signatory_post_share: 0.625
  # 👁 3/8 carry a note about the electronic signature or about the operation being automatic.
  electronic_note_share: 0.375
  # 👁 2/8 print a caption with nothing under it — the second, mechanically different form of
  # emptiness. Applied to the recipient's name, which 👁 was observed empty once and is the
  # field a cross-check between seller and payee would rest on.
  empty_captioned_field_share: 0.25

  # How the payment was initiated, which is what decides the field set — see `initiation` in
  # config/fiscal-rules.yaml. 👁 card 4/8 · transfer 3/8 · acquiring 1/8.
  initiation_shares:
    card: 0.5
    transfer: 0.375
    acquiring: 0.125

  # 🔴 THE PAYMENT PURPOSE NEVER NAMES WHAT WAS BOUGHT — 👁 0 of 7 documents that carry the
  # field. It names ANOTHER DOCUMENT (an invoice, a delivery note), or a generic category, or
  # nothing but the movement of money. That is the observation behind `proves_subject: false`
  # for this type in config/policy.yaml, and it is a stronger result than the same finding on a
  # bank statement, where at least a generic category of goods was seen.
  #
  # `{invoice_no}` and `{invoice_date}` are filled by `content_builder`, not from the
  # placeholder vocabulary above: they are a document reference rather than merchandise.
  #
  # ⛔ ONE OBSERVED FORM IS NOT REPRODUCED: 👁 1/7 purposes contained the full name of a THIRD
  # PERSON, written by the payer. It is left out rather than modelled — it would put a personal
  # name into a free-text field on a published image for no gain this step needs — and it is
  # named here so the corpus is known to be narrower than the observation.
  # ⛔ «Переказ власних коштів» WAS IN THIS POOL AND IS DELIBERATELY NOT ANYMORE. Every
  # confirmation this generator builds pays a NAMED FIRM — the payee block carries the
  # vendor's name, code and IBAN — and a purpose asserting a transfer between the payer's
  # own accounts contradicts the page it is printed on. Measured before the repair, on the
  # production corpus (RP-06): 54 of 261 confirmations printing a purpose carried it, 55%
  # of the "cites nothing" bucket — see docs/cross-document-fields.md, which blocked the
  # `cites_subject_document` contract field on exactly these 54. The wording itself is
  # real and stays where it is coherent: the bank statement's `credit_from_self` pool,
  # whose counterparty IS the holder. Same defect, same repair as the one that pool's
  # comment records — a purpose is only as honest as the party block beside it.
  purposes:
    uk:
      - "Оплата згідно рахунку № {invoice_no} від {invoice_date}"
      - "Оплата за послуги згідно рахунку № {invoice_no}"
      - "Поповнення балансу (гарантійний внесок) згідно рахунку № {invoice_no}"
      - "Оплата за товар"

  # The value under a "name of the initiating system" caption: 👁 a system named in ordinary
  # words. Generic descriptions of a channel rather than marks, so nothing here names a firm.
  initiating_systems:
    uk:
      - "Інтернет-банкінг"
      - "Мобільний застосунок"
      - "Термінал самообслуговування"


# =============================================================================
# A claim whose two documents disagree — the draw input, not the share
# =============================================================================
#
# 🔴 WHICH FILE THIS BELONGS IN, because the neighbouring parameter is in the other one. HOW OFTEN a
# claim's documents disagree is in config/policy.yaml, beside `verdict_mix`, because it SIZES A
# LABELLED BUCKET: it decides what share of the corpus carries `insufficient_evidence` with the
# cause `amount_mismatch`, which is a design parameter of an evaluation set. BY HOW MUCH they
# disagree is here, because it changes no label at all — a claim whose payment is one hryvnia out
# and one whose payment is four hundred out are the same verdict and the same cause.
#
# What it does change is how hard the disagreement is to SEE, so it is a difficulty knob, and a
# difficulty knob is a property of the documents rather than of the policy.
mismatch:
  # In hryvnias, bounds included. The lower bound is deliberately well above a kopiyka: a rounding
  # difference is a different phenomenon from a wrong payment, and this generator does not produce
  # the first — the amounts of a matching pair are EQUAL, exactly, because one is copied from the
  # other. A tolerance-sized difference would be a claim about rounding that nothing here models.
  delta_range: ["20.00", "400.00"]


# =============================================================================
# A claim whose payment settles one INSTALMENT — the draw input, not the share
# =============================================================================
#
# 🔴 THE SAME SPLIT AS `mismatch` ABOVE, AND FOR THE SAME REASON. HOW OFTEN a claim's payment
# settles part of what its subject document states is `verdict_mix.partially_paid` in
# config/policy.yaml — it sizes a labelled bucket. INTO HOW MANY PARTS the obligation is divided
# is here, because it changes no label: a subscription paid in two parts and one paid in twelve
# are the same verdict, and the marker `policy_engine` reads is the presence of the instalment
# term rather than its size.
#
# ⚠️ WHAT IT DOES CHANGE is how far the payment sits from the invoice — a twelfth is further from
# the total than a half — so it is the same kind of difficulty knob the mismatch delta is.
#
# ⛔ NO SKEW BETWEEN THEM, AND NOT FOR WANT OF THINKING ABOUT IT. A quarterly subscription is
# surely more common than a half-yearly one in the world, but nothing in this repository has
# measured that, and a share written here would smuggle a claim about the world into a draw
# input. They are drawn uniformly for the same reason `insufficient_evidence_causes` splits
# evenly.
partial_payment:
  # Schedule id -> how many equal parts it divides the obligation into. The id is what a plan
  # carries and what config/fiscal-rules.yaml turns into the Ukrainian adverb the page prints;
  # the number is what one instalment is computed from.
  #
  # 🔴 EVERY COUNT IS AT LEAST 2. One part is not an instalment plan — it is the ordinary claim,
  # whose payment equals its invoice — and a schedule of 1 would print an instalment term over a
  # payment that settles the whole thing, i.e. a marker with nothing to mark.
  schedules:
    quarterly: 4
    monthly: 12
    semiannual: 2


# =============================================================================
# Invoice — the draw inputs
# =============================================================================
#
# What the document PRINTS is `invoice` in config/fiscal-rules.yaml. Here are the rates at which
# its optional requisites appear.
#
# ⚠️ TWO OPEN INVOICES ARE THE WHOLE OF THE EVIDENCE, and 📄 there is no approved form for this
# document, so variation is large by construction and a share below is a JUDGEMENT informed by two
# documents rather than a frequency. Each says which it is.
invoice:
  # 👁 1 of 2 carries a «Договір:» line naming an agreement by number and date. 📄 Both sources list
  # it as an optional requisite — "не завжди" — so it is drawn rather than always printed.
  agreement_share: 0.5

  # 📄 A validity line is the RECOMMENDED alternative to a payment status: an invoice is an offer,
  # and an offer stands for a period. ⚠️ A judgement: neither open invoice printed one, and the
  # recommendation is what supports it. It is printed at a minority rate for that reason, and it is
  # the positive form of this class's central fact — 🔴 that no payment status exists to print.
  validity_share: 0.35
  validity_days_range: [5, 30]

  # How long before the payment the invoice is dated is NOT here: it is `_SUBJECT_LEAD_DAYS` in
  # claim_planner, because the gap between an invoice and its settlement is a property of the CLAIM
  # rather than of the document, and the planner is what dates a claim's documents.

  # 👁 1 of 2 prints a telephone number in the supplier block. A number is DRAWN from a published
  # range rather than taken from any document — see `phone_prefixes` below.
  phone_share: 0.5
  # 📄 The mobile prefixes assigned by the national numbering plan. A number formed from one of
  # these and seven drawn digits designates nobody in particular; printing a real one would
  # designate whoever holds it.
  phone_prefixes: ["050", "063", "066", "067", "068", "093", "095", "096", "097", "098", "099"]


# =============================================================================
# Bank statement — the draw inputs
# =============================================================================
#
# What the document PRINTS is under `bank_statement` in config/fiscal-rules.yaml. Here are the
# same three questions this file answers for every class: how many of a thing, how much money,
# and which words fill a free-text field.
#
# ⚠️ THE EVIDENCE IS ONE DOCUMENT — a corporate statement of 89 operations over 4 pages. So a
# share below is one document's proportion used as a draw weight, and a count is a page of that
# document. Neither is a measurement anybody should quote, and where a number could not be
# derived from one document at all it says so instead of looking derived.
bank_statement:
  # 👁 ≈18–20 operations on the first page, 89 over four. The bound is what fits under the header
  # block on one sheet — see `bank_statement.pagination` in config/fiscal-rules.yaml — and it is
  # the range a statement that stays on ONE page draws from. Twenty rows already make "find the
  # relevant transaction" non-trivial, which is the whole task the class carries.
  row_count_range: [15, 25]

  # 🔴 HOW OFTEN A STATEMENT RUNS ONTO A SECOND SHEET, and why the case exists at all: until it
  # did, EVERY document in this corpus was one page, so "one page is one document" was true by
  # construction and a step that splits a submitted file into logical documents scored a perfect
  # result on data that could not contradict it. A measurement whose ideal is guaranteed by the
  # construction of the data measures the construction. 👁 The one observed statement ran to four
  # pages, so the multi-page form is the ordinary shape of this document rather than an edge case.
  #
  # ⛔ NOT A RATE, AND NOTHING MEASURED ONE. How often a PRIVATE PERSON's statement covers enough
  # operations to paginate depends on the period they pull and how much they spend, and no source
  # in this repository observes either. This is a DIFFICULTY AND COMPOSITION knob, in the same
  # class as `mixed_basket.coverage_targets` — which is why it is here and not in
  # config/policy.yaml: it sizes no verdict bucket and no label depends on its value.
  #
  # 0.15 IS CHOSEN FROM TWO BOUNDS RATHER THAN PICKED. Below it, a run of a few hundred claims
  # holds too few paginated statements for a per-page segmentation figure to mean anything —
  # roughly half of the split pairs take a statement rather than a confirmation, so 0.15 puts
  # about one paginated document in fourteen claims. Above it, the ONE-PAGE statement stops being
  # the overwhelming majority, and every figure already measured on this class was measured on
  # one-page documents: a share that changed the mix would change what those numbers describe
  # without anybody editing them. Asserted from both sides in tests/test_statement_pagination.py.
  two_page_share: 0.15

  # The row count once a statement paginates. Its own range rather than a widened
  # `row_count_range`: that bound is tuned against the first sheet, and one range serving both
  # would either underfill the second sheet or overflow the first. The low end clears
  # `pagination.rows_first_page` so a paginated statement always has a real second sheet, and the
  # high end stays inside one continuation sheet — three sheets are allowed by the split and are
  # not drawn, because the second page is what makes the rule falsifiable and a third adds paper.
  two_page_row_count_range: [28, 45]

  # 👁 15 of 89 operations are credits — money arriving. The share matters because `direction` is
  # a label field: a page with no credit row at all would carry no visible instance of the
  # distinction the field names, so at least one is generated whatever the draw returns.
  credit_share: 0.17

  # Of the credits, how many are a transfer from ANOTHER ACCOUNT OF THE HOLDER'S rather than money
  # from somebody else. ⚠️ A JUDGEMENT, and it is marked as one: the own-account transfer is 👁 one
  # of the purpose formulas quoted from the observed statement, but a formula appearing in a quoted
  # sample is not a rate. What is not a judgement is that the case has to exist — such a row prints
  # the account holder as its own counterparty, which is a shape an extractor will meet.
  credit_from_self_share: 0.3

  # What the account is left with when the period closes. 🔴 THE OPENING BALANCE IS DERIVED FROM
  # THIS AND FROM THE ROWS, not drawn: an opening balance drawn independently produced statements
  # whose closing balance was NEGATIVE, which is a different document — an account with a credit
  # line — and one nothing observed supports. So the residue is drawn and the opening balance is
  # whatever makes the arithmetic come out at it. Neither figure is ever labelled.
  closing_balance_range: ["800.00", "12000.00"]

  # The amount of the ONE transaction the label is about. Its own key rather than a reuse of
  # `payment_confirmation.transfer_amount_range`, because it is an assumption about a different
  # document — but it is the same quantity, a person's payment toward a benefit, and it is chosen
  # to sit inside the annual limits of policy.yaml for the reason stated there.
  transaction_amount_range: ["400.00", "9000.00"]

  # 🔴 THE ORDINARY DEBIT ROWS COVER THE LABELLED RANGE, and that is the point of the bound rather
  # than a coincidence: if the noise were drawn smaller, the labelled transaction would be the
  # largest debit on the page and findable without reading anything. It has to be an ordinary
  # amount among ordinary amounts.
  debit_amount_range: ["80.00", "9000.00"]

  # 👁 A CREDIT IS TYPICALLY MUCH LARGER THAN A DEBIT, and the factor is derived rather than
  # assumed: on the observed statement the credit turnover was spread over 15 operations and the
  # debit turnover — of the same order — over 74, so the average credit is about four times the
  # average debit. Money arrives in few large amounts, a salary, and leaves in many small ones.
  #
  # THE TWO TURNOVER AMOUNTS THEMSELVES ARE NOT WRITTEN DOWN ANYWHERE IN THIS REPOSITORY, and
  # their absence is the point: they are concrete values printed on somebody's real statement, and
  # this repository carries layout facts and counts from such a document, never its figures. The
  # ratio is what the decision needs, and the ratio is not a value off the page.
  credit_amount_range: ["4000.00", "40000.00"]

  # 👁 1/1 statements carry a bank service charge as one of their operations — the row whose
  # counterparty is the bank itself. It is generated on every statement rather than drawn: 📄 the
  # charge for account servicing recurs monthly, so its presence within a period is expected, and
  # ⛔ one document cannot give a rate. Named here as a constant of the class so that it is a
  # decision rather than an accident, and as the first thing to vary once more are seen.
  service_fee_range: ["10.00", "120.00"]

  # How far the statement's period reaches either side of the labelled transaction, in days. ⛔ NOT
  # OBSERVED: the one statement covered a single day, which is what a company pulls at the close
  # of business and is implausible for a page of a private person's operations. Derived from the
  # rows instead — the period is the span the operations fall in — so the only choice here is how
  # far apart they are spread.
  #
  # 🔴 THE TRAILING WINDOW IS NEVER ZERO, and that is what keeps the labelled transaction off the
  # bottom of the page. Rows are printed in the order they happened, so with no days after it the
  # labelled row is the last one on every image — findable without reading anything, exactly the
  # artificial ease the four printed totals exist to prevent. A first version had a zero lower
  # bound here and put the row last on two renders out of three.
  period_lead_days_range: [10, 25]
  period_trail_days_range: [3, 12]

  # 🔴 THE PAYMENT PURPOSE OF A STATEMENT ROW NAMES ANOTHER DOCUMENT, not the expense. 👁 Every
  # observed purpose follows one pattern — `Оплата за <generic category> згідно <ВН|рахунку>
  # № <number>[ від <date>], у т.ч. ПДВ 20%` — and the commonest form names no category at all,
  # only an invoice number. That is what `proves_subject: false` for this type in
  # config/policy.yaml rests on, and it is a WEAKER form of the same finding than the payment
  # confirmation's: here a generic category of goods was at least sometimes named, so the
  # confirmation's 0-of-7 is the stronger observation and this one confirms rather than carries it.
  #
  # `{invoice_no}`, `{invoice_date}` and `{delivery_note_no}` are filled by `content_builder`, as
  # `{invoice_no}` is for a confirmation: a reference to another document is not merchandise, so it
  # does not come from the placeholder vocabulary above.
  #
  # 🔴 «РАХУНОК» AND «ВН» ARE TWO DIFFERENT DOCUMENT CLASSES, AND THEY DO NOT SHARE A PLACEHOLDER.
  # A рахунок is an invoice, and the labelled row of a statement cites THE CLAIM'S OWN invoice —
  # that is the one cross-document reference this corpus offers. A ВН is a видаткова накладна, a
  # delivery note, and no claim contains one, so its number is drawn and points outside the claim.
  # Both used to be `{invoice_no}`, which is why the distinction is written here rather than
  # inferred from the wording: filling a delivery note with the claim's invoice number would
  # manufacture a reference that resolves to the wrong document class, and a linking system that
  # matched on «№» alone would score a correct-looking hit on it.
  purposes:
    uk:
      debit:
        - "Оплата за товар згідно ВН № {delivery_note_no}, у т.ч. ПДВ 20%"
        - "Оплата за послуги згідно рахунку № {invoice_no} від {invoice_date}"
        - "Оплата за витратні матеріали згідно рахунку № {invoice_no}, у т.ч. ПДВ 20%"
        - "Оплата згідно рахунку № {invoice_no} від {invoice_date}"
        - "Оплата за обладнання згідно ВН № {delivery_note_no}, у т.ч. ПДВ 20%"
      # 👁 A credit row's purpose cannot be an «Оплата за…»: the money is arriving. The observed
      # forms are a return of funds and a transfer between the holder's own accounts — and note
      # that a RETURN is exactly why a credit can never be proof of an expense.
      credit:
        - "Повернення коштів згідно рахунку № {invoice_no}, без ПДВ"
        - "Зарахування коштів, без ПДВ"
      # 🔴 A SEPARATE POOL BECAUSE THE COUNTERPARTY IS DIFFERENT, not because the wording is. On
      # a transfer between the holder's own accounts the counterparty IS the holder, and a first
      # version drew this purpose against an ordinary vendor — printing a shop as the sender of a
      # transfer between the reader's own accounts. Nothing in a label would have caught it; the
      # render did.
      credit_from_self:
        - "Переказ коштів між власними рахунками, без ПДВ"
      # 👁 The observed service-charge wording, verbatim as a formula: it names a tariff rather
      # than a transaction, and carries no identifier of anything.
      service_fee: "Комісія за розрахунково-касове обслуговування згідно тарифів банку, без ПДВ"


# =============================================================================
# File composition — how many documents one submitted FILE holds
# =============================================================================
#
# 🔴 THE SAME SPLIT AS `mismatch` AND `partial_payment` ABOVE, ON A QUESTION ABOUT FILES. A share
# that sizes a LABELLED BUCKET belongs beside `verdict_mix` in config/policy.yaml; this one sizes
# none. Bundling changes no verdict, no cause, no amount, no date and no party — the same claim,
# the same two documents, the same labels, carried in one file instead of two. What it changes is
# where a consumer has to look for them, which makes it a composition knob of exactly the kind
# `bank_statement.two_page_share` is, and this file is where those live.
#
# ⛔ THE PATTERN IS DOCUMENTS OF **ONE CLAIM** IN ONE FILE, AND ONLY THAT. Documents of DIFFERENT
# claims in one file is a shape this generator deliberately does not produce; the boundary and its
# reason are stated at the bundling site in `assembler.documents_share_one_file`.
file_composition:
  # HOW OFTEN THE DOCUMENTS OF ONE CLAIM ARRIVE AS ONE FILE, drawn per eligible claim — a claim
  # carrying a single document has nothing to bundle and is never eligible.
  #
  # 👁 ZERO OF THE AUTHOR'S OWN 87 FILES HOLDS MORE THAN ONE DOCUMENT, so the value is not measured
  # from them and the honest reading of that set is that it contains no instance of the case.
  # ⚠️ IT IS A JUDGEMENT, and the argument for it not being zero is about the SUBMISSION rather
  # than about the document: a channel that takes one file per claim, while a claim needs both a
  # subject document and a payment document, makes stitching the two the ordinary way to file it —
  # and a submission rule that admits a file of a dozen documents is stating that such files
  # arrive. A verifier meets them; a corpus in which every file holds exactly one document cannot
  # ask a file-splitting step to refuse a single cut, so it measures the construction of the data
  # rather than the step. See templates/ua_claim_bundle.html.
  #
  # 0.25 IS CHOSEN FROM TWO BOUNDS RATHER THAN PICKED, and the arithmetic is worth stating because
  # the eligible claims are not a small minority: at the current archetype registry ≈4 claims in 5
  # carry two documents (measured over 2,400 planned claims, no rendering involved). So 0.25 of
  # eligible puts roughly one claim in five, and about one FILE in eight, into the multi-document
  # case. Below that, a run of a few hundred claims holds too few boundaries for a segmentation
  # figure to mean anything. Above it, the single-document file stops being the overwhelming
  # majority — and every classification and extraction number this corpus has produced was
  # measured on files holding one document, so a share that changed the mix would change what
  # those numbers describe without anybody editing them. Asserted from both sides in
  # tests/test_multidocument_files.py.
  bundle_share: 0.25


# =============================================================================
# Personal names
# =============================================================================
#
# The surnames from which a personal name is composed, keyed by document language. Used for
# a sole trader printed on a receipt (`content_builder.sole_trader_name`) and for a
# persona's own name (`persona_generator`), which is not printed today but will be, as the
# payer on a payment confirmation. Given names and patronymics still come from `Faker`;
# only the surname is drawn from here.
#
# WHY THE SURNAME POOL IS NARROWED. This dataset is published, so a name on a rendered
# receipt is read as it appears, whatever mechanism produced it. `ФОП Бандера О. А.` is a
# name this generator actually drew: the surname came from a public list, the initials were
# drawn independently of it, and no real person was designated — and it still reads as a
# statement, because the surname is rare and loaded, so it points.
#
# THE PROPERTY THAT DECIDES IS RARITY TOGETHER WITH RECOGNISABILITY — not whether a surname
# belongs to real people. Every Ukrainian surname does, and a sole trader has to look real,
# so "avoid real surnames" is neither achievable nor wanted. What is wanted is that the name
# should not point at a PARTICULAR person, and a surname carried by a hundred thousand
# people cannot: `ФОП Коваленко О. І.` points at nobody, although public Коваленки certainly
# exist. The surname is noise rather than signal, and that is the whole mechanism.
#
# SO THIS IS A PROPERTY OF THE SAMPLE, NOT A REGISTER OF EXCEPTIONS. A denylist of loaded
# names is the wrong shape twice over: any sample of Ukrainian surnames contains politicians,
# writers and historical figures, so the list is never finished — and every surname NOT on it
# silently becomes a claim that it was checked and found safe. A narrowed pool needs no
# maintenance and makes no claim about any single entry. This repository removed exactly that
# denylist construction from its vendor names; it is not reintroduced here.
#
# SOURCE AND THRESHOLD. The list below is the Ukrainian Wikipedia project list of the most
# common surnames in Ukraine, whose declared inclusion threshold is at least 20,000 bearers
# among Ukrainian citizens, compiled from the surname-distribution map of the Ukrainian
# genealogy society «Рідні» (ridni.org):
#   https://uk.wikipedia.org/wiki/Вікіпедія:Проєкт:Україна/Список_найпоширеніших_прізвищ_в_Україні
# That threshold is the point, and it is why the source was chosen: it is a published lower
# bound on frequency for EVERY entry, so the set contains nothing rare. For scale, the same
# data puts the head of the distribution at Мельник 107,878 bearers, Шевченко 106,340,
# Коваленко 88,632, Бондаренко 88,133, Бойко 83,195.
#
# THREE ENTRIES OF THAT SOURCE ARE OMITTED — Іванов/Іванова, Попов/Попова, Ковальова — for a
# mechanical reason and not a judgement about the names: they are the only ones that inflect
# for sex. Without them the pool is one list that can be drawn from whatever the person's
# sex, because every surname below is identical in the masculine and feminine nominative.
#
# NOTHING IS EXCLUDED FOR BEING ICONIC, and the closest calls are deliberate. Шевченко,
# Кравчук and Тимошенко are all present and all are borne by very widely known Ukrainians.
# They stay because the criterion above is the criterion: each is carried by tens of
# thousands of people, so none of them points the way a rare surname does. Removing them
# would start the register this block exists to avoid, and would leave the next reader
# obliged to read every remaining entry as vetted, which none of them is.
#
# LANGUAGES WITH NO ENTRY HERE fall back to `Faker`'s own surname pool for that locale —
# see `content_builder.personal_surname`. Only Ukrainian documents are rendered today, and
# a narrowed set for pl/de/es arrives with the templates that print those names.

personal_names:
  surnames:
    uk:
      ["Бабенко", "Білоус", "Бойко", "Бондар", "Бондаренко", "Василенко",
       "Власенко", "Вовк", "Гаврилюк", "Герасименко", "Гончар", "Гончаренко",
