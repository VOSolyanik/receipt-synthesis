# Generation inputs — the vocabulary and the distributions the draws use.
#
# Nothing here is a label, and nothing here is law. This file answers three questions the
# generator has to answer before it can print a line on a document:
#
#   * what word goes where a name template has a placeholder — `{brand}`, `{dose}`, `{n}`;
#   * what such an article plausibly costs, and how many of it a basket holds;
#   * what coverage ratio a deliberately mixed basket aims at.
#
# WHY THIS IS NOT IN policy.yaml. `policy.yaml` is the labelling policy: it states what a
# benefit plan reimburses, and a downstream consumer loads it to stay consistent with the
# labels. A plan document says nothing about what a vitamin pack costs or which brands a
# pharmacy stocks — those are properties of the merchandise, not of the plan. The item
# kinds and the name templates stay in policy.yaml because they ARE the label space; this
# file only fills the holes those templates leave.
#
# WHY THE COVERAGE TARGETS ARE HERE TOO, AND NOT WITH `verdict_mix`. They shape a label
# distribution, which makes them a relative of `verdict_mix` rather than of a price range —
# but they are an ASPIRATION the builder aims at, never a value that reaches a label.
# `covered_fraction` in the ground truth is measured from the document that was actually
# built, and `content_builder._repriced` clamps prices into each item kind's own range, so
# the realized ratio only approaches the target. A consumer that loaded the target would
# learn nothing it could use and might mistake an aspiration for a label. It therefore
# belongs with the generator's own draw inputs, which is this file.
#
# CLEAN ROOM. No name here comes from any private source — see
# docs/architecture.md#provenance.
#
# EVERY MARK BELOW IS A PUBLICLY KNOWN ONE, and there is no third option. A brand appears
# only where it verifiably makes the article the template pairs it with: this repository is
# published, so printing "Планшет Canon" would put an unverifiable claim about a named
# company into every copy of the dataset, whatever the label says.
#
# INVENTING A MARK IS NOT THE SAFE FALLBACK IT LOOKS LIKE, and this file learned it the
# hard way. A public brand printed as a product is ordinary commerce. An invented mark that
# turns out to belong to a real small firm is a claim about that firm — and a name invented
# to sound plausible is plausible precisely because it is drawn from the space of real
# firms, so the better it reads, the likelier it is already taken. Two marks added here
# under the word "invented" turned out to be active companies in the very trade they were
# printed in. The intuition that inventing is the more polite choice is wrong: publicness is
# verifiable and inventedness is not. So there is no invented-mark class in this file, and
# nothing here needs a verification note, because nothing here rests on a check that a name
# is free.
#
# WHERE NO PUBLIC POOL FITS, THE KIND IS DECLARED UNPRINTABLE rather than filled with
# something made up — see `unprintable_item_kinds` at the foot of this block. That is a
# statement about the TEMPLATE, not about the vocabulary.
#
# Only the two name classes remain, and both are structurally safe rather than checked:
#
#   * public marks — public, so the question of whether they are free does not arise;
#   * personal names — composed at build time from the surname pool under `personal_names`
#     at the foot of this file. No full name is stored, and the surname is drawn from a
#     published high-frequency set, so it is too common to point at anyone. That block
#     states the reasoning; `content_builder.personal_surname` is the draw.
#
# Course titles, book titles, club names and session dates remain invented: they are works
# and events, not marks under which a firm trades, and none of them names a company.
#
# DETERMINISM. Every list is a list, never a set, and every list is drawn from with the
# seeded generator. Reordering a list changes what a given seed produces — that is expected
# and is the reason lists are edited deliberately rather than sorted by a tool.

version: 1

# =============================================================================
# A CONFLICT BETWEEN SOURCES, RECORDED RATHER THAN RESOLVED:
# what a seller that is NOT registered for ПДВ prints where the VAT letter goes
# =============================================================================
#
# Comment only — there is nothing here for a loader to read. It is a decision about what the
# generated documents LOOK LIKE, which is this file's subject; the letters themselves are law
# and live in `vat_letters` in config/fiscal-rules.yaml, and law cannot record a deliberate
# departure from itself.
#
# THREE SOURCES, THREE ANSWERS, AND THEY DO NOT RECONCILE:
#
#   📄 Положення про форму та зміст розрахункових документів (наказ Мінфіну № 13, редакція
#      11.01.2025), п. 2, the line-item requisite: "назва товару (послуги) […] вартість,
#      літерне позначення ставки ПДВ" — the letter is required, with NO reservation limiting
#      it to registered payers. Read alone, every line of every receipt carries one.
#   📄 The tax service's own clarification (ДПС, база знань / ЗІР 109.10, quoted in Factor
#      № 97, 12.2025): sellers that are not ПДВ payers "узагалі можуть не заповнювати поля
#      фіскальних чеків, що містять інформацію щодо цього податку" — they MAY leave the
#      fields concerning that tax unfilled. Permission, not instruction, so it settles
#      nothing on its own either.
#   👁 The one open photograph of a real ФОП receipt (1/1): there is no VAT block at all. The
#      line ends with the amount and nothing follows it; then СУМА / ЗНИЖКА / ЗАОКРУГЛЕННЯ /
#      ДО СПЛАТИ, with no ПДВ row anywhere. No letter, no zero-rate group, and no "Без ПДВ".
#
# OBSERVATION DECIDES, and the reason is what this generator is for: a dataset whose images
# must be indistinguishable from real ones is answerable to what real documents show, not to
# what the norm permits. A receipt built to the first reading would carry a requisite no
# observed receipt of that kind carries, on every image, and a model trained on it would
# learn to expect one.
#
# WHAT IS NOT CLAIMED. "Без ПДВ" and the exempt-group letter «Д» are 📄 named as permissible
# practice and were seen on no open sample ⛔ — so their absence here is a statement about the
# sample, not a claim that no printer emits them. And the observed receipt is ONE document, on
# the form in force BEFORE 01.03.2025; it is evidence about the VAT block, which that revision
# did not touch, and not about the completeness of the line set.

# =============================================================================
# Line-item placeholder vocabulary
# =============================================================================
#
# The name templates in policy.yaml carry placeholders: "Вітамін D3 {dose} МО табл. №{n}".
# This block says what may be substituted, keyed by ITEM KIND and then by placeholder name.
#
# Keyed by item kind because one placeholder means different things in different kinds:
# `{brand}` on `hardware` wants a laptop maker and on `cosmetics` wants a skincare house,
# and `{dose}` is 400–5000 IU for a vitamin but 14–45 mg for an iron tablet. A single global
# pool per placeholder would print "Крем Dell 250 мл" and "Залізо 2000 мг".
#
# Lookup order for (language, item kind, placeholder):
#   1. <language> -> <item kind> -> <placeholder>
#   2. shared     -> <item kind> -> <placeholder>
#   3. <language> -> default     -> <placeholder>
#   4. shared     -> default     -> <placeholder>
#   5. nothing found -> the builder RAISES, naming the kind, the language and the
#      placeholder. It does not skip the template. Skipping is what this file was written
#      to end: a template quietly dropped for want of a vocabulary narrows the printed
#      vocabulary of the whole dataset, and nothing says so.
#
# `shared` holds values that read identically in every document language — numbers, doses,
# Latin brand names, exam and certification codes. `default` holds the few placeholders
# whose meaning does not depend on the item kind at all.
#
# ONE POOL SERVES EVERY TEMPLATE OF A KIND, so a brand in it has to fit all of them. That
# is a real constraint, not a technicality: `hardware` prints a laptop, a monitor and a pair
# of headphones from one pool, `hygiene` a shower gel and a toothpaste, `electronics` a
# tablet and a camera. Where a real pool cannot satisfy every template, the names are
# invented rather than paired wrongly — see the clean-room note at the head of this file.
# Splitting such a kind would mean editing policy.yaml, which is the label space.

line_item_placeholders:

  # ---------------------------------------------------------------- shared --
  shared:

    default:
      # CEFR levels and pack counts read the same in any language.
      level: ["A1", "A2", "B1", "B2", "C1"]

    # --- medical_insurance
    insurance_premium:
      # Invented policy numbers. Shaped like the several conventions Ukrainian insurers
      # use, so a consumer extracting a policy number sees more than one format.
      policy_no: ["ДМС-2026/0148", "VHI-0247-26", "МС/2026/03318", "ДМС-114520", "PA-2026-00937"]

    # --- language_courses
    language_lessons:
      # Hours in one template, lessons in another. Kept at 5 and above: Ukrainian numerals
      # 2–4 take a different noun form ("2 заняття", not "2 занять"), and the templates in
      # policy.yaml spell the genitive plural.
      n: ["8", "10", "12", "16", "20", "24"]
    language_exam:
      # Publicly published examinations.
      exam: ["IELTS", "TOEFL iBT", "Cambridge B2 First", "Cambridge C1 Advanced", "Goethe-Zertifikat B1", "DELE B2"]
    textbook:
      # Publicly known English-language coursebook series; the titles print in Latin in
      # a Ukrainian receipt as well.
      title: ["English File Intermediate", "Headway Pre-Intermediate", "Outcomes Upper-Intermediate", "Speakout Elementary", "Empower B1"]

    # --- professional_development
    certification_exam:
      # Publicly published certification programmes.
      cert: ["AWS Certified Solutions Architect - Associate", "AZ-900", "Certified Kubernetes Administrator", "PMP", "ISTQB Foundation Level", "Professional Scrum Master I"]
    conference_ticket:
      # Publicly announced conference series.
      event: ["PyCon", "DevOpsDays", "KubeCon", "JSConf", "Data Science UA", "IT Arena"]
    hardware:
      # One pool serves "Ноутбук {brand}", "Монітор {brand}" and "Навушники {brand}", so
      # every brand here has to make all three. Logitech was dropped for that reason: it
      # makes headphones and no laptops or monitors, and a receipt printing "Ноутбук
      # Logitech" would state something untrue about a named company.
      brand: ["Dell", "Lenovo", "HP", "ASUS", "Acer", "Samsung"]
    travel:
      # Nights. 5 and above for the same numeral-agreement reason as above: policy.yaml
      # prints "{n} діб", the genitive plural.
      n: ["5", "6", "7"]

    # --- sport
    gym_membership:
      n: ["8", "10", "12", "16", "20"]
    pool_membership:
      n: ["8", "10", "12", "16", "20"]
    group_class:
      n: ["8", "10", "12", "16", "20"]
    personal_training:
      # Counted in "шт", which does not decline, so small numbers are safe here.
      n: ["1", "2", "4", "5", "8", "10"]
    sport_apparel:
      brand: ["Nike", "Adidas", "Puma", "Reebok", "Under Armour", "Decathlon"]
    sports_nutrition:
      # The same item kind appears under `sport` (excluded) and `vitamins_nutrition`
      # (ambiguous). One entry serves both — coverage is scoped to the category, the
      # merchandise is not.
      brand: ["Optimum Nutrition", "MyProtein", "BioTech USA", "Scitec Nutrition", "Olimp Sport Nutrition"]
      w: ["500", "700", "900", "2000"]
    food_drink:
      # `{brand}` is used by the `sport` templates ("Батончик {brand}"); the `hobby`
      # templates of the same kind print no brand at all.
      brand: ["Corny", "Nature Valley", "Nutrend", "Power Pro"]

    # --- mental_health
    therapy_session:
      n: ["1", "2"]
    group_therapy:
      n: ["6", "8", "10", "12"]

    # --- vitamins_nutrition
    vitamin_complex:
      # IU for vitamin D3, mg for omega-3 — both templates live in this kind and both
      # ranges overlap in the same numbers.
      dose: ["400", "500", "1000", "2000", "5000"]
      n: ["20", "30", "60", "90", "120"]
      brand: ["Solgar", "Now Foods", "Doppelherz", "Jarrow Formulas", "Nature's Bounty", "Orzax"]
    mineral_supplement:
      # Elemental iron per tablet, in mg. Deliberately NOT the vitamin dose pool: the same
      # placeholder name means a different quantity here.
      dose: ["14", "20", "25", "28", "45"]
      n: ["30", "50", "60", "90", "100"]
    medicine:
      # Milligrams per capsule, and pack sizes.
      dose: ["100", "200", "400", "500", "850"]
      n: ["10", "20", "30", "50", "60"]
    medical_device:
      brand: ["Microlife", "Omron", "Beurer", "Longevita", "Gamma"]
      n: ["25", "50", "100"]
    cosmetics:
      brand: ["Nivea", "Bioderma", "La Roche-Posay", "CeraVe", "Eveline", "Green Pharm"]
      w: ["50", "75", "100", "200", "250"]
    # `hygiene` has NO brand vocabulary and cannot get one — see `unprintable_item_kinds`.
    probiotic:
      # Capsule probiotics sold over the counter. BioGaia was dropped: its range is drops,
      # tablets and chewables, and the template prints capsules.
      brand: ["Lactiale", "Linex", "Enterol", "Bifiform"]
      n: ["10", "14", "20", "30"]

    # --- hobby
    hobby_materials:
      n: ["3", "4", "6", "12"]
      # Yarn manufacturers, publicly sold in Ukrainian craft shops.
      brand: ["YarnArt", "Alize", "Himalaya", "Nako", "Drops"]
    hobby_class:
      n: ["4", "5", "6", "8", "10"]
    # `electronics` has NO brand vocabulary and cannot get one — see `unprintable_item_kinds`.
    alcohol:
      # Ukrainian wineries with a public presence.
      brand: ["Shabo", "Koblevo", "Chateau Chizay", "Beykush"]
    hobby_tool:
      # Sewing-machine makers.
      brand: ["Singer", "Brother", "Janome", "Minerva"]

  # ------------------------------------------------------------ Ukrainian --
  uk:

    default:
      period: ["1 місяць", "3 місяці", "6 місяців", "12 місяців"]

    # --- medical_insurance
    family_member_premium:
      relative: ["дружина", "чоловік", "дитина", "мати", "батько"]

    # --- language_courses
    language_lessons:
      month: ["січень", "лютий", "березень", "квітень", "травень", "вересень", "жовтень", "листопад"]

    # --- professional_development
    online_course:
      # Invented course titles. Descriptive rather than copied from any catalogue.
      course: ["Основи хмарної архітектури", "Docker і Kubernetes на практиці", "Проєктування розподілених систем", "Аналіз даних мовою Python", "Тестування API"]
    professional_book:
      # Invented titles.
      title: ["Проєктування систем під навантаженням", "Практика рефакторингу", "Алгоритми для інженерів", "Основи мережевої безпеки", "Керування технічним боргом"]
    entertainment_book:
