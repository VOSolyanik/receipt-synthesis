      drug: ["Парацетамол", "Ібупрофен", "Німесулід", "Лоратадин", "Омепразол", "Дротаверин", "Амброксол", "Ацетилцистеїн", "Метформін", "Аторвастатин", "Цетиризин", "Панкреатин"]

