# The labelling policy of this generator: the rules by which a claim's verdict and
# covered fraction are derived. Because generation is label-first, these rules ARE
# the ground truth — they are not applied to documents after the fact, the
# documents are built to satisfy them.
#
# Deliberately a standalone declarative file rather than logic buried in code: any
# downstream document-verification pipeline can load this same file and stay
# consistent with the labels of the dataset it was trained on. Nothing in the
# pipeline hardcodes the category names, limits or thresholds below.
#
# PROVENANCE. The benefit categories below are derived from a public industry
# survey of benefits packages in the Ukrainian IT market, conducted and published
# by DOU (primary source, ~10.6k respondents; 10,664 responses on the benefits
# question):
#   https://dou.ua/lenta/articles/benefits-package-2026/
# Secondary summary consulted: https://scroll.media/2026/06/30/it-benefity-2026/
# Reported adoption: medical insurance 49%, English courses 39%, internal
# training / mentoring 33%, access to external courses 29%, gym / membership
# compensation 27%, mental health programmes 22%, massage 8%, family medical
# insurance 8%.
# The seven categories are a selection from that list, chosen for *document
# diversity* rather than popularity: each one owns a document type or an
# imperfection mechanism the others do not produce. Limits, thresholds and the
# verdict mix are this project's own plausible values — they describe no real
# employer's plan.
#
# STRUCTURE OF A CATEGORY. `intent` is the prose rule, i.e. what a real benefit
# policy document would say. The `*_items` maps are its machine-readable
# specification: item kind -> line-item name templates used when rendering.
# The item kind is the join key between three layers — content generation
# (which name to print), this policy (covered or not) and fiscal-rules.yaml
# (which VAT letter applies). On a real receipt no such kind is printed; it is a
# ground-truth vocabulary, not a runtime mechanism.

version: 1

# Active benefit period. A claim whose PAYMENT falls outside it is `rejected`, with
# the cause `outside_period` — one verdict and not a choice between two. Nothing about
# such a claim is unestablished, so it is not `insufficient_evidence`: the policy
# plainly does not cover it, by *when* rather than by *what*. Only the payment date is
# checked; a December invoice paid in January is an ordinary January expense
# (docs/architecture.md#the-period-is-checked-on-the-payment).
period:
  start: "2026-01-01"
  end: "2026-12-31"
  # WHICH DATE THE WINDOW IS CHECKED AGAINST. A real bank payment confirmation does not print
  # one date: several are printed at once, under captions that the law defining the document
  # does not define. So "the payment date" is a CHOICE, and it has to be written down
  # somewhere; the alternative is not neutrality, it is every reader choosing.
  #
  # THIS FILE NAMES THE CONCEPT AND NAMES NO CAPTION. The concept belongs here because the
  # period rule above is this file's rule: whoever loads this file to reproduce the labels has
  # to compare the window against the same thing the labels were built from. A caption is a
  # property of one bank's layout — it changes when a bank renames a row, and a benefit plan
  # is not edited for that. The mapping of printed captions onto the concept therefore lives
  # in the labelling contract: config/labelling-schema.yaml,
  # `document_types.payment_confirmation.payment_date`.
  #
  # THE SPLIT IS NOT STYLISTIC. A downstream consumer builds its own verdict engine against
  # this file, independently. Were the concept left unnamed here, two independent and equally
  # correct engines would pick different printed dates LEGITIMATELY — and because the period
  # is checked on this value, they would disagree not about a date but about the VERDICT. One
  # side would appear to be measuring the other wrongly while both were right, which is the
  # most expensive class of defect this repository has.
  payment_date: >
    The date on which the funds LEFT THE PAYER'S ACCOUNT. That is the whole of the concept,
    and it is stated positively on purpose: a printed date that answers some other question —
    when the instruction was drawn up, when the recipient acquires the funds, when the bank
    processed its own record — fails this definition by its own content, and needs no list to
    exclude it. Which printed caption carries it is not a policy question; see
    config/labelling-schema.yaml, `document_types.payment_confirmation.payment_date`.

# Currency the limits are expressed in. Foreign-currency documents are converted
# with config/fx-rates.yaml before limit checks.
reporting_currency: UAH

# --- how a persona's categories are drawn ------------------------------------
persona_categories:
  count_per_persona: { min: 3, max: 4 }
  # Medical insurance is near-universal in the Ukrainian market (49% overall,
  # and effectively the default allocation for many plans). Elsewhere in Europe
  # it is chosen rather than granted, but still chosen by most, because private
  # healthcare is expensive.
  probability:
    medical_insurance:
      UA: 0.95
      PL: 0.75
      DE: 0.75
      ES: 0.75
  # Remaining slots are drawn uniformly from the other categories.

# --- categories ---------------------------------------------------------------
categories:

  - id: medical_insurance
    display: { uk: "Медичне страхування", en: "Medical insurance" }
    intent: >
      Premiums for a personal voluntary health insurance policy. Proven by a bank
      payment confirmation whose payment purpose names the policy and the insurer.
      The policy document itself is out of scope and is never parsed.
    annual_limit: 16000
    covered_items:
      insurance_premium:
        uk: ["Страховий платіж за договором {policy_no}", "Черговий платіж, поліс {policy_no}"]
        en: ["Insurance premium, policy {policy_no}", "Quarterly premium {policy_no}"]
    excluded_items:
      property_insurance:
        uk: ["Страхування майна", "КАСКО"]
        en: ["Property insurance", "Motor insurance"]
      travel_insurance:
        uk: ["Туристичне страхування"]
        en: ["Travel insurance"]
    ambiguous_items:
      family_member_premium:
        uk: ["Страховий платіж, застрахована особа {relative}"]
        en: ["Premium for insured person {relative}"]

  - id: language_courses
    display: { uk: "Мовні курси", en: "Language courses" }
    intent: >
      Tuition for language classes with a school or a private tutor, billed per
      month or per package of lessons. Course materials bought separately are not
      reimbursed.
    annual_limit: 12000
    covered_items:
      language_lessons:
        uk: ["Заняття з англійської, {n} год", "Абонемент {n} занять, {level}", "Навчання за {month}"]
        en: ["English lessons, {n} hours", "Package of {n} lessons, {level}", "Tuition for {month}"]
      placement_test:
        uk: ["Тестування рівня"]
        en: ["Placement test"]
      language_exam:
        uk: ["Складання іспиту {exam}"]
        en: ["{exam} exam fee"]
    excluded_items:
      textbook:
        uk: ["Підручник {title}", "Робочий зошит"]
        en: ["Coursebook {title}", "Workbook"]
      stationery:
        uk: ["Зошит", "Ручка"]
        en: ["Notebook", "Pen"]
    ambiguous_items:
      missed_lesson_fee:
        uk: ["Пропущене заняття без попередження"]
        en: ["Late cancellation fee"]

  - id: professional_development
    display: { uk: "Професійний розвиток", en: "Professional development" }
    intent: >
      Paid training that develops professional skills: online and offline courses,
      certification exams, conference tickets and professional literature.
      Hardware, entertainment and travel to the event are not reimbursed.
    annual_limit: 16000
    covered_items:
      online_course:
        uk: ["Онлайн-курс «{course}»", "Підписка на навчальну платформу, {period}"]
        en: ["Online course \"{course}\"", "Learning platform subscription, {period}"]
      certification_exam:
        uk: ["Сертифікаційний іспит {cert}"]
        en: ["{cert} certification exam"]
      conference_ticket:
        uk: ["Квиток на конференцію {event}", "Regular ticket"]
        en: ["Conference ticket, {event}", "Regular ticket"]
      professional_book:
        uk: ["Книга «{title}»"]
        en: ["Book \"{title}\""]
    excluded_items:
      hardware:
        uk: ["Ноутбук {brand}", "Монітор {brand}", "Навушники {brand}"]
        en: ["Laptop {brand}", "Monitor {brand}", "Headphones {brand}"]
      entertainment_book:
        uk: ["Книга «{fiction_title}»"]
        en: ["Novel \"{fiction_title}\""]
      travel:
        uk: ["Квиток Київ — {city}", "Проживання, {n} діб"]
        en: ["Ticket to {city}", "Accommodation, {n} nights"]
    ambiguous_items:
      workshop_materials:
        uk: ["Роздаткові матеріали воркшопу"]
        en: ["Workshop materials"]

  - id: sport
    display: { uk: "Спортивна програма", en: "Sports program" }
    intent: >
      Membership fees and paid classes at sports facilities. Goods, apparel,
      supplements and food bought at the same venue are not reimbursed.
    annual_limit: 12000
    covered_items:
      gym_membership:
        uk: ["Абонемент {n} занять", "Клубна карта, {period}", "Разове відвідування"]
        en: ["Membership, {n} sessions", "Club card, {period}", "Single entry"]
      pool_membership:
        uk: ["Абонемент басейн, {n} відвідувань", "Плавання, разове"]
        en: ["Pool pass, {n} entries", "Swimming, single entry"]
      group_class:
        uk: ["Групове заняття {activity}", "Йога, {n} занять"]
        en: ["Group class {activity}", "Yoga, {n} sessions"]
    excluded_items:
      sport_apparel:
        uk: ["Футболка {brand}", "Рушник", "Шапочка для басейну"]
        en: ["T-shirt {brand}", "Towel", "Swim cap"]
      sports_nutrition:
        # Same item kind is `ambiguous` under `vitamins_nutrition` — coverage is
        # scoped to the category, not global to the kind.
        uk: ["Протеїн {brand} {w} г", "Ізотонік {brand}"]
        en: ["Protein {brand} {w} g", "Isotonic drink {brand}"]
      food_drink:
        uk: ["Вода 0,5 л", "Батончик {brand}"]
        en: ["Water 0.5 l", "Bar {brand}"]
    ambiguous_items:
      personal_training:
        uk: ["Персональне тренування, {n} шт"]
        en: ["Personal training, {n} sessions"]
      equipment_rent:
        uk: ["Оренда шафки, {period}", "Оренда рушника"]
        en: ["Locker rental, {period}", "Towel rental"]

  - id: mental_health
    display: { uk: "Ментальне здоров'я", en: "Mental health" }
    intent: >
      Sessions with a licensed psychotherapist or psychologist, individual or
      family. Providers are usually private entrepreneurs who issue an act of
      services rendered rather than a fiscal receipt — such an act alone does not
      prove payment.
    annual_limit: 25000
    covered_items:
      therapy_session:
        uk: ["Психотерапевтична консультація, {n} год", "Сесія {date}"]
        en: ["Psychotherapy session, {n} h", "Session {date}"]
      family_therapy:
        uk: ["Сімейна консультація"]
        en: ["Family counselling session"]
      psych_assessment:
        uk: ["Психодіагностика"]
        en: ["Psychological assessment"]
    excluded_items:
      coaching:
        uk: ["Коуч-сесія"]
        en: ["Coaching session"]
      self_help_book:
        uk: ["Книга «{title}»"]
        en: ["Book \"{title}\""]
    ambiguous_items:
      group_therapy:
        uk: ["Групова терапія, {n} занять"]
        en: ["Group therapy, {n} sessions"]

  - id: vitamins_nutrition
    display: { uk: "Вітаміни та нутриціологія", en: "Vitamins and nutrition" }
    intent: >
      Vitamin and mineral complexes, and consultations with a nutritionist.
      Prescription and over-the-counter medicines are treated as healthcare and
      are not reimbursed here, even when bought on the same pharmacy receipt.
    # Note that the coverage boundary deliberately does NOT coincide with the
    # fiscal VAT boundary: medicines are non-covered but carry the reduced 7% VAT
    # letter, while vitamin complexes are covered and may carry either letter.
    # A consumer therefore cannot shortcut coverage from the VAT letter and has to
    # read the line item.
    annual_limit: 12000
    covered_items:
      vitamin_complex:
        uk: ["Вітамін D3 {dose} МО табл. №{n}", "Полівітаміни {brand} капс. №{n}", "Омега-3 {dose} мг капс. №{n}"]
        en: ["Vitamin D3 {dose} IU tabl. #{n}", "Multivitamin {brand} caps. #{n}", "Omega-3 {dose} mg caps. #{n}"]
      mineral_supplement:
        uk: ["Магній B6 табл. №{n}", "Залізо {dose} мг табл. №{n}", "Цинк табл. №{n}"]
        en: ["Magnesium B6 tabl. #{n}", "Iron {dose} mg tabl. #{n}", "Zinc tabl. #{n}"]
      nutritionist_visit:
        uk: ["Консультація нутриціолога", "Складання плану харчування"]
        en: ["Nutritionist consultation", "Personalised nutrition plan"]
    excluded_items:
      medicine:
        uk: ["{drug} табл. №{n}", "{drug} капс. {dose} мг №{n}"]
        en: ["{drug} tabl. #{n}", "{drug} caps. {dose} mg #{n}"]
      medical_device:
        uk: ["Тонометр {brand}", "Тест-смужки №{n}"]
        en: ["Blood pressure monitor {brand}", "Test strips #{n}"]
      cosmetics:
        uk: ["Крем {brand} {w} мл"]
        en: ["Cream {brand} {w} ml"]
      # BRANDLESS ON PURPOSE, and it is what makes this kind printable at all. Both templates
      # used to name `{brand}`, and the brand vocabulary in config/generation.yaml is keyed by
      # ITEM KIND rather than by template — so one pool had to serve the shower gel and the
      # toothpaste, and a mark drawn for either was printed on the other. The generator
      # therefore declined to fill the kind and it reached no dataset. Naming the size instead
      # of a house removes the pool, and 👁 it is how Ukrainian receipts most often print such
      # articles anyway. The consequence for a consumer is that this kind contributes exactly
      # two printed strings — see KL-02 in config/labelling-schema.yaml.
      hygiene:
        uk: ["Гель для душу 250 мл", "Зубна паста 75 мл"]
        en: ["Shower gel 250 ml", "Toothpaste 75 ml"]
    ambiguous_items:
      lab_test:
        # Ordered by the nutritionist, but it is a medical service.
        uk: ["Аналіз крові: вітамін D", "Аналіз крові: феритин"]
        en: ["Blood test: vitamin D", "Blood test: ferritin"]
      sports_nutrition:
        # A supplement, but a sports one — the same kind is excluded under `sport`.
        uk: ["Протеїн {brand} {w} г", "BCAA {brand}"]
        en: ["Protein {brand} {w} g", "BCAA {brand}"]
      probiotic:
        uk: ["Пробіотик {brand} капс. №{n}"]
        en: ["Probiotic {brand} caps. #{n}"]

  - id: hobby
    display: { uk: "Хобі", en: "Hobbies" }
    intent: >
      Classes, memberships and materials for a non-professional creative or
      leisure activity. Electronics, food and alcohol bought alongside are not
      reimbursed.
    annual_limit: 10000
    covered_items:
      hobby_class:
        uk: ["Заняття {activity}, {n} шт", "Майстер-клас {activity}"]
        en: ["{activity} class, {n} sessions", "{activity} workshop"]
      hobby_materials:
        uk: ["Набір для {activity}", "Фарби акрилові, {n} шт", "Пряжа {brand}"]
        en: ["{activity} kit", "Acrylic paints, {n} pcs", "Yarn {brand}"]
      club_membership:
        uk: ["Членський внесок клубу {club}, {period}"]
        en: ["Club membership {club}, {period}"]
      instrument_rent:
        uk: ["Оренда {instrument}, {period}"]
        en: ["{instrument} rental, {period}"]
    excluded_items:
      electronics:
        uk: ["Планшет {brand}", "Камера {brand}"]
        en: ["Tablet {brand}", "Camera {brand}"]
      food_drink:
        uk: ["Кава", "Сендвіч"]
        en: ["Coffee", "Sandwich"]
      alcohol:
        uk: ["Вино {brand} 0,75 л"]
        en: ["Wine {brand} 0.75 l"]
    ambiguous_items:
      hobby_tool:
        uk: ["Мольберт", "Швейна машина {brand}"]
        en: ["Easel", "Sewing machine {brand}"]

# --- verdict derivation ------------------------------------------------------
coverage:
  # covered_fraction = covered amount / total amount.
  #
  #   covered_fraction >= full_threshold    -> covered
  #   0 < covered_fraction < full_threshold -> partially_covered
  #   covered_fraction == 0                 -> rejected
  #
  # `rejected`, and NOT `not_proof_of_payment`. The two are easy to merge and are
  # not the same outcome: they answer different questions, and a claim earns one
  # of them for reasons the other knows nothing about.
  #
  # `rejected` answers WHETHER THE POLICY COVERS THE CLAIM AT ALL, and it has two
  # ways of answering no.
  #
  #   By WHAT WAS BOUGHT — a covered fraction of zero, decided from the line items
  #   against the category's `covered_items` / `excluded_items`. A basket drawn
  #   wholly from `excluded_items` is exactly that case. Carries NO cause in
  #   `imperfection`: the verdict says the whole of it.
  #
  #   By WHEN IT WAS PAID — the claim's payment falls outside `period` above.
  #   Carries the cause `outside_period`, which is what tells the two routes apart.
  #
  # Both are visible on the document, so `verdict_basis` is ["documents"] either
  # way. And neither is `insufficient_evidence`: that verdict says a required fact
  # was not established, and an out-of-window expense establishes every one of
  # them — the purchase happened, the proof is flawless, only the date does not
  # match. Not covered by *when* rather than by *what* is still not covered.
  #
  # `not_proof_of_payment` answers WHETHER MONEY MOVED, and that is a property of
  # the DOCUMENT TYPE — `proves_payment` in the `document_evidence` block below —
  # not of item coverage. A fiscal receipt proves its payment whatever its basket
  # was, so a pharmacy receipt listing nothing but medicines is `rejected` and is
  # not, on any reading, a failure of proof of payment.
  #
  # The two must not be collapsed into one another in either direction. Each is a
  # verdict a consumer is expected to reach on its own, and merging them destroys
  # a distinction this policy draws deliberately.
  #
  # STRICT semantics: ANY non-covered line item makes the claim partially
  # covered, however small. A 3 UAH carrier bag on a 1000 UAH pharmacy receipt is
  # not reimbursed, and the label must say so — otherwise the dataset would
  # contain images with a visibly non-covered line labelled as fully covered, and
  # a consumer would learn to ignore small non-covered items.
  #
  # The threshold therefore exists ONLY to absorb floating-point error when
  # summing amounts, not to absorb real items. Hence 0.9999, not 0.995.
  full_threshold: 0.9999

limits:
  # Limits bind on CUMULATIVE spend per persona per category over the period, not
  # on a single claim. claim_planner therefore processes a persona's claims in
  # date order and carries the remaining balance: an otherwise fully covered
  # claim becomes `partially_covered` when it exceeds what is left.
  #
  # Such a verdict CANNOT be derived from the document pixels — no consumer can
  # read a remaining balance off a receipt. Every claim therefore records
  # `verdict_basis`:
  #   ["documents"]                     -> derivable from the images alone
  #   ["documents", "account_state"]    -> also needs the persona's spend history
  # Document-understanding metrics are computed on the first subset only;
  # end-to-end system metrics on both.
  enforce_cumulative: true

# Target distribution over claim verdicts. The assembler's balance-report checks
# the realized distribution against this.
#
# This is a decision about DATASET BALANCE, not an estimate of anything: in
# production the `covered` class would dominate heavily. Over-representing the
# harder verdicts is what makes a per-class F1 meaningful — but it also means
# aggregate metrics measured on this dataset do not transfer to production without
# reweighting by the class prior expected there.
#
# That prior is deliberately NOT defined here. It is an assumption about a
# particular deployment, it is consumed by whoever computes metrics, and no stage
# of this generator reads it. It belongs to the evaluation configuration of the
# consumer, not to the specification of the dataset.
verdict_mix:
  covered: 0.40
  partially_covered: 0.20
  # 🔴 THE SHARE DID NOT MOVE AND THE VERDICT DID: this entry has read 0.10 since the file was
  # written, sizing a bucket nothing filled. `claim_planner` now plans a claim whose only document
  # states what was bought and never that money moved — a bare invoice, or the товарний чек the
  # `ua_non_fiscal_receipt` archetype prints — and the engine reads the document types and answers
  # this verdict. So the number is unchanged and what it sizes is real for the first time.
  #
  # ⚠️ WHAT THIS COSTS EVERY OTHER SHARE is one line below, at
  # `insufficient_evidence_causes_min_run_size`: a fifth member in the realizable subset makes the
  # denominator 0.90 instead of 0.80, so every other verdict is drawn slightly RARER than before
  # while its declared share is untouched. That is the renormalization this file has always
  # described and the reason the run-size guideline is derived rather than picked.
  not_proof_of_payment: 0.10
  insufficient_evidence: 0.10
  # 🔴 THE SHARE DID NOT MOVE AND THE VERDICT DID, for the second time in this file and by a
  # different route. This entry has read 0.10 since the file was written; what it sized was
  # unbuildable because no archetype PRINTED anything a payment could be part of. The invoice now
  # states an instalment term — that its obligation is settled in equal parts, and what one part
  # comes to — so `claim_planner` plans a pair whose payment settles exactly one part and the
  # engine reads the printed term. See `partial_payment` below for the rule and for why the
  # arithmetic alone could not have supplied it.
  #
  # 🔴 AND WITH IT THE REALIZABLE SUBSET BECOMES THE WHOLE MIX. It summed to 0.90 while this member
  # was absent from it; it sums to 1.00 now, so every other verdict is drawn slightly RARER than
  # before at an unchanged declared share, and the balance report's shares stop being conditional
  # on anything. `insufficient_evidence_causes_min_run_size` below moves from 85 to 90 for that
  # reason and for no other — the derivation is redone there rather than assumed to have survived.
  partially_paid: 0.10
  # 🔴 A SHARE AT LAST, AND IT ARRIVES WITH THE MECHANISM RATHER THAN BEFORE IT. This entry
  # read `null` while nothing could build such a claim, on the ground that a number set then
  # would size a bucket nothing fills. One of the two routes to `rejected` is now drawn:
  # `claim_planner` moves a claim's payment date OUT of `period` above, which the engine
  # labels `rejected` with the cause `outside_period`. A verdict with a mechanism gets a
  # share; that is the rule this file has always followed, and the number arrives by the rule.
  #
  # ⚠️ ONE ROUTE OF THE TWO, so every `rejected` claim in a corpus is out-of-period. The other
  # — a basket drawn wholly from the category's `excluded_items`, i.e. a covered fraction of
  # zero — needs `content_builder` to draw no covered line, and it always draws at least one.
  # That route is recorded as unbuildable in `claim_planner._UNREALIZABLE_ROUTES` and declared
  # to consumers as a known limitation in config/labelling-schema.yaml: a reader of this
  # dataset must not learn "`rejected` means the date is outside the window", because here it
  # does.
  #
  # 0.10, THE SAME AS THE OTHER THREE NEGATIVES, and equal for the reason
  # `insufficient_evidence_causes` below splits evenly: a skew between them would have to come
  # from an observation that a claimant files an out-of-window expense more or less often than
  # a bare transfer, and NO SUCH OBSERVATION EXISTS. Nothing in this repository has measured
  # one, and inventing a skew would smuggle a claim about the world into a file whose numbers
  # are decisions about a dataset.
  #
  # TAKEN FROM `covered`, WHICH FALLS 0.50 -> 0.40. The mix has to sum to 1.0, so a new share
  # is a share removed from somewhere, and `covered` is the member to take it from: the
  # paragraph above says production would be dominated by that class and that this file
  # deliberately over-represents the harder ones, so `covered` is the padding here while every
  # other share sizes a mechanism under test.
  #
  # 🔴 AND THE REALIZABLE SUBSET SUMMED TO 0.80 WHEN THIS SHARE ARRIVED, which is what kept the
  # derivation under `insufficient_evidence_causes_min_run_size` correct at the time: `covered`
  # 0.40 + `partially_covered` 0.20 + `insufficient_evidence` 0.10 + `rejected` 0.10 was the same
  # total the three realizable members had before, so `insufficient_evidence` went on being drawn
  # on 12.5% of built claims. ⚠️ IT SUMS TO 0.90 NOW — `not_proof_of_payment` joined the subset
  # without a share moving — so that rate is 11.1% and the guideline is 85 rather than 75. The
  # paragraph is kept as written and corrected here rather than rewritten, because the two facts
  # are separate: the share was paid for out of `covered`, and the DENOMINATOR later changed for a
  # reason that has nothing to do with this member. An edit that moves either number has to redo
  # the derivation rather than assume it survived.
  rejected: 0.10

# Why a claim ends up partially covered. Splits the `partially_covered` bucket
# above by cause; must sum to 1.0.
#
# The distinction matters because the two causes carry different `verdict_basis`:
# a non-covered line item is visible in the image, an exhausted annual limit is
# not. Stated explicitly rather than as a single rate, so the resulting share of
# the whole dataset is predictable: 0.20 * 0.35 = 7% of claims exercise the limit
# mechanism.
partially_covered_causes:
  mixed_items: 0.65        # a non-covered line on the document
  limit_exhausted: 0.35    # the annual balance ran out

# Why a claim's evidence is insufficient. Splits the `insufficient_evidence` bucket
# of `verdict_mix` by cause, over the causes the generator can BUILD; must sum to 1.0.
#
# WHY THIS BLOCK IS LEGITIMATE HERE AND A `document_mix` WOULD NOT BE — the question the
# next reader will ask, so it is answered where the parameter lives.
#
# A share here is a DESIGN PARAMETER OF AN EVALUATION SET, of exactly the same kind as
# `verdict_mix` above: it does not estimate how often a real claimant attaches a payment
# for the wrong amount, it DECIDES how often this dataset contains one, so that a
# per-cause figure is measurable at all. The paragraph above `verdict_mix` says the same
# thing about verdicts — over-representing the harder cases is what makes a per-class
# metric meaningful, and the production prior is deliberately not defined here. This
# block inherits that reasoning whole. It asserts NOTHING about a real claim flow.
#
# A `document_mix` — how often a dataset contains a receipt rather than an invoice — was
# refused for the opposite reason: it would read as an observation about which documents
# claimants actually submit, which nothing in this repository has measured. The
# distinction is not the file the number sits in; it is whether the number is a decision
# about this dataset or a claim about the world. This one is a decision.
#
# 🔴 ONLY THE CAUSES THAT CAN BE BUILT CARRY A SHARE, AND ALL THREE OF THEM NOW CAN.
# `subject_not_evidenced` — a claim whose documents establish that money moved and never
# what it bought — carried none while nothing could plan a deliberately incomplete claim.
# The planner now can: it names the intent (`claim_planner.EvidenceIntent.EVIDENCE_GAP`)
# and selects a payment document with no subject beside it, so the bucket this share sizes
# is one the generator fills. A cause with a mechanism gets a share; that is the rule this
# block has always followed, and the entry arrives by the rule rather than by exception.
#
# The other two are the CROSS-CHECK causes: both need a claim whose subject document and
# whose payment document are different documents, so both became buildable only when an
# archetype proving the subject alone was registered. All three carry the same
# `verdict_basis` — a reader of the images can see each of them.
#
# 🔴 THE SHARES ARE EQUAL, AND EQUAL FOR A REASON RATHER THAN BY DEFAULT. An unequal split
# would have to come from an observation — that claimants attach a payment for the wrong
# amount more often than they attach one dated too early, or send a bare transfer more
# often than either — and NO SUCH OBSERVATION EXISTS. Nothing in this repository has
# measured any of them, and inventing a skew would smuggle a claim about the world into a
# file whose whole point is that these numbers are decisions about a dataset. So the
# realizable causes split evenly: two of them, half each; three of them, thirds.
# `partially_covered_causes` above is NOT uniform, and the difference is instructive — its
# 65/35 sizes the share of the dataset that exercises the cumulative-limit mechanism, which
# is a decision about how much of a MECHANISM to test. There is no such asymmetry between
# three causes that cost the same to build.
#
# ⚠️ THIRDS, TO THE NEAREST HUNDREDTH, AND ONE OF THEM CARRIES THE ODD ONE. Three equal
# shares cannot be written exactly in two places while the block sums to 1.0, so the first
# reads 0.34. Which one takes it is arbitrary and decides nothing measurable — a hundredth
# of an eighth of the corpus — and writing 0.3333 instead would state a precision nobody
# chose. The run-size guideline below is derived from the SMALLEST share, so the rounding
# cannot make that number optimistic.
#
# WHAT IS REQUIRED IS OF THE RESULT, NOT OF THE SHARE: at or above the run size named by
# `insufficient_evidence_causes_min_run_size` below, every cause here must be NON-ZERO in a
# generated run. A verdict's share is not a mechanism's share — `verdict_mix` declares
# `insufficient_evidence: 0.10` and says nothing about which cause realizes it, so ten
# percent of the corpus arriving through one cause would leave the label vocabulary
# promising three causes while the data held one. The realized distribution is measured and
# recorded per run in `known_limitations` in config/labelling-schema.yaml.
#
# BELOW THAT SIZE A ZERO COUNT IS EXPECTED BEHAVIOUR, NOT A DEFECT. A run of 36 claims that
# realized zero `amount_mismatch` is not this policy violated — it is a small sample landing
# on the low side of a distribution, and the guideline below exists so a reader can tell the
# two apart instead of every small corpus reading as broken.
insufficient_evidence_causes:
  subject_not_evidenced: 0.34     # no document of the claim states what was bought
  amount_mismatch: 0.33           # the payment states a different amount from the subject
  payment_precedes_subject: 0.33  # the payment is dated before what it settles

# THE RUN SIZE AT WHICH THE NON-ZERO REQUIREMENT ABOVE BINDS, derived from the actual draw
# probabilities rather than picked. `verdict_mix` renormalizes over the realizable subset, and
# EVERY MEMBER IS NOW REALIZABLE — `covered` 0.40, `partially_covered` 0.20,
# `insufficient_evidence` 0.10, `not_proof_of_payment` 0.10, `partially_paid` 0.10, `rejected`
# 0.10 — so the subset sums to 1.00 and `insufficient_evidence` is drawn on 10.0% of built claims
# (this is the same renormalization the balance report prints as "target, of the realizable
# subset", which is now the whole mix). `insufficient_evidence_causes` above then splits that
# three ways, so a single built claim lands on the RAREST cause with probability
# 0.100 * 0.33 = 0.033.
#
# For a run of N built claims, the probability that a cause drawn at rate p is realized at
# least once is 1 - (1 - p)^N. Solving 1 - (1 - 0.033)^N >= 0.95 for the smallest N gives
# N >= ln(0.05) / ln(1 - 0.033) ~= 89.3, i.e. 90 built claims. At 90 built claims or more, a zero
# count for any cause is unlikely enough (<5%) to report as a defect rather than as sampling
# noise; below it, a zero count is unremarkable and the balance report says so.
#
# ⚠️ IT MOVED FROM 50 TO 75 WHEN THE THIRD CAUSE GAINED A SHARE, from 75 TO 85 WHEN
# `not_proof_of_payment` BECAME REALIZABLE, and from 85 TO 90 WHEN `partially_paid` DID — and the
# last two are the instructive ones, because NOTHING ABOUT `insufficient_evidence` OR ITS CAUSES
# CHANGED IN EITHER. A member entered the realizable subset, so the denominator of the
# renormalization rose — 0.80, then 0.90, now 1.00 — and every other verdict is drawn slightly
# rarer at an unchanged declared share. A guideline derived from a share alone would have missed
# all three; this one is derived from the DRAW, which is why it moves when a verdict elsewhere in
# the file gains a mechanism. A figure quoted against any older guideline was correct for the
# subset of its day.
#
# 🔴 AND THE DENOMINATOR CAN NO LONGER RISE. It is 1.00; the enum is fully realizable, so the next
# move of this number will have to come from `insufficient_evidence`'s own share or from its
# causes, which is the first time that has been true.
insufficient_evidence_causes_min_run_size: 90

# WHEN A PAYMENT SMALLER THAN ITS SUBJECT DOCUMENT IS A PART RATHER THAN A MISMATCH.
#
# 🔴 TWO CLAIMS WITH THE SAME PAIR OF NUMBERS AND DIFFERENT VERDICTS, which is why this block
# exists at all. An invoice for 12000.00 beside a payment of 3000.00 is either
#
#   * an obligation settled IN PARTS — an annual gym subscription billed for the year and paid
#     quarterly — which is `partially_paid`, a lawful claim of which part of the amount has been
#     paid; or
#   * a payment that simply states a different amount from the document it is offered as
#     settling, which is `insufficient_evidence` with the cause `amount_mismatch`: the two
#     documents do not describe one transaction, so nothing establishes that THIS payment paid
#     for THIS subject.
#
# ⛔ THE DIFFERENCE IS NOT THE ARITHMETIC AND CANNOT BE. "The payment is smaller" is true of both,
# so a rule reading only the amounts would relabel every `amount_mismatch` whose delta happens to
# fall on the low side as `partially_paid` — collapsing a negative the corpus already contains
# into one it is only now gaining, and leaving the dataset with fewer distinctions than it
# started with. The difference is INTENT, and intent has to be PRINTED to be readable.
#
# 🔴 SO THE RULE TURNS ON A MARKER THE SUBJECT DOCUMENT CARRIES: the document states that its
# obligation is settled in equal parts and what one part comes to. On this generator's Ukrainian
# invoice that is the payment term «Умови оплати: оплата частинами …, черговий платіж: …»,
# labelled as `instalment_amount`. A document that carries no such term states one obligation
# payable in one, and a payment disagreeing with it disagrees.
#
# A PAYMENT TERM IS NOT A PAYMENT STATUS, and the distinction is what keeps this rule from
# reading proof of payment off a printed word. The term says how the seller proposes to be paid
# and is fixed when the document is drawn up; whether money moved is still decided from the
# PAYMENT document's type in `document_evidence` below, exactly as on every other claim.
#
# WHAT A CONSUMER'S OWN ENGINE HAS TO IMPLEMENT, stated so that it can be implemented from this
# file alone:
#
#   for a transaction whose subject and payment are DIFFERENT documents:
#     if   subject.instalment_amount is not null
#     and  payment.amount == subject.instalment_amount
#     and  subject.instalment_amount <  subject.amount     -> partially_paid
#     elif payment.amount            != subject.amount     -> insufficient_evidence /
#                                                             amount_mismatch
#
# 🔴 EQUALITY WITH THE PRINTED PART, NOT MERELY "SMALLER THAN THE TOTAL". A document that states
# its parts and a payment that matches none of them is not a partial settlement of it — it is a
# payment for some third amount, which is the mismatch case again. The equality is what makes the
# marker load-bearing rather than decorative: it has to AGREE with the payment, not merely be
# present.
#
# ⚠️ AND IT IS CHECKED ON THE SUBJECT DOCUMENT ONLY. A payment document states what left the
# account and has no view of the obligation behind it; 👁 a payment purpose names an invoice, not
# how much of one is left.
#
# WHAT SUCH A CLAIM IS PAID OUT: NOTHING, in this version, and that is a policy decision rather
# than an implementation gap. The plan reimburses against the obligation the subject document
# states, and only part of that obligation has been settled; how much of a partly settled
# obligation is payable — the part paid, the whole once completed, nothing until then — is a
# decision this policy has not taken. `reimbursable_amount` is therefore 0.00 and the ledger is
# untouched, exactly as for the other verdicts that establish something and pay nothing.
#
# 🔴 AND WHAT HAPPENS WHEN A PARTIAL SETTLEMENT IS PAID OUTSIDE THE `period` ABOVE — a question two
# engines built from this file must not be left to answer differently. The period rule above is
# stated UNCONDITIONALLY, so a reader implementing it in the order this file declares things would
# check the window first and answer `rejected`; an implementer following the discrimination above,
# which lives beside the amount cross-check, could as reasonably answer `partially_paid`. Both
# would be faithful to the file and they would disagree about a LABEL, which is the most expensive
# kind of disagreement this project has. So the precedence is decided here rather than left to the
# order of paragraphs, and `partial_payment.outside_the_period` below is the machine-readable form.
#
# `rejected` WINS, AND THE STRUCTURE OF THE VERDICTS IS WHAT DECIDES IT. There are two tiers:
#
#   * the EVIDENCE verdicts — `not_proof_of_payment`, `insufficient_evidence` — say that a slot of
#     `document_evidence` is unestablished. They come first, because a claim that has not
#     established what it is about cannot be assessed against a policy at all. That is why a
#     payment dated BEFORE the invoice it settles stays `insufficient_evidence` even when the
#     amounts agree perfectly: the order is impossible, so there is nothing to score.
#   * the POLICY verdicts — `rejected`, `partially_paid`, and the coverage ones — presuppose that
#     every slot IS established, and then say what the plan makes of the claim. Among them,
#     `rejected` by period comes first because it answers a PRIOR question: whether the plan
#     covers this expense at all. It does not, on an axis that nothing about the settlement can
#     change. `partially_paid` is a statement about a claim the plan DOES cover — a lawful claim
#     awaiting the rest of its instalments — and saying that of an expense outside the benefit
#     window would describe a settlement the plan is not party to.
#
# ⚠️ IT IS UNREACHABLE IN A GENERATED CORPUS TODAY and is specified all the same. `claim_planner`
# names a payment schedule for a `partially_paid` claim and displaces a payment out of the window
# for a `rejected` one, and never both, so no claim of this dataset exercises the precedence. A
# consumer's own engine meets it the first time a real claim does, and a rule that exists only in
# whichever branch an implementation happened to write first is not a rule.
partial_payment:
  # The label field(s) carrying the marker. `policy_engine` pins its own reading against this
  # list, so the file and the engine cannot drift apart in silence.
  marker_fields: [instalment_amount]
  # WHICH VERDICT A PARTIAL SETTLEMENT PAID OUTSIDE `period` GETS. See the paragraphs above for
  # why: the period question is prior, and `partially_paid` describes a claim the plan covers.
  outside_the_period: rejected

# What each document type proves. A claim is reimbursable only when BOTH facts
# are established — what was bought, and that it was paid for — possibly across
# different documents. That is where linked claims come from (an order screenshot
# plus an account statement) and where the traps come from (an invoice on its own
# proves nothing was paid).
#
# A fiscal receipt is the only common document that establishes both at once.
#
# These are type-level defaults. A specific archetype may override them: a bank
# payment confirmation whose payment purpose spells out what was bought does
# prove the subject, unlike a bare transfer. The override belongs to the archetype
# registration, not here.
document_evidence:
  fiscal_receipt:       { proves_subject: true,  proves_payment: true  }
  payment_confirmation: { proves_subject: false, proves_payment: true  }
  bank_statement:       { proves_subject: false, proves_payment: true  }
  invoice:              { proves_subject: true,  proves_payment: false }
  act:                  { proves_subject: true,  proves_payment: false }
  order_screenshot:     { proves_subject: true,  proves_payment: false }
  non_fiscal_receipt:   { proves_subject: true,  proves_payment: false }
