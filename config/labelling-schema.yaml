    blocked_on: done
    blocked_on_note: >
      THE `src/` CHANGE IS MADE — see `progress:` and `change:` above. This slot read `nothing`
      until version 22, which this file declares to mean WITHDRAWN, and this entry was fulfilled
      rather than dropped.

      ⚠️ AND THE SENTENCE THAT SAT HERE WAS STALE, so it is corrected rather than carried across.
      It said "no dataset contains such a document … it arrives with an invoice archetype". The
      invoice archetype was written, and `run_profiles` RP-06 — the authoritative delivered corpus
      — counts 293 payment confirmations among its 1315 documents. The condition this entry named
