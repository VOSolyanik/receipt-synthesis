  - id: RC-08
    file: src/receipt_synth/schemas.py, templates/
    change: >
      Record positive and negative fiscality markers with their position in the text.
      Needs both a field and archetypes that print such a marker.
    blocked_on: decision

  - id: RC-09
    file: src/receipt_synth/content_builder.py
    change: >
      `validate_line_item_sum` returns False for an empty list. The requirements document
