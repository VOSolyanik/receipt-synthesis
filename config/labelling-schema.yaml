# =============================================================================
# 10. Required changes to src/ — `blocked_on:` SAYS WHICH ARE MADE
# =============================================================================
#
# Every divergence above that can only be closed by editing this repository, collected in one
# place. Each says which file, what would change, and whether it is mechanical or waits on a
# decision — because a change that waits on a decision must not be made by whoever happens to read
# this next.
#
# ⚠️ THE SENTENCE "NOTHING IN THIS LIST HAS BEEN IMPLEMENTED" STOOD HERE UNTIL VERSION 29 AND IS
# WITHDRAWN. It was already false at version 22, which added the word `done` for RC-06 — so this
# comment and the vocabulary directly below contradicted each other for seven versions, and a
# consumer that trusted the comment would not have read the slot. AND THE SECTION TITLE ABOVE
# CARRIED THE SAME CLAIM — "NONE OF THEM MADE" — for five versions longer still, until version 34:
# the sentence was withdrawn here while its shorter twin went on standing in the largest type on
# the section. TWO of the sixteen entries are `done` (RC-06, RC-12), one is withdrawn, and
# thirteen are open. `blocked_on:` is the answer; neither the comment nor the title offers a
# second one now.
#
# The four words `blocked_on:` may take are declared as DATA, in `blocked_on_vocabulary` directly
# below, for the reason the rest of this version is about: they were declared in this comment
# until version 22, where YAML cannot see them at all — so a consumer branching on the key had no
# way to read the set it was branching against, short of parsing a comment. `status_vocabulary` is
# the shape being copied.
#
# 🔴 `blocked_on:` HOLDS ONE OF THOSE FOUR WORDS AND NOTHING ELSE, and a test holds it to that.
# THREE OF THE SIXTEEN ENTRIES HELD A PARAGRAPH until version 22 — the same defect the `status:`
# slots carried, one key over, and with the same consequence: `blocked_on == "decision"` was FALSE
# for two entries that are blocked on precisely a decision, so a consumer filtering for
# mechanically-actionable work silently mis-sorted them. The qualifying sentences were worth
# keeping and the slot was wrong, so they live in `blocked_on_note:` beside the word — prose, read
# rather than branched on.
#
# ⚠️ THE FOURTH WORD IS AN ADMISSION, NOT A TIDY-UP. `done` was added because RC-06 is finished
# and the three existing words could not say so: it is not awaiting a decision, it is not
# mechanical work waiting to be done, and it was not withdrawn. It had been wearing `nothing`,
# which this file declares to mean WITHDRAWN — so the vocabulary was asserting that a completed
# change had been dropped. A word was added because the file needed one; none was invented to
# make a slot parse.
#
# ⚠️ AN ENTRY HERE CARRIES NO `status:`, AND THE KEY THAT LOOKS LIKE ONE IS `progress:`. Two
# entries spelled it `status:` until version 21 and put a SENTENCE in the slot — "done in version
# 10, and NARROWER than it was asked for". `status:` is this file's reserved word for the five
# words of `status_vocabulary`; a sentence there is not a sixth word but a value that compares
# against nothing, so a consumer branching on the vocabulary could not act on it at all. The
# sentences were worth keeping and the slot was wrong, which is why they moved rather than being
# shortened into a word that would have said less than either. `progress:` is prose, appears only
# where an entry is partly done, and is deliberately not a vocabulary: what "partly" means differs
# per entry and the entry's own `change:` is where that is said.

blocked_on_vocabulary:
  decision: >
    The author must choose between two defensible answers. A change that waits on a decision must
    not be made by whoever happens to read this next.
  none: >
    Mechanical, and OPEN: the data already exists inside the generator and is discarded at label
    time. Nothing has to be decided first.
  nothing: >
    WITHDRAWN. The divergence was settled the other way and nothing in this repository changes.
    The entry stays so its id keeps resolving and the decision stays visible.
  done: >
    THE CHANGE WAS MADE. Nothing remains because the ask was FULFILLED — which is a different fact
    from `nothing`, and the two must not share a word: a consumer asking "what work is left" gets
    the same answer from both, and one asking "was this ever implemented" gets opposite ones. The
    entry's `progress:` and `change:` say what was built.

    Added in version 22 because RC-06 needed it. It had been carrying `nothing`, so the contract
    was asserting that a completed change had been dropped.

required_changes:

  - id: RC-01
    file: none — nothing changes in this repository
    change: >
      WITHDRAWN. The counterparty naming divergence was settled in favour of the name this
      generator already emits: `counterparty` stays, and the requirement is amended instead.
      `seller_name` is semantically wrong for half of the four target classes — a payer or
      payee on a payment confirmation, a payee on a bank statement, a seller on neither.
    because: see divergence_counterparty_name, which carries the full reasoning
    blocked_on: nothing
    kept_because: >
      The id is retained rather than removed so that references to RC-01 elsewhere, and in
      anything already written against this file, keep resolving. A withdrawn entry that
      explains itself is cheaper than a renumbered list.

  - id: RC-02
    file: src/receipt_synth/schemas.py, content_builder.py
    change: >
      Replace `has_fiscal_number: bool` with a fiscal-scheme structure — jurisdiction plus
      that scheme's requisites. The consumer forbids a boolean fiscality flag. The
      requirement's own jurisdiction vocabulary has no member for DE or ES, whose archetypes
      are planned here, so this cannot be closed by copying the enum.
    blocked_on: decision

  - id: RC-03
    file: src/receipt_synth/schemas.py, content_builder.py
    change: >
      Replace `has_qr` / `qr_is_fiscal` with the decoded payload and a four-value type
      (fiscal_link / promotional / payment / unknown), as the consumer requires.
      `PrroReceipt.qr_payload` already holds the payload and `ground_truth()` drops it.
    blocked_on: none

  - id: RC-04
    file: src/receipt_synth/schemas.py, content_builder.py
    change: >
      Carry the seller's tax / fiscal number as a labelled value. `Seller.tax_code` and
      `tax_code_label` already exist and are dropped at label time.
    blocked_on: none

  - id: RC-05
    file: src/receipt_synth/schemas.py, content_builder.py
    change: >
      Carry per-letter VAT amounts. `_build_tax_lines` already computes `TaxLine(letter,
      rate, gross, vat)` per letter and `ground_truth()` drops it. The consumer requires it
      and states that tax cannot be a scalar on a Ukrainian receipt.
    blocked_on: none

  - id: RC-06
    file: src/receipt_synth/schemas.py, content_builder.py
    progress: done in version 10, and NARROWER than it was asked for
    change: >
      DONE, in a form the original entry got partly wrong. The payment-confirmation fields are
      carried as values — `payer`, `counterparty` (the payee), `payment_purpose`, `document_code`,
      `auth_code`, `fee`, `total_charged` — by `content_builder.PaymentConfirmation`.

      TWO OF THE ORIGINAL ASKS ARE WITHDRAWN RATHER THAN COMPLETED: an RRN and a payment form.
      👁 Neither appears on any of the eight documents reviewed. This entry asked for them because
      the field list it was written from carried them over from a FISCAL RECEIPT, where an RRN is a
