        not on the corpus row. Nothing is measured on the corpus as a whole: a consumer inspects
        documents on one side and reports figures on the other, so `split_by_document_class` below
        is the row that matters and `document_types` is context for it.
      command: "generate-dataset --seed 42 --personas 96 --claims-per-persona 8 --split 0.5"
