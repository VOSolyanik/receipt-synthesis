# Bumped to 11 by THE THIRD DOCUMENT CLASS ARRIVING — a bank account statement — and by the ONE
# THING ABOUT IT THAT IS NOT LIKE THE OTHER TWO: its label describes ONE ROW of a many-row document
# rather than the document. SIX consequences a consumer has to know about.
#
# Derived the same way as the lists below: a key-set diff of this file against version 10, the
# printed-field inventory, and a reading of the label model, because every omission from such a list
# has been found by deriving the delta rather than by re-reading the prose.
#
#   THE LABEL OF A STATEMENT IS A TRANSACTION, NOT A DOCUMENT. `amount`, `date`, `counterparty`,
#   `payment_purpose` and `direction` are the values of the one row a claim rests on, and the
#   document's own four summary totals are printed and NOT LABELLED AT ALL. A consumer that expected
#   a statement's `amount` to be a figure from its summary block will find a figure from a table
#   row. Derived from the requirement's own field list, which is singular over a type it says has no
#   line items. See `document_types.bank_statement.the_label_is_one_transaction`.
#
#   ONE NEW LABEL FIELD, `direction`: `debit` | `credit`, `null` on every other class. A separate
#   field rather than a sign on `amount`, because money is normalized identically on every class of
#   this dataset and a signed amount would give one class a second convention. 🔴 IT DOES NOT
#   DISCRIMINATE IN THIS VERSION — every statement's labelled row is a debit — so its accuracy is
#   not to be reported, exactly as `amount_due`'s is not. What it carries is an INVARIANT: only a
#   debit can be proof of payment.
#
#   ONE NEW LABEL FIELD, `relevant_transaction`: the printed operation number of the labelled row,
#   `null` on every other class. Forced by the shape above — a field list in the singular over a
#   document with twenty rows has to say WHICH row.
#
#   `field_bboxes` GAINS AN INDEXED KEY PER TABLE ROW on this class — `operation_<i>` over the whole
#   row rect — alongside the labelled cells and the four unlabelled totals. A consumer pinning a
#   key set per class meets a key count that varies with the row count, which is the lesson version
#   8 already recorded about deriving a key set from the document rather than pinning it.
#
#   `amount`'s MEANING IS NO LONGER ONE SENTENCE FOR EVERY CLASS. It was "the total payable, gross,
#   VAT inclusive"; that is a basket's total and a statement has no basket. The field's own entry now
#   states the question it answers and each class's answer to it.
#
#   A REFUSAL IN THE ORACLE WAS REPLACED BY A NARROWER ONE, which changes which claims are
#   labelled at all. A claim carrying a bank statement used to be refused outright, because the
#   label could not point at the row the claim was about; it now can, so such a claim is labelled
#   like any other. What refuses instead is a claim whose proof of payment is a CREDIT — money
#   arriving proves no expense — and policy.yaml assigns no verdict to that. See
#   `document_label.fields[direction]`.
#
# Bumped to 10 by THE SECOND DOCUMENT CLASS ARRIVING: a bank payment confirmation has a template, a
# builder and label fields. SEVEN consequences a consumer has to know about, and the first is the
# one that changes what a label record looks like.
#
# Derived the same way as the lists below — a key-set diff of this file against the previous
# version, the printed-field inventory, and the `known_limitations` section.
#
#   SIX NEW KEYS ON EVERY LABEL RECORD, because there is one label model for every document class:
#   `fee`, `total_charged`, `payer`, `payment_purpose`, `document_code`, `auth_code`. They are
#   `null` on a fiscal receipt, which prints none of them. A consumer that pinned the key set of a
#   document label breaks on them — the same lesson as version 8's two new bbox keys, one level up.
#
#   🔴 `amount` ON A CONFIRMATION IS THE TRANSFER AND NOT THE LARGEST NUMBER ON THE PAGE. 👁 0 of 8
#   real confirmations carry a single amount: each prints the operation amount and the fee, and 1
#   of 8 also prints their sum, in the biggest type on the sheet. 📄 The National Bank's
#   instruction on non-cash settlements names the amount of the OPERATION as the requisite and does
#   not name the fee at all, and a fee buys a banking service that no benefit category covers. So
#   the salient number is the wrong one, deliberately, and `total_charged` is labelled beside
#   `amount` to make the disagreement measurable rather than invisible.
#
#   TWO FIELDS THIS TYPE NEVER HAD ARE GONE FROM ITS REQUIRED LIST: an RRN and a payment form.
#   👁 0 of 8. An RRN is a requisite of the CARD OPERATION printed inside a fiscal receipt — where
#   this generator does print it, so the earlier 0-of-8 finding was a misplacement rather than a
#   defect — and a payment form is a receipt requisite too. Deduplication for this class rests on
#   the bank's own document number, 👁 8 of 8 and 📄 mandatory; the authorization code cannot carry
#   it at six digits. See RC-06, amended.
#
#   THE FIELD SET VARIES WITHIN THE CLASS, BY HOW THE PAYMENT WAS INITIATED. A card operation
#   carries an authorization code and a card number; a transfer by account details carries neither.
#   👁 3 of 8 documents carry a card AND an authorization code AND a payment purpose at once, which
#   refuted an earlier plan to split the class into two archetypes. A consumer must not treat a
#   missing authorization code as an extraction failure.
#
#   `forward_contract` NOW MEANS "NOT IN THE DATASET" rather than "no template produces it". The
#   word is unchanged everywhere it is used and the promise a consumer relies on is unchanged; what
#   changed is that a class can now have a template and still not be in any run. See
#   `status_vocabulary`.
#
#   `normalization.identifier` NO LONGER SAYS THAT NOTHING CARRIES AN IDENTIFIER VALUE. Two do —
#   `document_code` and `auth_code` — so the rule it states has something to normalize for the
#   first time.
#
#   NO NEW `known_limitations` ENTRY, AND THE ABSENCE IS DELIBERATE. This class is narrower than
#   the observation in four named ways — one layout for four issuers among them — but every entry
#   in that section states a SHARE OF A REFERENCE RUN, and no run contains a document of this class
#   at all. A limitation of a dataset that does not yet hold the class would be a share of nothing.
#   The four narrowings are recorded on the type instead, under `narrower_than_observed`, and they
#   become `known_limitations` entries when a run first contains one.
#
# Bumped to 9 by THE PAYMENT DATE ACQUIRING A DEFINITION, which is a change of MEANING with no
# change of shape: no key of any label record is added, removed or retyped, so a consumer diffing
# the label structure sees nothing. FOUR consequences a consumer has to know about.
#
# Derived the same way as the two lists below — a key-set diff of this file against the previous
# version, plus the `known_limitations` section, which this version does not touch.
#
#   `date` ON A PAYMENT CONFIRMATION NOW HAS ONE ANSWER, WHERE IT PREVIOUSLY HAD SIX. A real bank
#   confirmation prints several dates under captions the law does not define; until now this file
#   said only "the calendar date of the transaction", which every one of them satisfies. The
#   caption preference order and the three refused captions are
#   `document_types.payment_confirmation.payment_date`. A consumer whose extraction takes the
#   first date on the page, or the one with a time beside it, is not extracting this field.
#
#   AND IT IS THE VERDICT THAT MOVES, NOT ONLY THE FIELD. The benefit period is checked on this
#   value and on no other (`claim_evidence.period_and_date`), so a consumer reading a different
#   printed date reaches a different verdict on any claim paid near a period boundary — while
#   every field it extracted looks correct. That is why the number moves for a change that adds
#   no key.
#
#   THE DEFINITION IS SPLIT ACROSS TWO FILES ON PURPOSE, AND A CONSUMER NEEDS BOTH. The CONCEPT —
#   the date the funds left the payer's account — is `period.payment_date` in config/policy.yaml,
#   which is the file a consumer vendors to reproduce the labels. The MAPPING of printed captions
#   onto it is here. Neither file names both, and neither is sufficient alone.
#
#   ONE PROSE CORRECTION AT THE HEAD OF THIS FILE, recorded rather than made quietly because it
#   was a claim about the repository: "nothing in this repository reads this file" is now "no code
#   in `src/` reads this file", one test having been added that loads it.
#
# Bumped to 8 by the `fiscal_receipt` CLASS GAINING TWO MORE ARCHETYPES, which changes what a
# document of that class may contain and what a fixed key set for it is worth. SIX consequences
# a consumer has to know about.
#
# Derived the same way as the version 7 list below — a key-set diff of this file against the
# previous version, the printed-field inventory, and the `known_limitations` section — because
# each omission from that list was found by deriving the delta rather than by re-reading it.
#
#   THE CLASS IS NO LONGER ONE RENDERING. `ua_prro_receipt` is joined by `ua_prro_receipt_58mm`,
#   the same software register on the narrow 58 mm roll, and by `ua_rro_receipt`, a classic
#   hardware register. All three carry `doc_type: fiscal_receipt` and the same labelled fields;
#   they differ in the paper width and in the fiscal identity printed at the foot. A consumer
#   that treated the class as one layout — a fixed image width, a fixed key set, a template match
#   on «ФН ПРРО» — meets all three now. See `printed_fields`.
#
#   TWO NEW BBOX KEYS, AND ONE OF THEM IS ON A MINORITY OF DOCUMENTS. `provider_name` is the
#   maker's name printed immediately after «ФІСКАЛЬНИЙ ЧЕК» — 📄 the same requisite of the form as
#   the wording, 👁 present on 11 of 11 open receipts, and absent from this generator's output
#   until now. `device_serial` is the «ЗН» factory serial, and it appears ONLY on the hardware
#   archetype: ⚠️ «ЗН» and «ФН» are not a pair. `mode_marker`, present on every document until
#   now, is absent from that same archetype. See `printed_fields.varies_with_the_kind_of_register`.
#
#   `fiscal_device_number` IS PREFIXED TWO WAYS AND `receipt_number` HAS TWO FORMATS. The
#   printed prefix is «ФН ПРРО» on a software register and «ФН» on a hardware one; the receipt
#   number is an eleven-character alphanumeric id on the first and four to six digits on the
#   second. Same keys, same meanings, two printed shapes — so a consumer validating either by
#   format needs both.
#
#   KL-02 IS WIDER, WHICH IS A LIMITATION SHRINKING RATHER THAN GROWING. `hygiene`, the fourth
#   excluded kind of the one category with an archetype, was absent from every document because
#   its templates named a brand the vocabulary could not supply per template. They now name a
#   size instead, the kind is drawn like any other, and the entry's `narrowed_further_by` block
#   is GONE — it described a state that no longer exists. A consumer that stratified on three
#   head-noun families will meet a fourth.
#
#   ONE NEW LEAK, INSIDE KL-02 RATHER THAN AS AN ENTRY OF ITS OWN. The brandless `hygiene`
#   templates carry no placeholder, so the kind contributes exactly TWO distinct strings against
#   8, 13 and 8 for the other three excluded kinds — and within that kind the STRING IS THE
#   LABEL. It sits in KL-02 as `a_second_leak_inside_one_kind` because it shares that entry's
#   subset and nothing else: its predictor is the exact string rather than the head-noun family,
#   so a consumer stratifying by family would not catch it. KL-02 also gains a `fixed_by` naming
#   the root repair — keying the placeholder vocabulary by TEMPLATE rather than by item kind in
#   config/generation.yaml — and saying plainly that the brandless form is the narrower fix taken
#   instead. Its per-kind figures now state occurrences and distinct strings separately; an
#   earlier draft gave one set without saying which, and they were occurrences.
#
#   NO NEW `known_limitations` ENTRY, AND THE ABSENCE IS A FINDING RATHER THAN AN OMISSION. The
#   obvious candidate is that the corpus now mixes three renderings while no label names which
#   one produced a document. It is not a limitation, because both axes are recoverable: the
#   register's kind from whether `device_serial` is among the bbox keys, and the paper width from
#   the image, whose width the degrader preserves. The reference-run counts are stated below so
#   the proportions are known without measuring them.
#
#   EVERY REFERENCE-RUN FIGURE IN `known_limitations` MOVED AGAIN, mechanisms unchanged. Both
#   changes of this version shift the seeded stream — a claim's receipt is now drawn from three
#   archetypes, and `hygiene` entering the excluded catalogue changes the basket draw — so the run
#   is 143 documents rather than 146. Each figure names its run and says what it was before.
#
# Bumped to 7 by the VAT-PAYER STATUS OF THE SELLER becoming a modelled property, which changes
# what a fiscal receipt CONTAINS. NINE consequences a consumer has to know about, and the first
# three would otherwise look like defects in the dataset.
#
# WHAT THIS LIST IS CHECKED AGAINST, since a completeness claim has to say what it covers: a
# key-set diff of this file against the previous version, the printed-field inventory, AND the
# `known_limitations` section — the last was missing from the claim while two new limitations
# were being added, so the summary was complete on the axis it named and silent on the one it
# did not. Earlier drafts of it declared three of the nine, then six, then seven; each omission
# was found by deriving the delta rather than by re-reading the summary, which is the argument
# for deriving it:
#
#   THE SELLER'S TWO IDENTIFIER LINES ARE NOT ALTERNATIVES, and an earlier draft of THIS FILE
#   said they were. Every seller prints an identification code under «ІД» — ЄДРПОУ (8 digits) for
#   a legal entity, РНОКПП (10) for a sole trader, so the length follows the TYPE OF PERSON. A
#   registered seller prints its VAT-payer number under «ПН» IN ADDITION: 12 digits for a legal
#   entity, of which the first 8 are its ЄДРПОУ — OBSERVED ON ONE DOCUMENT, one of one that
#   carries both lines, and not stated as a requirement by any source — and for a sole trader
#   THE SAME 10-DIGIT РНОКПП its «ІД» line carries. So both bbox keys may be present; two identifier fields bearing
#   identical digits is CORRECT on a sole trader's receipt; a 12-digit value is not a malformed
#   ЄДРПОУ; and registration is read from the presence of «ПН», never from «ІД». The draft
#   reading came from a published table of the form; real ПРРО output refuted it and observation
#   decides. A consumer that built a validation rule from the old sentence will now reject
#   correct documents. See `document_types.fiscal_receipt`.
#
#   AN INVARIANT IS LIFTED. `vat_letter: null` is now legitimate on a Ukrainian receipt — this
#   file used to state that it was a builder bug, so the contract FORBADE the correct
#   behaviour. A seller that is not registered for ПДВ prints no letter on any line and no tax
#   row at all. See `normalization.vat_letter.nullability`.
#
#   `field_bboxes` IS NO LONGER THE SAME KEY SET ON EVERY DOCUMENT. A registered seller prints a
#   `seller_vat_number` line IN ADDITION to the `seller_tax_code` line every seller prints, and
#   the VAT keys are absent from an unregistered seller's document entirely. A key's absence is
#   now information rather than an error. See `printed_fields`.
#
#   ONE NEW LABEL FIELD, `amount_due`, WHICH MUST NOT BE SCORED YET. The merged "СУМА ДО
#   СПЛАТИ" line became the four lines the form actually defines. The field equals `amount`
#   in this version, so it discriminates nothing; the entry says so and says why the
#   divergence is deferred.
#
#   TWO NEW BBOX KEYS ON EVERY RECEIPT, `discount` and `rounding` — the two amount lines
#   between `СУМА` and `ДО СПЛАТИ`. Both are zero in this version and neither carries a
#   labelled value. A consumer that vendored version 6 and asserted a fixed key set for the
#   archetype breaks on them, which is the same lesson as the entry above: derive the key set
#   from the document rather than pinning it. See `printed_fields.bbox_only`.
#
#   ONE BBOX GEOMETRY CHANGED: `tax_line_<i>` now spans the full width of its row rather than
#   hugging its text on the left, because the VAT amount moved into the receipt's amount column
#   with the other amounts. Same key, same content, wider box — an IoU comparison against
#   version 6 boxes will not agree. See `printed_fields.tax_row_geometry`.
#
#   ONE NEW `required_changes` ENTRY, RC-16: make `amount_due` differ from `amount`, blocked on
#   a policy decision about distributing a discount across covered and non-covered lines.
#   RC-07 is amended in the same breath, its `amount_due` half no longer being open.
#
#   TWO NEW `known_limitations`, BOTH CREATED BY THIS VERSION'S OWN CHANGES. KL-04: `vat_letter`
#   became nullable, and its nullability is fully predicted by the counterparty string on 73% of
#   the corpus — 34 of 34 stored vendor names are registered payers, so the shortcut holds at any
#   size. KL-05: every document prints an identification code while only 1 of 3 real receipts
#   does, so the corpus OVERSTATES that field's presence; it is printed as the superset and the
#   overstatement is declared rather than left for a consumer to discover.
#
#   EVERY REFERENCE-RUN FIGURE IN `known_limitations` MOVED, mechanisms unchanged. The seller's
#   identifiers are built differently now, so the same seed reaches the basket draw in a
#   different state: the run is 146 documents rather than 147. Each figure names its run and says
#   what it was before.
#
# Bumped to 6 by TWO CHANGES that arrived together, stated separately because they are
# separate and a consumer that regresses needs to know which one to look at.
#
#   A CHANGE OF LABEL, not of shape: a claim whose payment falls outside the benefit period is
#   now `rejected` rather than `insufficient_evidence`. No field was added or removed and the
#   `outside_period` cause is unchanged, so a consumer diffing structure alone would see
#   nothing — which is exactly why the number has to move. A scorecard pinned to the old
#   verdict scores every such claim as a miss. See `verdicts.rejected.by_when_it_was_paid` for
#   the reasoning and for the alternative that was rejected.
#
#   A RESTRUCTURE OF THE DEFINITIONS, changing no label at all: every evidence verdict is now
#   defined by its own slot of `document_evidence` instead of as the case that is not its
#   neighbour. Nothing a consumer scores changes, but TWO KEYS DEPARTED — one renamed, one
#   removed, both declared under
#   `verdicts.not_proof_of_payment.why_this_was_once_unreachable`, which a consumer diffing key
#   sets should read first. The rule itself is
#   `verdict_notes.definitions_name_their_own_slot`.
#
# Version 5 was a CLAIM-LEVEL SHAPE CHANGE: a claim's evidence is resolved into transactions
# before any verdict is derived, `imperfection` gained four causes, and `covered_fraction`
# became genuinely nullable. See `claim_evidence` below. A consumer that vendors this file
# compares versions before diffing it, so a change of either size under an unchanged number
# would be a change nobody looked for.
#
# Version 30 is the CURRENCY CONVERSION: the oracle converts a foreign-currency document at
# the rate config/fx-rates.yaml states for the document's date, and the claim label gained
# `fx_rates` — one record per converted document, carrying the applied rate. The `currency`
# field's note stops saying the engine refuses; the quantization point of the conversion is
# declared in fx-rates.yaml (`conversion`), not here, because it belongs to the constant
# both sides load. KL-17 records the external-validity gap this opens: the corpus converts
# at STATIC vendored rates, a production system converts at a live rate for the transaction
# date, and no figure measured here transfers across that difference unexamined.
#
# Version 31 is the DOCUMENT CLASS the conversion exists for: `platform_receipt`, with its
# one archetype `eu_platform_receipt` — English, EUR, both facts of `document_evidence`
# established by a page carrying no fiscal identity. `DocType` gained the member,
# policy.yaml's `document_evidence` gained the row, and the `document_types` section below
# gained the block. `classifier_role` is `undecided`, exactly as for `non_fiscal_receipt`,
# so the four target classes and the classifier metric's denominator are unchanged.
#
# Version 32 is THREE MORE RENDERINGS AND NO NEW TYPE: `ua_platform_receipt` joins its
# English twin under `platform_receipt` (Ukrainian, UAH, a domestic seller whose requisites
# and contained-VAT row are ordinary where the EU page disclaims them — one shared body, so
# the pair is a controlled comparison of the language and currency axes), and the two phone
# carriers `ua_bank_receipt_in_app` and `ua_bank_app_transaction` join
# `payment_confirmation` — the framed A4 sheet, labelled by the A4's own ground_truth, and
# the transaction screen, the class's strongest negative example by lack of requisites.
# Which rendering a claim draws is `archetype_shares` in config/generation.yaml. The four
# target classes and the metric's denominator are unchanged; what changed is that a
# per-class figure now averages over renderings, and the per-archetype notes in
# `document_types` say how to slice them apart.
#
# Version 33 is THE CORPUS AS A MEASURING INSTRUMENT, in two degenerate places. FIRST, the
# second route to `rejected`: a basket the claimed category covers none of, drawn per
# `rejected_routes` in policy.yaml (new block, 0.5/0.5), so the payment date stops predicting
# the verdict — until now every `rejected` claim was out-of-period and a false-approval rate
# scored on the label measured the period rule alone. No new field; the route is visible as an
# EMPTY `imperfection` beside `covered_fraction` 0.0, per `imperfection.cardinality`. KL-07 is
# rewritten rather than deleted. SECOND, the `subject` axis: `cross_document_agreement` gains
# its fourth entry, the cause `subject_mismatch` joins the vocabulary at a 0.2 share (five-way
# even split; `insufficient_evidence_causes_min_run_size` 119 -> 149), and TWO LABEL FIELDS
# carry its ends — `cites_document_no`, the рахунок the payment's purpose names, new and null
# wherever no рахунок is cited; and `document_code`, which now also carries the invoice's own
# printed №. KL-16 narrows to the citation noise that stays outside the axis; KL-16's
# `fixed_by`, misfiled under KL-17 since it was written, moved home. A consumer that vendored
# version 32 receives claims of a cause it does not know and `rejected` claims its date rule
# cannot explain — re-vendor before scoring anything generated at this version.
#
# Version 34 is THE CONTRACT CATCHING UP WITH ITS OWN DATA — a truth pass, and deliberately
# nothing else: NO document, NO draw and NO comparison rule changes, and `config/policy.yaml`
# IS NOT TOUCHED, so this is not an I-2 event. What changes is which statements of this file
# describe the dataset a consumer actually receives.
#
#   🔴 THE THREE REMAINING TARGET CLASSES MOVE TO `emitted`. `payment_confirmation`,
#   `bank_statement` and `invoice` read `forward_contract` — this file's word for NOT PRESENT IN
#   THE DATASET — while RP-06, the authoritative delivered corpus, counts 293 / 294 / 587 of them
#   among its 1315 documents: 89% of the corpus was described as absent, and the prose beside the
#   statuses still said "IN NO RUN YET … an invoice is not written". The transition was made
#   under the rule, not around it: one document of each class was re-checked FIELD BY FIELD
#   against the reference run (seed 42) — each class's `emitted_since` says what was read — which
#   is the check `status_vocabulary` demands and RC-06's note declined to skip. The classes'
#   `prd_required_fields` rows, payment-date blocks and `fee.cardinality` move with them.
#
#   🔴 AND EVERY OTHER STATEMENT ASSERTING AN EMPTY OR SINGLE-CLASS DATASET WAS SWEPT AND
#   RE-DERIVED, because a wrong status with correct prose and a correct status with wrong prose
#   are the same defect at different volumes. Corrected, each with its history at the key:
#   `verdict_notes.realizability` ("only two verdicts buildable" against a six-member
#   `REALIZABLE_VERDICTS`), `claim_evidence.shapes` (self-contained "the only shape", the
#   bank-statement refusal that version 11 resolved), `claim_label.documents.cardinality`
#   ("exactly one in every run"), `linked.observed` ("always false"),
#   `covered_fraction.absence` / `reimbursable_amount.absence` (null IS on real claims since
#   version 25, and the two fields part company there), `fx_rates` (`emitted`, against the run
#   named beside it), `language`/`currency` observed lists and `open_enum.label_side` (`en`/`EUR`
#   since version 31), the three fiscality flags' "always true", `party_name`'s "ПрАТ is not
#   produced" (it prints on the reference run), KL-01 (its own condition fired: two covered-only
#   profiles DO reach datasets — the leak is live and now says so), KL-02 (`hobby` has an
#   archetype; `electronics` stays out for the reason that still holds), KL-05 ("every document"
#   narrowed to the receipt classes), the section-9 header counts (SEVENTEEN entries), the
#   `run_profiles` header ("authoritative: false on every profile" beside an
#   `authoritative: true`), the split-flag note still calling RP-05 authoritative, section 10's
#   own title ("NONE OF THEM MADE"), RC-07's "no invoice archetype exists", and RC-10's account
#   of an engine that stopped raising at version 25.
#
#   ⚠️ NO LABEL A CONSUMER EVER RECEIVED WAS DESCRIBED WRONGLY — every correction above is this
#   file catching up with data that was already right. A consumer that SKIPPED scoring against
#   the three classes on the strength of their status was under-prepared, exactly as the
#   version-26 precedent states for `insufficient_evidence`; one that scored them anyway was
#   right to. Diffing 33 against 34 is where such a consumer learns which of its guards were
#   built against words this file had outgrown.
#
# Version 35 is THE CAPTURE LAYER CALIBRATED, in four moves that share one purpose: a defect
# carried by 100% of a channel is a property of the corpus's construction, not evidence about
# documents, and every number measured on such a channel is a lower bound wearing a
# measurement's clothes.
#
#   🔴 `capture` HAS A FOURTH VALUE, `digital_pdf` — THE UNDAMAGED ORIGINAL, applied-nothing by
#   construction and by test. A consumer whose `capture` vocabulary was pinned to three members
#   meets a fourth on the first corpus of this version. The reversal of version 29's "not a
#   fourth channel" argument is recorded at RC-11 and at the field's divergence, which narrows
#   to the NAME and the HOME — the value vocabularies now agree.
#
#   🔴 THE CHANNEL FOLLOWS THE CLASS: `capture_mix` in config/policy.yaml, one row per document
#   class, weights beside their arithmetic — and the uniform in-code draw is gone, taking its
#   impossible combinations with it: no more flatbed scans of a banking-app screen (the two
#   in-app renderings are `screenshot` by construction — `Archetype.screen_native`), no more
#   "screenshots" of a paper till roll bearing paper grain, no undamaged electronic original of
#   a товарний чек that has no electronic form. 🔴 THIS IS AN I-2 EVENT: config/policy.yaml is
#   vendored downstream under a sha256 lock, so a consumer holding an earlier copy is holding a
#   different file. Its `version` stays at 1 under the standing rule — the sha IS its identity.
#
#   🔴 A SCREENSHOT STOPPED CARRYING PAPER GRAIN AND SENSOR NOISE — pixels that never were light
#   on paper and never crossed a camera cannot carry either; compression is the channel's one
#   loss. And the HEAVY artefacts of `photo` and `scan` fire per document at declared rates
#   (`degradation` in config/generation.yaml, arithmetic at the block) instead of always: a cast
#   shadow, uneven light, motion blur and transport streaks are now evidence about documents at
#   p < 1, not channel constants at p = 1. Intensities are untouched — what moved is the
#   certainty of the worst case, not the worst case.
#
#   ⚠️ EVERY FIGURE MEASURED ON AN EARLIER CORPUS IS A FIGURE ABOUT A DIFFERENT ONE — the channel
#   marginals, the difficulty of every channel, and the draw itself all moved, so nothing
#   measured before this version compares with anything measured after it without both mixes
#   stated. The delivered production corpus predates this version; its profile (RP-06) stands as
#   the record of its own run. ⚠️ AND THE CORPUS GETS EASIER ON AVERAGE, BY CONSTRUCTION — an
#   undamaged share exists where none did — WHICH IS THE REMOVAL OF A SYSTEMATIC ERROR, NOT A
#   CLAIM ABOUT SYSTEMS: whoever quotes a before/after gain must attribute it to the corpus, and
#   the measured before/after legibility of the invoice's amount-in-words line under this
#   calibration is in the session record beside the change, not here — it is a run measurement,
#   and this file quotes no run it does not profile.
#
#   KL-11 is rewritten around the declared mix — its `fixed_by` had named exactly this fix, and
#   what remains of it is the survey no config block can replace.
version: 35

# One status vocabulary. Every section that describes a LABEL carries a `status`, and
# wherever anything below says whether a thing exists yet or is disputed it uses these five
# words and no others — there is no second spelling of the distinction anywhere in this
# file. Individual fields carry a `status` only where they differ from their section, or
# inside a `divergence` block. Section 9 describes the DATASET rather than a label: nothing
# in it exists or fails to exist, so it carries measurements instead of a status.
#
# 🔴 `status:` IS A RESERVED WORD WITH EXACTLY ONE MEANING, AND ITS VALUE IS ALWAYS ONE OF THE
# FIVE. It is what a consumer branches on, so a sentence in a status slot compares against
# nothing and no consumer can act on it. Two entries in `required_changes` carried one until
# version 21; the sentences survive under `progress:` there, which is prose and is read rather
# than indexed. The rule is enforced by a test in tests/test_contract_indexes.py, not by care.
status_vocabulary:
  emitted: >
    Observed in the output of a real run, checked field by field. A consumer may rely on
    it being in the dataset today.
  forward_contract: >
    Required by the consumer side, or called for by the design, and NOT PRESENT IN THE DATASET. A
    consumer may build against it; a consumer may not conclude that the current dataset contains
    it.

    AMENDED IN VERSION 10, and the amendment is the difference between a promise about code and a
    promise about data. This word used to say "not produced by any template yet", which stopped
    being true of `payment_confirmation`: a template, a builder and the label fields all existed
    while — at that version — no run contained such a document, because a claim needs both facts
    and this class proves one. (The class has since entered the data and its status moved; the
    amendment's reasoning is kept because it is what the word still means.) The operative half was
    always the second sentence, so the definition turns on the DATASET. A consumer reads this word
    as "do not expect to find it in the labels", and that reading is unchanged.
  divergent: >
    Both sides exist and disagree — on a name, a type, or a definition. Neither is chosen
    here. See `required_changes`.
  resolved: >
    A divergence that HAS been settled, and the settlement is written beside it under
    `resolution`. The pair of statuses is the whole state machine of a `divergence` block: it
    opens `divergent` and closes `resolved`, never by deletion — a divergence removed once
    settled takes its reasoning with it, and the next reader re-opens the same argument.

    ADDED TO THE VOCABULARY IN VERSION 21, having been in use since the file's first commit at
    version 2 without ever being declared. A consumer branching on the four declared words fell
    through on
    `divergence_counterparty_name` and would have read a settled question as unsettled — which
    is why an undeclared value is a defect and not a synonym.
  undecided: >
    Neither side settles it, and guessing would be indistinguishable from a decision.

sources:
  generator: >
    src/receipt_synth/schemas.py (the label models), content_builder.py (the values),
    policy_engine.py (the derived claim labels), claim_planner.py (the archetype registry),
    degrader.py (capture modes), and config/policy.yaml (the labelling policy).
  reference_run: >
    Every `status: emitted` statement below was verified against
    `generate-dataset --seed 42 --personas 2 --claims-per-persona 4 --split 0.5`. The generator
    version is not repeated in this file: every label record carries its own `generator_version`,
    and a copy here would be a second thing to keep in step.

    ⚠️ `--split 0.5` WAS ADDED IN VERSION 24, WHERE THE FLAG BECAME REQUIRED. Unlike a profile, this
    is a re-verification handle rather than a record of one run — it has to execute — and NO
    `status: emitted` STATEMENT TURNS ON THE FRACTION'S VALUE: `split` declares the vocabulary
    `[train, validation]` and nothing here asserts a count or a side. A half is what the flag
    defaulted to while these statements were last re-checked.

    🔴 TWO STATEMENTS OF VERSION 27 WERE VERIFIED AGAINST A LARGER RUN, AND HAD TO BE. That run
    builds eight claims, and both `verdicts.not_proof_of_payment` and
    `document_types.non_fiscal_receipt` describe a bucket drawn at about one claim in nine — so a
    run of eight contains neither more often than not, and this one contains neither. Verifying an
    `emitted` status against a run that cannot be expected to hold an instance would be recording a
    check that did not happen. Both were verified against
    `generate-dataset --seed 20260803 --personas 12 --claims-per-persona 3 --split 0.5`, which
    built 36 claims, 7 of them `not_proof_of_payment` and 4 of those evidenced by a
    `non_fiscal_receipt`; the label of one such document was read field by field against its
    rendered image.

    🔴 AND THE VERSION 28 STATEMENTS WERE VERIFIED AGAINST THE SAME LARGER RUN, THE EXCEPTION
    HAVING BECOME THE RULE FOR NEGATIVES. `verdicts.rejected`, `verdicts.partially_paid` and
    `document_label.fields.instalment_amount` each describe a bucket the mix draws at about one
    claim in ten, so the default handle's eight claims cannot be expected to hold one, and an
    `emitted` status verified against such a run would be recording a check that did not happen.
    All three were re-checked against
    `generate-dataset --seed 20260803 --personas 12 --claims-per-persona 3 --split 0.5`, the run
    of 36 claims named above: it contains 6 `partially_paid` claims and 2 `rejected` ones (both
    with the cause `outside_period`), and `instalment_amount` is populated on the invoice of each
    of the 6 and on no other document of the run.

    ⚠️ SO THE SENTENCE THAT USED TO CLOSE THIS ENTRY IS GONE. It read "the handle above stays the
    file's default because every other `emitted` statement is about a shape that occurs on every
    run", which was true while version 27's pair was the sole exception and false from version 26
    onward, when a negative verdict was first drawn at a tenth of the mix. The handle stays the
    default because it is the cheapest run that re-checks the SHAPES a label record has; a
    statement about a BUCKET names the run that contains one, beside itself.
  consumer: >
    The neighbouring product requirements document — its extraction fields per document
    type and its entity model, its classifier classes and metric, its extraction
    thresholds and field names, its rules for QR content, fiscality markers and fiscal
    schemes, its validation and line-item guards, its duplicate detection and its
    cross-document checks — together with the concept note on the open language and
    currency scope. THAT DOCUMENT IS NOT IN THIS REPOSITORY AND NEVER WILL BE. Individual
    requirements are therefore restated below in substance and on their own authority,
    never cited by an address into it — neither requirement number nor section number: an
    address an outside reader cannot resolve carries nothing while still reading as a
    precise reference, and it rots besides, a renumbered requirement pointing silently at
    the wrong rule and a reorganized section vanishing outright. That document remains
    authoritative for its own contents and is never edited from here.


# =============================================================================
# 1. The document-type vocabulary
# =============================================================================
#
# `document_types` keys are the `DocType` members in schemas.py, which are also the keys of
# `document_evidence` in policy.yaml. What each type PROVES — subject, payment, or both —
# is that block in policy.yaml and is not copied here.
#
# `classifier_role` follows the consumer's classifier vocabulary — four target classes plus
# an `other` catch-all — which settles it. There is no per-type narrative below:
# what each document class is belongs to docs/architecture.md#document-archetypes.
#
# `prd_required_fields` is the requirements document's table of the fields a consuming system
# must extract from this document type, EXPRESSED IN THE SHAPE THE REQUIREMENT DEMANDS rather
# than in the generator's current shape, with the generator's counterpart named beside it.
# That is what makes a divergence visible instead of inherited.
#
# 🔴 `generator:` IN THAT TABLE IS A LIST OF LABEL FIELD NAMES AND NOTHING ELSE — possibly empty,
# never a sentence. It was a prose cell until version 21, mixing names with commentary, and the
# punctuation was load-bearing: rearranging `has_qr, qr_is_fiscal (two booleans)` into
# `has_qr (boolean), qr_is_fiscal` reads as a stylistic edit and drops a field from the schema.
# As a list the same rearrangement is a no-op or a parse error, never a silent loss. Every
# commentary that lived in such a cell moved into that row's `note:`, and a test holds that each
# name is a real `document_label` field so a typo cannot pass either.
#
# ⚠️ `generator:` MEANS TWO OTHER THINGS ELSEWHERE IN THIS FILE, and neither is this list: at
# `sources.generator` it names the modules the file was written from, and inside a `divergence`
# block it is the generator's POSITION, standing against a `consumer:` paragraph. Both are prose
# a reader reads. Only the table's column is indexed, so only it is data.

document_types:

  fiscal_receipt:
    classifier_role: target_class
    status: emitted
    emitted_archetypes:
      # The registry is `ARCHETYPES` in claim_planner.py. All three print the same labelled
      # fields and differ in the paper width and in the fiscal identity at the foot — see
      # `printed_fields.varies_with_the_kind_of_register`.
      - slug: ua_prro_receipt
        jurisdiction: UA
        language: uk
        categories: [vitamins_nutrition]
        register: software        # ПРРО, 80 mm
      - slug: ua_prro_receipt_58mm
        jurisdiction: UA
        language: uk
        categories: [vitamins_nutrition]
        register: software        # ПРРО, 58 mm — the narrow roll
      - slug: ua_rro_receipt
        jurisdiction: UA
        language: uk
        categories: [vitamins_nutrition]
        register: hardware       # classic РРО, 80 mm — the only archetype printing «ЗН»
    prd_required_fields:
      - prd: total
        generator: [amount]
        status: emitted
        note: >
          The receipt prints FOUR amounts under the items — `СУМА`, `ЗНИЖКА`, `ЗАОКРУГЛЕННЯ`,
          `ДО СПЛАТИ` — and `amount` is the first. `amount_due` is the last; see its entry
          under `document_label`, and read the warning there before scoring it.
      - prd: date
        generator: [date]
        status: emitted
      - prd: seller_name
        generator: [counterparty]
        status: divergent
        see: divergence_counterparty_name
      - prd: seller tax / fiscal number
        generator: []
        status: forward_contract
        note: >
          NO LABELLED VALUE. `seller_tax_code` and `seller_vat_number` exist as bbox keys only,
          and THE REQUIREMENT NAMES ONE FIELD WHILE THE DOCUMENT CARRIES UP TO TWO NUMBERS.

          `content_builder.Seller.tax_code` and `.vat_number` already hold them and
          `ground_truth()` discards both. Mechanical to add; see RC-04.

          TWO LINES, NOT A CHOICE BETWEEN TWO. Every seller prints an identification code under
          «ІД» (bbox key `seller_tax_code`) — a checksum-correct eight-digit ЄДРПОУ for a legal
          entity, a ten-digit РНОКПП for a sole trader, so the LENGTH FOLLOWS THE TYPE OF PERSON
          rather than the prefix. A seller registered for ПДВ prints, IN ADDITION, its VAT-payer
          number under «ПН» (bbox key `seller_vat_number`): twelve digits for a legal entity, of
          which the first eight are its ЄДРПОУ; and for a sole trader THE SAME TEN-DIGIT РНОКПП
          its ІД line carries — one number under two prefixes.

          THE PREFIX RELATION RESTS ON ONE DOCUMENT — one of the one observed receipt that
          carries both lines. It is a construction this generator applies so that its two printed
          identifiers cannot contradict each other, NOT a rule any source states, and a consumer
          must not validate real documents against it. The LENGTHS are the certain part.

          Consequences for a consumer, none of them cosmetic: a document may legitimately carry
          BOTH keys; two identifier fields bearing identical digits is correct on a sole
          trader's receipt and must not be deduplicated; a twelve-digit value is not a malformed
          ЄДРПОУ; and the absence of «ПН» rather than the presence of «ІД» is what says the
          seller is not registered. If the requirement keeps one scalar field for the seller's
          tax number, it cannot represent a registered company at all, and which of the two
          numbers it should hold is undecided here.

          AN EARLIER VERSION OF THIS CONTRACT SAID THE TWO WERE MUTUALLY EXCLUSIVE, on a
          published table of the form that lists them as rows 4 and 5 with alternative example
          values. Real ПРРО output prints both together, and observation decides. Recorded
          rather than quietly amended, because a consumer that built a validation rule from the
          old sentence will now reject correct documents.
      - prd: FiscalScheme — the JURISDICTION of the fiscal scheme plus that scheme's own requisites
        prd_vocabulary: [ua_prro, pl_paragon, ar_factura, pt_atcud, sk_ekasa, hr_fiskalizacija, none, unknown]
        generator: [has_fiscal_number]
        status: divergent
        note: >
          A BOOLEAN AGAINST A STRUCTURE. The consuming system requires the jurisdiction of the fiscal scheme rather than a
          boolean, on the reasoning that UA ПРРО, PL paragon, AR Factura, PT ATCUD, SK
          eKasa and HR fiskalizacija are all fiscal in their own systems by different
          requisites; a boolean `is_fiscal` is forbidden in that model. The generator emits
          no jurisdiction at all; `has_fiscal_number` is a boolean about one requisite of
          one scheme. TWO SEPARATE PROBLEMS — the shape, and the fact that the requirement's
          own vocabulary has NO member for Germany or Spain, whose archetypes this generator
          plans to build. A DE Kassenbon could only be labelled `unknown`, and an unknown
          fiscal scheme is routed to `in_review`. See RC-02.
      - prd: VAT amounts per letter — TaxAmount(letter, rate, amount), explicitly not a scalar tax
        generator: []
        status: forward_contract
        note: >
          `content_builder._build_tax_lines` computes exactly this — `TaxLine(letter, rate,
          gross, vat)`, one row per letter present — and `DocGroundTruth` has no field to
          put it in, so it is rendered and thrown away. Mechanical; see RC-05.

          AND THERE IS A DOCUMENT WITH NO SUCH ROW AT ALL: a seller that is not registered for
          ПДВ prints no tax block, so the correct extraction is an EMPTY collection rather than
          a zero-rate row. A consumer whose model requires at least one TaxAmount per fiscal
          receipt cannot represent that document.
      - prd: line items, required only where the category carries exception rules
        generator: [line_items]
        status: emitted
      - prd: DECODED QR CONTENT plus its type (fiscal_link / promotional / payment / unknown)
        generator: [has_qr, qr_is_fiscal]
        status: divergent
        note: >
          TWO BOOLEANS AGAINST A PAYLOAD AND A TYPE. The consuming system requires the decoded payload and its type, on the ground
          that mere presence is unusable as a fiscality signal — bank confirmations
          routinely carry promotional QR codes, so a document with a QR code says nothing
          about whether it is fiscal. `qr_is_fiscal` is a boolean collapse of a four-value
          type and cannot express `payment` or `unknown`. `PrroReceipt.qr_payload` already
          holds the decoded string and `ground_truth()` discards it. See RC-03.
      - prd: fiscality markers found in the text, positive and negative, with their position
        generator: []
        status: forward_contract
        note: >
          A rule of the consuming system: a NEGATIVE marker («НЕ ФІСКАЛЬНИЙ ЧЕК», «KOPIA
          DLA SPRZEDAWCY», an empty receipt-number field) OVERRIDES every positive
          fiscality signal, however many of those a document carries — a slip may hold a
          QR code, a tax number and a total and still declare itself not a fiscal receipt.
          No generator field records a marker, and no archetype of THIS class prints one; the one
          printed negative marker of the corpus is the platform receipt's
          `not_a_tax_invoice_note` (version 31), and the товарний чек carries the negative as an
          ABSENCE of requisites. Both halves are argued at RC-08.

  payment_confirmation:
    classifier_role: target_class
    status: emitted
    emitted_since: >
      VERSION 34 AS A WORD, VERSION 12 AS A FACT, and the gap between the two is a defect of this
      file rather than of the dataset. The class entered the data the moment the invoice archetype
      made a split pair buildable; RP-06 — the authoritative delivered corpus — counts 293 such
      documents among its 1315, and the status went on reading `forward_contract`, which RC-06's
      note recorded as a standing contradiction rather than half-fixing. Moved now under the rule
      `status_vocabulary` states: one document of the class was re-checked FIELD BY FIELD against
      the reference run (`sources.reference_run`, seed 42) at this version — the printed amount,
      fee, date caption, payee, hyphen payer, authorization code and document code all matching
      their label — which is the check the transition demands. No label a consumer received was
      ever described wrongly; what was wrong was this file's word for their presence.
    archetypes:
      # THREE ARCHETYPES, ALL IN THE DATA. `ua_bank_payment_confirmation` is the A4 sheet; the two
      # phone renderings joined it in version 32. The sentence that stood here — "ONE ARCHETYPE,
      # AND IT IS IN NO RUN YET … the class that proves the other (an invoice) is not written" —
      # described versions 10 and 11: the invoice landed in version 12 and made the pair buildable,
      # and this comment was left behind by every version since. A claim still needs BOTH facts;
      # what changed is that the other fact has a class to prove it.
      - slug: ua_bank_payment_confirmation
        jurisdiction: UA
        language: uk
        # EVERY category of policy.yaml, which is a consequence of the class rather than a generous
        # guess: the document lists no items, so nothing on it can contradict a category. A test
        # checks the tuple against policy.yaml so a category added there cannot drop out.
        categories: all
        paper: A4 — 210 × 297 mm, unlike the till rolls the fiscal class is printed on
      # 🔴 TWO MORE RENDERINGS OF THE SAME CLASS SINCE VERSION 32 — THE PHONE. Neither is a
      # new document type; both are what the same payment looks like inside the banking
      # application, and their shares of the payment draw are `archetype_shares` in
      # config/generation.yaml. A consumer's per-class figures now average over three
      # renderings, and per-archetype slices need `source_file` names or the box
      # vocabularies below to tell them apart.
      - slug: ua_bank_receipt_in_app
        jurisdiction: UA
        language: uk
        categories: all
        paper: >
          a phone screen, 1170 × 2532 px — the A4 sheet itself framed inside it. The inner
          document is built by the SAME builder and labelled by the SAME ground_truth as
          the A4 archetype (the medium does not change the ground truth, by construction),
          so every field box of the class is present, in the screen's coordinates, plus
          the chrome's own `screen_title` — the app's wording for the document, repeating
          its number over a page whose own heading reads differently. 👁 Observed, not
          staged.
      - slug: ua_bank_app_transaction
        jurisdiction: UA
        language: uk
        categories: all
        paper: >
          a phone screen, 1170 × 2532 px — the transaction screen, and the strongest
          negative example for this class by LACK of requisites: ⛔ no document number, no
          authorization code, no RRN, no stamp, no signature, no amount in words, no
          payment purpose — every one of them printed by the A4 archetype. Its label
          fields are accordingly null (`payment_purpose`, `auth_code`, `fee`, `payer`),
          `direction` is debit (the printed minus), and its box vocabulary is its own:
          `merchant_descriptor` (the counterparty as the card network carries it —
          `PREFIX*NAME`, matching no party block of any document beside it, while the
          label's `counterparty` still carries the bare trade name), `category_chip` (the
          BANK's category, drawn without reference to the claim and free to disagree with
          what was bought), `date` (👁 written in words with a time — «2 лютого 2026,
          13:46» — a form no printed document of this corpus uses), `amount` (signed),
          `balance`, `payment_method`.
    narrower_than_observed: >
      FOUR WAYS THIS CLASS IS NARROWER THAN WHAT WAS OBSERVED.

      ⚠️ WHY THEY SIT HERE RATHER THAN UNDER `known_limitations` IS AN OPEN QUESTION, RECORDED
      RATHER THAN RESOLVED. The reason given until now was that every entry there stated a share of
      a reference run and that no run contained this class yet, and BOTH HALVES HAVE SINCE BECOME
      FALSE: entries there quote no run at all now — they describe a limitation qualitatively and
      reference section 9b — and this class does reach a corpus, which the profiles in that section
      count. So these four may belong under `known_limitations`, and nothing in this file settles
      it. The dead justification is removed rather than replaced by one reasoned up to fit.

      ONE LAYOUT FOR FOUR ISSUERS. Three real banks were reviewed and their layouts differ; one
      arrangement of the fields they all carry is modelled. Field-set variation is what extraction
      has to cope with and it IS modelled; visual diversity between issuers is not, so a consumer
      must not read robustness to bank layouts off a score on this corpus.

      THE MERCHANT-DOMAIN VALUE OF THE TERMINAL FIELD IS NOT PRODUCED. 👁 That field carries three
      incompatible kinds of value — a system named in words, an uppercase mnemonic, and a
      merchant's internet domain. The domain is left out because printing one beside a named payee
      asserts that the payee owns it, which is a claim about a real firm.

      AN EMPTY RECIPIENT NAME IS NOT PRODUCED. 👁 Observed once, and it is the field a cross-check
      between a seller and a payee would rest on. `counterparty` is a required label field, so
      emitting an empty one would assert that the document names no counterparty — a case whose
      comparison rule this file has not settled. The other captioned-but-empty field observed on
      that same document, the recipient's bank, IS produced.

      A THIRD PERSON'S NAME IN THE PAYMENT PURPOSE IS NOT PRODUCED. 👁 1 of 7 purposes contained
      one, written by the payer. Left out: it would put a personal name in free text on a published
      image for no gain this step needs.
    line_items: >
      EMPTY BY DESIGN. The requirements document states plainly that this type has no line
      items — it is proof of one transaction. Settled by the requirement, not an open
      question.

    # WHICH OF THE PRINTED DATES IS THIS DOCUMENT'S `date`, AND WHY THE ANSWER IS SPLIT ACROSS
    # TWO FILES.
    #
    # A real Ukrainian bank payment confirmation does not print one date. 👁 Of eight reviewed,
    # five carry two or more; ten different captions across the eight reduce to six distinct
    # concepts. 📄 HALF OF THOSE SIX ARE NOT DEFINED TERMS AT ALL: the National Bank's
    # instruction on non-cash settlements (Resolution 163 of 29.07.2022, as amended) defines
    # composition, execution and valuation, and does not define carrying-out, processing or
    # "the operation". 📄 And of the two temporal requisites that instruction makes mandatory,
    # one — the date the payment was accepted for execution — is 👁 printed on 0 of 8 under any
    # caption. The documents do not carry what the law prescribes, so no caption can simply be
    # trusted to mean it.
    #
    #   config/policy.yaml, `period.payment_date`, names THE CONCEPT — the date the funds left
    #   the payer's account — and names no caption.
    #   This block gives THE MAPPING of printed captions onto that concept, and defines no
    #   concept of its own.
    #
    # Neither half works alone, and the split is why this file exists. A consumer builds its
    # own engine against policy.yaml; had that file named only "the payment date", two
    # independent and equally correct implementations would pick DIFFERENT captions
    # legitimately. The period is checked on this value, so they would disagree about the
    # VERDICT, and the disagreement would arrive as a scorecard reporting a date error against
    # a system that read the document correctly.
    payment_date:
      # `emitted` with the class: the mapping is what the archetype PRINTS — every caption it
      # prints is one of the three accepted, checked by a test — and runs contain such documents,
      # so the mapping is exercised on real labels. The document re-checked for version 34 printed
      # «Дата проведення», the second accepted caption, and the label carried its date.
      status: emitted
      concept: >
        config/policy.yaml, `period.payment_date`. Not restated here — a second statement of a
        definition becomes a second definition the first time one of them is edited.
      derived_from: >
        THE MEANING OF THE TERMS, NOT A COUNT. The frequencies below are recorded because they
        say what an extractor will meet, but they decided nothing: the most common caption of
        the six is one this block accepts only as a third choice, and one of the refused
        captions is as frequent as two of the accepted ones. Written as an ordered list plus a
        refusal list so that a disagreement has a line to argue with rather than the decision
        as a whole.
      accept_in_order:
        - caption: "Дата виконання"
          also_printed_as: []
          why: >
            The literal counterpart of the concept: the payment instruction has been EXECUTED,
            so the funds have gone. 📄 A defined term of the instruction, entered by the payer's
            payment service provider. 👁 2/8.
        - caption: "Дата проведення"
          also_printed_as: []
          why: >
            A common synonym of execution in bank usage. ⛔ Not a defined term of the
            instruction. 👁 2/8.
        - caption: "Дата операції"
          also_printed_as: ["Дата і час операції", "Дата та час операції"]
          why: >
            Taken as the same thing WHEN NEITHER OF THE TWO ABOVE IS PRINTED, and third for
            that reason alone: it names the operation without saying which end of it. ⛔ Not a
            defined term, and 👁 the most frequent of the six — 4/8.
      never:
        - caption: "Дата валютування"
          also_printed_as: []
          why: >
            AN ACCOUNTING CONVENTION, NOT THE MOMENT OF DEBIT. 📄 The Ukrainian law on payment
            services (Law 1591-IX), article 1, defines it as the date from which the funds pass
            into the RECIPIENT's ownership — the far end of the transfer — and the banks' own
            published explanations of it describe exactly the gap: debited from the payer on one
            date, credited to the recipient on another. So it MAY DIFFER BY A DAY, and across a
            month boundary that is a different benefit period. 👁 2/8.
        - caption: "Дата складання"
          also_printed_as: ["Дата і час складання"]
          why: >
            THE DATE OF THE OBLIGATION, NOT OF THE EXPENSE — when the payment instruction was
            drawn up. Accepting it would be the same error as dating a claim by its invoice,
            which `claim_evidence.period_and_date` refuses in the same words. 📄 A defined term,
            which is what makes it tempting: being defined is not being the right definition.
            👁 2/8.
        - caption: "Дата обробки"
          also_printed_as: ["Дата оброблення", "Дата обробки операції"]
          why: >
            AN INTERNAL BANK EVENT. ⛔ Not a defined term, and no source relates it to the debit
            at all, so a value under it cannot be known to satisfy the concept even when it
            happens to. 👁 2/8.
      observed_divergence: >
        NORMATIVE, NOT MEASURED, and stated that way round on purpose. 👁 Of the five documents
        carrying two or more dates, 0 show two dates falling on different days — the only
        difference observed is that one caption prints a time to the second and another does
        not. 📄 The gap is nonetheless provided for by statute, through valuation. So the
        preference order above is a guard against a divergence the norm permits and the sample
        of eight does not exhibit; a consumer must not read the counts as evidence that the
        choice does not matter.
      if_no_accepted_caption_is_printed: >
        A REQUIREMENT ON THE TEMPLATE, NOT A FALLBACK — AND IT IS NOW MET. The archetype
        `ua_bank_payment_confirmation` draws its caption from `accept_in_order` and from nothing
        else, so no document it produces can carry a date this file refuses to read;
        `tests/test_payment_confirmation.py` holds it to that in both directions, sweeping the
        printed captions against the accepted list and against the refused one.

        The case remains undefined for a REAL document that prints none of the three, and this file
        still does not invent a rule for it: nothing generated exhibits it, so any rule stated here
        would be untested by construction.
    prd_required_fields:
      - prd: amount
        generator: [amount]
        status: emitted
        note: >
          🔴 `amount` IS THE TRANSFER, AND NOT THE LARGEST NUMBER PRINTED — THE ONE FIELD OF THIS
          CLASS A CORRECT-LOOKING SYSTEM GETS WRONG. 👁 0 of 8 real
          confirmations print a single amount: each prints the operation amount and the fee
          separately, and 1 of 8 also prints their sum in the largest type on the page. 📄 The
          National Bank's instruction on non-cash settlements names the amount of the OPERATION as
          the requisite and does not name a fee anywhere, and a fee is a charge for a banking
          service rather than for anything a benefit category covers. So `amount` is the transfer,
          `fee` and `total_charged` are labelled beside it, and an extractor that takes the most
          prominent figure is wrong by exactly the fee — measurably, which is the point.
      - prd: date
        generator: [date]
        status: emitted
        see: document_types.payment_confirmation.payment_date
      - prd: payer / payee
        generator: [payer, counterparty]
        status: emitted
        note: >
          THE DIVERGENCE IS RESOLVED, and this entry used to record it: `counterparty` is one
          party and could not carry two. `payer` now carries the other. `counterparty` keeps its
          meaning — the party opposite the claimant — which on this class is the PAYEE, exactly as
          on a bank statement.

          ⚠️ Two forms of emptiness, and they are not one case. 👁 A payer field may print a HYPHEN
          as its value, which OCR returns as the string "-"; a captioned field may be printed with
          nothing under it, which returns nothing. `payer` is `null` only where the class names one
          party — never for an unidentified payer, whose label carries the hyphen.
      - prd: payment purpose
        generator: [payment_purpose]
        status: emitted
        note: >
          🔴 IT NEVER NAMES WHAT WAS BOUGHT — 👁 0 of 7 documents that carry the field. It names
          another DOCUMENT (an invoice by number, a delivery note), or a generic category, or
          nothing but the movement of money. That is the strongest confirmation available of
          `proves_subject: false` for this type in policy.yaml.

          AN EARLIER VERSION OF THIS ENTRY SAID THE OPPOSITE OF WHAT IT NOW SAYS, and the
          correction is recorded rather than made quietly. It called the field load-bearing because
          "the one documented override is a confirmation whose payment purpose spells out what was
          bought" — an archetype-level evidence override. That override does not exist, cannot be
          labelled (see `claim_evidence.what_is_not_recorded`), and the observation refutes the
          premise it rested on. The field is load-bearing for a different reason: it is what a
          consumer must NOT read a subject out of.
      - prd: authorization code
        generator: [auth_code]
        status: emitted
        note: >
          👁 4 of 8 — the card operations, six digits in 4 of 4 of them. OPTIONAL BY NATURE: a
          transfer by account details has no card operation to authorize, so its absence is
          information and not an extraction failure.

          ⚠️ NOT A DEDUPLICATION KEY. Six digits is a space of a million and the code is unique
          only within an issuer and a time window; 👁 it is also absent from half the documents, and
          a key missing from half the cases is not a key. See `document_code`.
      - prd: bank document code
        generator: [document_code]
        status: emitted
        note: >
          👁 8 of 8, 📄 mandatory as "the number of the payment instruction", and 📄 the key the
          official check services take. THIS is the deduplication key of the class. Three formats
          are 👁 observed and all three are produced, so a consumer validating the field by shape
          needs every one of them: four groups of four, a letter prefix followed by digits, and a
          bare run of eight to ten digits.
      - prd: >
          NOT ON THIS CLASS — an RRN and a payment form. Both were in an earlier field list for this
          type and 👁 neither appears on any of the eight documents reviewed.
        generator: []
        status: forward_contract
        note: >
          NOTHING IS EMITTED AND NOTHING IS WANTED — RECONCILED RATHER THAN SIMPLY DROPPED, because the earlier 0-of-8 finding read as a defect
          in this generator and is not one. An RRN IS a requisite of a card operation — as printed
          inside a FISCAL RECEIPT, where this repository does print it, and 👁 where a real sole
          trader's receipt carries one. It is not a requisite of a bank confirmation. A payment form
          (cash / card) is a receipt requisite too, carried over by the same mistake. A consumer
          cross-checking a payment form between linked documents has nothing on this class to read
          it from.

  bank_statement:
    classifier_role: target_class
    status: emitted
    emitted_since: >
      VERSION 34 AS A WORD, VERSION 12 AS A FACT — the same gap `payment_confirmation` carries, on
      the same history: the invoice made the split pair buildable and this status was left behind.
      RP-06 counts 294 statements among its 1315 documents. Moved under `status_vocabulary`'s rule:
      a two-sheet statement of the reference run (seed 42) was re-checked FIELD BY FIELD at this
      version — the labelled row's amount, operation date, counterparty, purpose and debit column
      all matching, with the row on the second sheet and `page_count: 2` saying so.
    archetypes:
      # ONE ARCHETYPE, IN THE DATA SINCE THE INVOICE MADE PAIRS BUILDABLE. The sentence that stood
      # here — "IN NO RUN YET … an invoice — is not written" — described version 11 and was stale
      # from version 12 on. `ua_bank_statement` is registered in `ARCHETYPES` in
      # claim_planner.py, has a template and a stylesheet, and produces every field below.
      - slug: ua_bank_statement
        jurisdiction: UA
        language: uk
        # Every category of policy.yaml, and for the same reason the confirmation carries them all:
        # the page lists transactions and no items, so nothing on it can contradict a category.
        categories: all
        paper: >
          A4 the long way round — 297 × 210 mm — and ONE OR TWO sheets. ⛔ The orientation is not
          observed: it follows from seven columns, two of them free text.

          ⚠️ THIS ENTRY READ "and ONE page … Every generated statement is exactly one sheet, and a
          test holds the tallest row counts to it" UNTIL VERSION 29. A statement now runs onto a
          second sheet at the share `bank_statement.two_page_share` declares in
          config/generation.yaml, and the test that held one sheet holds the split instead. The
          one-sheet form is still the overwhelming majority, and the label says which a document is:
          `page_count` and `page_regions`.
        rows: >
          15–25 operations on one sheet, 28–45 across two, of which exactly one is labelled — and
          the labelled one may fall on either sheet

    # 🔴 THE SHAPE OF THIS TYPE'S LABEL, AND IT IS DERIVED RATHER THAN CHOSEN.
    #
    # The requirement lists this type's fields in the SINGULAR — an amount, a date, a payee, a
    # payment purpose — and states that it has no line items. A single amount for a document that
    # lists twenty transactions would be a number nothing on the page is, so what the requirement
    # describes is ONE TRANSACTION. The label follows: `amount`, `date`, `counterparty`,
    # `payment_purpose` and `direction` are the values of the one row a claim rests on, and
    # `relevant_transaction` names that row.
    #
    # WHICH ROW IS THE RELEVANT ONE IS NOT A PROPERTY OF THE IMAGE ALONE, and a consumer has to
    # know it: the row is identified from the claim's OTHER document — an invoice naming a seller
    # and a total — which is what makes the dominant pair a pair. A statement scored on its own,
    # with no claim around it, is not a well-posed extraction task for these fields, and no
    # threshold in `extraction_thresholds` should be read as one.
    the_label_is_one_transaction:
      status: emitted
      labelled_from_the_row: [amount, date, counterparty, payment_purpose, direction]
      pointer: relevant_transaction
      bboxes: >
        `field_bboxes` carries the CELLS OF THAT ROW for each field above, so the label says where
        the answer is and not only what it is. Each row additionally carries an indexed box over its
        whole rect — `operation_<i>`, `i` counted down the page from 0 — so a consumer can find the
        rows without reading them. That is also what makes "the boxes are on the labelled row" a
        measurement: `tests/test_bank_statement.py` requires each labelled box to sit inside
        `operation_<k>` and its centre to fall in no other row's rect.
      the_four_totals_are_printed_and_never_labelled: >
        🔴 A statement prints four summary figures — вхідний залишок, вихідний залишок, разом за
        кредитом, разом за дебетом — 👁 in a framed block under the header, and 👁 they are the most
        prominent numbers on the document. NONE OF THEM IS LABELLED, and none is `total_charged`
        under another name: that field is one payment plus its fee on a confirmation, and reusing it
        for a period's turnover would give one key two meanings.

        THEY ARE PRINTED ALL THE SAME, and that is the deliberate half. Omitting them would make
        "find the relevant transaction" artificially easy and inflate every figure measured on this
        class. It is the same refusal as `amount_due` not being scoreable and as the confirmation's
        total being printed while the transfer is the answer: a document prints what the document
        prints, and a value is labelled only where the label can mean something.

        All four are DERIVED from the rows — the closing balance is the opening balance plus the
        credit turnover less the debit turnover, and each turnover is the sum of its side — so the
        block cannot contradict the table it sits above. 👁 The observed document's figures satisfy
        this exactly.

    # THE DATE OF THE LABELLED ROW, DERIVED FROM THIS CLASS'S OWN OBSERVATIONS.
    #
    # 🔴 NOT INHERITED FROM THE CONFIRMATION'S CAPTION ORDER, and the distinction is the point. That
    # order was derived from eight payment confirmations; applying it to a statement would be
    # applying a rule outside the evidence it was derived on.
    payment_date:
      status: emitted
      concept: >
        config/policy.yaml, `period.payment_date` — the date the funds left the payer's account. Not
        restated here: a second statement of a definition becomes a second definition the first time
        one of them is edited.
      derived_from: >
        👁 THE ROW CARRIES EXACTLY ONE DATE, and that is the whole derivation. The observed table has
        a single temporal column, captioned «Дата та час операції» and printed as a date over a time.
        It has no second one of any kind — no valuation date, no composition date, no processing
        date — so on this layout there is nothing to PREFER, and the question the confirmation's
        ordered list exists to answer does not arise. The one date a row states is the date that
        row's money moved.

        A ROW IS ALSO THE ONLY PLACE A PER-TRANSACTION DATE COULD BE. The label describes one
        transaction; every other date on the page is a property of the DOCUMENT — see `never` below,
        which is where the work of this block actually is, since the acceptance side has a single
        candidate and no contest.
      accept:
        # ONE ENTRY, and one is not an oversight: the row carries one date. It is a list all the
        # same, so that a second temporal column found on some other statement layout is an ADDITION
        # here rather than a rewrite — and so that a test can read the caption rather than a
        # sentence. `tests/test_bank_statement.py` checks this string against the column caption
        # config/fiscal-rules.yaml actually prints, in both directions.
        - caption: "Дата та час операції"
          reads_as: >
            The DATE part of the row's own timestamp. The time is printed under it and is not part
            of the label — `normalize.iso_date` compares calendar dates.
          why: >
            It names the operation the row IS, and a statement row exists because an operation was
            carried out on the account: the funds are recorded as having left on the date the row
            states. ⛔ Not a defined term of any instruction, and it does not need to be — nothing
            competes with it on this layout.
      never:
        # THE THREE DOCUMENT-LEVEL DATES A STATEMENT PRINTS. Each is disqualified by its own
        # mechanism and none by comparison with another, so editing one cannot move the others.
        # This list is why the block is worth writing at all: an extractor that reaches for the most
        # authoritative-looking date on the page reaches for one of these three, and the label would
        # score it wrong for a reason that would look like an extraction error.
        - caption: "the production timestamp in the header"
          also_printed_as: ["a bare date and time, top right, under no caption at all"]
          why: >
            WHEN THE STATEMENT WAS MADE, not when any money moved. 👁 The observed document was
            produced the morning after its period closed, and this generator reproduces that, so the
            value is STRICTLY LATER than every operation on the page and can never be any row's
            date. It carries no caption, which is what makes it dangerous: it looks like the
            document's date because it is the only date not inside something else.
        - caption: "Дата останньої операції"
          also_printed_as: []
          why: >
            THE DATE OF THE LAST ROW, which is a fact about the table rather than about the
            transaction the label is for. It is captioned with a date word and sits in the header
            among the account's identifying facts, so it reads as authoritative; it answers "how
            current is this statement", and the labelled row is usually not the last one.

            ⚠️ IT CAN COINCIDE with the labelled date in general — a labelled row that happens to be
            last, or another row on the same day — so the rule is about WHICH FIELD IS READ and never
            about the values being distinct. IN THIS CORPUS THEY ARE DISTINCT: measured over 24
            seeds, the labelled date differed from the last operation's on 24 of 24. That is a
            consequence of a draw parameter and not a property a consumer may rely on — the period
            runs at least three days past the labelled transaction, so with fifteen to twenty-five
            rows across it some row almost always falls later. Narrow that window and the coincidence
            returns. The measurement is recorded because the sentence here previously asserted the
            opposite of what the corpus does, and `tests/test_bank_statement.py` now pins the count
            with its denominator so the two cannot drift apart again.
        - caption: "the period bounds in the title"
          also_printed_as: ["«Заключна виписка за період з … по …»"]
          why: >
            A WINDOW, NOT AN EVENT. Two dates naming the interval the document covers; no
            transaction happened on either by virtue of its being a bound. The start is frequently
            the date of the first row and the end frequently the date of the last, which makes
            either one a plausible-looking answer that is right by coincidence when it is right.
      relation_to_the_confirmations_rule: >
        DERIVED FROM THIS CLASS'S OWN DOCUMENT, AND IT AGREES WITH THE CONFIRMATION'S — in that
        order, and the order is the point. The caption accepted above is 👁 what a statement row
        prints, established from the statement; that the confirmation's block lists «Дата та час
        операції» as a variant of its third accepted caption is a SEPARATE FACT, established from
        eight confirmations, and the two agreeing is a RESULT of two derivations rather than a
        licence for one.

        The distinction is operational, not stylistic. Had this block been written by carrying the
        confirmation's ordered list across, it would have imported an ORDER — a preference among
        captions — into a class where no second caption exists to prefer against, and the first
        statement layout printing a valuation column would have been read by a rule never derived on
        a statement. Where the two classes genuinely differ: there, that caption is accepted only
        when neither better one is printed; here there is no better one to be absent.

        AND THE REFUSALS DO NOT CORRESPOND AT ALL, which is the clearest evidence that the two were
        derived separately. The confirmation refuses three CAPTIONED CONCEPTS that compete for the
        same slot on one transaction — valuation, composition, processing. A statement prints none of
        those; what it prints instead are three DOCUMENT-LEVEL dates, and one of them carries no
        caption at all. A rule carried across would have refused three things that are not on the
        page and admitted three that are.
      see: document_types.payment_confirmation.payment_date

    line_items: >
      EMPTY BY DESIGN. The requirements document gives this type no line items, as it gives
      none to `payment_confirmation`. Settled by the requirement, not an open question — and it is
      why a statement establishes nothing about what was bought: a transaction is not a line of a
      basket.

    difficulty_is_understated: >
      🔴 A NUMBER MEASURED ON THIS CLASS IS EASIER THAN IT LOOKS, AND ANYONE QUOTING ONE MUST SAY SO.
      The rows that are not the labelled one are ordinary operations drawn from the same pools, with
      NO deliberate resemblance to it. A DECOY — a row carrying the same counterparty, or an amount
      a kopiyka away — is what makes "find the relevant transaction" hard, and decoys are deferred:
      they are a difficulty dial belonging to the design of traps rather than to the first version
      of this template.

      Two things are additionally true by construction and both make the task easier: the labelled
      amount appears on NO other row, and the claim's payee is kept out of the pool the other rows
      draw from. The first of those is not a difficulty choice — it is what makes the label
      well-posed, since a consumer identifies the row by seller and total and two matching rows
      would leave the ground truth pointing at either.

    narrower_than_observed: >
      SIX WAYS THIS CLASS IS NARROWER THAN, OR DIFFERENT FROM, WHAT WAS OBSERVED.

      ⚠️ WHY THEY SIT HERE RATHER THAN UNDER `known_limitations` IS THE SAME OPEN QUESTION THE
      OTHER TWO CLASSES CARRY, RECORDED RATHER THAN RESOLVED. The justification that stood here —
      that entries there state shares of a reference run and no run contains this class — is dead
      in both halves: entries there quote no run now, and this class reaches every corpus, which
      RP-06 counts. The dead justification is removed rather than replaced by one reasoned up to
      fit, exactly as at `payment_confirmation.narrower_than_observed`.

      ONE LAYOUT OF AT LEAST THREE. 👁 The corporate current-account statement is modelled: no
      running balance per row, and the turnover block instead. 📄 A personal CARD statement carries a
      balance on EVERY line — the monobank open-API statement element has a `balance` field, and such
      a statement prints cashback — and 📄 a bank's own "open statement" is cut down to four columns.
      Mixing them would reproduce a document that does not exist, so one is built and the other two
      are gaps. A consumer must not read robustness across statement layouts off this corpus.

      TWO PAGES AT MOST, AND THE SECOND IS LAYOUT-GENERIC. 👁 The observed statement had four. ⛔
      Only a preview of its first page was seen, so what a real continuation sheet repeats is
      unestablished; what is generated repeats the column headings and prints a «Сторінка N з M»
      footer, which is the least the sheet can do and still be readable, and it is DERIVED rather
      than transcribed. A third sheet is allowed by the split and is not drawn — the second is what
      makes "one page is one document" falsifiable, and a third only adds paper.

      ⚠️ THIS ITEM READ "ONE PAGE … a repetition invented here would be on every image of the class"
      UNTIL VERSION 29, when the class began to paginate at the share `bank_statement.two_page_share`
      declares. The worry the withdrawn sentence carried is answered by the share rather than
      refuted: the invented continuation is on a minority of this class's images and on none of the
      rest of the corpus, and the label says which document has one.

      THE ACCOUNT HOLDER IS A NATURAL PERSON ON A CORPORATE LAYOUT. ⚠️ 👁 The observed statement was a
      company's, and printed a ЄДРПОУ beside the client's name; this one prints a persona and a
      РНОКПП. That is not a layout preference: a statement is evidence that THIS person's money left
      THIS person's account, and a company's statement would evidence nothing about the persona
      filing the claim. ⛔ A personal current-account statement in exactly this arrangement was not
      observed — what was observed is the arrangement. The observed header's branch line, naming the
      bank's corporate-business division, is not printed for the same reason.

      TWO MONEY COLUMNS. 👁 THE OBSERVED TABLE HAS ONE, captioned «Сума» and unsigned; ⛔ THE
      TWO-COLUMN FORM WAS NOT OBSERVED ON IT. Both halves stated first, because this is the one place
      in this block where the generator prints something the sample does not.

      Why it is printed anyway: on the observed table a reader cannot tell a debit row from a credit
      row at all — the direction appears only in the turnover block, for the period as a whole — and
      `direction` is a LABELLED field. 🔴 A ground-truth field the document cannot support is worse
      than no field: it is unlearnable, and every extractor fails it for a reason that is the
      dataset's fault rather than the system's. So the amount is printed in one of two columns,
      «Дебет» or «Кредит», which is 📄 the ledger-extract form the document's OWN turnover captions
      are written in («разом за дебетом», «разом за кредитом»).

      The three options, with the strength of each claim, because the choice is a judgement and a
      reader is entitled to weigh it: a SIGN ON THE AMOUNT breaks the money normalization that is
      uniform across every document type of this dataset, so a consumer comparing `-1200.00` against
      `1200.00` scores a correct reading as a miss; a Дт/Кт LETTER COLUMN is grounded in nothing at
      all; TWO COLUMNS departs from one observed corporate layout. The third is the weakest claim of
      the three, which is why it is the one taken.

      THE COUNTERPARTY-CODE COLUMN IS CAPTIONED «Код», NOT «ЄДРПОУ». 👁 The observed caption holds
      only while every counterparty is a legal entity; a sole trader carries a РНОКПП of ten digits,
      and ten digits under an ЄДРПОУ caption would be a false caption. ⚠️ Note the consequence, which
      is the confirmation's finding on a second class: three code lengths appear under one caption —
      ten for a sole trader, eight for a company, six for the bank's own service-charge row — so the
      caption does not tell the kinds apart.

      THE BANK IS IDENTIFIED BY ITS МФО. 👁 The observed header carried the bank's ЄДРПОУ. The МФО is
      what the confirmation archetype prints for an issuer, and two archetypes of one repository
      identifying the same bank by two different codes would be a difference nothing supports.

    prd_required_fields:
      - prd: amount
        generator: [amount]
        status: emitted
        note: THE LABELLED ROW'S amount, not the document's
        see: document_types.bank_statement.the_label_is_one_transaction
      - prd: date
        generator: [date]
        status: emitted
        note: the labelled row's OPERATION date
        see: document_types.bank_statement.payment_date
      - prd: payee
        generator: [counterparty]
        status: divergent
        see: divergence_counterparty_name
        note: >
          ⚠️ THE ROW PRINTS FOUR FIELDS FOR ITS COUNTERPARTY — 👁 name, code, IBAN and bank, laid out
          as two columns of two stacked lines — and the label carries the NAME. The other three are
          printed and unlabelled, like the turnover totals: the requirement asks a statement for one
          counterparty field, so a label carrying four would be answering a question nobody asked
          while leaving the name's own comparison rule to cover them.

          🔴 AND A SINGLE COUNTERPARTY FIELD IS AMBIGUOUS ABOUT ROLE ON THIS CLASS, which is the
          second reason `direction` exists. For a debit the counterparty received the money; for a
          credit it sent it. Without the direction, "the payee" of a statement row cannot be
          distinguished from the sender of a refund — which for a reimbursement claim is the
          difference between proof of an expense and proof that the money came back.
      - prd: payment purpose
        generator: [payment_purpose]
        status: emitted
        note: >
          THE GENERATOR NOW HAS A COUNTERPART — this entry emitted nothing until version 11,
          when the archetype began printing a purpose on every row and labelling the relevant one.

          🔴 IT NAMES ANOTHER DOCUMENT, NOT THE EXPENSE. 👁 Every observed purpose follows one
          pattern — payment for a generic category of goods, «згідно» an invoice or a delivery note
          by number — and the commonest form names no category at all, only a number. So a statement
          CONFIRMS `proves_subject: false` for its type in policy.yaml rather than testing it. ⚠️ It
          is the WEAKER of the two confirmations available: a generic category of goods was at least
          sometimes named here, while 👁 0 of 7 payment-confirmation purposes named anything of the
          kind, so the confirmation carries the finding and this class agrees with it.
      - prd: >
          NOT A REQUIRED FIELD, and named because the generator emits it: `direction`, and the
          pointer `relevant_transaction`.
        generator: [direction, relevant_transaction]
        status: emitted
        note: >
          Neither is asked for by the requirement. `relevant_transaction` is forced by the shape of
          the label — a field list in the singular over a document with twenty rows has to say WHICH
          row — and `direction` is forced by the invariant that only a debit can be proof of
          payment. See both fields in `document_label`.

    decided_in_version_11: >
      WHAT THIS BLOCK USED TO LEAVE OPEN, so that a consumer diffing versions finds the answer
      rather than the absence. Until version 11 it read: "whether a multi-page statement produces
      one label for the statement or one per transaction, and how `amount` and `date` are then
      defined. Neither side settles it."

      It is settled, and by derivation rather than by choice: the requirement's own field list is
      singular over a type it says has no line items, so the extraction target it describes is one
      transaction — see `the_label_is_one_transaction`.

      ⚠️ AND THE SECOND HALF OF THIS ENTRY IS WITHDRAWN IN VERSION 29, KEPT HERE IN THE PAST TENSE
      FOR THE SAME REASON THE FIRST HALF IS. It read: "Multi-page is a separate question and is now
      a declared gap rather than an open decision: one page is generated because ⛔ a second was
      never observed." MULTI-PAGE STATEMENTS ARE GENERATED, at the share
      `bank_statement.two_page_share` declares, and the gap is closed on the terms the withdrawn
      sentence set rather than in spite of them: the answer to "one label or one per transaction" is
      unchanged — a paginated statement still carries ONE label for ONE transaction, and that
      transaction may sit on either sheet — and what carries the pagination is
      `document_label.page_count` and `page_regions`, which describe the document's SHEETS and say
      nothing about how many labels it has.

      ⛔ WHAT WAS NEVER OBSERVED IS STILL NOT OBSERVED. The continuation sheet is layout-generic —
      see `narrower_than_observed` above, which carries the same ⛔ — so what closed here is the
      measurement gap, not the anatomy.

  invoice:
    classifier_role: target_class
    status: emitted
    emitted_since: >
      VERSION 34 AS A WORD, VERSION 12 AS A FACT — the class landed WITH the pair it activates and
      the status never moved. It is the largest class of the delivered corpus: RP-06 counts 587
      invoices among its 1315 documents, one on every split claim. Moved under
      `status_vocabulary`'s rule: an invoice of the reference run (seed 42) was re-checked FIELD BY
      FIELD at this version — title number and date (in words), specimen payment order, seller and
      buyer blocks, four line items, the total and the amount in words all matching their label.
    archetypes:
      # 🔴 THE ARCHETYPE THAT ACTIVATES THE DOMINANT PAIR. It states what was bought and proves no
      # payment, which is the exact inverse of the two bank classes — so `claim_planner` can now
      # assemble both facts from TWO documents, and a claim whose evidence is split is buildable for
      # the first time. Until this landed, `documentable_categories` reported the six non-receipt
      # categories as not documentable.
      - slug: ua_invoice
        jurisdiction: UA
        language: uk
        # Every category, and here that is a positive claim rather than the bank classes' "nothing
        # on the page can contradict one": an invoice LISTS ITEMS, so it carries a category exactly
        # when a basket can be drawn for it. A test builds one per category rather than asserting it.
        categories: all
        paper: A4 portrait — 210 × 297 mm
        # ⚠️ SIX OF THE SEVEN, NOT ALL SEVEN, and a reader of a dataset needs this before counting:
        # the planner PREFERS a single document proving both facts, and the three fiscal receipts
        # carry `vitamins_nutrition`. So that category still produces a receipt and the other six
        # produce an invoice plus a payment document.
        exercises_the_pair_in: six categories; `vitamins_nutrition` still gets a fiscal receipt

    the_class_is_an_offer_to_pay:
      status: emitted
      note: >
        🔴 EVERYTHING BELOW FOLLOWS FROM ONE FACT. 📄 A Ukrainian рахунок на оплату is NOT a primary
        accounting document: the seller PROPOSES that the buyer pay, and the fact of payment is
        established by a payment document. 📄 A paid invoice may then serve as a primary document,
        but its paidness is established by the payment instruction or the account statement — never
        by a line printed on the invoice itself.

        THE CONSEQUENCE FOR THE ORACLE, and it is the one that matters: no verdict in this
        repository rests on anything printed on an invoice about PAYMENT HAVING HAPPENED, because
        nothing of the kind is printed and nothing of the kind is labelled. An oracle deriving
        proof of payment from a printed word would be reading the answer off the thing under test.

        ⚠️ SINCE VERSION 28 A VERDICT DOES REST ON A LINE OF THIS CLASS, and the sentence above is
        worded to stay exactly true beside it. `the_instalment_term` below states how the seller
        proposes to be PAID IN PARTS — a condition of the offer, settled before any money exists —
        and `partially_paid` turns on its presence. Whether money moved is still decided from the
        PAYMENT document's type, as on every other claim.

    prd_required_fields:
      - prd: total
        generator: [amount]
        status: emitted
        note: >
          👁 ONE TOTAL BLOCK, and the amount is Σ over the line items exactly, as on a receipt. A
          registered payer additionally prints the tax CONTAINED WITHIN it («У т.ч. ПДВ»), which is
          not a second amount and is not labelled: 📄 prices are VAT-inclusive, so the total is the
          whole of what is owed.
      - prd: date
        generator: [date]
        status: emitted
        note: >
          ⚠️ TWO SPELLINGS OF ONE DATE ON ONE PAGE. 👁 The title writes it in words — «Рахунок на
          оплату № … від 3 червня 2026 р.» — while the agreement line and any validity line use
          digits. A corpus of receipts alone never presents that, and `normalization.iso_date` is
          what settles the comparison: both sides parse to a calendar date and dates are compared,
          never strings.
      - prd: seller plus tax number
        generator: [counterparty]
        status: divergent
        see: divergence_counterparty_name
        note: >
          THE NAME ONLY. THE TAX NUMBER IS PRINTED AND NOT LABELLED — `seller_tax_code` carries a box and no value,
          as on a receipt. ⚠️ AND IT IS PRINTED TWICE: 👁 1/1 open invoices carry a filled-in SPECIMEN
          PAYMENT ORDER above the title, which repeats the recipient's name, code, bank and account.
          An extractor therefore has to choose between two identical strings, and the duplication is
          reproduced rather than smoothed away because a real invoice does it.
      - prd: subject / line items
        generator: [line_items]
        status: emitted
        note: >
          🔴 THIS IS THE CLASS'S REASON FOR EXISTING. An invoice STATES WHAT WAS BOUGHT, which is
          what `proves_subject: true` means for it in policy.yaml and what makes it the subject
          document of the pair — the exact inverse of a statement, whose payment purpose names
          another document and never the expense.

          ⛔ NO PER-LINE VAT LETTER. 👁 The observed table prices VAT-inclusive and states the tax
          once at the foot, so `line_items[].vat_letter` is `null` on every line of this class — a
          letter labelled and not printed would be a ground-truth value unreadable from the image.
          A consumer must not read the absence as "not a VAT payer": the seller's status is visible
          in the column captions and in the tax line, not per line.
      - prd: PAYMENT STATUS (e.g. "Оплачено" / "Zapłacono")
        generator: []
        status: divergent
        note: >
          NOTHING IS EMITTED AND NOTHING IS WANTED. 🔴 THE REQUIREMENT ASKS THIS TYPE FOR A FIELD THE
          DOCUMENT DOES NOT CARRY, and this row
          RECORDS the disagreement rather than resolving it — which is what every `divergent` row in
          this file does. It was `forward_contract` until version 12, i.e. "the generator will
          produce this later". It will not.

          👁 0 of 2 open Ukrainian invoices print any payment status, and 📄 THE REASON IS STRUCTURAL
          RATHER THAN A SMALL SAMPLE: an invoice is an offer to pay. The requirement's own example is
          POLISH — «Zapłacono» — and a Polish faktura does carry that line, so the field is kept as a
          FORWARD CONTRACT FOR NON-UA JURISDICTIONS and is not satisfied for UA. The expected value
          for a Ukrainian invoice is "not stated", and that is the expected case rather than an edge
          one.

          🔴 NO VERDICT EVER RESTS ON IT. Even where a non-UA archetype eventually prints one, an
          invoice stays `proves_payment: false`: reading proof of payment off a printed word would
          be the oracle deriving the answer from the thing a consumer is being tested on. The
          requirement's own `document_evidence` says the same, so this is the requirement made
          consistent with itself rather than overruled.

          AND THE DISAGREEMENT IS INTERNAL TO THE REQUIREMENT, which is worth saying plainly: one
          part asks an invoice for a payment status while another states that an invoice does not
          prove payment. Both cannot hold. See RC-07.
      - prd: amount due
        generator: []
        status: divergent
        note: >
          NOTHING IS EMITTED ON THIS CLASS AND NOTHING IS WANTED.
          🔴 `amount_due` IS A RECEIPT REQUISITE AND HAS MOVED THERE. 📄 «ДО СПЛАТИ» is line 24 of the
          FISCAL RECEIPT form, where it differs from «СУМА» by the discount and the rounding, and 👁 a
          real receipt prints all four lines. 👁 An invoice has ONE total block — «Разом» plus the
          tax contained within it, or a single «Разом до сплати» for a non-payer — so there is
          nothing for a second amount to differ from, and a populated field would be `amount` twice
          under two names.

          This row was paired with the payment status until version 12 and asked for both. The
          field exists on `DocGroundTruth` and is populated on `fiscal_receipt` alone; on an invoice
          it is `null` BY DESIGN rather than pending.

    narrower_than_observed: >
      THREE WAYS THIS CLASS IS NARROWER THAN WHAT WAS OBSERVED.

      ⚠️ WHY THEY SIT HERE RATHER THAN UNDER `known_limitations` IS AN OPEN QUESTION, RECORDED
      RATHER THAN RESOLVED — the same one the payment confirmation carries. The reason given until
      now was that every entry there stated a share of a reference run, which is no longer true of
      any of them; and this class reaches a corpus in quantity, so the fallback the confirmation
      also used — that no run holds the class — is not available either. Whether these three belong
      under `known_limitations` is unsettled by anything in this file, and a justification that has
      outlived its basis is removed rather than replaced by one reasoned up to fit.

      THE BUYER IS A NATURAL PERSON. 👁 The observed invoice was addressed to a company and printed a
      ЄДРПОУ; this one names the claimant and prints a РНОКПП. Not a layout preference: an invoice
      addressed to anybody else would evidence nothing about the persona filing the claim, which is
      the same reasoning that puts the persona on a bank statement's account. ⛔ A personal buyer on
      this arrangement was not observed.

      THE SIGNATORY IS A SURNAME WITH INITIALS. 👁 The real invoice prints a full given name and
      patronymic. The narrowed form carries the same information for extraction — a personal name in
      the signature block — while drawing only from the published high-frequency surname pool, so a
      published image never names a person more specifically than that pool justifies.

      THE UNIT OF MEASURE FOLLOWS THE VENDOR, NOT THE LINE. 👁 A real invoice's «Од.» column varies
      per line — «посл.» for a service, «шт.» for a thing — and here it is decided once per document
      from what the vendor sells. So a mixed basket from a service provider prints «посл.» beside a
      non-covered GOODS line. ⛔ No source maps an item kind to a unit, and inventing one would put
      an unevidenced classification into the ground truth's neighbourhood; the narrowing is declared
      instead.

    line_items: >
      PRESENT AND LABELLED, unlike on either bank class. This is the only type besides
      `fiscal_receipt` whose label carries a basket, which is exactly why the two are the two that
      can be a claim's subject document.

    the_instalment_term:
      status: emitted
      emitted_since: version 28
      printed_box: instalment_amount
      label_field: instalment_amount
      note: >
        🔴 A SECOND PAYMENT TERM ON THIS CLASS, AND THE ONLY LINE OF THIS DATASET A VERDICT RESTS
        ON. Some invoices now print «Умови оплати: оплата частинами {щоквартально | щомісяця |
        щопівроку}, черговий платіж: {сума}» — the obligation is settled in equal parts and this is
        what one part comes to. The amount carries its own box and its own label field,
        `instalment_amount`; the adverb is printed and not labelled.

        🔴 WHY IT DOES NOT CONTRADICT `the_class_is_an_offer_to_pay` ABOVE, which a reader will
        check first. A PAYMENT TERM IS NOT A PAYMENT STATUS. A status is a RECORD that money moved
        — «Оплачено» — and this class still prints none, for the structural reason that block
        gives. A term is a CONDITION OF THE OFFER: it says how the seller proposes to be paid, and
        it is fixed when the invoice is drawn up, before there is any payment to record. The
        `validity` line is already such a term. Nothing on this page says any money has moved, and
        `proves_payment` stays `false`.

        WHAT A CONSUMER DOES WITH IT: an invoice whose `instalment_amount` is non-null states an
        obligation SETTLED IN PARTS, so a payment document beside it stating that part — and not
        the total — is a correct pair rather than a contradiction. `verdicts.partially_paid` and
        `partial_payment` in policy.yaml carry the rule. A consumer that compares a payment against
        `amount` alone will score every such claim as a mismatch.

        ⚠️ NOT OBSERVED, AND DECLARED AS A DIVERGENCE FOR THAT REASON. Neither of the two open
        invoices behind this class carried an instalment term — both were payable in one — so the
        wording is derived from general knowledge of the document rather than transcribed from one.
        What IS carried over is the shape: a left-aligned line in the block below the totals, where
        the validity line sits. See KL-15.

  act:
    classifier_role: other
    status: forward_contract
    note: >
      The consumer's classifier vocabulary folds the act of services rendered into `other`
      explicitly, and the required-field table gives it no row of its own.

  order_screenshot:
    classifier_role: other
    status: forward_contract
    note: >
      The consumer's `other` class is "contract, act and everything else", which absorbs
      this type. It still matters for linking: it establishes the subject and never the
      payment.

  non_fiscal_receipt:
    classifier_role: undecided
    status: emitted
    emitted_since: >
      VERSION 27, AND IT IS THE FIRST CLASS OF THIS DATASET WHOSE LAYOUT DOES NOT IDENTIFY IT.
      📄 The State Tax Service's rule (БЗ 109.10) is that a товарний чек carries the wording
      «Товарний чек» and otherwise satisfies the fiscal receipt's own form EXCEPT the fiscal number
      of the register and the wording «ФІСКАЛЬНИЙ ЧЕК» — so the basket, the four amount lines, the
      columns and the arithmetic are a fiscal receipt's, and the whole difference is a set of
      requisites left out. A classifier that recognizes a receipt by its shape recognizes this one
      too, and is wrong.

      WHAT ITS LABEL RECORD CARRIES: `doc_type: non_fiscal_receipt`, a basket in `line_items`,
      `amount` and `amount_due` (equal, as on a fiscal receipt — see that field), `counterparty`
      the seller, `date`, and `payer: null` — 📄 the form it follows names no buyer, the person who
      paid having been at the counter. `vat_letter` is `null` on every line and there is no VAT
      row: 📄 a registered ПДВ payer is obliged to use a cash register, so the seller of such a
      slip is a non-payer, and `vat_row_form` is `null` for the same reason.

      🔴 THE THREE FISCALITY FLAGS ARE ALL `false`, AND THEY ARE WHAT THE ABSENCE IS RECORDED AS:
      `has_fiscal_number`, `has_qr`, `qr_is_fiscal`. No field records the negative marker itself —
      see RC-08, amended in this version rather than closed by this archetype.
    undecided: >
      The consumer's `other` class is defined as "everything else", which mechanically
      absorbs this type — but the requirement's `other` row says such a document gets
      classification only and the claim goes straight to `in_review`, while the fiscality-marker
      rule requires exactly these documents (a sales slip with full requisites marked
      non-fiscal, a terminal slip with an RRN and an empty receipt-number field) to be
      DETECTED AND REASONED ABOUT: a negative marker must override positive fiscality
      signals, and the stated test is that such a document is not classified as a fiscal
      receipt. Being reasoned about specifically and being routed
      to manual review as an unrecognized type are different outcomes, and no source names a
      class for this one. Left open.

  platform_receipt:
    classifier_role: undecided
    status: emitted
    emitted_since: >
      VERSION 31, TOGETHER WITH THE CURRENCY CONVERSION IT EXISTS TO EXERCISE — the first
      document of this corpus in a second language and a second currency, and the second
      class after `fiscal_receipt` whose type establishes BOTH facts of policy.yaml's
      `document_evidence`. An online platform's own receipt for a paid order: the lines
      say what was bought, the paid caption and the masked card say money moved, and no
      fiscal identity of any jurisdiction appears anywhere on the page.

      TWO ARCHETYPES SINCE VERSION 32, ONE SHARED BODY. `eu_platform_receipt` — English,
      EUR, seller drawn from the EU pool of config/vendors.json — and
      `ua_platform_receipt` — Ukrainian, UAH, a domestic company (its legal name,
      address, identification code, ПН and the contained-VAT row «У т.ч. ПДВ 20%» are
      ordinary requisites, each the exact particular the English page's footer licenses
      ITSELF to omit; ⛔ it prints no not-a-tax-invoice note, no Ukrainian equivalent of
      the wording having been found in any public source). Both are registered for
      `professional_development` only (the registry entry carries the blast-radius
      reasoning), drawn against each other at `archetype_shares` in
      config/generation.yaml. Claims are single-document either way; the oracle CONVERTS
      the EUR variant's amounts at the vendored rate of config/fx-rates.yaml, recording
      what it applied in the claim's `fx_rates` field, and the UAH variant needs no
      conversion — which is exactly the controlled pair the class exists for: language,
      currency and tax treatment vary, the layout does not.

      WHAT ITS LABEL RECORD CARRIES: `doc_type: platform_receipt`, `language: en`,
      `currency: EUR`, a basket in `line_items` (every amount in the document's own
      currency — nothing on the record is converted), `counterparty` the platform's bare
      mark, `payer` the buyer the page names, `date`, and the three fiscality flags all
      `false`. `vat_letter` is `null` on every line and no tax row is printed: 📄 the page
      declares «This is not a VAT invoice.», and Article 226 of Directive 2006/112/EC is
      the list of particulars that declaration licenses it to omit — the supplier's
      address, both parties' VAT identification numbers, the rate and the amount of tax.

      🔴 THE NEGATIVE MARKER IS A STRING WITH A POSITION — `not_a_tax_invoice_note` in
      `field_bboxes` — which is the other half of RC-08's argument: the Ukrainian slip's
      marker was an ABSENCE, this one is text with a box, and a field shaped "marker text
      plus position" fits exactly one of the two.
    printed_fields:
      note: >
        The box vocabulary of the class — the shared body means one list serves both
        archetypes, the Ukrainian one adding `seller_address`, `seller_tax_code`,
        `seller_vat_number` and `vat_amount` and dropping `not_a_tax_invoice_note`
        (pinned by a field-set test): `title`, `seller_name`, `paid_amount`,
        `currency` (the code beside the paid figure — the corpus prints a currency code
        beside a number on no other class, one currency having nothing to distinguish),
        `receipt_number`, `date`, `card_masked`, `buyer_name`, `buyer_country`,
        `item_<i>_name` / `item_<i>_qty` / `item_<i>_sum` (no per-line price: the page
        prints quantity and line total only), `subtotal`, `total`,
        `not_a_tax_invoice_note`. `paid_amount` and `total` are one figure printed twice,
        as `amount` and `amount_due` are on the receipt classes.
    undecided: >
      For the reason the slip's role is: the consumer's `other` absorbs it mechanically
      and routes the claim to `in_review`, while this class — unlike anything in `other`
      today — establishes both facts and can carry a fully derivable verdict. Whether the
      consumer classifies it specifically or reviews it manually is a decision about the
      consumer's class vocabulary, and no source has taken it. Left open, exactly as for
      `non_fiscal_receipt`; the four target classes and their denominator are unchanged.

# The consumer's classification metric, stated here because a consumer that computes a
# different metric than the one being reported has no way to discover the difference from
# the field lists alone.
classifier_metric:
  status: forward_contract
  target_classes: [fiscal_receipt, payment_confirmation, bank_statement, invoice]
  target: macro-F1 >= 0.90 over those four classes
  other_class: >
    `other` IS REPORTED SEPARATELY AS A PER-CLASS F1 AND DOES NOT ENTER THE TARGET
    MACRO-F1. It is a catch-all with blurred edges, so failing the threshold through it
    would say nothing about the system. A consumer that folds `other` into the macro average
    computes a different number than the one being reported.
  missing_from_doctype: >
    `DocType` in schemas.py has NO `contract` member and NO `other` member, while the
    consumer's required-field table names both — `contract` with its own row (subject,
    parties, validity period, amount; exploratory extraction, no threshold) and `other` as
    the catch-all. The generator therefore cannot label a document as either. See RC-14.

# The consumer's per-field extraction thresholds, for the same reason: a threshold applied
# to the wrong slice is not a smaller number, it is a different measurement.
extraction_thresholds:
  status: forward_contract
  scope: printed documents of the four target classes; handwritten reported separately
  per_field:
    amount: F1 >= 0.85
    date: F1 >= 0.85
    seller_name: F1 >= 0.75
  contract_extraction: exploratory, no target threshold — `contract` is not a target class
  line_item_extraction: >
    Reported without a target threshold, as three separate numbers: extraction F1, the
    accuracy of the covered / not-covered call per line, and the error on the final
    reimbursable amount.
  language_slice: >
    TARGET THRESHOLDS ARE SET ONLY ON THE UKRAINIAN-LANGUAGE PART OF THE SET. Every other
    language is reported separately as an exploratory slice. A consumer that averages over
    all languages is not measuring against these thresholds. See `normalization.open_enum`
    for why the set is wider than the plan.


# =============================================================================
# 2. Normalization rules
# =============================================================================
#
# The rules a scorecard applies to BOTH sides before comparing. Named here and referenced by
# `normalize:` on each field, so a rule is written once and no field acquires a variant.
#
# `decided_here` marks a rule that is this file's own decision rather than something
# determined by the generator or by a requirement. A consumer may disagree with one, but
# then it has to say so too.
#
# 🔴 THERE IS ONE INDEX, AND IT POINTS FORWARD: `normalize:` on a field names its rule. THE
# REVERSE INDEX WAS DELETED IN VERSION 21. Every rule below carried an `applies_to:` listing the
# fields that name it — a hand-maintained copy of information the forward index already holds —
# and it had diverged for 8 of the 15 rules over 11 fields, INCLUDING IN THE VERY VERSION THAT
# ADDED SOME OF THEM: version 10 rewrote `identifier.applies_to` for two of its six new fields
# and left `money`, `party_name` and `text_name` untouched for four others. A duplicate index
# that diverges while under active attention is not stale, it is the wrong shape, and "update it
# more carefully" repairs nothing.
#
# A consumer wanting rule → fields computes it, which is three lines over the field lists:
#
#     from collections import defaultdict
#     rule_to_fields = defaultdict(list)
#     for block in ("document_label", "line_item", "claim_label", "persona_record"):
#         for field in contract[block]["fields"]:
#             if "normalize" in field:
#                 rule_to_fields[field["normalize"]].append((block, field["name"]))
#
# What the deleted index was actually good for is now held by two tests in
# tests/test_contract_indexes.py, which cannot go stale because they read the file itself: every
# field's `normalize` names a real rule here, and every rule here is named by at least one field.
# The first is what a consumer's `normalization[field["normalize"]]` needs; the second catches an
# orphan rule, which is the only thing a missing entry in the old index could ever have revealed.

normalization:

  identity:
    status: emitted
    rule: exact byte-for-byte comparison, no folding
    why: >
      Not extractable content. Nothing prints them and no extractor produces them; they
      exist so a label can be joined to an image and a claim to its documents.

  closed_enum:
    status: emitted
    form: lower_snake_case ASCII
    rule: exact match against the closed vocabulary declared in this file
    why: a value outside the vocabulary is an error, not a near miss to be scored partially

  policy_vocabulary:
    status: emitted
    form: lower_snake_case ASCII
    rule: exact match against the vocabulary policy.yaml declares
    why: >
      Open in the same sense policy.yaml is: replacing that file retargets the generator at
      a different benefit plan and the vocabulary changes with it. Not copied here for that
      reason.

  open_enum:
    status: divergent
    label_side: >
      Always a concrete code. The generator builds the document, so it knows the language
      and the currency exactly and never needs a fallback. Today: `uk` and `en`, `UAH` and
      `EUR` — the second pair since version 31, on `platform_receipt` alone. Both
      fields are plain `str` in schemas.py, not enums, so the type already permits any code.
    extraction_side: >
      THE ENUM IS OPEN. It carries an `other` value with a free-text qualifier, and amount
      normalization accepts an ARBITRARY currency code.
    why: >
      The consumer's concept note records that the real flow is wider than the plan. Planned
      languages were uk/pl/de/es/en; also observed are Portuguese, Bulgarian, Slovak,
      Croatian, Montenegrin, Italian and Russian. Planned currencies were UAH/PLN/EUR/USD;
      also observed are BGN, GEL, BRL, GBP and ARS. Closing either enum would make a correct
      extraction unrepresentable.
    form: >
      `language` is ISO 639-1 where one exists. It does not always exist — Montenegrin has
      no two-letter code — which is itself an argument for the free-text qualifier rather
      than a longer closed list. `currency` is ISO 4217, three uppercase letters.
    rule: >
      Compare case-sensitively after trimming; `currency` uppercase, `language` lowercase.
      An extraction of `other` never matches a concrete label code — score it as a miss and
      read the qualifier only when investigating one.
    metric_consequence: see `extraction_thresholds.language_slice`; the slice is not the whole set

  iso_date:
    status: emitted
    label_form: "YYYY-MM-DD"
    printed_form: >
      Per jurisdiction, from `date_format` in fiscal-rules.yaml: DD.MM.YYYY in UA, PL and
      DE; DD/MM/YYYY in ES; YYYY-MM-DD in the EU block. An extractor reads the printed form,
      the label carries the ISO one.
    rule: parse both sides to a calendar date and compare dates, never strings
    timezone: >
      None, and no time component. The label is a naive calendar date. A ПРРО receipt does
      print a time beside the date, but no ground-truth field carries it, so a time cannot
      be scored.
    why: DD.MM versus MM/DD is the most common way for a correct extraction to score zero.

  money:
    status: emitted
    label_form: >
      A JSON number. Amounts are exact `Decimal` inside the generator and are serialized
      through `float()`, so TRAILING ZEROS ARE LOST: 2607.80 is written 2607.8 and 1139.10
      is written 1139.1. Never a fixed-width string.
    precision: two decimal places (`KOPIYKA` in content_builder.py)
    rule: >
      Round both sides half-up to two decimal places and compare numerically. Never compare
      serialized text, never compare floats for exact equality.
    printed_form: >
      Grouped by the jurisdiction's `thousands_separator` — a NO-BREAK SPACE (U+00A0) in UA
      and PL, a full stop in DE and ES — with the jurisdiction's decimal separator. In UA
      the separator is drawn PER DOCUMENT from ["." , ","], because real ПРРО vendors print
      both, so a parser must accept either within one jurisdiction. No currency symbol is
      printed beside an amount.
    currency: >
      Never part of the amount; the `currency` field carries the code, and per `open_enum`
      that code may be one the generator has never emitted.
    decided_here: >
      half-up rounding — and since version 30 the generator's oracle does round once
      itself: a foreign-currency amount is converted and quantized at the single point
      config/fx-rates.yaml declares (`conversion`: sum-then-convert-then-quantize, step
      0.01, half-up), which is the same convention this rule names. The declaration lives
      in that file rather than here because it belongs to the constant both sides load —
      see the `fx_rates` claim field.

  quantity:
    status: emitted
    label_form: a JSON number, serialized as money is
    printed_form: "formatted with %g — an integral quantity prints as `1`, not `1.0`"
    rule: compare numerically
    observed: >
      Every quantity produced so far is integral; the draw is from (1, 1, 1, 2). Fractional
      quantities are not generated and this file promises no precision for them.

  text_name:
    status: emitted
    rule: >
      Unicode NFC, trim, collapse internal whitespace runs to one space, then compare
      exactly and CASE-SENSITIVELY.
    why: >
      The name is printed verbatim from its template, so the only differences a correct
      extraction can introduce are whitespace and composition. Folding case would hide a
      real transcription error.

  party_name:
    status: emitted
    rule: >
      Unicode NFC, trim, collapse internal whitespace, strip the legal-form prefix and any
      enclosing quotation marks, then compare case-insensitively (Unicode casefold).
    why: >
      THE LABEL AND THE PRINTED FORM ARE NOT THE SAME STRING. `counterparty` carries the
      bare trading name; the document prints the name with its legal form inside guillemets.
      An invented example of the pair:
        printed on the document:   ТОВ «Вітамін Плюс»
        counterparty in the label: Вітамін Плюс
      `_LEGAL_FORM_PREFIX` in content_builder.py SUPPORTS three Ukrainian forms — ТОВ, ФОП,
      ПрАТ. ALL THREE ARE PRODUCED, and ФОП is the majority — most counterparties are sole
      traders, whose printed form is `ФОП Прізвище І. Б.`, no guillemets, because the name is a
      person's. How a particular run divides among them is a count, not a rule here. ПрАТ became
      producible the day the invoice carried every category (version 12): vendors.json's ПрАТ
      entries are all insurers, `medical_insurance` had no archetype before that, and the sentence
      here — "ПрАТ is not produced: none of them sells the one category the registered archetypes
      cover" — outlived its registry by twenty-two versions. The reference run (seed 42) prints
      «ПрАТ «ІНГО»» on a confirmation's payee block, read there for version 34.

      (This paragraph said "only ТОВ has ever been PRODUCED" through version 7, which was false —
      ФОП receipts were the larger half of every run. It was corrected in version 8 on a measured
      count. The comparison rule below is unaffected either way: it strips the legal form
      whichever form that is.) Non-Ukrainian forms in vendors.json
      (SA, SL, SP_ZOO, GMBH, EK) have no prefix mapping and would render as the raw key.
    decided_here: >
      Which side is authoritative. This file makes the bare name authoritative and requires
      the comparison to strip the legal form, because the legal form is a property of the
      seller's registration rather than of the merchant identity a claim is about. Scoring
      the legal form needs a separate field, and none exists.
    see: divergence_counterparty_name

  vat_letter:
    status: emitted
    rule: compare code points exactly, after NFC. Do not fold case, do not transliterate.
    why: >
      The Ukrainian VAT letters are Cyrillic, and two of the four are homoglyphs of Latin
      letters — А is U+0410, not U+0041; В is U+0412, not U+0042. (Б and Г have no Latin
      twin.) The Polish PTU letters A–E and the German A–B genuinely are Latin. A pipeline
      that normalizes Cyrillic to Latin turns a correct read of А into a mismatch; one that
      does the reverse turns a wrong read into a match. Hence code points.
    nullability: >
      `null` in TWO legitimate cases, and neither is an error to be repaired by a consumer.

      FIRST, where the jurisdiction prints no per-line letter at all —
      `line_item_letter_position: none`, the ES and EU case.

      SECOND, and new in version 7: WHERE THE SELLER IS NOT REGISTERED FOR ПДВ. Such a receipt
      carries no VAT block whatever — no letter after the line amount, no `ПДВ …%` row under
      the totals, and no "Без ПДВ" in their place. `null` therefore means the ABSENCE OF THE
      WHOLE BLOCK and never an empty letter beside a present zero-rate row.
    invariant_lifted_in_version_7: >
      THIS FILE PREVIOUSLY FORBADE THE CORRECT BEHAVIOUR. It stated that a null letter on a UA
      receipt was a builder bug and that content_builder raised on one — which was true of the
      code and wrong about Ukrainian receipts, and it made every sole trader in the dataset a
      simplified-system seller printing a rate group it cannot have assigned. The raise has
      become two narrower guards, both still builder bugs: a null letter on a REGISTERED
      seller's receipt, and a letter present on a non-payer's. Recorded here rather than
      silently amended because a consumer that built a validation rule from the old sentence
      will now reject correct documents.
    why_observation_decided_it: >
      The sources conflict, and the conflict is recorded in full at the head of
      config/generation.yaml: the Положення requires the letter with no reservation for
      non-payers, the tax service's own clarification permits non-payers to leave the fields of
      that tax unfilled, and the one open photograph of a real sole trader's receipt has no VAT
      block at all. Observation decides, because the dataset's job is to look like what a
      verifier actually receives.

  identifier:
    status: forward_contract
    note: >
      WHAT KIND OF VALUE THIS RULE IS FOR, which is not the same question as which fields name it
      — that is `normalize:` on each field, and this paragraph deliberately lists no field names.
      The class is the registration and transaction identifiers a document prints: tax code, VAT
      number, receipt number, RRN, authorization code, terminal id, and the bank's own document
      code.

      MOST OF THE CLASS STILL CARRIES NO LABELLED VALUE. The receipt's own identifiers appear in
      `field_bboxes` as geometry only, which is why the rule's status is a forward contract while
      some fields already name it. The rule was written before anything carried a value and is
      unchanged by every arrival since — which is the useful part, since a comparison rule agreed
      in advance is one nobody had to fit to a field.

      (This paragraph counted the fields carrying a value — "TWO OF THEM" — until version 21, and
      the count was wrong from the version after it was written: a third arrived with the bank
      statement and nothing brought the sentence with it. It counts nothing now, for the same
      reason the reverse index is gone.)
    rule: >
      Strip everything outside [0-9A-Za-z], then compare case-insensitively. Separators, spacing
      and the prefix printed beside an identifier (ІД and ПН on a Ukrainian receipt, which may
      both be present — see `document_types.fiscal_receipt` — and the leading country letters of
      a VAT number) are formatting, not identity.

      THE PREFIX IS NOT PART OF THE VALUE BUT IT IS PART OF THE FIELD'S IDENTITY: «ІД 1234567890»
      and «ПН 1234567890» on one sole trader's receipt are the same digits under two requisites,
      so normalizing them into one string and comparing would make two distinct fields
      indistinguishable.
    decided_here: >
      All of it. The rule predates every field that names it and was not adjusted for any of them;
      no source states a comparison rule for a printed identifier.

  fraction:
    status: emitted
    label_form: >
      A JSON number in [0, 1], quantized to SIX decimal places before serialization
      (`ClaimEvaluation.fraction_as_label`). Observed: 1.0, 0.600109, 0.500048.
    rule: compare with an absolute tolerance of 1e-6

  bbox:
    status: emitted
    label_form: "[x, y, width, height] in image pixels — the COCO convention"
    frame_of_reference: >
      The SHIPPED image, after degradation. Geometric transforms carry the boxes with them,
      so a box aligns with the artifact on disk and not with the clean intermediate render,
      which is never written out.

      🔴 AND SINCE VERSION 29 THE SHIPPED IMAGE IS THE FILE, WHICH IS NOT ALWAYS THE DOCUMENT. Where
      `document_label.file_region` is non-null the file holds this document and another, and every
      box of both — fields, content extent, page regions and the two file regions — is in that
      file's single coordinate space, because they were all carried through one call of one
      transform. There is no per-document frame in the label and none is derivable except by
      subtracting `file_region`.
    rule: >
      No matching rule is stated here. IoU thresholds, and whether boxes are scored at all,
      are the consumer's evaluation decision; the boxes come from the browser's layout engine
      rather than from OCR, so there is no annotation noise for a threshold to absorb.

  string_list_unordered:
    status: emitted
    rule: compare as SETS
    element_rule: closed_enum
    element_rule_why: >
      THE ONLY THING THE DELETED `applies_to` HELD THAT NO FIELD HOLDS. `imperfection` and
      `verdict_basis` name THIS rule, so a consumer reading the forward index alone learns the
      array is a set and nothing about what a member is. Each member is a value of a closed
      vocabulary declared in this file, and is compared as `closed_enum` says. Carried as a rule
      name rather than as a sentence, so it is looked up rather than parsed.
    why: >
      The emitted order is stable because it is append order in policy_engine.py, but
      nothing makes that order meaningful and a consumer must not score it.

  prose_not_comparable:
    status: emitted
    rule: >
      DO NOT COMPARE LITERALLY, in whole or line by line. The trace is prose, its wording is
      free to change between generator versions, and an exact-match score over it measures
      nothing.
    intended_use: >
      A reference for judging EXPLANATION quality against a system's own justification —
      which is the shape the consumer's `DecisionTrace` takes.


# =============================================================================
# 2b. Conformance vectors — the comparison rules, as cases rather than as prose
# =============================================================================
#
# 🔴 WHY THEY EXIST. Section 2 above states each comparison rule in words, and two readers
# implement a sentence two ways: "strip the legal form" is unambiguous until a name has no legal
# form, or two, or one that is part of the trading name. A rule stated only in prose is agreed in
# prose and disagreed in code — and the disagreement surfaces as a scorecard reporting a fault in a
# system that is working, which is the exact failure this whole file exists to prevent.
#
# ⚠️ THIS BLOCK CITED "SECTION 8" AND WAS NUMBERED 8b BEFORE IT WAS COMMITTED, and both were wrong:
# section 8 is `artifacts`, while the rules these cases pin down are `normalization`, which is
# section 2. The number and the citations are corrected together with the placement so that all
# three agree — a reader comparing versions should not read the move as having changed which
# section this extends. It always extended this one.
#
# HOW TO READ A VECTOR:
#
#   `input`  — what an EXTRACTOR might return, having read the document.
#   `label`  — what this dataset carries for the same thing.
#   `equal`  — whether the class's rule declares the two the same. A consumer's implementation is
#              conformant when it agrees with every `equal` below.
#   `why`    — which clause of the rule decides it. A vector without a reason is a fact nobody can
#              maintain: when the rule changes, the reason is what says whether the case moved.
#
# ⚠️ THE VECTORS ARE TYPED BY CLASS, not by field. A field's comparison follows from its
# `normalize:` key, so a vector attached to a field would have to be repeated for every other field
# of the same class and would drift between them. Every class marked `status: emitted` in section 2
# carries vectors, and a test holds that correspondence — a class added there without cases here
# fails rather than being silently untested.
#
# 🔴 ONE INPUT IS WRITTEN AS AN ESCAPE SEQUENCE ON PURPOSE — see `text_name` below. A vector for
# Unicode normalization has to carry a string that is NOT normalized, and any editor, any copy
# through a terminal, any well-meant reformatting of this file would quietly normalize it and leave
# a case that tests nothing while still looking like a test. Written as `\u0456\u0308` it survives
# every one of those, and a test asserts that the value really is un-normalized rather than trusting
# that it stayed so.

conformance_vectors:
  status: emitted
  conformance_is: >
    An implementation is conformant with a class when, for every vector of that class, its
    comparison of `input` against `label` returns `equal`. Nothing here is a test of THIS
    repository: the generator never compares two values, it only emits one side. These cases are
    for whoever writes the other side.

  vectors:
    identity:
      - input: "p001_c1_d1"
        label: "p001_c1_d1"
        equal: true
        why: identical bytes
      - input: "P001_C1_D1"
        label: "p001_c1_d1"
        equal: false
        why: >
          NO CASE FOLDING. These are opaque keys; a consumer that folded them could join two
          different documents.
      - input: " p001_c1_d1"
        label: "p001_c1_d1"
        equal: false
        why: no trimming either — an opaque key is compared as bytes

    closed_enum:
      - input: "fiscal_receipt"
        label: "fiscal_receipt"
        equal: true
        why: exact match against the declared vocabulary
      - input: "Fiscal Receipt"
        label: "fiscal_receipt"
        equal: false
        why: >
          A value outside the vocabulary is an ERROR, not a near miss to be scored partially. A
          consumer that mapped display text onto members would be scoring its own mapping.
      - input: "invoice"
        label: "fiscal_receipt"
        equal: false
        why: two members of the vocabulary are never equal

    policy_vocabulary:
      - input: "vitamin_complex"
        label: "vitamin_complex"
        equal: true
        why: exact match against the vocabulary config/policy.yaml declares
      - input: "vitamins"
        label: "vitamin_complex"
        equal: false
        why: >
          A kind not in the vocabulary is not a partial match for one that is. The join this
          vocabulary exists for is exact.

    iso_date:
      - input: "2026-06-15"
        label: "2026-06-15"
        equal: true
        why: same calendar date
      - input: "15.06.2026"
        label: "2026-06-15"
        equal: true
        why: >
          🔴 THE RULE PARSES BOTH SIDES TO A CALENDAR DATE AND COMPARES DATES, NEVER STRINGS. The
          document prints `DD.MM.YYYY` and the label carries ISO; a consumer comparing strings
          scores every correct reading as wrong.
      - input: "06/15/2026"
        label: "2026-06-15"
        equal: true
        why: >
          Also the same date. ⚠️ DD/MM versus MM/DD is the commonest way for a correct extraction to
          score zero, which is why parsing is the rule — but a consumer must know which convention
          it parsed with, and a Ukrainian document is `DD.MM.YYYY`.
      - input: "2026-06-15T10:15:00"
        label: "2026-06-15"
        equal: true
        why: the time is not part of the value; both sides reduce to a calendar date
      - input: "2026-05-15"
        label: "2026-06-15"
        equal: false
        why: a different date, and no tolerance — ±1 day would forgive the period rule

    money:
      - input: "1200.00"
        label: 1200.00
        equal: true
        why: two decimal places, exact
      - input: "1 200,00"
        label: 1200.00
        equal: true
        why: >
          The printed form carries a space as the thousands separator and a comma or a dot as the
          decimal one — both occur in this corpus. A consumer parses the printed form to a number.
      - input: "1200.004"
        label: 1200.00
        equal: true
        why: half-up rounding to two places, then exact — the kopiyka is the smallest unit
      - input: "1200.01"
        label: 1200.00
        equal: false
        why: >
          🔴 NO TOLERANCE. A kopiyka IS a difference; `0.01` would forgive a real error. This is the
          case a consumer copying a tolerance from elsewhere gets wrong.
      - input: "-1200.00"
        label: 1200.00
        equal: false
        why: >
          The sign is never part of an amount in this dataset — direction is its own field, exactly
          so that this comparison stays one rule for every class.

    quantity:
      - input: "1"
        label: 1
        equal: true
        why: compared numerically
      - input: "1.0"
        label: 1
        equal: true
        why: >
          The document prints an integral quantity as `1`, not `1.0`, but a consumer that returns
          either is right — the comparison is numeric, not textual.
      - input: "2"
        label: 1
        equal: false
        why: a different quantity

    text_name:
      - input: "Вітаміни D3 2000 МО"
        label: "Вітаміни D3 2000 МО"
        equal: true
        why: identical after NFC and trimming
      - input: "  Вітаміни D3 2000 МО  "
        label: "Вітаміни D3 2000 МО"
        equal: true
        why: >
          Leading and trailing whitespace is trimmed. OCR routinely returns it, and a rule that did
          not trim would score every such reading as wrong.
      - input: "Вітаміни  D3 2000 МО"
        label: "Вітаміни D3 2000 МО"
        equal: true
        why: internal runs of whitespace collapse to one space
      - input: "Вітаміни D3"
        label: "Вітаміни D3 2000 МО"
        equal: false
        why: a truncated reading is not a match — there is no fuzzy matching in any class here
      - input: "\u0456\u0308\u0436\u0430\u043a"
        label: "їжак"
        equal: true
        why: >
          🔴 THE UNICODE CASE, AND THE REASON THE INPUT IS AN ESCAPE SEQUENCE. `\u0456\u0308` is
          `і` followed by a COMBINING DIAERESIS — the decomposed (NFD) spelling of `ї`, which the
          label carries precomposed. The two are the same word and every rule here begins with NFC,
          so a conformant implementation returns `true`.

          WRITTEN AS AN ESCAPE BECAUSE ANY EDITOR WOULD NORMALIZE IT AWAY. A vector for
          normalization whose input has been normalized is a case that passes without testing
          anything, and it would still look like a test. `tests/test_conformance_vectors.py` asserts
          that this value is genuinely NOT in NFC — the escape is checked, not trusted.

    party_name:
      - input: "ТОВ «Вітамін Плюс»"
        label: "Вітамін Плюс"
        equal: true
        why: >
          THE CENTRAL CASE OF THIS CLASS. The document prints the name with its legal form inside
          guillemets; the label carries the bare trading name, which this file makes authoritative.
          The rule strips the legal-form prefix and the enclosing quotation marks.
      - input: "ФОП Ковальчук О. С."
        label: "Ковальчук О. С."
        equal: true
        why: >
          A sole trader's form is stripped too, and there are no guillemets to strip — the name is a
          person's. A rule written to expect quotation marks fails here, which is why the two are
          separate clauses.
      - input: "вітамін плюс"
        label: "Вітамін Плюс"
        equal: true
        why: the comparison casefolds, after stripping
      - input: "Вітамін  Плюс"
        label: "Вітамін Плюс"
        equal: true
        why: internal whitespace is collapsed
      - input: "Вітамін"
        label: "Вітамін Плюс"
        equal: false
        why: >
          🔴 NO FUZZY MATCHING. A prefix is not a match. The threshold for this field is already
          lowered because the field is hard; forgiving near misses as well would be counting one
          difficulty twice, and the reasoning is in `normalization.party_name`.

    vat_letter:
      - input: "А"
        label: "А"
        equal: true
        why: identical code points after NFC — both are CYRILLIC CAPITAL LETTER A
      - input: "A"
        label: "А"
        equal: false
        why: >
          🔴 THE CASE MOST LIKELY TO BE GOT WRONG AND HARDEST TO SEE. The input is LATIN CAPITAL
          A (U+0041); the label is CYRILLIC А (U+0410). They render identically in most fonts and
          are different characters. The rule forbids transliteration for exactly this reason.
      - input: "а"
        label: "А"
        equal: false
        why: no case folding — the letters are a closed set of capitals

    fraction:
      - input: 1.0
        label: 1.0
        equal: true
        why: within the absolute tolerance of 1e-6
      - input: 0.6666667
        label: 0.6666666666666666
        equal: true
        why: >
          THE ONE CLASS WITH A TOLERANCE, and it is not a money tolerance in disguise: a covered
          fraction is a ratio of two amounts and its decimal expansion does not terminate. The
          tolerance absorbs the representation, not a difference in the underlying amounts.
      - input: 0.75
        label: 1.0
        equal: false
        why: a different fraction
      - input: 0.0
        label: null
        equal: false
        why: >
          🔴 `null` IS NOT ZERO. It means there was no line item to compute a fraction from, which is
          a different statement from "nothing was covered". A consumer that coerced one to the other
          would report a covered claim as uncovered.

    bbox:
      - input: [31, 659, 1062, 26]
        label: [31, 659, 1062, 26]
        equal: true
        why: identical whole pixels, `[x, y, width, height]` — the COCO convention
      - input: [31, 659, 1093, 685]
        label: [31, 659, 1062, 26]
        equal: false
        why: >
          ⚠️ THE CONVENTION IS THE TRAP. These are the same rectangle written as `[x1, y1, x2, y2]`.
          A consumer reading the label as corners rather than as origin-plus-size gets a box that
          overlaps the right answer and is wrong everywhere it matters.

    string_list_unordered:
      - input: ["mixed_items", "limit_exhausted"]
        label: ["limit_exhausted", "mixed_items"]
        equal: true
        why: compared as SETS — the order carries no meaning
      - input: ["limit_exhausted"]
        label: ["limit_exhausted", "mixed_items"]
        equal: false
        why: a missing member is a missing cause, not a partial match

    prose_not_comparable:
      - input: "category=sport ok"
        label: "category=sport ok"
        equal: null
        why: >
          🔴 `equal: null` MEANS NO COMPARISON IS DEFINED, and that is the whole content of this
          class. `policy_trace` is prose written for a human reading a disagreement; scoring it
          would measure a wording nobody promised to keep. A consumer that computed a similarity
          over it would be reporting a number about this generator's phrasing.


# =============================================================================
# 3. The document label
# =============================================================================
#
# One record per rendered document, written to `labels/<doc_id>.json` and repeated in the
# `documents` array of `ground_truth.json`. Model: `DocGroundTruth`.
#
# ONE MODEL FOR EVERY DOCUMENT TYPE. Nothing in schemas.py varies the field set by
# `doc_type`, so the list below is the field list for all seven types. The consumer's
# required-field table is per type; this is not, and that gap is what
# `document_types.*.prd_required_fields` records above. A per-type label shape would make the
# label depend on the answer to the classification question, which is one of the things being
# evaluated — so the divergence is recorded rather than resolved.
#
# EVERY KEY IS PRESENT IN EVERY RECORD. `required: false` means the VALUE may be null or an
# empty container, never that the key is missing.

document_label:
  status: emitted
  file: "labels/<doc_id>.json"

  fields:

    - name: doc_id
      type: string
      required: true
      normalize: identity
      note: >
        Unique within a dataset, formed today as `<claim_id>_d<n>`. Treat it as opaque:
        joining on a parsed substring depends on a format that is the assembler's business.

    - name: source_file
      type: string
      required: true
      normalize: identity
      note: >
        The image file name, relative to the run's `images/` directory — AND IT IS NOT UNIQUE PER
        DOCUMENT SINCE VERSION 29. Where a claim's two documents are carried in one file, both
        labels name that one file and `file_region` below says which part of it each occupies.
        It is the only join from a label to an image: `images/<doc_id>.png` holds for a file
        holding one document and a shared file is `images/<claim_id>.png`, so a path rebuilt from
        `doc_id` names nothing on such a claim.
      divergence:
        name: divergence_one_file_one_document
        status: divergent
        generator: >
          A FILE MAY HOLD MORE THAN ONE DOCUMENT, AND A DOCUMENT MAY RUN TO MORE THAN ONE PAGE.
          `source_file` and `doc_id` are 1:1 on the ordinary file and n:1 on a shared one;
          `file_region` describes this document's region of its file, `page_regions` the sheets
          within it, and both are ground truth by construction.

          ⚠️ WHAT STILL DIVERGES IS THE SHAPE, NOT THE FACT. There is no file-level record here:
          `capture` — drawn per FILE where a file holds two documents — `source_file` and the
          content-completeness fields are all carried on the DOCUMENT, so two labels of one file
          repeat one file's facts. See RC-11 for the same disagreement on `capture` alone.
        consumer: >
          The consuming system makes file-to-document segmentation a pipeline step in its
          own right, on the ground that one file may hold up to twelve separate receipts,
          and it names THIS GENERATOR as the source of ground truth for the boundaries. It
          separates `ClaimFile` (the binary, with a `medium` and a content hash) from
          `ClaimDocument` (a logical document, with a page or region reference into the
          file).
        withdrawn_in_version_29: >
          TWO SENTENCES ARE PAST-TENSED HERE RATHER THAN DELETED, because they are what a consumer
          diffing an earlier copy comes looking for. The generator side read: "One image is one
          document; `source_file` and `doc_id` are 1:1, and no label describes a region of a file."
          The note beside it read: "nothing in the generator models a multi-document file. See
          RC-12."

          BOTH WERE TRUE UNTIL VERSION 29 AND BOTH ARE NOW FALSE — three label fields describe
          exactly the regions they denied, and RC-12 is closed. A consumer that pinned "one image,
          one document" as an invariant of this dataset is the one this note is for: nothing warns
          it at read time, since a record with `file_region: null` looks exactly as it always did.
        note: >
          ⛔ AND THE GAP THAT REMAINS IS A DECIDED BOUNDARY RATHER THAN AN OMISSION: the documents
          of one CLAIM share a file, documents of different claims never do, and the consumer's
          "up to twelve separate receipts" is a shape this dataset will not contain. RC-12 states
          the decision, its reason, and the guard the consumer applies instead.

    - name: doc_type
      type: enum
      required: true
      normalize: closed_enum
      vocabulary: see `document_types`
      note: the classification target; see `classifier_metric` for how it is scored

    - name: language
      type: string
      required: true
      normalize: open_enum
      observed: ["uk", "en"]
      observed_note: >
        `en` since version 31, on `platform_receipt` alone (`eu_platform_receipt`); a run's split
        between the two archetypes is `archetype_shares` in config/generation.yaml. Verified
        against `generate-dataset --seed 9105 --personas 12 --claims-per-persona 3 --split 0.5`,
        which carries one English document. The list read `["uk"]` until version 34, three
        versions after it stopped being true.

    - name: currency
      type: string
      required: true
      normalize: open_enum
      observed: ["UAH", "EUR"]
      note: >
        The document's amounts stay in ITS OWN currency — nothing on the record is
        converted, which is why the original amount, currency and date are all kept per
        document. Where the currency is not policy.yaml's `reporting_currency`, the policy
        engine converts FOR THE VERDICT ARITHMETIC ONLY, at the rate config/fx-rates.yaml
        states for the document's date, and the claim record carries that rate in
        `fx_rates` — see the claim field, which is where the conversion contract lives. An
        earlier version of this note said the engine refuses such a document outright;
        that fell with the decision to convert, and the refusal that remains is narrower:
        a currency the vendored table has no rate for.

    - name: amount
      type: number
      required: true
      normalize: money
      meaning: >
        ONE QUESTION, ANSWERED BY EACH CLASS'S OWN REQUISITE — *the amount this document is about*.
        It was written here as "the total payable, gross, VAT inclusive" until version 11, which is
        a BASKET's total and true of only one of the three classes that exist.

          fiscal_receipt        the basket total, gross, VAT inclusive.
          payment_confirmation  📄 the TRANSFER — the amount of the operation, which excludes the
                                fee and is not the largest number printed. See `total_charged`.
          bank_statement        the amount of the ONE ROW the label is about, and never a figure
                                from the document's summary block. See
                                `document_types.bank_statement.the_label_is_one_transaction`.
      invariant: >
        WHERE THE DOCUMENT LISTS ITEMS, this equals Σ(qty × price) over `line_items`, exactly. Fraud
        and trap archetypes will break that deliberately, and the break is then named in the claim's
        `imperfection`.

        Two classes list nothing, and on them the invariant is vacuous rather than violated: a
        payment confirmation and a bank statement carry an EMPTY `line_items`, which is the statement
        "this document lists nothing" and is why neither establishes what was bought. The sentence
        used to be unqualified and was already false of a confirmation when version 10 added one.
      printed_twice: >
        A ПРРО receipt prints this value as the total due and again as the amount paid
        (`total` and `paid_amount` among the printed fields). One value, two boxes.
      no_subtotal:
        status: undecided
        note: >
          THERE IS NO NET SUBTOTAL FIELD, and on a VAT-inclusive Ukrainian receipt no net
          subtotal is printed either — the tax block states the VAT contained within the
          gross. The consumer's arithmetic guard checks `subtotal + Σtax ≈ total` and its
          line-item guard checks `abs(Σline_items − subtotal)`, which require `subtotal` to
          be net in the first and gross in the second. The two cannot both hold in a
          VAT-inclusive jurisdiction, and this file cannot reconcile them. Raised as a
          question for the requirement, not as a generator change.

    - name: instalment_amount
      type: number or null
      required: false
      normalize: money
      status: emitted
      meaning: >
        WHAT ONE PART OF THIS DOCUMENT'S AMOUNT COMES TO, where the document states that its
        obligation is settled in equal parts — «черговий платіж» on an invoice printing an
        instalment term. `null` on every other document, which is every class but `invoice` and
        most invoices. `amount` stays the WHOLE obligation.
      not_a_payment_status: >
        🔴 IT RECORDS NOTHING ABOUT MONEY HAVING MOVED. It is a term of an offer — how the seller
        proposes to be paid — fixed when the document is drawn up. Reading it as "this much has
        been paid" inverts it: nothing on the page says any part has been settled, and the payment
        document beside the claim is what says money moved, exactly as on every other claim.
      a_verdict_rests_on_it: >
        🔴 THE ONLY LABEL FIELD OF THIS DATASET WHOSE PRESENCE DECIDES A VERDICT. A payment equal to
        this value, on a claim whose subject document carries it, is `partially_paid`; the same two
        amounts with this field `null` are `insufficient_evidence` with the cause `amount_mismatch`.
        The arithmetic is identical in both — "the payment is smaller" is true of each — so a
        consumer scoring a payment against `amount` alone will score every partly settled claim as
        a mismatch. `partial_payment` in config/policy.yaml states the rule in the order an
        implementer applies it, and `policy_engine` pins its own reading against that block.
      scoreable: >
        UNLIKE `amount_due` BELOW, THIS FIELD DISCRIMINATES AND ITS ACCURACY IS A REAL MEASUREMENT.
        It differs from `amount` by construction wherever it is populated — every declared schedule
        divides an obligation into at least two parts — so a system echoing the total scores zero on
        it rather than perfectly. It is `null` on most documents, so a per-class figure belongs on
        the invoice slice; see KL-15 for what a run contains.

    - name: amount_due
      type: number or null
      required: false
      normalize: money
      status: emitted
      meaning: >
        ДО СПЛАТИ — what the customer actually pays: the basket total less any discount, plus
        cash rounding. `null` on a document type whose form has no such line; populated on
        every `fiscal_receipt`.
      do_not_report_its_accuracy: >
        🔴 THE FIELD DISCRIMINATES NOTHING IN THIS VERSION AND ITS ACCURACY IS NOT TO BE
        REPORTED AS A METRIC. Discount and rounding are both zero, so `amount_due` equals
        `amount` on every document produced — which means an extractor satisfies it perfectly
        by echoing the total, having read nothing, and any F1 or exact-match figure quoted for
        it measures the total again under a second name. Score it once the dataset contains
        documents where the two differ, and not before. Same refusal as the one that keeps a
        bank statement's four summary totals printed but unlabelled: a number nobody can get
        wrong is not a measurement.
      why_the_divergence_is_deferred: >
        NOT because the printing is hard, and not because the oracle is delicate — BECAUSE THE
        POLICY IS SILENT. Coverage is decided per line item, the line items sum to `СУМА`, and a
        discount applies to the BASKET; reaching a genuine `ДО СПЛАТИ` therefore requires a rule
        for DISTRIBUTING that discount between covered and non-covered lines, and policy.yaml
        contains no such rule. Choosing one here would wire an interpretation the policy does
        not have into the ground truth, which is the one thing a label-first generator must
        never do. See RC-16 for what closing it needs.
      why_the_line_is_printed_at_all: >
        Because the form has both: `СУМА` is line 20 and `ДО СПЛАТИ` line 24, they differ by
        `ЗНИЖКА` and `ЗАОКРУГЛЕННЯ`, and the observed receipt prints all four. The generator
        printed ONE merged "СУМА ДО СПЛАТИ" line until version 7, which is neither of the two
        requisites — a defect on every image, and one no label could have revealed.

    - name: date
      type: string
      required: true
      normalize: iso_date
      meaning: >
        The calendar date of the TRANSACTION, which on two of the three classes is not the date the
        document itself was produced.

          fiscal_receipt        the date printed at the foot; the sale and the document coincide.
          payment_confirmation  the payment date, under one of three accepted captions. See
                                `document_types.payment_confirmation.payment_date`.
          bank_statement        the operation date of the LABELLED ROW. 👁 The statement is produced
                                after its period closes — the observed one the following morning —
                                so a record dated by the document would be dated days after the
                                money moved, and the period rule reads this value. See
                                `document_types.bank_statement.payment_date`.

    - name: counterparty
      type: string
      required: true
      normalize: party_name
      meaning: >
        The other party to the transaction — the seller on a receipt, and THE PAYEE on a payment
        confirmation or a bank statement. The claimant's own side, where a document names it, is
        `payer` below.
      divergence:
        name: divergence_counterparty_name
        status: resolved
        note: >
          THREE NAMES FOR ONE THING — the failure this file exists to prevent, found live:
            `counterparty` — the field the generator emits in every document label;
            `seller_name`  — the field the consumer's extraction metric names, and the one
                             the F1 >= 0.75 threshold was stated against;
            `seller_name`  — the `data-field` bbox key in templates/ua_fiscal_receipt.jinja, the
                             body every UA fiscal-receipt archetype shares, covering the printed
                             string WITH its legal form.
          The second and third are spelled the same and mean different things: the metric
          field is the merchant identity, the bbox key is the rendered text.
        resolution: >
          RESOLVED IN FAVOUR OF `counterparty`, and the requirement is amended rather than
          this generator. `seller_name` is semantically wrong for half of the four target
          classes: on a `payment_confirmation` the party is a payer or a payee, and on a
          `bank_statement` a payee — neither is a seller. `counterparty` is the only one of
          the two words that is true of all four. The F1 >= 0.75 threshold therefore applies
          to `counterparty`, under whatever name the requirement spells it.
        bbox_key_unchanged: >
          The `seller_name` bbox key stays as it is. Printed keys are a separate vocabulary
          from label field names — that is stated once, for every field, and this is an
          instance of it rather than an exception to it.

    # ------------------------------------------------------------------------
    # EIGHT FIELDS THAT ARE `null` ON A FISCAL RECEIPT — six added in version 10 with the second
    # document class, two in version 11 with the third. One label model serves every class, so a
    # field a class does not print is null on its records rather than absent — `required: false`
    # here means the VALUE may be null, never that the key is missing.
    #
    # EACH ONE'S `null_on` IS PART OF THE CONTRACT, not a remark: it is what tells a consumer
    # whether a missing value is information or a failure to read.
    # ------------------------------------------------------------------------

    - name: fee
      type: number or null
      required: false
      normalize: money
      meaning: >
        The bank's charge for executing the payment — комісія. NEVER REIMBURSABLE: it pays for a
        banking service rather than for anything a benefit category covers, so no annual limit
        reaches it and it is not part of a claim's amount.
      cardinality:
        emitted: >
          👁 Non-zero on 3 of 8 real confirmations — about 37% — and generated at that rate. A field
          that were always zero would discriminate nothing, which is the state `amount_due` is in
          and says so; this one is not in that state. (The key read `forward_contract` while the
          class was in no run; it moved with the class at version 34.)
      null_on: every class but `payment_confirmation`

    - name: total_charged
      type: number or null
      required: false
      normalize: money
      meaning: >
        `amount` + `fee`: everything that left the payer's account. 👁 Printed on 1 of 8, where it
        is the LARGEST NUMBER ON THE PAGE — and 📄 it is not the amount of the operation.
      why_it_is_labelled_apart: >
        SO THAT THE DIVERGENCE IS MEASURABLE. An extractor trained to reach for the most salient
        figure returns this and not `amount`, and the difference is exactly the fee. Folding the two
        would hide, in a single number, whether a system resists salience. Derived rather than
        stored inside the generator — see `content_builder.PaymentConfirmation.total_charged` — so
        the three amounts cannot drift apart.
      null_on: every class but `payment_confirmation`

    - name: payer
      type: string or null
      required: false
      normalize: party_name
      meaning: >
        The claimant's own side of the payment, where the class names both parties.
      two_forms_of_emptiness: >
        ⚠️ `null` MEANS THE CLASS NAMES ONE PARTY, and it is not the same as an unidentified payer.
        👁 One observed confirmation prints a HYPHEN as the payer's value, and OCR returns the string
        "-" for it, so the label carries that string. A label that merged the two would make
        accuracy on empty fields unmeasurable, which is the whole reason both forms are produced.
      null_on: >
        `fiscal_receipt`. Populated on a `payment_confirmation`, where it is the payer named on the
        document, and on a `bank_statement`, where it is THE ACCOUNT HOLDER — the claimant, whose
        account the statement is of. On a debit row the holder is the payer of the labelled
        transaction, which is the only direction a claim may rest on.

    - name: payment_purpose
      type: string or null
      required: false
      normalize: text_name
      meaning: >
        Призначення платежу — free text written by the payer. 🔴 It NEVER names what was bought:
        👁 0 of 7 observed confirmation purposes do, naming an invoice, a delivery note, a generic
        category, or the movement of money itself. A consumer must not read a subject out of it; that
        is what `proves_subject: false` for these types means in practice.

        ON A BANK STATEMENT it is the purpose of the LABELLED ROW — 👁 every row carries one — and the
        same finding holds there in a WEAKER form: a generic category of goods was at least sometimes
        named on a statement, so the confirmation's 0 of 7 carries the observation and the statement
        agrees with it.
      null_on: >
        `fiscal_receipt`. Populated on a `payment_confirmation` — where 👁 1 of 8 has no such field at
        all, an internet-acquiring document, so null occurs within that class too — and on every
        `bank_statement`.

    - name: document_code
      type: string or null
      required: false
      normalize: identifier
      meaning: >
        The document's OWN printed number. On a payment confirmation, the bank's number for the
        document — 👁 8 of 8 and 📄 mandatory as "the number of the payment instruction", and 📄
        the key the official check services take. On an invoice, its own printed № — the number by
        which a payment's purpose cites it, and the value the `subject` axis of
        `cross_document_agreement` compares `cites_document_no` against.
      deduplication: >
        THIS is the decisive key for the confirmation class. Not the authorization code, which is
        six digits, unique only within an issuer and a window, and 👁 absent from half the
        documents; and not an RRN, which 👁 is not on this class at all. See RC-06.
      null_on: every class but `payment_confirmation` and `invoice`

    - name: cites_document_no
      type: string or null
      required: false
      normalize: identifier
      meaning: >
        The рахунок the payment's purpose line names by number — the payment document's ONE
        statement about WHICH obligation it settles, structured. Always a substring of
        `payment_purpose`: a structured copy of what the page prints, never an extra fact. It is
        the left-hand side of the `subject` axis of `cross_document_agreement` in
        config/policy.yaml; the right-hand side is the subject document's own `document_code`.
      null_means: >
        ⛔ NO РАХУНОК IS CITED, WHICH IS THREE PAGE FORMS UNDER ONE VALUE: a generic formula
        («Оплата за товар»), a purpose citing a ВН — a delivery note, a class no claim of this
        dataset holds — and no purpose line at all (the internet-acquiring confirmation, the
        app-transaction screen). A consumer that needs the three apart reads `payment_purpose`,
        which still carries the text; what this field promises is only the resolvable case. On
        every one of the three, the `subject` axis does not run — absence is never a
        disagreement.
      null_on: >
        every class but `payment_confirmation` and `bank_statement` — and within them, wherever
        no рахунок is cited, per `null_means`. On a statement it describes the LABELLED row;
        ordinary rows cite documents outside the claim by construction and reach no label.

    - name: auth_code
      type: string or null
      required: false
      normalize: identifier
      meaning: >
        Код авторизації — 👁 six digits on 4 of 4 card operations, and 👁 absent from 4 of 8
        documents, because a transfer by account details has no card operation to authorize.
      null_on: >
        every class but `payment_confirmation`, and within the class wherever the payment was not a
        card operation. Its absence is information, not an extraction failure.

    # ------------------------------------------------------------------------
    # THE TWO FIELDS VERSION 11 ADDED, both of them for the same reason: a bank statement is the
    # first class whose document describes MANY transactions while its label describes one.
    # ------------------------------------------------------------------------

    - name: direction
      type: enum or null
      required: false
      normalize: closed_enum
      vocabulary: [debit, credit]
      meaning: >
        Which way the money moved on the transaction this label is about — дебет or кредит, as an
        account statement prints them.
      why_not_a_sign_on_the_amount: >
        Two reasons, and the first settles it on its own. Money is normalized IDENTICALLY on every
        class of this dataset — two decimal places, half-up, exact comparison — and a signed amount
        would give one class a second convention, so a consumer comparing `-1200.00` against
        `1200.00` would score a correct reading as a miss. And the direction is a fact of the PAGE
        rather than a property of the number: the amount is printed in one of two money columns, and
        which column it is in is what a reader reads the direction off.
      invariant: >
        🔴 ONLY A DEBIT CAN BE PROOF OF PAYMENT. A credit is money arriving — a refund, a reversal, a
        transfer from another account of the holder's — and it evidences no expense whatever its
        amount: for a reimbursement claim the difference is the difference between proof of an expense
        and proof that the money came back.

        ENFORCED, NOT DESCRIBED, in two INDEPENDENT places. `content_builder.BankStatement` refuses
        to be constructed with a credit as its labelled row, testing the row's own direction; and
        `policy_engine.resolve_evidence` REFUSES a claim resting on a credit rather than labelling it,
        because policy.yaml assigns no verdict to such a claim and the oracle does not invent one. The
        two share no code, so a mistake in either is caught by the other.
        `content_builder.proves_payment_by_direction` states the rule as a validator and is what the
        second of them calls. A trap archetype that prints a refund as though it were a
        payment is where the invariant is broken deliberately, and it will have to name the break in
        the claim's `imperfection`.
      do_not_report_its_accuracy: >
        🔴 THE FIELD DISCRIMINATES NOTHING IN THIS VERSION. Every statement's labelled row is a debit,
        so a system answering `debit` unconditionally scores perfectly while having read nothing —
        exactly the state `amount_due` is in, and the same refusal applies. What varies is what the
        PAGE shows: both directions appear among the rows, and reading the labelled row's direction
        means finding that row. Score the field once the corpus contains a labelled credit, which
        needs a trap archetype and a policy decision about what verdict a refund-backed claim gets.
      bbox: >
        NO BOX OF ITS OWN, and that is a property of the field rather than an omission: the direction
        has no printed element — it is WHICH of two columns the amount occupies. The two column
        headers carry boxes without labelled values, `column_debit` and `column_credit`, and a
        consumer combines one of those with the `amount` box.
      null_on: >
        every class whose document describes ONE movement of money — `fiscal_receipt` and
        `payment_confirmation`. Such a document exists because a payment was made, so there is nothing
        for the field to distinguish. `null` is therefore a statement about the class and never a
        missing reading.

    - name: vat_row_form
      type: enum or null
      required: false
      normalize: closed_enum
      vocabulary: [equals, spaced]
      meaning: >
        Which of the two 👁 observed forms the VAT summary row of a fiscal receipt is printed in:
        `equals` for `ПДВ А=20,00%`, `spaced` for `ПДВ А 20%`. The letter and the rate are the
        same fact either way; what differs is the punctuation and whether the rate carries two
        decimals.
      why_it_is_labelled: >
        SO THAT THE VARIATION IS FILTERABLE. A corpus that printed one form would teach it, and a
        system that learned it would fail on the other with nothing in the labels to explain why.
        A consumer stratifying an extraction figure by this field can tell "the model cannot read
        the tax row" from "the model learned one of its two forms".
      the_medium_decides_it_asymmetrically: >
        🔴 PAPER TAKES `equals` AND NOTHING ELSE — 👁 two of the author's own receipts, two
        independent installations, no counterexample. AN ELECTRONIC DOCUMENT DRAWS EITHER, because
        there is 👁 one electronic observation, and a rule cannot rest on one.

        THE ASYMMETRY IS NOT AN OVERSIGHT AND MUST NOT BE TIDIED. "Electronic ⇒ spaced" would match
        the paper rule in shape, read better, and be half unproven — it is exactly the n=1
        over-claim that produced the single unconditional form this replaces. What the asymmetry
        buys is that the combination PAPER + `spaced` is absent from the data BECAUSE IT WAS NEVER
        OBSERVED, rather than because somebody guessed.

        The medium of a capture channel is `schemas.Capture.medium`: `photo` and `scan` are paper,
        `screenshot` is electronic.
      null_on: >
        every class but `fiscal_receipt`, and within that class every receipt whose seller is not
        registered for ПДВ — such a document prints no tax block at all, so there is no row to take
        a form. `null` is therefore the same statement the empty `line_items[].vat_letter` makes.

    - name: reference_text
      type: string
      required: true
      normalize: prose_not_comparable
      meaning: >
        EVERY PRINTED CHARACTER OF THE PAGE, in reading order, taken from the layout engine before
        rasterization. Ground truth by construction rather than by annotation: it is read from the
        same authority that produced the image, in the same pass, and nothing in it was transcribed
        from a picture.
      it_is_not_the_fields: >
        🔴 `field_bboxes` COVERS THE LABELLED FIELDS; THIS COVERS ALL TEXT. Captions, headings, the
        fiscal wording, a footer — none of them is a labelled field and all of them are here. That
        difference is what a per-document measurement of whether a capture survived degradation
        rests on: a document whose every labelled field came through while a crop took the footer
        would report as complete measured on the fields alone, and would then hand a system a
        falsely low character error rate for text it never read.
      how_to_compare_it: >
        NOT AS A LABEL TO BE SCORED FIELD BY FIELD. It is the reference side of a character error
        rate over the whole page, so `prose_not_comparable` is the normalization in the sense that
        no equality rule applies to it: a consumer computes a distance, not a match. Whitespace is
        as the layout engine reported it — line boxes appear as newlines and table cells as tabs —
        so a consumer normalizing whitespace before comparing should say so.
      null_on: nothing; every archetype produces it

    - name: content_bbox
      type: "[number, number, number, number] or null"
      required: false
      normalize: bbox
      meaning: >
        Where the text is, as ONE box — the extent of the rendered characters.
      its_scope_is_text: >
        ⚠️ A QR, A STAMP AND A SIGNATURE ARE INK IT DOES NOT COVER, deliberately: it is the
        geometric counterpart of `reference_text`, which is also text only, and the two describe
        the same thing. A consumer must not read it as "everything printed".
      not_the_page_and_not_the_fields: >
        Not the image: the paper's margins are outside it, which is what makes it usable for
        detecting a crop at all — a box equal to the image would be contained in every capture. Not
        the union of the field boxes either: it is computed from text ranges, so it covers the
        characters rather than the padded elements around them.
      it_travels_with_the_field_boxes: >
        Through the SAME geometric transform, under a reserved key that is removed before the label
        is written. A box moved by a second route would drift from the fields the moment a real
        geometric degradation step arrives — which is exactly when a measurement built on it would
        begin to be quietly wrong. Since version 17 that moment has arrived: `photo` and `scan`
        rotate and warp.
      it_may_lie_outside_the_image: >
        🔴 SINCE VERSION 17, and this is the property `content_complete` is computed from. A
        consumer that wants an index into the image clips it; the clipped form can be derived from
        this one, and this one cannot be derived from the clipped form.
      null_on: nothing today; nullable so a page with no text at all is expressible

    - name: content_lost_edges
      type: array of string
      required: true
      normalize: closed_enum
      vocabulary: [left, top, right, bottom]
      status: emitted
      meaning: >
        WHICH EDGES OF THE IMAGE THE TEXT CROSSES after degradation — empty when the text is wholly
        on the page. Derived from `content_bbox` against the degraded image's own dimensions.
      the_frame_is_the_file: >
        🔴 SINCE VERSION 29, AND IT IS THE FILE A CONSUMER RECEIVES. Where two documents share a
        file the edges are the FILE's, so this says whether this document's text survived the
        capture of that file — a document whose sheet fell outside the photograph loses its content
        exactly as a single-document capture does. `content_complete` inherits the frame, being
        computed from this. It follows that one file's two documents can report differently: the
        one at the bottom of a stapled pair is the one a crop reaches first.
      its_scope_is_text: >
        ⚠️ THE SCOPE OF `content_bbox`, AND NO WIDER. A capture that cut off a QR code, a stamp or a
        signature while keeping every character reports NO lost edge, and truthfully. A completeness
        measure cannot claim more than the extent it is built on.
      why_named_edges_and_not_a_count: >
        A consumer filtering a corpus wants to know WHAT left: a document missing its bottom is a
        different training example from one missing its left margin, and reconstructing that from a
        box and an image size is work every consumer would otherwise repeat.
      observed: >
        Non-empty only on `photo`. `screenshot` applies no geometry at all, and `scan` applies a
        rotation of a degree or so onto a margin wide enough to absorb it — a flatbed lays the whole
        sheet on the platen and is not expected to crop.
      null_on: never; the empty array is the statement that nothing was lost

    - name: content_complete
      type: boolean or null
      required: true
      normalize: closed_enum
      status: emitted
      meaning: >
        Did all the printed TEXT survive the capture — the per-document answer, and the FILTER a
        consumer applies before computing a character error rate.
      derived_not_stored: >
        Computed from `content_lost_edges` inside the model rather than written beside it. Two
        fields stating one fact is how they come apart, and this pair would come apart in the
        direction that matters: a stale `true` beside a populated edge list sends a consumer to
        measure a distance against text that is not in the image.
      null_is_not_false: >
        🔴 `null` MEANS UNMEASURED. A document with no `content_bbox` has no extent to compare
        against a frame, so nothing is known about whether its content survived. Reporting that as
        `false` puts a fabricated measurement into a metric and reporting it as `true` puts an
        unearned one; both answer a question nobody asked.
      what_it_is_for: >
        🔴 THE CHARACTER ERROR RATE IS DEFINED ONLY WHERE THIS IS `true`, AND THE SIZE OF THAT
        SUBSET PER CHANNEL IS PART OF THE RESULT. See `known_limitations` KL-12; the counts are in
        `run_profiles`.
      null_on: nothing today; every archetype produces a content extent

    - name: split
      type: enum or null
      required: true
      normalize: closed_enum
      vocabulary: [train, validation]
      status: emitted
      meaning: >
        Which side of the train / validation partition this document is on. NOT AN EXTRACTION
        TARGET and never scored — nothing about it is printed on the page. It is dataset structure
        carried on the record.
      why_it_is_on_the_record_and_not_only_in_the_manifest: >
        A DOCUMENT LABEL HAS NO `persona_id`. The partition's unit is the persona, so a consumer
        holding one document label could not place it on either side without loading the whole
        corpus and joining through the claim. The manifest carries the DECISION — unit, requested
        fraction, realized counts — and never the id lists, so there is exactly one statement of
        where any given document went.
      the_unit_is_the_persona: >
        🔴 A LABEL DEPENDENCY, NOT A FEATURE LEAK, AND THAT IS WHY THE UNIT IS NOT THE CLAIM. Annual
        limits are cumulative per persona, so a claim labelled `partially_covered` with the cause
        `limit_exhausted` carries that label BECAUSE OF THAT PERSONA'S EARLIER CLAIMS. Partition by
        claim and a validation claim's own verdict is a function of training claims. Keeping
        personas whole also keeps a claim's documents together — an invoice in one side and the
        payment that settles it in the other is one transaction split across the boundary — and
        keeps a persona's printed name and tax id from appearing on both sides.
      it_is_not_stratified: >
        ⚠️ PERSONAS ARE ASSIGNED AT RANDOM, so a side may contain NO documents of a class the corpus
        has, and no claims of a verdict the corpus has. Deliberate: stratifying would tune the
        corpus, and this generator's rule is that the balance report makes a shortfall visible
        rather than repairing it. A consumer must check what its validation side contains before
        reporting anything per class. See `known_limitations` KL-13.
      null_on: >
        a record produced outside a run. `null` means NO PARTITION WAS COMPUTED, which is a
        different statement from either side and from an empty side.

    - name: relevant_transaction
      type: string or null
      required: false
      normalize: identifier
      meaning: >
        WHICH ROW of a multi-row document the fields above describe: the printed operation number
        («Номер документа») of the labelled row, unique within the statement it is on.
      a_pointer_not_an_identity: >
        This is what distinguishes it from `document_code`, which is the identity OF a document. A
        statement's `document_code` is `null` — 👁 the observed header carries no number of its own,
        only a client, an account, a period and a production time — and this field points INTO the
        document instead.
      uniqueness: >
        Distinct across the rows of one statement BY CONSTRUCTION: the trailing digits are one
        counter, which is 👁 what a short operation number is — a client's own sequential numbering.
        A drawn number did repeat on two rows of one render before that was so, and nothing but the
        pointer would have revealed it: every labelled VALUE was still the right row's.
      null_on: every class but `bank_statement`

    - name: line_items
      type: array of line_item
      required: true
      # NO `normalize:` KEY, DELIBERATELY. `normalize:` names a rule in `normalization`, and there
      # is none for an array of RECORDS: each element's own fields carry their own rule under
      # `line_item` below. It read `see \`line_item\`` until version 21, which is a sentence in an
      # index slot — `normalization[field.normalize]` raised on it. The pointer is prose and lives
      # here, where a reader finds it and a lookup does not.
      element_rules: see the `line_item` field list below; every element field names its own rule
      cardinality:
        emitted: >
          AT LEAST ONE on the classes that state a subject — `fiscal_receipt`,
          `non_fiscal_receipt`, `invoice`, `platform_receipt` — and EMPTY on
          `payment_confirmation` and `bank_statement`: the requirements document gives neither of
          those types line items, and both shapes are ordinary in every run. (The empty case sat
          under a `forward_contract` key while those classes were in no run; it moved with them at
          version 34.) One place in `src/` still treats an empty array as wrong on the honest
          path: `validate_line_item_sum` returns False for it — see RC-09. `policy_engine` no
          longer raises on a zero-total CLAIM (a payment-only claim evaluates with a `null`
          fraction since version 25); the helper `covered_fraction` still raises, which is RC-10's
          remaining half.
        consumer_interaction: >
          The consumer's line-item guard routes a claim to `in_review` with reason
          `line_items_unreliable` when the line-item array is empty while `total > 0`, on
          the ground that a document with a total and no lines is more likely to have been
          read badly than to have no lines. Read together with the requirement above that
          those two types carry no line items at all, THAT GUARD MUST BE TYPE-AWARE or every
          payment confirmation and every bank statement lands in manual review.
          This is the consumer's to fix, not the generator's; it is recorded
          here because the two requirements only contradict each other when read side by
          side, which is what this file is for.

    - name: has_qr
      type: boolean
      required: true
      observed: >
        BOTH VALUES, BY CLASS: `true` on every `fiscal_receipt` (the fiscal QR is a requisite),
        `true` on the payment confirmations that draw the DECORATIVE verification code
        (`payment_confirmation.qr_share` in config/generation.yaml — the classification trap this
        pair of booleans exists to record, since on those documents `qr_is_fiscal` is `false`),
        and `false` on every other class. "Always true" was the fiscal-receipt-only corpus.
      divergence:
        name: divergence_qr
        status: divergent
        generator: two booleans — `has_qr` and `qr_is_fiscal`
        consumer: >
          The consuming system requires the DECODED CONTENT and a four-value type
          (fiscal_link / promotional / payment / unknown), presence being unusable as a
          fiscality signal. See `document_types.fiscal_receipt` and RC-03.

    - name: qr_is_fiscal
      type: boolean
      required: true
      observed: >
        `true` exactly where the class is `fiscal_receipt`; `false` everywhere else — INCLUDING
        the confirmations whose `has_qr` is `true`, which is the pair's whole point: presence
        without fiscality. "Always true" was the fiscal-receipt-only corpus.
      see: divergence_qr

    - name: has_fiscal_number
      type: boolean
      required: true
      observed: >
        `true` exactly where the class is `fiscal_receipt`; `false` on all five other classes —
        which is what makes the slip a trap: a page shaped like a receipt carrying `false` here.
        "Always true" was the fiscal-receipt-only corpus.
      divergence:
        name: divergence_fiscal_scheme
        status: divergent
        consumer: >
          The consuming system requires the fiscal SCHEME JURISDICTION plus that scheme's
          requisites, and forbids a boolean `is_fiscal` in the model. See
          `document_types.fiscal_receipt` and RC-02.

    - name: capture
      type: enum
      required: true
      normalize: closed_enum
      vocabulary: [screenshot, photo, scan, digital_pdf]
      meaning: how the document reached the verifier
      observed: >
        ALL FOUR — three since version 17, `digital_pdf` since version 35. Each has its own
        recipe: `digital_pdf` is the ORIGINAL FILE and applies NOTHING — same pixels, same boxes,
        asserted by test; `screenshot` is a screen capture — no geometry, no paper grain and no
        sensor noise (both physically impossible on pixels that never crossed a camera; they were
        applied anyway until version 35), only the compression of whatever re-sent it; `photo` is
        a hand-held camera over paper on a desk — texture, sensor noise, a perspective, a small
        rotation, phone compression always, and uneven light / a cast shadow / motion blur at the
        per-document rates `degradation` in config/generation.yaml declares; `scan` is a flatbed —
        evenly lit, a degree or so of skew, transport streaking at its declared rate.
      the_mix_is_declared_per_class: >
        🔴 WHICH CHANNEL CARRIES A DOCUMENT FOLLOWS ITS CLASS — `capture_mix` in
        config/policy.yaml, one row per document class, with the born-medium physics stated at
        the block: a till roll has no undamaged electronic original (`digital_pdf: 0`), a
        товарний чек has no electronic form at all, and the two banking-app renderings are
        screenshots BY CONSTRUCTION (`claim_planner.Archetype.screen_native`) rather than by
        weight. ⚠️ The weights are a dataset-balance decision sized for measurability, NOT a
        survey of how evidence arrives — see KL-11, which carried the uniform placeholder until
        version 35 and now carries this. A consumer slicing per channel within one class must
        note the class's own mix as the denominator's shape.
      drawn_per_document_or_per_file: >
        🔴 PER DOCUMENT, EXCEPT THAT A FILE IS CAPTURED ONCE. Where a claim's two documents are
        carried in one file, ONE channel is drawn for the FILE and both records carry it — a
        claimant who photographs a stapled pair does not photograph one sheet and scan the other.
        So on such a claim `capture` is not independent between the two labels, and a consumer
        computing a per-channel figure over documents must know that some of them come in pairs
        that could not have differed. It is also why the same claim's two documents share their
        degradation exactly: one image was degraded, not two.
      label_invariance: >
        Capture mode changes pixels and boxes, never content — so one rendered document may
        yield several examples sharing every other field of this record. 🔴 WITH ONE EXCEPTION,
        AND IT IS NOT A BREACH OF THE RULE ABOVE: what a document PRINTS may depend on its
        MEDIUM, which the channel determines. A paper capture prints the `equals` VAT row only.
        The label still describes the image; it is the image that differs, not the reading of it.
        See `vat_row_form`.
      divergence:
        status: divergent
        consumer: >
          The requirement calls this `medium` and puts it on `ClaimFile` (the binary) rather
          than on the logical document, with FOUR values: digital_pdf / screenshot / photo /
          scan. 🔴 THE VALUE VOCABULARIES AGREE SINCE VERSION 35 — `digital_pdf` is a member
          here too, the undamaged original, closing the half of RC-11 that was about what the
          enum can say. (Version 29 through 34 argued the reverse — that the enum holds only
          kinds of damage, so the fourth value could not be a member; that reading was reversed
          deliberately, and the reversal is recorded at RC-11 rather than smoothed over.) WHAT
          STILL DIVERGES IS THE NAME AND THE HOME: `capture` on the document against `medium` on
          the file, and two labels of a shared file repeating one file's fact. See RC-11.

    # ------------------------------------------------------------------------
    # THREE FIELDS ADDED IN VERSION 29, CARRYING TWO RELATIONS THAT ARE INDEPENDENT OF EACH OTHER.
    # `file_region` answers WHICH PART OF ITS FILE this document is; `page_count` and `page_regions`
    # answer HOW MANY SHEETS THIS DOCUMENT RUNS TO and where each of them is. A file holding two
    # documents of which one is a two-sheet statement carries both at once, and the generator
    # produces that combination — so neither relation may be implemented as the other's special
    # case.
    #
    # 🔴 ONE PIXEL SPACE FOR ALL THREE, AND IT IS THE FILE'S. Every box below is in the coordinates
    # of the image named by `source_file`, in the same `[x, y, width, height]` COCO convention as
    # `field_bboxes` and under the same `bbox` rule. Where `file_region` is non-null, `field_bboxes`,
    # `content_bbox` and `page_regions` are ALREADY offset into that space: a consumer that crops by
    # `file_region` and then indexes with a field box applies the offset twice. Nothing here is in
    # per-document coordinates, and nothing derives them for a consumer.
    #
    # ⚠️ AFTER DEGRADATION EVERY ONE OF THEM IS AN AXIS-ALIGNED HULL, which is the caveat
    # `field_bboxes` and `content_bbox` already carry and is inherited for the reason it is
    # inherited: `degrader.carry_boxes` moves every rectangle of one file in ONE call, as four
    # keypoints each, and rebuilds each box as the smallest axis-aligned rectangle containing its
    # four moved corners. Under `photo` and `scan`, which rotate, a region is therefore larger than
    # what it covers — SO TWO ADJACENT `file_region`s MAY OVERLAP, and a region may extend past the
    # frame with a negative coordinate or a far edge beyond it, exactly as a field box may. A region
    # says where a document is. It is not a cut line, and a splitter scored pixel for pixel against
    # one is being scored against an annotation convention as much as against itself.
    #
    # 🔴 HOW MUCH THEY OVERLAP IS A PROPERTY OF THE CAPTURE CHANNEL, AND ON `photo` IT IS NOT A FEW
    # PIXELS. Measured on ONE run — `generate-dataset --seed 20260803 --personas 40
    # --claims-per-persona 3 --split 0.5`, 107 bundled files — and quoted as a measurement of that
    # run rather than as an invariant: nothing in the generator bounds these numbers, and a
    # different seed, profile or degradation parameter moves them.
    #
    #   * `screenshot` — 0 of 32 adjacent pairs overlap. Nothing rotates, so the sheets keep the
    #     ≈16 px gap the composition leaves between them.
    #   * `scan` — 11 of 36 pairs overlap, by at most 6 px. "A few pixels" describes this channel,
    #     and it is the only channel it describes.
    #   * `photo` — 27 of 39 pairs overlap: median 17 px, 39 px at the 90th percentile, 85 px at the
    #     worst. That is consistent with the few degrees of rotation this channel applies to a file
    #     over a thousand pixels wide, and it is two thirds of the adjacent pairs rather than an
    #     outlier.
    #
    # Between the two `page_regions` OF ONE PAGINATED DOCUMENT the same run measured 0 of 13 on
    # `screenshot`, 6 of 6 on `scan` (median 11 px, max 24 px) and 6 of 7 on `photo` (median 33 px,
    # max 60 px). ⚠️ A CONSUMER SIZING A TOLERANCE SHOULD SIZE IT FROM THE PHOTO FIGURES. One that
    # asserts disjoint regions, or that cuts a file along a region edge and expects the pieces to
    # partition it, will find the halves of a photographed file claiming some of the same pixels —
    # which is the convention above and not a defect in the label.
    # ------------------------------------------------------------------------

    - name: file_region
      type: "[number, number, number, number] or null"
      required: false
      normalize: bbox
      status: emitted
      meaning: >
        WHERE THIS DOCUMENT SITS INSIDE `source_file`. `null` is the statement that the document IS
        the whole file — the ordinary case, and every case before version 29 — and a box is the
        statement that the file holds another document besides this one.
      null_is_the_whole_file_and_not_a_missing_value: >
        🔴 A CONSUMER MUST NOT READ `null` AS "UNKNOWN". It is the segmentation answer for a file
        with one document in it: the region is the image. Treating it as absent leaves the
        commonest case of the corpus with no ground truth at all, and treating it as an error
        leaves it with a fabricated one.
      what_may_share_a_file: >
        ⛔ THE DOCUMENTS OF ONE CLAIM, AND NOTHING ELSE — a claimant stapling them together before
        submitting them, subject document first and payment document below, at the share
        `file_composition.bundle_share` declares in config/generation.yaml.

        ⚠️ THAT SHAPE IS A JUDGEMENT AND NOT AN OBSERVATION, AND THE HONEST NUMBER IS BESIDE THE
        SHARE: 👁 zero of the author's own 87 files holds more than one document. The argument for
        the share not being zero is about the SUBMISSION rather than about the document — a channel
        taking one file per claim, while a claim needs both a subject document and a payment
        document, makes stitching the two the ordinary way to file it — and it is written out where
        the number is, not restated here.

        Documents of DIFFERENT claims never share a file: a
        claim is the unit a verdict is reached on, so such a file would be evidence for two answers
        at once and no relation in this schema could say which part of the image belongs to which
        claim's label. See RC-12 for the decision and for what a consumer does with the pattern
        this dataset will not contain.
      it_is_the_boundary_ground_truth: >
        THIS IS WHAT MAKES A FILE-SPLITTING STEP MEASURABLE. While every file held exactly one
        document, a step that splits a submitted file into logical documents scored a perfect
        result on data whose ideal it could not fail — a measurement of the construction of the
        data rather than of the step. ⚠️ Nothing printed on such a file says that its sheets are two
        different documents; the only mark the stitching leaves is the gap between them, which is
        what makes refusing a cut a real problem.
      null_on: >
        every document of a file that holds only it, which is most of the corpus. The share that
        carries a box follows `file_composition.bundle_share` and the proportion of claims with two
        documents; a run's own count belongs in `run_profiles`, and NOT MEASURED YET.

    - name: page_count
      type: integer
      required: true
      status: emitted
      # NO `normalize:` KEY, DELIBERATELY, and for a different reason from `line_items`. This is a
      # fact about how the document was carried, not a value an extractor returns: nothing prints
      # it on a single-sheet document, and a paginated one prints «Сторінка N з M» in its footer,
      # which is a printed caption rather than a labelled field. Naming `identity` would be worse
      # than naming nothing — that rule's own `why` says nothing prints its fields.
      meaning: >
        HOW MANY SHEETS OF ITS FILE THIS DOCUMENT RUNS TO. `1` on every class but a paginated bank
        statement, which is the only archetype that splits today, at the share
        `bank_statement.two_page_share` declares in config/generation.yaml.
      it_is_not_the_file: >
        A file may hold two documents, so the sheets of a file are not the pages of a document. Only
        `page_regions` and `file_region` together say which sheet belongs to which document, and a
        consumer counting sheets in an image is counting neither field.
      do_not_report_its_accuracy: >
        NOT AN EXTRACTION TARGET. On the overwhelming majority of documents nothing on the page
        states it, so a system answering `1` unconditionally scores near-perfectly having read
        nothing — the same refusal `amount_due` and `direction` carry.
      null_on: never; it is `1` where there is one sheet, and never absent

    - name: page_regions
      type: "array of [number, number, number, number], or null"
      required: false
      normalize: bbox
      status: emitted
      meaning: >
        ONE RECTANGLE PER SHEET OF THIS DOCUMENT, in READING ORDER — element `i` is page `i + 1`.
        Present exactly when `page_count > 1`, with exactly that many entries, and `null` at one
        page, where `file_region` already says where the whole document is and a list of one would
        say it a second way. The agreement is enforced in `schemas.DocGroundTruth` rather than left
        for a consumer to discover as a length mismatch.
      the_rule_is_per_element_and_the_order_is_information: >
        `bbox` is named for each ELEMENT; the list itself is ORDERED and must not be compared as a
        set. Which sheet is the first one is the whole of what a continuation sheet means — the
        footer prints «Сторінка N з M», which is ⛔ the generator's own `folio` template under
        `bank_statement.pagination` in config/fiscal-rules.yaml and not the text of any published
        form — and a comparison that sorted or set-ified the list would score a document assembled
        backwards as correct.
      a_document_can_be_split_across_sheets_and_its_boxes_are_not: >
        ⚠️ A FIELD BOX LIVES ON WHICHEVER SHEET PRINTS IT, AND THE LABEL DOES NOT SAY WHICH. On a
        paginated statement the two unlabelled money-column headers, `column_debit` and
        `column_credit`, are marked on the FIRST sheet only, while the relevant row — and so the
        `amount` box a consumer combines with them to read `direction` — may sit on the SECOND. The
        combination stays valid because the column band is compared on x, which the sheets share;
        a consumer comparing on y, or assuming a header and its row are on one page, meets this on
        the first paginated statement whose relevant transaction fell to page two.
      what_the_second_sheet_is: >
        ⛔ A LAYOUT-GENERIC CONTINUATION, NOT OBSERVED ANATOMY. 👁 The one observed statement ran to
        four pages and ⛔ only a preview of its first was seen, so how a real second sheet repeats
        the header is unestablished. What is generated repeats the column headings and prints the
        page footer, which is the least this document can do and still be readable; the template and
        config/generation.yaml carry the same ⛔ beside the same claim.
      null_on: >
        every single-sheet document, which is every class but a bank statement and most bank
        statements.

    - name: field_bboxes
      type: map<string, [number, number, number, number]>
      required: true
      normalize: bbox
      keys: see `printed_fields`
      note: >
        A key is present only when its element was rendered, AND SINCE VERSION 7 THAT IS NO
        LONGER THE SAME SET ON EVERY DOCUMENT. A missing key is information — the element is not
        on that document — and never an omission to be repaired.

        THREE KEY FAMILIES VARY, and all three vary together, with the seller's ПДВ
        registration: `seller_vat_number`, `item_<i>_vat_letter` and `tax_line_<i>` are present
        for a registered seller and absent for an unregistered one.

        `seller_tax_code` DOES NOT VARY. It is on every document this generator produces, which
        is why a consumer must read registration from the presence of `seller_vat_number` and
        never from the absence of `seller_tax_code`.

        An earlier draft of this note said the two identifier keys were alternatives. Measured on
        the version 7 run of 146 documents: `seller_tax_code` 146 of 146, `seller_vat_number` 125
        of 146, and BOTH TOGETHER on 125 of 146 — so the draft was false on the majority of the
        corpus, and its count of varying keys corresponded to nothing. On the version 8 run of 143
        the same shape holds: `seller_tax_code` 143 of 143, `seller_vat_number` 116 of 143, both
        together on those same 116. See
        `printed_fields.varies_with_vat_payer_status`.

        ⚠️ THOSE TWO SETS OF FIGURES ARE A REFUTATION RECORD AND ARE NOT TO BE RE-MEASURED. They
        describe no current corpus: they are the evidence that a claim once made here was false,
        and each names the version it was taken on. A statement about the past cannot go stale,
        which is why they stay outside `run_profiles` while every live count moved into it. A
        later reader who refreshes them against a new run destroys the only thing they are for.

        🔴 SINCE VERSION 17 A BOX MAY LIE PARTLY OR WHOLLY OUTSIDE THE IMAGE, with a negative
        coordinate or a far edge past the frame. `photo` and `scan` move boxes, and a value trimmed
        flush with the edge would be indistinguishable from one that never left — which is exactly
        how a crop comes to be reported as complete. A consumer indexing an image with these must
        clip them itself; the clipped form is derivable from what is emitted and the emitted form is
        not derivable from the clipped one, so the emitted form is the one that carries information.

        SINCE VERSION 11 THE KEY COUNT ALSO VARIES WITH THE ROW COUNT of a bank statement. Each
        operation carries an indexed box over its whole row rect — `operation_<i>`, counted down the
        page from 0 — so a statement of 15 rows and one of 25 have ten keys' difference between them
        and neither is missing anything. It is the same shape as `item_<i>_*` on a receipt, applied
        to a row rather than to a line. A consumer that pins a key set per class rather than deriving
        it from the document meets this immediately.

    - name: synthetic
      type: boolean
      required: true
      value: always true
      note: >
        With `generator_version`, this is what keeps the provenance of an individual file
        unambiguous once it leaves this repository.

    - name: generator_version
      type: string
      required: true
      normalize: identity

  # ---------------------------------------------------------------------------
  # Printed fields: geometry without a value
  # ---------------------------------------------------------------------------
  #
  # The keys of `field_bboxes` are a DIFFERENT VOCABULARY from the label field names, and
  # they are not the same names for the same things:
  #
  #   printed `total`        <->  label `amount`
  #   printed `seller_name`  <->  label `counterparty`, and the printed string carries the
  #                               legal form while the label string does not
  #   printed `date`         <->  label `date`, in the jurisdiction's format
  #
  # Most printed keys have NO corresponding label field. They carry a box and nothing else,
  # so a scorecard can measure whether a system located them and cannot measure whether it
  # read them. Several are REQUIRED FIELDS on the consumer side — see
  # `document_types.*.prd_required_fields` and `required_changes`.
  printed_fields:
    status: emitted
    # THREE ARCHETYPES, ONE CLASS. They print the same labelled fields; what differs is the
    # paper width and the fiscal identity at the foot — see `varies_with_the_kind_of_register`.
    archetypes: [ua_prro_receipt, ua_prro_receipt_58mm, ua_rro_receipt]
    # ⚠️ THIS INVENTORY IS THE FISCAL RECEIPT'S AND NOT THE DATASET'S, and the `archetypes` key
    # above is what scopes it. The other two classes state their own box vocabularies at their own
    # types — `document_types.bank_statement.the_label_is_one_transaction.bboxes` for the indexed
    # per-row keys, the two unlabelled money-column headers and the four unlabelled totals — so a
    # reader must not take the lists below as the whole of what a run's `field_bboxes` can contain.
    scope: the three `fiscal_receipt` archetypes named above
    with_a_labelled_value:
      seller_name: counterparty          # differs by legal form and quotation marks
      total: amount
      amount_due: amount_due             # equal to `amount` in this version — do not score it
      paid_amount: amount                # the same value, printed a second time
      date: date                         # printed DD.MM.YYYY, labelled YYYY-MM-DD
      item_<i>_name: line_items[i].name
      item_<i>_qty: line_items[i].qty
      item_<i>_price: line_items[i].price
      item_<i>_vat_letter: line_items[i].vat_letter   # absent on a non-payer's receipt
    bbox_only:
      # No ground-truth value exists for any of these. Indices are zero-based and dense.
      - seller_address
      - seller_tax_code                  # «ІД» + ЄДРПОУ (8) or РНОКПП (10), checksum-correct.
                                         # On EVERY receipt this generator builds — oftener than
                                         # reality, see KL-05
      - seller_vat_number                # «ПН». 12 digits for a legal entity, whose first 8 are
                                         # its ЄДРПОУ (a construction from ONE observed document,
                                         # not a rule — see `document_types.fiscal_receipt`); the
                                         # same РНОКПП as `seller_tax_code` for a sole trader.
                                         # REGISTERED PAYER ONLY
      - item_<i>_sum                     # qty × price
      - tax_line_<i>                     # one row per VAT letter; none at all for a non-payer.
                                         # Box spans the whole row — see `tax_row_geometry`
      - discount                         # ЗНИЖКА — zero in this version
      - rounding                         # ЗАОКРУГЛЕННЯ — zero in this version
      - payment_method                   # payment form; consumer-required on payment_confirmation
      - acquirer
      - terminal_id
      - operation
      - card_masked                      # ЕПЗ — електронний платіжний засіб, the masked card
      - auth_code                        # the consumer requires it; a decisive duplicate key
      - rrn                              # the consumer requires it; a decisive duplicate key
      - amount_in_words
      - receipt_number                   # 11 alphanumeric characters from a software register,
                                         # 4 to 6 digits from a hardware one
      - time
      - fiscal_device_number             # 10 digits, prefixed «ФН ПРРО» by a software register
                                         # and «ФН» by a hardware one
      - device_serial                    # «ЗН» — the factory serial, 2 letters and 8 digits.
                                         # HARDWARE REGISTER ONLY: ⚠️ ЗН and ФН are not a pair
      - title
      - provider_name                    # the maker printed immediately after «ФІСКАЛЬНИЙ ЧЕК»
                                         # — 📄 part of the same requisite of the form. A
                                         # software provider or a device manufacturer, per
                                         # archetype. INVENTED NAMES, see `receipt.registrars`
                                         # in config/fiscal-rules.yaml for why and for what the
                                         # alternative would have cost
      - mode_marker                      # Онлайн / Офлайн. SOFTWARE REGISTER ONLY — 📄 the mode
                                         # marker is a ПРРО requisite
      - qr
      - footer_text
    tax_row_geometry:
      status: emitted
      changed_in_version_7: >
        `tax_line_<i>`'s BOX GREW, while its key and its content stayed the same. The row used
        to be a single string starting at the left margin — "ПДВ А 20% 111,32" — and its box
        hugged that text. The VAT amount now sits in the same right-hand column as `total`,
        `discount`, `rounding` and `amount_due`, so the box spans the full width of the row,
        from the label to the amount, in the way `operation` in the acquiring block already did.

        A consumer comparing boxes across versions by IoU will see a mismatch here and nowhere
        else. The label content of the row is unchanged, so nothing that reads text is affected.
      why: >
        The amount is a COLUMN on the paper rather than part of the label, and folding it into
        the label string left the VAT amounts floating mid-line between two right-aligned
        totals — visibly wrong on every registered seller's receipt, and invisible to every
        label. `receipt.totals_labels` and `tax_line_label_format` in config/fiscal-rules.yaml
        are where the wording of both now lives.

    varies_with_vat_payer_status:
      status: emitted
      note: >
        THE ONE CONDITIONAL THAT IS OBSERVED RATHER THAN PLANNED, unlike the acquiring block
        below. Both varieties are produced today, because config/vendors.json carries sellers of
        each kind in the one category that has an archetype.

        EVERY receipt carries `seller_tax_code` — the ІД identification code. That is MORE OFTEN
        THAN REALITY: only 1 of 3 observed real receipts prints the line at all, and KL-05
        declares the overstatement. It is printed as the superset so the field can be exercised.

        A REGISTERED ПДВ PAYER carries, IN ADDITION, `seller_vat_number`, one
        `item_<i>_vat_letter` per line, and one `tax_line_<i>` per letter present.

        A SELLER THAT IS NOT REGISTERED carries none of those three families: its lines end at
        the amount and there is no tax block under the totals.

        So a fiscal receipt's key set answers a question about the seller, and code that asserts
        a fixed key set for the archetype is wrong rather than strict. The status itself is not
        in the label; a consumer reads it from the PRESENCE OF `seller_vat_number`, never from
        `seller_tax_code`, which says nothing about registration because every seller has one.
        An earlier version of this entry made the two identifier keys alternatives and would have
        had a consumer read the status off which one appeared — see
        `document_types.fiscal_receipt`.

    varies_with_the_kind_of_register:
      status: emitted
      note: >
        THE SECOND OBSERVED CONDITIONAL, and it partitions the class rather than the sellers.
        ⚠️ «ЗН» and «ФН» are NOT a pair: 👁 the observed ПРРО receipts print the fiscal number
        alone, 👁 both published hardware samples print the factory serial as well. So the set of
        fiscal identity lines says which kind of cash register issued the document.

        A HARDWARE REGISTER (`ua_rro_receipt`) carries `device_serial` and NO `mode_marker`, its
        `fiscal_device_number` is prefixed «ФН», and its `receipt_number` is four to six digits.

        A SOFTWARE REGISTER (`ua_prro_receipt`, `ua_prro_receipt_58mm`) carries `mode_marker` and
        NO `device_serial`, its `fiscal_device_number` is prefixed «ФН ПРРО», and its
        `receipt_number` is eleven alphanumeric characters.

        This is the axis a consumer stratifies the class on, and `device_serial`'s presence among
        the bbox keys is how: nothing in the labels names the archetype. The paper width is the
        other axis and comes from the image — 464 px for the 58 mm roll, 640 px for the 80 mm one,
        both preserved by the degrader.

        As with the VAT-payer conditional above, a fixed key set for this archetype is wrong
        rather than strict, and for a second independent reason: the two conditionals compose, so
        four combinations of key set exist in the class.

    acquiring_block_is_conditional:
      status: forward_contract
      note: >
        The template omits `acquirer`, `terminal_id`, `operation`, `card_masked`,
        `auth_code` and `rrn` when a document was not paid by card. NO SUCH DOCUMENT IS
        PRODUCIBLE: `build_prro_receipt` constructs the acquiring block unconditionally, so
        all six keys appear on every document today. The conditional is a forward contract,
        not an observation.


# =============================================================================
# 4. The line item
# =============================================================================
#
# Coverage is decided PER LINE, which is why a line item is a labelled structure rather than
# a string. Model: `LineItem`. The consumer persists the same thing as `ReceiptLineItem`,
# normalized rather than inside a JSON blob, so it can be re-scored after a rule change.

line_item:
  status: emitted

  fields:

    - name: name
      type: string
      required: true
      normalize: text_name
      meaning: the line as printed

    - name: item_kind
      type: string
      required: true
      normalize: policy_vocabulary
      vocabulary: >
        The item-kind keys of the CLAIMED CATEGORY in policy.yaml — the union of its
        `covered_items`, `excluded_items` and `ambiguous_items`. Not copied here.
      never_printed: >
        NO SUCH KIND APPEARS ON ANY DOCUMENT. The receipt prints a product name and
        something has to decide whether that name is reimbursable; the kind is the
        ground-truth label space that decision lands in. An extractor predicts it and can
        never read it.
      scoped_to_the_category: >
        The same kind is classified differently in different categories —
        `sports_nutrition` is excluded under `sport` and ambiguous under
        `vitamins_nutrition`. A name-to-kind mapping that ignores the claimed category is
        wrong.

    - name: qty
      type: number
      required: true
      normalize: quantity

    - name: price
      type: number
      required: true
      normalize: money
      meaning: >
        THE UNIT PRICE. The line total is qty × price and the document prints it
        (`item_<i>_sum`), but no label field carries it — a scorecard comparing line totals
        computes them.

    - name: covered
      type: boolean
      required: true
      meaning: >
        Whether this line is reimbursable in the claimed category, per policy.yaml. The
        policy engine resolves the answer from the category's buckets and treats this flag as
        an assertion to check against that resolution.
      ambiguous_bucket: >
        Kinds from `ambiguous_items` never appear with this flag set either way; both the
        builder and the engine refuse to invent an answer policy.yaml declines to give.

    - name: vat_letter
      type: string or null
      required: false
      normalize: vat_letter
      meaning: ПДВ-літера — the VAT rate code printed at the end of the line
      null_is_legitimate: >
        AND IS THE WHOLE OF THE VAT BLOCK BEING ABSENT, not an unread letter. Every line of a
        receipt issued by a seller that is not registered for ПДВ carries `null`, and that
        document has no tax rows either. See `normalization.vat_letter.nullability`, which
        also records that this file forbade the case until version 7.
      not_a_shortcut_to_coverage: >
        The coverage boundary deliberately does not coincide with the VAT boundary, so a
        consumer cannot derive `covered` from this field and has to read the line.
      aggregate_is_missing: >
        Per-line letters are labelled; the per-letter VAT AMOUNTS the consumer requires are not. See
        `document_types.fiscal_receipt` and RC-05.


# =============================================================================
# 5. The verdict vocabulary
# =============================================================================
#
# `verdicts` keys are the `Verdict` members in schemas.py. The consumer's `Decision` enum is
# wider and names one of the shared concepts differently; each entry records its
# counterpart, and `verdict_decision_mapping` below states the whole correspondence in one
# table. The notes that follow are a SIBLING block so that a consumer generating an enum
# from these keys gets six values.

verdicts:

  covered:
    status: emitted
    means: fully reimbursable — every line qualifies and the annual limit absorbs it
    consumer_counterpart: auto_approved
    divergence:
      status: divergent
      note: >
        SAME CONCEPT, DIFFERENT WORD. The consumer's `Decision` verdict for a claim that
        passed with no flags is `auto_approved`, and a scorecard comparing verdict strings
        would score every correct decision as wrong. `verdict_decision_mapping` below now
        states the correspondence; neither name is changed. See RC-13.

  partially_covered:
    status: emitted
    means: >
      Part of the amount qualifies. Two causes, kept apart in `imperfection` because they
      differ in what a consumer can possibly know.
    consumer_counterpart: partially_covered
    note: >
      The consumer treats `partially_paid` and `partially_covered` as DIFFERENT AXES — part
      of the amount versus part of the lines — which may hold at once, each carrying its own
      reimbursable amount. The generator's `Verdict` is single-valued and cannot express both
      on one claim.

  not_proof_of_payment:
    status: emitted
    means: >
      THE SLOT: that MONEY MOVED. This verdict is what the claim gets when that one fact of
      `document_evidence` is not established, and it is decided from the DOCUMENT TYPE — every
      document the claim carries is of a type whose entry in policy.yaml says
      `proves_payment: false`. An invoice, an act, an order screenshot, a non-fiscal receipt,
      alone or in any combination. Amounts, baskets and dates are not consulted.

      NO CAUSE in `imperfection`: the verdict says the whole of it. There is one slot and one
      way to fail it, so there is nothing left for a cause to distinguish.
    consumer_counterpart: not_proof_of_payment
    agreement_across_the_sources: >
      All three sources read it this way: policy.yaml's `document_evidence`, the verdict table
      in docs/architecture.md, and the consumer's own definition, whose canonical example is an
      invoice reading "Zapłacono: 0,00".
    derived_and_now_built: >
      BOTH HALVES EXIST AS OF VERSION 27, and the key is renamed because its old name
      (`derived_but_not_built`) described a state that has ended. `policy_engine.evaluate_claim`
      labels the case — a claim none of whose documents is a payment-proving type comes back
      `not_proof_of_payment` with an empty `imperfection` — and `claim_planner` now BUILDS one:
      `EvidenceIntent.PAYMENT_GAP` plans a claim carrying a subject document and nothing beside it.

      ⚠️ WHAT WAS MISSING WAS NEVER THE TEMPLATE, and that is worth keeping because it is the
      lesson rather than the history. An archetype of a `proves_payment: false` type had existed
      since the invoice landed; what did not exist was a planner that would deliberately plan an
      INCOMPLETE claim, and naming the intent is what supplied it. TWO archetypes realize the
      verdict now — a bare invoice and a товарний чек — and KL-14 records what follows from the
      second occurring in no other claim shape.
    why_this_was_once_unreachable: >
      HISTORY, kept because it has gone wrong twice. This verdict used to be written as what it
      was NOT, and under that construction it lost its own territory: policy.yaml's `coverage`
      block wrote a zero covered amount as `not_proof_of_payment / rejected`, and
      docs/architecture.md's imperfection catalogue listed "no proof of payment" under a second
      verdict as well as under this one — between them, nothing was left that reached this name.
      Both are fixed by every verdict naming its own slot of `document_evidence`; see
      `verdict_notes.definitions_name_their_own_slot`, which is the rule, and
      `verdict_notes.why_this_boundary_slips` for why this particular pair invites the error.

      TWO KEYS DEPARTED FROM THIS VERDICT IN THIS REVISION, declared together because a consumer
      diffing key sets sees two absences and this file should not leave it guessing which is
      which. No content was lost; each sentence's new home is named.

        `not_the_same_as_a_missing_subject` was RENAMED to this key. A key whose NAME is a
        complement keeps the construction alive in the one place a reader converting the prose
        would not look. Its content is the paragraph above, less the sentence that defined this
        verdict by contrast with its neighbour, which the slot form makes unnecessary.

        `built_only_through_the_document_type` was REMOVED, not renamed. Its substance — that the
        document type is the one mechanism — is now the FIRST thing `means` says ("decided from
        the DOCUMENT TYPE — every document … says `proves_payment: false`"), so the key had become
        a second copy of the definition, and two copies of a rule become two rules the first time
        one is edited. Its other sentence, that the item-coverage route to this name is closed
        because that case is `rejected`, is in the `decided` block below, which this revision
        leaves unchanged and which is where that decision belongs.
    # -----------------------------------------------------------------------
    # WAS UNDECIDED. NOW DECIDED — recorded here so the reasoning survives the decision.
    # -----------------------------------------------------------------------
    decided: >
      THE QUESTION: what a claim with ZERO covered amount is called — a basket bought wholly
      outside the claimed category. policy.yaml's `coverage` block wrote that case as
      `not_proof_of_payment / rejected`, which is two different answers, and `rejected` was
      not a member of the `Verdict` enum at all, so `policy_engine.verdict_for` RAISED rather
      than choosing.

      THE DECISION: the policy was right and the enum was incomplete. `rejected` is now a
      member of `Verdict` and a zero covered amount maps to it; see `verdicts.rejected`.

      WHY: the two are different outcomes and always were. A pharmacy receipt listing nothing
      but medicines establishes payment perfectly well — it is about the wrong subject, which
      is a coverage failure and not an evidence failure. The consumer's own `Decision`
      vocabulary carries BOTH `rejected` ("the policy plainly does not cover it", example:
      paid for the wrong subject) and `not_proof_of_payment`, and the requirements state
      explicitly that collapsing any of the finer verdicts into `rejected` is a defect —
      "the claim failed" is not a decision a claimant can act on. Two names on both sides,
      for two outcomes: the generator was missing one of them, and the slash in policy.yaml
      was the symptom.

      READ WITH `verdicts.rejected.by_when_it_was_paid`, which moved the out-of-period case
      INTO `rejected` and is not the defect this paragraph forbids. Collapsing would be
      letting `rejected` absorb a verdict whose own definition fitted a case; this moved a
      case out of a verdict whose definition did not fit it, and left that verdict with every
      mechanism it does fit. The test is the same one applied here — does the verdict's
      one-line definition cover the case — and it is what both changes were decided by.

      WHAT DID NOT CHANGE: `_reimbursable` still raises for a claim wholly beyond an
      exhausted annual limit (`policy_engine._reimbursable`). `rejected` does not close that
      gap — there the policy DOES cover the purchase, in part or in full, and the persona has
      simply drawn the annual maximum already, which is a different state and still has no
      name in policy.yaml. It stays open, and the planner still refuses to produce such a
      claim.

  insufficient_evidence:
    status: emitted
    emitted: >
      YES, THROUGH ALL THREE OF ITS CAUSES, AND THE WORD IS A CORRECTION RATHER THAN NEWS. This
      verdict has been in the data since the planner gained it as a target — first through the
      two cross-check causes, then through `subject_not_evidenced` when
      `claim_planner.EvidenceIntent.EVIDENCE_GAP` made a deliberately incomplete claim plannable
      — and the status key was not moved with it. It read `forward_contract`, which this file
      defines as NOT PRESENT IN THE DATASET, so the contract understated what a consumer receives
      for two revisions.

      A CONSUMER THAT BELIEVED IT WAS UNDER-PREPARED, NEVER MIS-PREPARED: no field, cause or
      comparison rule was described wrongly, and every claim carrying this verdict was already
      shaped as the keys below say. What the wrong word cost was the decision to score against
      it. The counts per cause are in the run profiles.

      🔴 A FOURTH CAUSE IS NOW DRAWN AND BUILT. `counterparty_mismatch` — an invoice issued by one
      seller beside a payment made to another — carries a share in `insufficient_evidence_causes`
      and is realized by `assembler`, which draws the SECOND party the payment names. All four
      causes are therefore emitted, and the shares of the other three fell from a third each to a
      quarter each: a corpus generated before this revision contains none of the fourth, and its
      per-cause counts are conditional on a three-way split.

      🔴 AND A FIFTH, IN VERSION 33, BY THE SAME MACHINERY. `subject_mismatch` — a payment whose
      purpose cites a different рахунок from the invoice beside it — carries a share and is
      realized by `assembler`, which draws the wrong reference, and by the builders, which are
      forced to PRINT the citation (`must_cite`). The shares fell from a quarter each to a fifth
      each and `insufficient_evidence_causes_min_run_size` moved 119 to 149; a corpus generated
      before version 33 contains none of the fifth, and its per-cause counts are conditional on
      a four-way split.
    means: >
      THE SLOTS: that a PURCHASE WAS MADE, and that the payment and the purchase are ONE
      TRANSACTION. This verdict is what the claim gets when either of those two facts of
      `document_evidence` is not established, and `imperfection` says which — FIVE CAUSES over
      two slots:

        WHAT WAS BOUGHT is not established — no document of the claim is of a type that states
        it, so that slot has no document at all. Cause `subject_not_evidenced`. A bare transfer.

        ONE TRANSACTION is not established — a subject document and its payment both exist and
        fail a cross-check: the amounts differ (`amount_mismatch`), the payment is dated
        before the document it settles (`payment_precedes_subject`), the two name different
        parties (`counterparty_mismatch`), or the payment's purpose cites a different рахунок
        from the subject document's own number (`subject_mismatch`).

      🔴 THE SECOND LIST IS AS LONG AS config/policy.yaml MAKES IT. `cross_document_agreement`
      there declares which axes a pair is compared on and what a failure earns; a cause of this
      slot is the `cause` of one axis, so withdrawing an axis withdraws a cause a consumer can
      receive and adding one adds it. The vocabulary under `imperfection` is where each is
      defined; that block is where the set is decided.

      Those two slots are the whole of this verdict. Which slot is unestablished is read off the
      claim's own documents; no comparison with any other verdict is involved in reaching it.
    consumer_counterpart: insufficient_evidence
    what_moved_out: >
      A payment dated outside the benefit period WAS a fourth cause of this verdict and is
      now a cause of `rejected`. The name did not fit: for an out-of-window expense every
      fact is established — the purchase happened, the proof is flawless, only the date does
      not match — so "a required fact was not established" was false of it. See
      `verdicts.rejected.by_when_it_was_paid`. A consumer that keyed on
      `insufficient_evidence` to mean "go and ask for another document" was being sent after
      a document that does not exist.
    why_a_disagreement_is_this_verdict_and_not_a_new_one: >
      Both facts are present separately, and the claim still does not establish that THIS
      payment paid for THIS subject — which is a linkage a claim has to prove, so the
      evidence is insufficient by the verdict's own name. Recorded as a cause rather than as
      a new enum member, following the precedent `partially_covered` sets: one verdict,
      several named causes, told apart because a consumer can know different things about
      each. Here the distinguishing fact is whether a second document exists at all — a
      missing document versus two that contradict each other.
    never_a_flag_on_a_coverage_verdict: >
      Load-bearing. Were the cause hung off a coverage-determined verdict, a claim whose
      documents contradict each other would come out `covered` with a flag beside it, and
      every number derived from the verdict would be computed off evidence that does not
      hold together.
    note: >
      WITHDRAWN IN VERSION 28, AND KEPT IN THE PAST TENSE RATHER THAN DELETED, because it is the
      sentence a consumer diffing an earlier copy will come looking for. It read: "The policy
      engine labels all three causes correctly; what is missing is a planner path that produces a
      claim carrying only half its evidence, which needs archetypes that do not exist. No dataset
      contains this verdict."

      EVERY CLAUSE OF IT IS FALSE NOW, AND THE LAST ONE CONTRADICTED ITS OWN ENTRY. The planner
      path is `claim_planner.EvidenceIntent`, the archetypes exist, the causes are four rather
      than three, and this verdict has been emitted since version 13 — which `status: emitted` and
      the `emitted:` key above have said since version 26, while this sentence went on denying it
      two revisions longer. A consumer reading the entry top to bottom found the two halves
      disagreeing and no way to tell which held. The entry now agrees with itself.

  partially_paid:
    status: emitted
    emitted_since: version 28
    means: >
      THE OBLIGATION IS SETTLED IN PARTS AND THIS PAYMENT IS ONE OF THEM. The claim's subject
      document states that its amount is paid in equal parts and what one part comes to
      (`instalment_amount`), and the payment document beside it states exactly that part. Nothing
      about such a claim is unestablished: both facts of `document_evidence` are proven, the two
      documents describe one transaction, and what is true of the claim is that part of the amount
      has been paid.

      NO CAUSE in `imperfection`. One mechanism, one way to reach it — the same shape as
      `not_proof_of_payment`.
    consumer_counterpart: partially_paid
    how_it_is_told_from_amount_mismatch: >
      🔴 THE TWO ARE THE SAME PAIR OF NUMBERS AND MUST NOT BE THE SAME LABEL. An invoice of 1200.00
      beside a payment of 300.00 is this verdict when the invoice PRINTS the instalment term, and
      `insufficient_evidence` / `amount_mismatch` when it does not. A consumer deriving either from
      the inequality alone will get both wrong in one direction or the other, whichever it picks.

      THREE CONDITIONS, all readable from the images: the subject document carries
      `instalment_amount`; the payment equals it; and it is smaller than the subject's `amount`. A
      payment matching NO part of a stated arrangement is a payment for some third amount, i.e. the
      mismatch case again. `partial_payment` in config/policy.yaml states this for an engine built
      from that file, which is where a consumer should read it rather than from this summary.
    what_it_pays_out: >
      NOTHING, in this version, and by policy rather than by omission. The plan reimburses against
      the obligation the subject document states and only part of it has been settled; how much of a
      partly settled obligation is payable is a decision policy.yaml has not taken. So
      `reimbursable_amount` is 0.00 and the claim consumes no annual balance. `covered_fraction` is
      still reported: it is a property of the line items, and they are all on the invoice.
    the_date_check_still_applies: >
      A partial settlement dated BEFORE the invoice it settles is `insufficient_evidence` with the
      cause `payment_precedes_subject`, not this verdict. An impossible order is an impossible order
      whether the payment covers a part or the whole; only the AMOUNT cross-check is exempted.
    outside_the_period_is_rejected: >
      🔴 THE ONE CLAIM TWO RULES BOTH DESCRIBE, AND A CONSUMER MUST NOT DECIDE IT FOR ITSELF. A
      payment that settles a printed instalment AND falls outside `period` in policy.yaml is
      `rejected` with the cause `outside_period` — never this verdict. Both readings are faithful
      to a file that did not say, which is why policy.yaml now says:
      `partial_payment.outside_the_period`, with the reasoning beside it.

      WHY THAT WAY. The verdicts fall in two tiers. The EVIDENCE verdicts come first, because a
      claim that has not established what it is about cannot be assessed against a policy at all.
      The POLICY verdicts presuppose that every slot IS established, and among them the period is
      prior: it answers whether the plan covers this expense, and it answers no on an axis nothing
      about the settlement can change. This verdict is a statement about a claim the plan DOES
      cover — one awaiting the rest of its instalments — and saying it of an expense outside the
      window would describe a settlement the plan is not party to.

      ⚠️ NO CLAIM OF THIS DATASET EXERCISES IT, at any run size. `claim_planner` gives a payment
      schedule to a `partially_paid` claim and displaces the payment of a `rejected` one, and never
      both. So a consumer meets this rule before the corpus does — which is the reason it is
      written down rather than left to the order two branches happen to be in.

  rejected:
    status: emitted
    means: >
      The documents establish everything they need to, and the policy plainly does not cover
      the claim. TWO MECHANISMS, answering the same question on different axes — by WHAT was
      bought and by WHEN it was paid. `verdict_basis` is `["documents"]` for both: each is
      entirely visible in the image.
    consumer_counterpart: rejected
    by_what_was_bought: >
      The documents prove payment perfectly well, and NOTHING on them is covered by the
      claimed category — the covered amount is zero. A property of the LINE ITEMS, resolved
      against the category's `covered_items` and `excluded_items` in policy.yaml. Carries NO
      cause in `imperfection`: the verdict says the whole of it.
    by_when_it_was_paid: >
      The claim's PAYMENT falls outside `period` in policy.yaml. Carries the cause
      `outside_period`, which is what tells the two mechanisms apart without parsing
      `policy_trace`.

      HISTORY, NOT PART OF THE DEFINITION ABOVE. The paragraph above decides this route on its
      own; everything from here down is for a reader who has already classified and is checking
      themselves, and that is the only reason it may name another verdict at all. Two other
      artifacts fence this same history the same way: `policy_engine`'s module docstring does it
      at rule 4, and the `Verdict` class docstring in `schemas.py` does it in the paragraph that
      follows this verdict's two axis bullets.

      WAS `insufficient_evidence` UNTIL THIS REVISION, AND THE CHANGE IS A CONTRACT CHANGE —
      a consumer that pinned the old verdict for this case scores it as a miss until it
      re-vendors. The old label was wrong by the other verdict's own name: that verdict says
      a required fact was not established, and for an out-of-window expense ALL of them are —
      the purchase happened, the proof is flawless, only the date does not match. Meanwhile
      `rejected` means the policy plainly does not cover it, and an out-of-window
      expense is plainly not covered, by *when* rather than by *what*, symmetrically to the
      wrong-subject case above. Nothing was collapsed into `rejected`: a CASE moved from a
      badly fitted verdict to a well fitted one, and every mechanism that did fit
      `insufficient_evidence` stayed there (see `verdicts.insufficient_evidence`).

      REJECTED ALTERNATIVE: a seventh member of the enum meaning "outside period". It would
      pull a share into `verdict_mix` and cost the downstream contract another revision, and
      it buys no precision a named cause on a fitting verdict does not already give.
    # THIS BLOCK IS ALLOWED TO CONTRAST, and the reason is not that it comes after the
    # definition — position licenses nothing. It is that the block is NOT LOAD-BEARING: `means`
    # and the two axis keys above decide the verdict on their own, so a reader classifying a
    # claim never has to come here, and one who skips the block entirely still gets the right
    # answer. It warns a reader who has already classified and is checking themselves. The rule
    # in `verdict_notes.definitions_name_their_own_slot` governs the text a reader MUST consult;
    # everything in it must be positive. Optional neighbours may contrast, and a key name that
    # announces itself as disambiguation is where they belong. If any entry below ever becomes
    # something a reader needs in order to classify, it stops qualifying and has to be rewritten
    # positively or folded into an axis key.
    not_to_be_confused_with:
      not_proof_of_payment: >
        A property of the DOCUMENT TYPE (`proves_payment: false`), not of item coverage. The
        canonical separating case is a pharmacy receipt listing nothing but medicines: it
        establishes payment, so it is not `not_proof_of_payment`, and it covers nothing, so
        it is `rejected`.
      exhausted_annual_limit: >
        A claim that covers something and is paid nothing because the persona has already
        drawn the annual maximum is NOT this verdict — the policy covers that purchase.
        policy.yaml names no verdict for it and `policy_engine._reimbursable` still raises.
      in_review: >
        The consumer's catch-all for a guard firing. A runtime outcome, not a label; see
        `verdict_decision_mapping`.
    emitted: >
      YES, BY BOTH MECHANISMS, SINCE VERSION 33. On the period route the claim's PAYMENT FELL
      OUTSIDE THE BENEFIT PERIOD, carrying the cause `outside_period`: `claim_planner` displaces
      such a claim's payment by a whole period, into the adjacent benefit year, on either side of
      the window; its basket is an ordinary covered basket, so `covered_fraction` is typically
      1.0 beside `reimbursable_amount` 0.00. On the coverage route the date is ORDINARY and the
      basket holds NO covered line — every item from the category's `excluded_items`, a covered
      fraction of exactly 0.0, and an empty `imperfection`: the verdict says the whole of it.
      How the bucket splits between the two is `rejected_routes` in policy.yaml.

      🔴 THE DEGENERACY THE SECOND ROUTE CLOSED IS WORTH ONE PARAGRAPH, because it is the reason
      the route was opened at all. Until version 33 every `rejected` claim was an out-of-period
      one, so the payment date ALONE predicted the verdict, and a false-approval rate measured on
      this label exercised exactly one rule — a system implementing only the period check would
      have scored perfectly. A consumer must not learn "`rejected` means the payment date is
      outside the window": on a corpus of this version it is true of the period route only. KL-07
      recorded the degeneracy while it held and is rewritten rather than deleted.
    share: >
      `verdict_mix` in policy.yaml declares 0.10 for this member since the revision that made it
      buildable. It read `null` before — a share, unlike a weight of 0, that the loader returns
      as `None` and that a consumer had to treat as absent rather than as zero. NO MEMBER OF THE
      MIX CARRIES `null` TODAY, and the rule about one is unchanged for whichever verdict is next
      declared before its mechanism exists: an undeclared share is absent, not zero, and the
      balance report reports the absent fraction of the mix as a LOWER BOUND when one appears.

      SINCE VERSION 33 THE BUCKET IS SPLIT BY ROUTE — `rejected_routes` in policy.yaml, 0.5
      each, with the even split reasoned and the both-routes-non-zero run size (59) derived
      beside the shares. The verdict's own 0.10 did not move.

      🔴 THE SHARE CAME OUT OF `covered`, WHICH FELL 0.50 TO 0.40, so the realizable subset still
      sums to 0.80 and the conditional rate of every other realizable verdict is unchanged. A
      consumer comparing a corpus generated before this revision with one generated after will
      find `covered` down by about ten points of the whole and the rest of the table where it
      was.

# The two enums, side by side. Stated as a table because the alternative is a consumer
# comparing verdict strings and scoring every correct decision as wrong — the exact failure
# `divergence_counterparty_name` was found live for, one field over.
verdict_decision_mapping:
  status: divergent
  mapping:
    covered: auto_approved
    partially_covered: partially_covered
    not_proof_of_payment: not_proof_of_payment
    insufficient_evidence: insufficient_evidence
    partially_paid: partially_paid
    rejected: rejected
  renamed:
    covered_vs_auto_approved: >
      THE ONLY RENAMING. Same concept, different word: the consumer's decision for a claim
      that passed with no flags is `auto_approved`, and the generator's label for a claim
      every line of which qualifies is `covered`. Neither name is wrong for its own side —
      `covered` is a statement about the claim, `auto_approved` about what was done with it —
      so this file maps them rather than choosing. See RC-13.
  consumer_only:
    in_review: >
      NO GENERATOR COUNTERPART, AND THERE SHOULD NOT BE ONE. `in_review` is the runtime
      outcome of a guard firing — arithmetic inconsistent, line items unreliable,
      segmentation uncertain, an unknown fiscal scheme — i.e. a statement about the
      consumer's own confidence, not about the claim. Generation is label-first: the verdict
      is chosen and then documents are built to realize it, and there is nothing in a chosen
      ground truth from which "a human should look at this" could be derived. A dataset
      cannot label a claim `in_review`; it can only contain claims that a given system's
      guards happen to route there, which is a measurement of that system.
    consequence_for_scoring: >
      An `in_review` decision matches no label. Score it as its own outcome — the rate at
      which the system defers, reported against the true verdict it deferred on — never as a
      miss on the verdict axis, or a system that correctly refuses to guess reads as one that
      guessed wrong.
  see: verdicts, for what each generator-side member means

verdict_notes:

  definitions_name_their_own_slot:
    # NO `status`, deliberately. Every value in `status_vocabulary` says something about whether
    # a LABEL exists or is disputed, and this key is a construction rule for this file's own
    # prose — nothing in a dataset corresponds to it. `emitted` in particular would tell a
    # consumer filtering on it that a style rule was observed in a run and may be relied upon.
    # The file's convention is that a `status` belongs to a section describing a label; this
    # section does not.
    note: >
      HOW THE EVIDENCE VERDICTS IN `verdicts` ABOVE ARE CONSTRUCTED, and the rule for amending
      them. `document_evidence` carries TWO facts plus the LINKAGE between them — three slots.
      Each slot has a name, and each definition states ITS OWN SLOT and nothing else.
    slots: |
      fact not established            verdict                 cause in `imperfection`
      ------------------------------  ----------------------  ---------------------------
      that MONEY MOVED                not_proof_of_payment    none - the verdict says it all
      that a PURCHASE was made        insufficient_evidence   subject_not_evidenced
      that the two are ONE            insufficient_evidence   amount_mismatch,
      TRANSACTION                                             payment_precedes_subject,
                                                              counterparty_mismatch,
                                                              subject_mismatch
    the_test_an_edit_must_pass: >
      A BARE INVOICE MUST BE CLASSIFIABLE FROM `verdicts.not_proof_of_payment.means` ALONE, with
      no mention of any other verdict in it. An invoice is a `proves_payment: false` type, the
      money-moved slot is therefore unestablished, and that is the answer — reached without
      consulting a second definition. Apply the mirror test to each of the others. If definition
      A has to mention B to work, it is still relational, and the next edit to B moves A.
    no_exception_clauses: >
      A definition must carry no clause of the form "and case X is NOT this verdict". Under the
      three-slot form such a clause excludes nothing that was ever included — a bare invoice
      fails the money-moved slot and no other, so it never fell under `insufficient_evidence` to
      be excluded from it. Such a clause is not a harmless safety rail: it re-introduces exactly
      the cross-reference the structural form exists to remove, while looking like care. One was
      added to three artifacts during this very repair and then deleted for that reason.
    what_the_rule_governs_and_what_it_does_not: >
      THE CRITERION IS WHETHER THE TEXT IS LOAD-BEARING FOR CLASSIFICATION, and it is the only
      criterion. The rule governs text a reader must consult to decide what a claim is called —
      `means`, and anything a definition folds into itself. Such text must be positive: it must
      name its own slot and reach the answer without reading another verdict's entry.

      Text that is NOT load-bearing may contrast freely. The example in this file is the
      `not_to_be_confused_with` block on `verdicts.rejected`: that verdict's `means` together with
      its two axis keys is self-sufficient, so classification never enters the block, and a reader
      who skips it
      entirely still arrives at the right verdict. It exists to warn a reader who has already
      classified correctly and is checking themselves. Being optional is what makes the contrast
      safe, and a key whose NAME announces it as disambiguation is where such text belongs.

      NOT A CRITERION: where the text SITS. "It comes after a positive definition" licenses
      nothing — `not_the_same_as_a_missing_subject` also sat after a positive definition and was
      renamed, because it was reached while classifying and its name presented a complement as
      the thing to know. Position is not a property; reachability is. Ask what a reader must read
      to answer the question, and require every sentence in that set to be positive.
    why_it_is_not_style: >
      Both evidence verdicts were once written as "the one that is not the other". Under that
      construction, editing the boundary of either SILENTLY MOVES the boundary of the other, and
      nothing local to the edit reveals it. It has gone wrong twice: once when
      docs/architecture.md's imperfection catalogue listed "no proof of payment" under a second
      verdict as well, leaving `not_proof_of_payment` unreachable by any mechanism either source
      described; and again when a later repair narrowed `insufficient_evidence` to "a document is
      missing" and thereby reclaimed the bare-invoice case — written, at the time, while actively
      guarding against the first. A sharper boundary buys time. A slot buys the property.

      THE GENERAL FORM, which is not specific to verdicts: whenever several names partition a
      space, define each by its own position in the structure being partitioned. **A definition
      of the form "X is the case that is not Y" is a defect even when it is, at that moment,
      accurate** — its accuracy depends on a sentence elsewhere that nothing links it to.

  why_this_boundary_slips:
    status: divergent
    note: >
      WHY THIS PARTICULAR PAIR INVITES THE ERROR, recorded so the next recurrence is expected
      rather than surprising. The split is ASYMMETRIC. The payment slot has a verdict of its own,
      `not_proof_of_payment`; the purchase slot has no verdict of its own and lives as a CAUSE,
      `subject_not_evidenced`, under `insufficient_evidence`. Two facts of equal standing in
      `document_evidence`, at two different levels of the label.

      THE ASYMMETRY IS NOT THIS GENERATOR'S CHOICE. It comes from the CONSUMER'S vocabulary,
      which carries `not_proof_of_payment` and carries no counterpart for the subject half — so
      the generator cannot make the partition symmetric without inventing a verdict the consumer
      cannot receive. Marked `divergent` for that reason: it is a property of the two sides, not
      a defect in either.

      THE CONSEQUENCE FOR EDITORS: an asymmetric partition is harder to state than a symmetric
      one, so every prose edit TENDS TO LEVEL IT — "a document is missing" is the symmetric
      sentence, and it is wrong precisely because it covers both halves. Both recurrences took
      that shape. This deserves a check of its own on any edit to either definition, not a
      general resolve to be careful.

  missing_from_the_generator:
    status: divergent
    note: >
      One member of the consumer's `Decision` enum has no counterpart in `Verdict`, and only
      one: `in_review`. `rejected` used to be the other and no longer is — it was added to
      `Verdict`; see `verdicts.not_proof_of_payment.decided`. The full correspondence, and
      why `in_review` is not a gap to be closed, are in `verdict_decision_mapping`. What is
      left of RC-13 is the `covered` / `auto_approved` naming and the two-axis question under
      `verdicts.partially_covered`.

  realizability:
    status: emitted
    note: >
      ALL SIX VERDICTS ARE BUILDABLE (`claim_planner.REALIZABLE_VERDICTS` holds the whole enum,
      and each member's entry there records what made it realizable and when). This note read
      "Only `covered` and `partially_covered` can be built today … the other four are refused" —
      true through version 12 and left standing while the enum filled: the
      third arrived at 13, the fourth at 26, the fifth at 27, the sixth at 28, and this file's own
      history records each. The conditionality it warned about is GONE with the subset: the
      realizable set is the whole mix, the renormalization denominator is 1.00, and a realized
      distribution compares against `verdict_mix` directly. What remains true is the other half:
      the balance report says where the ORACLE overruled a TARGET, and that is still not the
      dataset's balance against the mix.

  distribution:
    status: emitted
    note: >
      `verdict_mix` in policy.yaml is a DATASET-BALANCE decision, not an estimate of any
      real-world distribution, and no production class prior is defined anywhere in this
      repository — that assumption belongs to a consumer's evaluation configuration. The full
      reasoning, and the obligation it places on anyone measuring against this dataset, is in
      policy.yaml above `verdict_mix` and in config/README.md; it is not repeated here.


# =============================================================================
# 6. The claim label
# =============================================================================
#
# One record per claim, written to `labels/<claim_id>.claim.json` and repeated in the
# `claims` array of `ground_truth.json`. Model: `ClaimGroundTruth`; the derived values come
# from `policy_engine.evaluate_claim`. Every key is present in every record.

# ---------------------------------------------------------------------------
# 6a. How a claim's documents become its amount
# ---------------------------------------------------------------------------
#
# A CLAIM'S AMOUNT IS NOT THE SUM OF ITS DOCUMENTS, and a consumer that computes it as one
# gets a plausible verdict off a doubled figure. This block states the rule the labels were
# derived under, because nothing in the label files makes it visible: `documents` is a flat
# list of ids and does not say which of them describe the same money.
#
# The rule is read off `document_evidence` in policy.yaml and nothing else. A document that
# proves payment attests to a movement of money; a document that proves only the subject
# describes money some payment document already attests. So:
#
#   * an invoice plus the payment confirmation that settles it are ONE transaction. The
#     claim's line items are the invoice's, counted once, and the payment adds no money of
#     its own — it supplies the amount the invoice is CROSS-CHECKED against.
#   * several fiscal receipts are several transactions, and their money does add. Each is
#     its own payment. That is the same rule, not an exception to it.
#
# Implemented in `policy_engine.resolve_evidence`, whose `Transaction` pairs a subject
# document with the payment that settles it.

claim_evidence:
  status: emitted

  shapes_the_generator_can_resolve:
    self_contained: >
      Every payment document proves its own subject and no other document is present. One
      transaction per document; their amounts add. This sentence closed "THE ONLY SHAPE ANY
      DATASET CONTAINS TODAY, since the single registered archetype is a fiscal receipt" — true
      when written and stale from version 12 on, when the invoice made the pair buildable. Both
      shapes are ordinary now, and the PAIR is the majority: RP-06's corpus is 587 two-document
      claims against 141 receipts.
    one_split_pair: >
      Exactly one document proves the subject, exactly one proves the payment, and they are
      different documents. One transaction described twice, counted once.

  shapes_that_are_refused:
    status: emitted
    note: >
      `policy_engine` RAISES rather than labelling, because the guess would decide the
      claim's amount. A fiscal receipt beside an invoice is either the same purchase
      described twice or two purchases one of which was never paid; one invoice beside two
      payments leaves open which payment settles it. `document_evidence` answers neither.
    bank_statement: >
      NO LONGER REFUSED, AND THE SENTENCE THAT REFUSED IT IS KEPT IN THE PAST TENSE because a
      consumer diffing an old copy comes looking for it. It read: "REFUSED OUTRIGHT … a statement
      lists several transactions while its label carries a single `amount` for the whole document,
      so nothing identifies the row a given claim is about … it has to be settled before a
      statement archetype lands." It WAS settled before the archetype landed — by
      `the_label_is_one_transaction` and the `relevant_transaction` pointer, at version 11, which
      is exactly the resolution the refusal demanded (the open question it cited now lives at
      `document_types.bank_statement.decided_in_version_11`). A statement resolves as the payment
      half of a split pair, its labelled row identified by the pointer; what remains refused is a
      statement whose relevant row NOTHING identifies, which the generator does not produce.

  cross_checks:
    status: emitted
    note: >
      Applied to a split pair only; a self-contained document cannot disagree with itself
      about which payment settled it. Failing one is `insufficient_evidence` with the
      cause in `imperfection` — NOT a flag on a coverage-determined verdict, which would
      let a claim whose documents contradict each other come out `covered`.

      🔴 WHICH CHECKS ARE APPLIED IS DECLARED IN config/policy.yaml, under
      `cross_document_agreement`, and is no longer a list inside the engine. Each entry names the
      AXIS and the OUTCOME — the verdict and the cause a failure earns — so a consumer building its
      own engine reads both from the same file the labels were derived from, and an axis withdrawn
      there is a check neither engine performs. The four below are what that block declares today;
      the block is the authority and this section describes it.
    amount: >
      The subject document and its payment state the same amount, compared to two decimal
      places. Cause `amount_mismatch`. Axis `amount`.
    order: >
      The payment is not dated BEFORE the document it settles. Strictly before: paying an
      invoice on the day it is issued is ordinary. Cause `payment_precedes_subject`. Axis
      `date_order`.
    counterparty: >
      The subject document and its payment name THE SAME PARTY — an invoice issued by one seller
      beside a payment made to another does not establish that this money settled that obligation,
      however well the amounts and the dates agree. Cause `counterparty_mismatch`. Axis
      `counterparty`.

      COMPARED ON THE `counterparty` LABEL FIELD, raw, which carries the BARE trading name on every
      class (`normalization.party_name` makes that form authoritative, so the comparison needs no
      normalization of its own). ⛔ THE COUNTERPARTY'S TAX NUMBER IS NOT COMPARED, and cannot be:
      no label field of any class carries it. That is the consumer cross-check named in
      `claim_label.linked` and it stays unperformed for want of a field, not for want of a rule.
    subject: >
      Where the payment's purpose names the рахунок it settles, it names THE CLAIM'S OWN subject
      document. Cause `subject_mismatch`. Axis `subject`. Compared on `cites_document_no` against
      the subject document's `document_code`, and ONLY where both are stated — ⛔ ABSENCE IS NEVER
      A DISAGREEMENT: a generic formula, a ВН citation and an unprinted purpose line all leave the
      axis silent, which is what keeps the ordinary citation noise KL-16 documents from becoming
      a verdict. What the axis catches is the one defect no other axis can see — the right money,
      to the right party, in the right order, declared on the payment's own face to settle a
      DIFFERENT purchase.

      ⚠️ IT IS NOT A SUBJECT-CONTENT COMPARISON. A payment document states no basket
      (`proves_subject: false` is unchanged, and remains 👁-grounded); what it states is a
      document NUMBER, and the number is the whole of what is compared.
    not_checked_here: >
      Whether a document's own stated `amount` equals the sum of its own line items. That
      is a DOCUMENT invariant, owned by `content_builder.validate_line_item_sum`,
      deliberately without a caller on the honest path, and it belongs to the fraud
      archetypes that will break it on purpose. See `document_label.amount.invariant`.

  period_and_date:
    status: emitted
    claim_date: >
      A claim is dated by its PROOF OF PAYMENT — the earliest payment document where it
      carries several — and not by its earliest document. A limit is consumed when money
      moves; the earliest document is the invoice, which is the date of the obligation. The
      claim label carries no date field, so this is visible only in the ORDER claims consume
      a persona's annual balance in.
    period: >
      Checked on the PAYMENT DATE ONLY. A December invoice paid in January is an ordinary
      January expense, not a period failure — the subject document's date is checked for
      order instead (see `cross_checks.order`). A payment that does fall outside the window
      makes the claim `rejected` with the cause `outside_period`, and NOT
      `insufficient_evidence`, which it was labelled until this revision: see
      `verdicts.rejected.by_when_it_was_paid`.

  what_is_not_recorded:
    status: divergent
    note: >
      WHICH DOCUMENT PROVED WHAT IS NOT IN THE LABEL. The pairing above is derived at
      evaluation time from `document_evidence` and the document's TYPE; no field of
      `ClaimGroundTruth` or `DocGroundTruth` carries a document's role in the claim, so a
      consumer holding only the labels re-derives it the same way. `policy_trace` names the
      pairing in prose, and prose is not comparable. See RC-15.
    consequence_for_archetypes: >
      Because the role is type-level, an archetype whose evidence DIFFERS from its type's
      default — policy.yaml's example is a bank confirmation whose payment purpose spells
      out what was bought — cannot be labelled correctly and must not be registered. The
      override is described in policy.yaml and exists nowhere in `src/`;
      `claim_planner.Archetype` says so at its head.

claim_label:
  status: emitted
  file: "labels/<claim_id>.claim.json"

  fields:

    - name: claim_id
      type: string
      required: true
      normalize: identity

    - name: persona_id
      type: string
      required: true
      normalize: identity
      note: >
        The only link from a claim to the person who filed it; document labels carry no
        persona reference. The join is document -> claim -> persona. See `persona_record`.

    - name: category
      type: string
      required: true
      normalize: policy_vocabulary
      vocabulary: the `id` of a category in policy.yaml
      answers: which benefit the claim is made against — the scope every coverage answer is relative to

    - name: documents
      type: array of string
      required: true
      normalize: identity
      normalize_applies: >
        PER ELEMENT. Each entry is a `doc_id`, compared under `identity` like any other opaque
        dataset key; the array itself is a join and is not a comparable value. This key read
        `normalize: identity per element` until version 21, which named no rule —
        `normalization[field.normalize]` raised on it. The rule is now in the index and the
        qualifier is here.
      answers: which document labels make up the evidence
      cardinality: >
        ONE OR TWO, and which is a property of the CLAIM'S EVIDENCE rather than a constant: one
        where a single document proves both facts (a fiscal or platform receipt) or where a gap is
        the point (a bare payment, a bare subject), two where the evidence is split across the
        dominant pair. The pair is the majority of the delivered corpus — RP-06 counts 587
        two-document claims. This key read "exactly one in every run so far … the one registered
        template is a fiscal receipt", which described version 9 and nothing since. Nothing in the
        pipeline assumes either count.
      ordering: >
        The order the assembler wrote them in, which for a split claim is subject first and
        payment second. Do NOT read a role off the position: the pairing is derived from
        `document_evidence` and the document's type. See `claim_evidence`.
      joining: >
        A document belongs to exactly one claim, and this list is the join. Do not pair the
        `claims` and `documents` arrays of `ground_truth.json` positionally — that only
        works while every claim has one document.

    - name: verdict
      type: enum
      required: true
      normalize: closed_enum
      vocabulary: see `verdicts`
      authority: >
        Derived by `policy_engine` from the documents actually built and the persona's
        ledger — not the verdict the planner aimed at. Where the two differ the engine wins
        and the balance report says so, so no label reaches the dataset that nothing derived.

    - name: covered_fraction
      type: number or null
      required: false
      normalize: fraction
      answers: HOW MUCH OF THE DOCUMENT BELONGS TO THE CATEGORY
      definition: covered amount over total amount, from the line items and nothing else
      note: >
        Reported, never used as a tolerance — the coverage rule is strict. A claim held back
        only by an exhausted limit reads 1.0 alongside `verdict: partially_covered`, which is
        two facts kept apart rather than a contradiction. The reasoning is in
        docs/architecture.md#ground-truth.
      absence: >
        `null` means nothing derived a fraction. TWO CAUSES, and they are different states: an
        undecided claim, which is what the default of the model is for; and a claim with NO LINE
        ITEMS to compute a fraction from — one evidenced by a payment and nothing saying what it
        bought. `null` is emphatically not `0`, which says the lines were read and none of them is
        covered. THE SECOND KIND IS IN THE DATA since version 25 (`subject_not_evidenced`), so a
        consumer meets real records carrying `null` here beside `insufficient_evidence` — verified
        against `generate-dataset --seed 9105 --personas 12 --claims-per-persona 3 --split 0.5`,
        two of whose claims carry exactly that shape. The sentence "present and non-null on every
        record written so far, because no archetype produces a claim of the second kind" described
        the corpus before that version and is withdrawn.
      definition_across_documents: >
        Covered amount over total, over the line items of the claim's SUBJECT documents,
        counted once per transaction — not over every document's lines. An invoice and the
        payment that settles it describe one purchase. See `claim_evidence`.

    - name: reimbursable_amount
      type: number or null
      required: false
      normalize: money
      answers: HOW MUCH THE PLAN ACTUALLY PAYS OUT
      definition: >
        The covered amount, capped by what is left of the annual limit, in policy.yaml's
        `reporting_currency`. It is the only field that distinguishes a limit-bound claim
        numerically.
      divergence:
        status: divergent
        note: >
          DIFFERENT ARITHMETIC FOR THE SAME QUANTITY. The generator computes Σ(covered
          lines). The consuming system is required to compute `total − Σ(excluded lines)`,
          deliberately, so that a MISSED line surfaces as a discrepancy instead of a silent
          underestimate. THE TWO AGREE EXACTLY ON THIS DATASET, because the ground truth
          satisfies Σ(all lines) = total by construction; they diverge only when extraction
          loses a line, which is the case that subtraction exists for. No generator change
          follows — this is recorded so a consumer does not read the agreement as a licence
          to compute it the generator's way.
      absence: >
        `null` would mean nothing derived an amount — and unlike `covered_fraction`, WHICH IS NULL
        ON REAL CLAIMS, this field is a number on every record written so far: a claim that
        reimburses nothing carries 0.00, including the payment-only claims whose fraction is
        `null`. The two fields part company on exactly those records — nothing to compute a
        fraction FROM is not the same statement as nothing being paid OUT — and this key read
        "same as `covered_fraction`" while the two behaved the same, which stopped at version 25.

    - name: linked
      type: boolean
      required: true
      answers: whether the evidence is split across more than one document
      definition: "`len(documents) > 1`, exactly"
      observed: >
        BOTH VALUES, and `true` is the majority: every split-pair claim is linked, and the pair
        dominates the corpus (RP-06: 587 of 728 claims). This key read "always false — linked
        claims need archetypes that do not exist yet", which described the registry before
        version 12.
      note: >
        The consumer models this richly: `DocumentLink` carries the result of named
        cross-checks (amount, date order, counterparty tax number, payment form, contract
        party against payee, date within period), and each `ClaimDocument` carries its role
        in the link (`proof_of_subject` / `proof_of_payment`). The generator has the role
        information at TYPE level in policy.yaml's `document_evidence` and records nothing
        per document. See RC-15.
      partly_closed: >
        THREE of the consumer's cross-checks are now PERFORMED, though still not recorded per
        document: amount agreement, date order, and THE PARTY — an invoice issued by one seller
        beside a payment made to another — between a subject document and the payment that settles
        it. A claim failing one is `insufficient_evidence` with the cause in `imperfection` — see
        `claim_evidence.cross_checks`. ⚠️ THE PARTY CHECK IS ON THE NAME AND NOT ON THE TAX NUMBER,
        which is a different cell of the requirement's table: the counterparty's tax number,
        the payment form and the contract party are still not compared, because no generator field
        carries any of them (see `document_types.payment_confirmation`).

    - name: imperfection
      type: array of string
      required: false
      normalize: string_list_unordered
      answers: >
        WHY the verdict is what it is, where the verdict alone does not say. One verdict,
        several named causes — a consumer can know different things about each, so neither
        absorbs the other.
      vocabulary:
        # Causes of `partially_covered`. These two, and only these two, are declared in
        # policy.yaml — as `partially_covered_causes`, which exists to give them SHARES of
        # the dataset.
        mixed_items: a non-covered line is on the document — VISIBLE IN THE IMAGE
        limit_exhausted: the annual balance ran out — NOT VISIBLE IN THE IMAGE
        # Causes of `insufficient_evidence`, one per slot it owns: the WHAT-WAS-BOUGHT slot and
        # the ONE-TRANSACTION slot (see `verdict_notes.definitions_name_their_own_slot`).
        # POLICY.YAML NAMES ALL FIVE — under `insufficient_evidence_causes`, which exists to
        # give them SHARES of that verdict's bucket, exactly as `partially_covered_causes` does
        # above. That is a DRAW and not a vocabulary: `policy_engine` derives a cause from a
        # claim's documents without consulting a share, so a cause whose share was removed would
        # still be returned and still reach a label. The names are `policy_engine`'s, exported as
        # module constants, and THIS FILE is where the vocabulary is contracted.
        # ⛔ `outside_period` below has a ROUTE share rather than a cause share: `rejected`'s two
        # routes are both drawn since version 33, and `rejected_routes` in policy.yaml is what
        # splits the verdict's bucket between them. It is a route map and not a cause map,
        # because the zero-coverage route carries NO cause at all — the label tells the routes
        # apart by the PRESENCE of `outside_period`, per `cardinality` below.
        subject_not_evidenced: >
          The WHAT-WAS-BOUGHT slot: no document of the claim is of a type that states it — a
          bare transfer. That slot has no document at all.
        amount_mismatch: >
          The ONE-TRANSACTION slot: a subject document and the payment that settles it state
          different amounts, so the claim does not establish that THIS payment paid for THIS
          subject.
        payment_precedes_subject: >
          The ONE-TRANSACTION slot again: the payment is dated before the document it settles,
          an impossible order. Checked between the two documents of a pair, not against the
          benefit period, which is a different rule with a different verdict.
        counterparty_mismatch: >
          The ONE-TRANSACTION slot a third time, and the first cause of it that is not about a
          number: the subject document was issued by one party and the payment was made to
          another, so the money that left the account settled some other obligation. Both
          documents may be flawless and the amounts and dates may agree exactly.

          🔴 A CONSUMER CANNOT DERIVE IT FROM THE AMOUNTS OR THE DATES — the only field that
          differs is `counterparty`, and comparing it across a claim's documents is the whole of
          the check. See `claim_evidence.cross_checks.counterparty`, and
          `cross_document_agreement` in policy.yaml, which is where the axis and this cause are
          declared together.
        subject_mismatch: >
          The ONE-TRANSACTION slot a fourth time, and the axis that closes the transaction's
          last dimension: the amount says HOW MUCH, the counterparty TO WHOM, the order WHEN —
          this one says FOR WHAT. The payment's purpose line cites a рахунок by number, and the
          number is not the subject document's own: the payment declares, on its own face, that
          it settles a DIFFERENT purchase. Amounts, dates and parties may all agree exactly.

          🔴 ONLY A STATED CITATION CAN EARN IT. `cites_document_no` is `null` on a generic
          formula, a ВН citation and an unprinted purpose line, and every such claim passes the
          axis whatever else is true of it — absence is never a disagreement. See
          `claim_evidence.cross_checks.subject`, and KL-16, whose ordinary citation noise this
          cause is deliberately deaf to.
        # The one cause of `rejected`, and the only one that verdict needs: its other
        # mechanism, a basket the category covers none of, is the whole of what the verdict
        # already says.
        outside_period: >
          The PAYMENT falls outside `period` in policy.yaml, so the claim is `rejected` — the
          policy plainly does not cover it, by WHEN rather than by WHAT. Under
          `insufficient_evidence` until this revision; see
          `verdicts.rejected.by_when_it_was_paid`. The subject document's date is not checked
          against the period at all — see `claim_evidence.period_and_date`.
      cardinality: >
        Empty on a `covered` claim, empty on `not_proof_of_payment`, and empty on a `rejected`
        claim whose basket is what the policy does not cover — in each case the verdict says
        the whole of it. Several causes may appear on one claim: both `partially_covered`
        causes, for which policy.yaml declares no share, and several cross-check causes, where
        one pair of documents disagrees on more than one axis.
      verdict_scope: >
        A cause never appears under a verdict it does not belong to. Three disjoint sets —
        two `partially_covered` causes, five `insufficient_evidence` causes, one `rejected`
        cause — so a cause always determines its verdict, and a consumer may key on the cause
        to recover the verdict.

        THE CONVERSE NO LONGER HOLDS EVERYWHERE, and this is the one asymmetry to read
        carefully. `partially_covered` and `insufficient_evidence` always carry a cause, so
        for those two the verdict and the cause induce the same partition. `rejected` does
        not: it arrives either through the period, carrying `outside_period`, or through zero
        coverage, carrying nothing. So a consumer keying on the cause must treat "no cause"
        as a value rather than as missing data, and must not assume every `rejected` claim
        names one.
      narrower_than_the_catalogue: >
        docs/architecture.md#imperfection-catalogue names the mechanisms; only these seven
        reach a label, because only these seven are mechanisms whose verdict does not say by
        itself which of them applied — read PER ROUTE rather than per verdict, since
        `rejected` names a cause on its period route and none on its coverage route. Where the
        others will be recorded is not decided. The consumer's counterpart is
        `ValidationFlag` plus the guard reasons (`line_items_unreliable`,
        `arithmetic_inconsistent`, `segmentation_uncertain`), which are runtime outcomes
        rather than labels.

    - name: verdict_basis
      type: array of string
      required: false
      normalize: string_list_unordered
      answers: WHAT THE VERDICT DEPENDS ON
      vocabulary:
        documents: derivable from the images alone
        account_state: also requires the persona's spending history
      how_to_use_it: >
        No model can read a remaining annual balance off a receipt, so document-understanding
        metrics belong on the `["documents"]` subset only and end-to-end metrics on both.
      absence: an empty array means nothing derived a basis, not that the verdict rests on nothing

    - name: policy_trace
      type: array of string
      required: false
      normalize: prose_not_comparable
      answers: WHY the verdict is what it is, in human-readable form
      contents: >
        Only what the verdict rested on: a limit that did not bind is not mentioned, and a
        claim rejected for its date says so without arguing about coverage. An invented
        example of the limit-bound shape:
          - "category=<category id> ok"
          - "period ok"
          - "coverage 100% (all line items covered)"
          - "annual limit <category id> 9000.00 UAH: 8100.00 already reimbursed, 900.00 remaining"
          - "reimbursable 900.00 UAH of 2400.00 covered — annual limit exhausted"

    - name: fx_rates
      type: array of object
      required: true
      # `money` governs the one member a consumer compares numerically: `rate` serializes
      # exactly as an amount does, so trailing zeros are lost — 45.00 is written 45.0.
      # The other members are lookups, not comparisons: `doc_id` and `currency` match
      # exactly, `on` is an ISO date.
      normalize: money
      status: emitted
      emitted_since: >
        VERSION 31 AS A FACT — the field landed at 30 and the class that populates it at 31 — and
        VERSION 34 AS A WORD. A non-empty array is a BUCKET SHAPE (it needs a claim drawing
        `eu_platform_receipt`, one archetype of one category), so per `sources.reference_run`'s
        rule the run that contains one is named beside the statement: verified against
        `generate-dataset --seed 9105 --personas 12 --claims-per-persona 3 --split 0.5`, whose
        EUR claim carries `{doc_id, currency: EUR, rate: 45.0, on}` and whose
        `reimbursable_amount` reproduces as Σ(covered lines) × rate, quantized as
        config/fx-rates.yaml declares — checked by hand for this version.
      answers: WHICH RATE THE ORACLE APPLIED to each document not stated in the reporting currency
      shape: >
        One object per converted document: `doc_id` (which document), `currency` (what the
        rate converts FROM — the target is always policy.yaml's `reporting_currency`),
        `rate` (reporting-currency units per 1 unit of `currency`, verbatim from
        config/fx-rates.yaml), `on` (the date the rate was taken at — the document's own
        date, repeated so the record stands alone). An EMPTY ARRAY means nothing was
        converted: every document of the claim is already in the reporting currency, and
        an identity rate on each of them would be noise dressed as information.
      definition: >
        The rate itself, not only its result. A converted amount is provable exactly when
        the label carries the applied rate beside the original amount, currency and date —
        amount × rate, quantized at the point fx-rates.yaml declares (`conversion`:
        sum-then-convert-then-quantize, step 0.01, half-up), is then reproducible by
        anyone holding the same vendored table. The rate is recorded whatever branch the
        verdict took: a rejected foreign-currency claim still carries it, because a
        consumer re-deriving any of its amounts needs the same constant the oracle read.
      the_shared_artifact_is_a_constant_not_a_library: >
        🔴 THE INDEPENDENCE OF THE LABELLING FROM THE ENGINE EVALUATED AGAINST IT IS NOT
        COMPROMISED BY THIS FIELD, and the boundary is worth stating because it is easy to
        blur from either side. What the two sides share is a CONSTANT — the vendored rate
        table and its declared quantization point, the same class of artifact as the
        currency code or the field names of this file: if the two sides take different
        numbers, comparison is meaningless, so vendoring is MANDATORY here. What they must
        NOT share is INTERPRETATION — each side implements the conversion arithmetic
        independently from the declaration, exactly as each derives verdicts independently
        from policy.yaml. A shared conversion LIBRARY would be the two engines being one
        engine, and the symmetry check between them would measure nothing.
      derived_not_extractable: >
        ⚠️ NO CONVERTED AMOUNT IS AN EXTRACTION TARGET. The conversion appears on no
        document — 👁 no public source shows a platform receipt stating a rate or an
        equivalent in the buyer's currency — so a per-field score on a converted figure
        measures nothing about extraction. It is a DERIVED quantity: score it only as
        arithmetic over (amount, `rate`), never as a field read off pixels. The same trap
        this file already names for `amount_due`.
      static_rates_are_a_declared_gap: see KL-17.

    - name: split
      type: enum or null
      required: true
      normalize: closed_enum
      vocabulary: [train, validation]
      status: emitted
      answers: which side of the train / validation partition this claim and all its documents are on
      see: >
        `document_label.fields.split`, which carries the whole reasoning. A CLAIM AND ITS DOCUMENTS
        CANNOT DISAGREE: the unit of the partition is the persona, which sits above both, so the
        value here always equals the value on every document this claim names.


# =============================================================================
# 7. The persona record
# =============================================================================
#
# `claim_label.persona_id` sends a consumer here, so the shape is documented rather than
# left to be discovered. Model: `Persona`. Personas appear ONLY in the `personas` array of
# `ground_truth.json` — there is no per-persona label file.
#
# NOT AN EXTRACTION TARGET. Nothing about a persona is printed on a document and none of
# these fields is scored. The record exists so that `verdict_basis: account_state` is
# auditable: a limit-bound verdict can be re-derived only if the person it belongs to is
# identifiable.
#
# Every value is invented. `city` and the given name come from Faker, the surname from the
# narrowed high-frequency set under `personal_names` in config/generation.yaml — see that
# block for why it is narrowed; `tax_id` is a checksum-correct РНОКПП generated from a drawn
# birth date — a well-formed identifier belonging to nobody.

persona_record:
  status: emitted
  location: "ground_truth.json -> personas[]"
  fields:
    - name: persona_id
      type: string
      normalize: identity
    - name: full_name
      type: string
    - name: location
      type: "object { country, city }"
      note: "`country` is the `Country` enum — UA, PL, DE, ES. `city` is free text."
    - name: home_currencies
      type: array of string
      normalize: open_enum
    - name: languages
      type: array of string
      normalize: open_enum
    - name: tax_id
      type: string
      note: РНОКПП in UA — the individual taxpayer number, checksum-correct
    - name: family
      type: "array of { relation, name, birth_date }"
      note: "`relation` is free text (spouse | child); empty on most personas"
    - name: benefit_categories
      type: array of string
      normalize: policy_vocabulary


# =============================================================================
# 8. Where the labels are
# =============================================================================

artifacts:
  status: emitted
  layout:
    "images/<doc_id>.png": the document as it would have been captured, after degradation
    "labels/<doc_id>.json": one `document_label` record
    "labels/<claim_id>.claim.json": one `claim_label` record
    "ground_truth.json": >
      The manifest for a run: `generator_version`, `seed`, `synthetic: true`, a `split` block, and
      the arrays `personas`, `claims`, `documents`. The claim and document arrays hold exactly the
      same records as the per-file labels — a second view, not a different set.
  there_is_no_separate_manifest_file: >
    `ground_truth.json` IS the manifest and the index; nothing writes a `manifest.json`. A second
    file holding a subset of this one would be a second statement of the same thing, and the first
    edit to either would make them disagree with nothing to notice it. An earlier README named a
    `manifest.json` and a `balance-report.md`; neither ever existed, and the README now describes
    what the generator writes.
  balance_report: >
    PRINTED TO STDOUT, not written to a file — redirect it to keep it. It covers verdicts against
    `verdict_mix`, imperfection causes, document classes against a per-class minimum, currency,
    language, capture channels with their completeness subsets, and the partition. Two rules hold
    throughout, and they are the reason it is worth reading: EVERY FIGURE CARRIES ITS DENOMINATOR,
    and ANYTHING WITH NO DATA IS REPORTED AS ABSENT RATHER THAN AS ZERO — a class no archetype can
    build, a channel no document took, a partition side too small to exist. It is not a pass/fail
    gate and does not tune anything; it makes a shortfall visible and leaves it.
  split:
    unit: persona
    stratified: false
    manifest_block: >
      `split` in `ground_truth.json` carries the DECISION — `unit`, `train_fraction_requested`,
      `stratified`, and the realized persona / claim / document counts per side — and NOT the id
      lists. Each claim and document carries its own `split`, which is the single statement of where
      that record went. `null` where no partition was computed.
  encoding: UTF-8 JSON, two-space indent, non-ASCII written literally rather than escaped
  determinism: >
    Every run is fully determined by `--seed`, so a scorecard may rely on the same seed
    producing the same labels.


# =============================================================================
# 9. Known limitations of the dataset
# =============================================================================
#
# Where a label is recoverable from something other than reading the document properly.
# Sections 1–8 say what the labels ARE; this one says where measuring against them will
# flatter a consumer, so that nobody discovers it from a production regression instead.
#
# WHY IT IS IN THE CONTRACT AND NOT IN A CODE COMMENT. A consumer reads this file. It does
# not read `content_builder.py`, and it should not have to: a limitation recorded only in
# the generator's internals is a limitation nobody downstream will ever meet.
#
# WHICH ENTRY MATTERS TO WHOM IS `hurts:`, AND IT IS A LIST. Every entry carries one, holding one
# or more words of `hurts_vocabulary` directly below — an entry may be hurtful in more than one
# way at once, and SEVEN OF THE SEVENTEEN are (re-derived at version 34; earlier readings — "three
# of the thirteen" at version 23, "seven of the sixteen" at version 29 — were each left behind by
# the entries added after them). 🔴 SO A CONSUMER SELECTS BY MEMBERSHIP, `"evaluation"
# in entry["hurts"]`, AND NEVER BY EQUALITY. Until version 23 the slot was a comma-joined STRING and
# this comment told a consumer to compare it against one — which was false for exactly the three
# entries that carry two words, so a consumer following these instructions silently dropped the
# three limitations that reach it in more than one way. Punctuation had been structural; a comma is
# now a list separator or a parse error.
#
# TWO KINDS OF CONSUMER ARE HURT IN DIFFERENT WAYS, which is what the first two words are for; the
# third, `reporting`, is defined with them below:
#
#   A consumer that TRAINS on this dataset accumulates a shortcut across examples. Given a
#   predictor that correlates with the label, it can reach a good score without learning the
#   rule at all, and the loss shows up only on data where the correlation does not hold.
#   Every entry below is a live risk for such a consumer.
#
#   A consumer that PROMPTS a language model accumulates nothing: it sees one document per
#   call and carries no state between them, so it cannot learn "this seller means fully
#   covered". The leak does not reach the model — it reaches the SCORECARD, and through it
#   the human tuning prompts and thresholds against these numbers. A metric measured here is
#   then an estimate of behaviour on this dataset's distribution and not on an open world,
#   and the person adjusting a prompt until the number rises is the channel by which the
#   bias arrives. Entries whose `hurts:` CONTAINS `evaluation` are the ones that reach this
#   consumer — TEN OF THE SEVENTEEN, SEVEN OF THEM ALSO CONTAINING `training` (re-derived at
#   version 34; it read "three of them" at version 23 and "nine of the sixteen" at version 29 —
#   equality would today miss all seven double-carriers).
#
# This is the same obligation policy.yaml states for `verdict_mix`, applied to predictors
# rather than to class shares: report what was measured, and say on what.
#
# 🔴 NO FIGURE APPEARS IN THIS SECTION, HERE OR IN ANY ENTRY, AND THAT IS THE POINT. Each entry
# describes its limitation QUALITATIVELY — what is understated, why, and how a consumer would
# detect it — and carries `see_profile` pointing at section 9b. It never quotes a profile. A
# limitation is a property of the CORPUS; a count is a measurement of ONE RUN. While the two shared
# a record, every change to the draw forced rewriting the description of something that had not
# changed, and this section had accumulated six "re-measured for version N" notes saying so. The
# notes were the symptom; the record shape was the disease.
#
# WHY NOT EVEN ONE NUMBER AS AN ILLUSTRATION, and this was measured rather than assumed: changing
# only the SIZE of a drawn pool — no mechanism and no other value — consumes the generator
# differently and shifts every later draw, and one seed was measured three times over a single
# commit with a different corpus each time. A count is therefore worth nothing without the command
# and seed beside it, which is what a profile is and what a sentence here cannot be.
#
# A SOLE TRADER CARRIES EXACTLY ONE DOCUMENT, which several entries below depend on: a `ФОП` entry
# in config/vendors.json denotes a sole trader of that trade rather than one named person, so the
# name is DRAWN fresh per claim rather than stored. Any statistic computed per counterparty is a
# sample of one for every such counterparty. That is a property of the vendor file and of the draw,
# not of a run, which is why it is stated here and no count is. KL-01 depends on it and says so.

hurts_vocabulary:
  training: >
    A consumer that LEARNS from this corpus carries the limitation away with it. Usually a
    shortcut — a predictor that correlates with the label, so a good score is reachable without
    the rule ever being learnt — but not only that: a narrow slice of the label space met as if
    it were the whole (KL-06), or a corpus regularity that reads as a causal rule and is not one
    (KL-10), damage a learner the same way and carry this word for the same reason.
  evaluation: >
    The limitation reaches the SCORECARD rather than the model, so it holds for a consumer that
    accumulates nothing — one prompting a language model, seeing one document per call. The
    number measured here then estimates behaviour on THIS dataset's distribution rather than on
    an open world, and the human tuning prompts and thresholds until it rises is the channel by
    which the bias arrives.
  reporting: >
    What was measured is sound; stating it as a single figure is not. The number needs its
    denominator or its conditioning printed beside it — a mix that is arbitrary (KL-11), a metric
    defined on a subset that differs per channel (KL-12), a per-class figure whose denominator is
    the validation side rather than the corpus (KL-13). Distinct from `evaluation`, where the
    measurement itself is of the wrong thing.

    DECLARED HERE FIRST IN VERSION 23. Three entries carried it while the section header above
    described only TWO kinds of consumer, so the third word was in use and defined nowhere.

known_limitations:

  - id: KL-01
    name: the counterparty can foretell full coverage
    predictor: counterparty
    hurts: [training]
    subset: >
      Documents issued by a vendor whose profile in config/vendors.json sells nothing the
      claimed category excludes. Such a vendor cannot produce a non-covered line, so every
      document it issues is fully covered by construction and its name alone settles the
      question.
    how_a_consumer_detects_it: >
      Two different quantities used to be reported here as though they were one — a STRUCTURAL
      count of vendor profiles whose shape makes the shortcut inevitable, and an EMPIRICAL count
      of documents on which it happened to hold. The first is a property of config/vendors.json
      and is stated here: TWO PROFILES ARE COVERED-ONLY AND BOTH REACH DATASETS — see
      `the_leak_is_live` below, which withdrew the "zero" this key used to report. The second is a
      measurement of one run, and section 9b is where it would live — NOT MEASURED YET, so no
      profile there carries it.
    see_profile: run_profiles
    the_leak_is_live: >
      🔴 THIS ENTRY'S CONDITION FIRED AND WENT UNRECORDED UNTIL VERSION 34. The key that stood
      here, `still_open_where`, said `private_tutor` (language_courses) and
      `online_learning_platform` (professional_development) are covered-only AND that "neither
      category has an archetype, so neither reaches a dataset yet … both must gain a vendor that
      can carry a mixed basket before their first template lands, or this entry stops being
      empty". Both categories reach every dataset — the invoice carries them since version 12 and
      `platform_receipt` carries professional_development since version 31 — and neither profile
      gained a mixed-capable shape: config/vendors.json's own reachability note names the same two
      as "a residual leak on the counterparty, recorded under known_limitations". So the
      structural count is TWO, not zero: a document whose seller is one of those profiles is fully
      covered by construction, and the profile settles the coverage question without the lines
      being read (`how_to_stratify` says why the profile and not the printed string is the key to
      group on).
    how_to_stratify: >
      Do NOT group by the counterparty string. Most counterparties are sole traders whose
      names are drawn per claim, so grouping by the string produces buckets of one and a
      long list of counterparties that are "never partially covered" for no reason at all,
      not one of them meaningful.

      Group by the VENDOR PROFILE instead: `config/vendors.json` maps each entry to a
      profile, and a profile that sells nothing the category excludes is the thing that
      actually leaks. Report those separately, or drop them from coverage metrics. Where a
      profile cannot be recovered — a consumer reading only the labels cannot — treat a
      counterparty with a handful of documents as uninformative rather than as a finding,
      and read the structural figure above instead of computing your own.
      Do not group by the counterparty string for KL-04 either, and for a different reason:
      there the string is informative, which is precisely the defect.
    fixed_by: >
      An affinity invariant enforced in the test suite: for every jurisdiction that has a
      registered archetype, every covered item kind must be sold by a vendor that also sells
      something the same category excludes.

  - id: KL-02
    name: every non-covered line comes from one of four item kinds
    predictor: the line item itself
    hurts: [training, evaluation]
    subset: >
      Documents whose non-covered lines come from `vitamins_nutrition` — the category the three
      fiscal archetypes are registered for. Every non-covered line of such a document is a
      medicine, a blood-pressure monitor or glucose test strips, a face cream, or a shower gel or
      toothpaste. Four head-noun families, and a consumer that learns those four scores as well
      here as one that reads the article and resolves it against the policy.

      ⚠️ THIS ENTRY READ "the whole dataset, without exception" UNTIL NOW, on the ground that every
      registered archetype carried one category. THAT GROUND IS GONE: the invoice carries every
      category — KL-06 is about a second category's non-covered vocabulary and could not exist
      otherwise. HOW WIDE THE SUBSET IS TODAY IS AN OPEN QUESTION, recorded rather than resolved,
      because settling it means measuring which categories reach a corpus and in what proportion.
      The mechanism this entry describes is unchanged; only the claim about its reach was false.
    how_a_consumer_detects_it: >
      Non-covered lines are drawn from a SMALL SET OF ITEM KINDS — the excluded buckets of the one
      category that reaches a corpus in quantity — so a model can learn the head noun rather than
      the coverage rule. It is a property of `excluded_items` in config/policy.yaml having few
      members per category, not of any run's size. The per-kind counts belong in section 9b and are
      NOT MEASURED YET.
    see_profile: run_profiles
    what_changed_in_version_8: >
      THE FOURTH FAMILY ARRIVED, AND THIS ENTRY USED TO CARRY A `narrowed_further_by` BLOCK
      SAYING IT COULD NOT. `hygiene` reached no document because both its templates named a
      brand, and the brand vocabulary in config/generation.yaml is keyed by ITEM KIND rather
      than by template — so one pool served the shower gel and the toothpaste, and a mark drawn
      for either was printed on the other. The generator declined to fill the kind rather than
      print an article under a mark chosen for a different one; the objection was the keying, not
      any claim about who manufactures what.

      The repair was a brandless template form — `Гель для душу 250 мл` rather than
      `Гель для душу {brand}`, which 👁 is how Ukrainian receipts most often print such articles.
      The kind is out of `unprintable_item_kinds` and drawn like any other, so the block is gone
      rather than reworded: it described a condition that no longer exists.

      WHAT THE FOURTH FAMILY IS WORTH, stated because it is small. `hygiene` contributes exactly
      TWO printable strings against the other three kinds' 398, since a brandless template has no
      placeholder to vary. The families went from three to four; the vocabulary went from 398 to
      400. A consumer stratifying by head noun gains a family, and one measuring string diversity
      gains almost nothing.

      `electronics` HAS THE SAME DEFECT AND KEEPS IT. It is an excluded kind of `hobby` and it
      reaches no dataset — no longer because the category lacks an archetype (the invoice has
      carried `hobby` since version 12; that reasoning went stale and is corrected at version 34)
      but because the kind is declared in `unprintable_item_kinds` in config/generation.yaml,
      which is the half of the old sentence that still holds. The brandless form is not applied to
      it because the form is evidenced for hygiene articles and not for consumer electronics,
      where a real receipt line names a brand and a model. It is not a cause of any narrowing
      here.
    a_second_leak_inside_one_kind: >
      🔴 WITHIN `hygiene`, THE STRING IS THE LABEL — and this is a DIFFERENT leak from the one this
      entry is named for, not the same one measured another way. It has its own predictor and its
      own subset:

        predictor — the SPECIFIC STRING, not the head-noun family;
        subset    — the `hygiene` lines only; how many there are is not measured.

      A brandless template has no placeholder to vary, so the kind's two templates produce exactly
      TWO strings for the whole corpus, against 8, 13 and 8 distinct strings for the other three
      kinds. `Гель для душу 250 мл` and `Зубна паста 75 мл` are therefore not examples of a
      non-covered hygiene article — between them they ARE the non-covered hygiene article, and
      either string memorised gives the label with no reading of the policy at all.

      WHY IT IS NOT FOLDED INTO THIS ENTRY'S OWN LIMITATION. That one is about four families
      standing in for an open world, and a consumer acts on it by stratifying on the family. This
      leak works only inside one kind and only on the exact string, so a consumer acting on the
      family would not catch it. Two mechanisms behind one visible column, as KL-01 and KL-04 are.

      THE CLASS, stated rather than cited, since nothing else in this file records an instance of
      it: a vocabulary narrow enough that a PARTICULAR STRING, and not the category it belongs to,
      predicts the label. What makes this instance easy to miss is that it is localized to one item
      kind instead of spread across the label space — the corpus-wide totals look healthy, 31
      distinct strings over four families, and the defect is entirely inside one of the four.

      HOW TO STRATIFY IT, which is not what the entry's own `how_to_stratify` says: exclude
      `hygiene` lines from any metric that would credit reading the article, or report them
      separately, until the vocabulary is keyed by template. Two strings cannot support a
      generalization claim about anything.
    fixed_by: >
      KEY THE PLACEHOLDER VOCABULARY BY TEMPLATE RATHER THAN BY ITEM KIND, in
      config/generation.yaml. That is the ROOT CAUSE of both this entry's second leak and of the
      original brand-crossover defect that kept `hygiene` out of the dataset altogether: the pool
      is keyed by kind, so a draw cannot see which of the kind's templates it is filling, and the
      shower gel and the toothpaste therefore cannot be given placeholders of their own. Key it by
      template and each article gets its own vocabulary — variety returns, the string stops being
      the label, and no brandless form is needed at all.

      THE BRANDLESS FORM IS THE NARROWER FIX, AND IT IS WHAT WAS TAKEN. It closes the crossover —
      no mark is printed on an article it was not chosen for — at the cost of two strings where
      there could have been dozens. It was preferred because it is one edit to a template and 👁
      it matches how Ukrainian receipts print such articles, whereas re-keying the vocabulary is a
      structural change to the shape of config/generation.yaml, a different concern from
      registering templates, and not something to do in the same commit. Recorded here so the real
      repair is not lost behind the narrower one that shipped.
    why_it_is_not_a_defect: >
      It IS the coverage rule of the one category that has an archetype, not an accident of
      the vendor data: `excluded_items` in policy.yaml is what the plan does not pay for. No
      configuration change widens it further — the file that would have to change is the policy,
      and widening the label space to make a metric look harder would be the wrong repair
      anyway. The fix is more categories with archetypes, which is a later wave of work. Note
      what the version 8 change was NOT: the four families are what the policy already declared,
      and the repair made the dataset match the label space rather than widening either.
    consequence: >
      Coverage metrics measured here are OPTIMISTIC relative to a real flow, where the
      non-covered article is drawn from an open world rather than from four families. This
      is the entry that reaches BOTH kinds of consumer: one that trains absorbs the four
      head nouns as a rule, and one that prompts a language model is scored on a
      distribution far narrower than production, so the number it reports is an estimate of
      the wrong thing rather than a noisy estimate of the right one.
    how_to_stratify: >
      Report coverage metrics together with the inventory of non-covered item kinds they
      were measured over, and treat them as conditional on it. Do not quote a single
      coverage F1 as an estimate of open-world behaviour. If an open-world estimate is
      needed, it has to come from documents this generator did not produce.

  - id: KL-03
    name: an item kind can foretell full coverage without the seller being read
    predictor: the line item itself
    hurts: [training]
    subset: >
      A covered item kind sold only by profiles that stock nothing the same category
      excludes. A line printing that kind then guarantees a fully covered document, and —
      unlike KL-01 — a consumer picks the shortcut up without ever looking at the
      counterparty.
    how_a_consumer_detects_it: >
      STRUCTURALLY ABSENT, and that is a statement about configuration rather than about a run: the
      vendor affinities were changed so that no covered kind is sold only by profiles stocking
      nothing the same category excludes — a training centre also sells travel, a music school also
      sells refreshments. Neither of the kinds that once had this shape reaches a corpus in any case.
      Zero by configuration, so there is nothing for a profile to confirm; the reason is here.
    see_profile: run_profiles
    still_open_where: >
      Nowhere, on this entry's own mechanism. The PL, DE and ES vendor lists do fail the
      enforced test, but for the SIBLING reason rather than this one: three covered kinds
      have no seller at all in those lists — `sport.pool_membership` in PL, and
      `vitamins_nutrition.nutritionist_visit` in DE and in ES. That is a kind missing from
      the dataset, which is the failure KL-01's invariant also guards against, and not a
      kind whose every seller is covered-only. There is no genuine covered-only-seller case
      in any non-UA list.

      Both must be closed before those jurisdictions get their first archetype, because the
      test is enforced only where one is registered. Recorded here rather than left to the
      test output because a reader of this section would otherwise attribute the failure to
      the leak this entry describes, which would be the wrong repair.
    how_to_stratify: >
      Cross-tabulate `item_kind` against `covered_fraction` over the whole dataset. Any kind
      appearing only on fully covered documents is a shortcut; exclude it, or report on it
      separately, before quoting a coverage metric.
    fixed_by: same invariant as KL-01, stated over item kinds rather than over vendors


  - id: KL-04
    name: the counterparty foretells whether the document has a VAT block
    predictor: counterparty
    hurts: [training, evaluation]
    subset: >
      Every document issued by a counterparty whose name is STORED in config/vendors.json. All
      of them are registered ПДВ payers, so a stored name guarantees a per-line `vat_letter`, a
      tax block and a `seller_vat_number` box — and their absence is guaranteed by a name that is
      not in that file. New in version 7: before it, `vat_letter` was never null, so there was
      nothing to predict.
    how_a_consumer_detects_it: >
      The counterparty foretells whether the document carries a VAT block, because a vendor's
      ПДВ-payer status is stored on its entry in config/vendors.json and never varies per document.
      ONE-DIRECTIONAL: a registered seller always prints the block, so seeing the name settles it;
      not seeing a block does not settle the name. Both halves are properties of the vendor list.
      How many documents each side accounts for belongs in section 9b and is NOT MEASURED YET.
    see_profile: run_profiles
    the_leak_is_one_directional: >
      Worth stating because it bounds what a consumer can do with it. A STORED name implies a VAT
      block with certainty; a DRAWN name implies nothing, a sole trader's registration being drawn
      too and falling on both sides. So a model can shortcut the positive case only — which is the
      larger half, and enough to inflate any metric conditioned on the VAT block.
    how_to_stratify: >
      Report anything that depends on `vat_letter`, on the tax block or on `seller_vat_number`
      SEPARATELY for documents with a stored counterparty and documents with a drawn one, and
      never as a single figure over the corpus. Neither subset is representative of the other, and
      how a run divides between them is a count that belongs beside the run that produced it — see
      section 9b. A consumer reading only the labels cannot tell the two apart — the
      vendor file is what distinguishes them, exactly as in KL-01 — so the split has to be taken
      from config/vendors.json rather than computed from the labels.
    fixed_by: >
      NOTHING TODAY, and the obvious fix is blocked for a reason worth knowing. Closing it means
      a named vendor that is not a ПДВ payer, and such an entry asserts of a real-sounding firm
      that it is not VAT-registered — a claim about its turnover and tax regime. One existed and
      was removed for exactly that reason; `$note_vat_payer_departures` in config/vendors.json
      carries the argument. So the honest routes are a stored name that cannot designate any real
      firm, or more drawn entries on both sides, and neither is a decision this file takes.
    why_it_is_not_the_same_as_KL_01: >
      KL-01 is about COVERAGE being foretold by the counterparty; this is about the VAT BLOCK.
      They share a predictor and nothing else: a document can be fully covered and have no VAT
      block, or partially covered and have one. Two mechanisms behind one visible string.

  - id: KL-05
    name: the dataset overstates how often a receipt prints an identification code
    predictor: none — a distribution gap rather than a label leak
    hurts: [training, evaluation]
    subset: >
      EVERY RECEIPT-SHAPED DOCUMENT — the three fiscal archetypes and the товарний чек all print
      the «ІД» identification code (bbox key `seller_tax_code`), while of the real ПРРО receipts
      examined only 1 of 3 carries one: two of three print no such line at all. ("EVERY document"
      stood here from the fiscal-receipt-only corpus; the other classes carry their own code
      requisites under their own captions and do not bear on this gap.)
    how_a_consumer_detects_it: >
      EVERY receipt this generator produces prints the identification code, while 👁 only 1 of 3
      real ПРРО receipts examined carries one — two of three print no such line at all. Both figures
      survive the move because NEITHER IS A RUN MEASUREMENT: "every" is true by construction, and
      the 1-of-3 is an observation about real documents, which is evidence rather than a count of
      this corpus. What a profile adds is only the number of documents that "every" came to.
    see_profile: run_profiles
    why_it_is_deliberate: >
      «ІД» is printed because it is the SUPERSET. A field that is present can be looked for and
      scored; a field the corpus never prints cannot be exercised at all, and its absence would
      be indistinguishable from an extractor that simply never finds it. The cost is this entry.
    consequence: >
      A system tuned on this corpus will expect an identification code where most real receipts
      have none, and will read the field's absence as a defect rather than as the ordinary case.
      Any measured recall on it is measured on a distribution the real flow does not have. This is
      the same refusal as `document_label.amount_due` not being scoreable and as a bank
      statement's four summary totals being printed but unlabelled: state what the corpus does
      not represent, rather than letting a number stand for something it never measured.
    why_this_entry_breaks_the_template: >
      It carries `predictor: none`, and the other four entries in this section all name one. That
      is informative rather than untidy: the other entries say "something in the document gives
      the label away", and this one says "the document population is not the real population".
      Fitting it to the template by inventing a predictor would have hidden the difference.
    how_to_stratify: >
      Nothing to stratify — there is no subset without the field. Do not report presence or
      recall figures for `seller_tax_code` as estimates of real-world behaviour, and treat any
      model that learned to require the line as untested against the majority of real receipts.
    fixed_by: >
      A FURTHER TEMPLATE THAT PRINTS NO «ІД» LINE. The axis of the variation is the ПРРО
      software provider — three observed receipts, three providers, and exactly one prints it —
      so it is NOT a property of the seller and must not become a flag on a vendor entry, which
      would model the wrong level and put a provider's layout choice on the merchant.
      `content_builder.Seller.tax_code` is already nullable for precisely this, so the template
      is the whole of the remaining work. Named as one gap in config/fiscal-rules.yaml.

      NONE OF THE THREE ARCHETYPES ADDED IN VERSION 8 IS IT, and the entry is not narrower for
      their arrival: they vary the paper width and the kind of cash register, and all three print
      «ІД». More templates of a class do not by themselves vary a provider's optional requisites.

  - id: KL-06
    name: one category's non-covered vocabulary is narrower than the policy declares
    predictor: none — a vocabulary gap rather than a label leak
    hurts: [training]
    subset: >
      Non-covered lines of `hobby`. policy.yaml declares three excluded kinds for it —
      `electronics`, `food_drink`, `alcohol` — and `electronics` is declared UNPRINTABLE in
      config/generation.yaml, so no document of that category can carry it. A mixed `hobby` basket
      therefore draws its non-covered lines from two kinds where the label space declares three.
    how_a_consumer_detects_it: >
      One of `hobby`'s three excluded item kinds is declared unprintable in config/generation.yaml,
      so NO document of that category can carry it and its non-covered vocabulary is a third
      narrower than the label space. A property of two configuration files agreeing, which no run
      changes; how many `hobby` claims a given corpus held is not measured.
    see_profile: run_profiles
    why_it_is_deliberate: >
      `electronics` is unprintable because ONE placeholder pool per kind would have to serve both
      "Планшет {brand}" and "Камера {brand}", so any mark drawn for one is printed on the other —
      an assertion about a firm's product range that this repository does not make. Printing it
      would need a brandless template form in policy.yaml, which is a change to the labelling
      policy and not to a template.
    when_it_appeared: >
      IT DID NOT EXIST BEFORE THE INVOICE ARCHETYPE, and that is the honest history rather than a
      newly discovered defect. `hobby` had no subject-proving archetype, so no document of that
      category reached any dataset and the gap was unreachable. The invoice carries every category,
      which brought six more into the corpus and this narrowing with them.
    consequence: >
      A model trained on this corpus meets two of the three head-noun families that `hobby`
      declares as non-covered. Do not read a per-kind recall on that category as covering its
      declared label space.
    how_to_stratify: >
      By `category == "hobby"` and `covered == false` on the line item.
    fixed_by: >
      A BRANDLESS TEMPLATE FORM FOR `electronics` in policy.yaml — an entry whose text names the
      article without a mark. Blocked on a policy edit rather than on a template, which is why it
      is declared here rather than fixed alongside the archetype that exposed it.

  - id: KL-07
    name: on corpora before version 33, the payment date fully predicted `rejected`
    predictor: >
      the payment date — on a pre-33 corpus, outside the benefit period on every `rejected`
      claim and on no other; on a corpus of this version, on the `outside_period` route only
    hurts: [evaluation, training]
    subset: >
      🔴 CLOSED IN VERSION 33, AND REWRITTEN RATHER THAN DELETED, because every corpus generated
      before it — including the ones the run profiles below measure — carries the degeneracy this
      entry records. On such a corpus every `rejected` claim is an out-of-period one: the verdict
      has two routes and those corpora contain one, by WHEN it was paid, cause `outside_period`.
      The other — by WHAT WAS BOUGHT, a basket the claimed category covers none of, carrying NO
      cause — was labelled by `policy_engine` and built by nothing, because `content_builder`
      always drew at least one covered line.

      So on a pre-33 corpus the verdict is FULLY PREDICTED BY A DATE COMPARISON, and a system
      that never reads a line item scores perfectly on it — a shortcut the data teaches, not
      merely a gap in it, which is why this entry hurts training as well as evaluation.

      SINCE VERSION 33 BOTH ROUTES ARE DRAWN (`rejected_routes` in policy.yaml, 0.5 each): the
      coverage route's claims sit INSIDE the window with a covered fraction of exactly 0.0 and
      an empty `imperfection`, so the date predicts the verdict on neither axis of a fresh run.
    how_a_consumer_detects_it: >
      Take every claim labelled `rejected` and compare its payment date against `period` in
      config/policy.yaml. On a pre-33 corpus all of them fall outside it and all carry
      `outside_period` in `imperfection` — the complement, a `rejected` claim with an EMPTY
      `imperfection` and every line non-covered, does not occur at any run size, and a scorecard
      row for that case is unmeasured rather than perfect. On a corpus of this version the same
      comparison splits the bucket into the two routes at roughly the declared shares (both
      non-zero from 59 built claims, per the derivation beside `rejected_routes`). Reading the
      other way round is the trap either way: `covered_fraction` on the period route is typically
      1.0, so "rejected means nothing was covered" disagrees with half the data or all of it,
      depending on the vintage.
    see_profile: run_profiles
    when_it_appeared: >
      WHEN THE PLANNER GAINED THE PERIOD ROUTE AND NOT THE COVERAGE ONE, and it held until
      version 33 gained the second. Every profile in `run_profiles` was measured while it held —
      each counts every `rejected` claim as an out-of-period one, correctly for the run it names.
    consequence: >
      A per-verdict figure for `rejected` measured on a PRE-33 corpus is a figure about the
      PERIOD RULE and about nothing else: it does not evidence that a system can refuse a claim
      whose basket the policy excludes, and it must not be quoted as one. The same figure on a
      corpus of this version measures both refusal rules at the declared route split — which is
      the property the false-approval bound needs, and the reason the route was opened.
    how_to_stratify: >
      By `imperfection` membership within the verdict, on any vintage: `outside_period` present
      is the period route; an empty `imperfection` beside `covered_fraction` 0.0 is the coverage
      route, a stratum whose denominator is zero by construction on every pre-33 corpus and
      non-zero from version 33 on.
    fixed_by: >
      WHAT THE ENTRY USED TO NAME AS THE FIX, DONE, in version 33: `content_builder._draw_basket`
      accepts a coverage target of exactly ZERO and draws every line from `excluded_items`; the
      planner asks for it via `ClaimPlan.coverage_target` and draws the route per
      `rejected_routes`. The engine needed nothing: it had labelled the case since `verdict_for`
      was written.

  - id: KL-08
    name: the cross-check causes can never occur on a fiscal receipt
    predictor: doc_type — a document class fully determines that two causes are absent from it
    hurts: [evaluation]
    subset: >
      🔴 EVERY `fiscal_receipt` IN THE CORPUS IS THE WHOLE OF ITS CLAIM, so no cross-check
      cause can ever be observed on one. A cross-check compares a claim's SUBJECT document with its
      PAYMENT document, and a receipt is both — a self-sufficient document has nothing to disagree
      with. The planner makes this exact: `_select_documents` prefers a single document proving both
      facts wherever one is registered, and the three fiscal receipts are registered for the one
      category that has them.
    how_a_consumer_detects_it: >
      EVERY `fiscal_receipt` is the whole of its claim, so no cross-check cause can occur on
      one: a cross-check compares a claim's subject document with its payment document, and a
      self-sufficient document has nothing to disagree with. `_select_documents` prefers a single
      both-proving document wherever one is registered, which makes this exact rather than likely.
      The denominator for that class is therefore ZERO BY CONSTRUCTION, and a profile only confirms
      the pairing counts.
    see_profile: run_profiles
    why_it_is_deliberate: >
      It is STRUCTURAL rather than chosen, which is why it is declared instead of fixed. Pairing a
      receipt with a payment document would mean planning a claim whose evidence is described twice
      — the shape `policy_engine.resolve_evidence` refuses outright, because nothing says whether
      such documents are one purchase or two.
    consequence: >
      A per-class evaluation of cross-document checking is measurable on three of the four target
      classes and NOT on `fiscal_receipt`. A consumer must not average a cross-check metric across
      the four and report it as a figure about the dataset: for one class the denominator is zero.
    how_to_stratify: >
      By `doc_type == "fiscal_receipt"`, which coincides exactly with `len(claim.documents) == 1`
      in this corpus. That coincidence is itself worth knowing and is not guaranteed by anything: it
      holds while receipts are the only self-sufficient archetype.
    fixed_by: >
      NOTHING IN THIS DESIGN. It would need a claim pairing a receipt with a payment document, which
      the evidence resolver refuses for a reason that has nothing to do with this entry.

  - id: KL-09
    name: a claim's payer cannot always be cross-checked across its documents
    predictor: none — a field that is deliberately empty on one variant
    hurts: [evaluation]
    subset: >
      Claims whose payment document is an INTERNET-ACQUIRING confirmation. 👁 That variant does not
      identify the payer and prints a HYPHEN as the value, which the label carries as the string
      "-" — deliberately, because an extractor returns a string for it and returns nothing for a
      captioned-but-empty field, and collapsing the two would make accuracy on empty fields
      unmeasurable. The invoice beside it names the claimant, so the claim's two documents carry
      two different payers and neither is wrong.
    how_a_consumer_detects_it: >
      An internet-acquiring confirmation 👁 does not identify the payer and prints a HYPHEN, which
      the label carries as the string "-". The invoice beside it names the claimant, so a claim's
      two documents carry two different payers and NEITHER IS WRONG. The rate at which the variant
      occurs follows `payment_confirmation.initiation_shares` in config/generation.yaml, where
      acquiring is 👁 1 of 8; how many documents of a given corpus were affected is in the profile.
    see_profile: run_profiles
    why_it_is_deliberate: >
      The document is right. 👁 An acquiring receipt genuinely does not name the payer, and printing
      the persona there would be inventing a requisite that variant does not carry.
    consequence: >
      A consumer cross-checking the PARTIES of a claim's documents against each other must treat an
      unidentified payer as absent rather than as a mismatch. A verifier that flagged such a claim as
      contradictory would be flagging an ordinary acquiring payment.
    how_to_stratify: >
      By `payer == "-"` on the payment document — the value is `parties.empty_value` in
      config/fiscal-rules.yaml.
    fixed_by: >
      NOTHING, AND NOTHING SHOULD. This is the corpus reproducing an observed document faithfully.
      It is declared because the consequence for a cross-party check is real, not because the
      document is wrong.


  - id: KL-10
    name: why the VAT row takes two forms is not established
    predictor: none — an unexplained variation, not a leak
    hurts: [training]
    subset: >
      Every `fiscal_receipt` of a registered payer. 👁 The VAT summary row is printed either as
      `ПДВ А=20,00%` or as `ПДВ А 20%`, and WHAT CAUSES THE DIFFERENCE IS UNKNOWN. The generator
      reproduces the association it can support — paper takes the equals form, electronic draws
      either — without claiming that the medium is the CAUSE.
    how_a_consumer_detects_it: >
      Both forms occur among the receipts of any corpus, and `vat_row_form` says which each document
      carries. ⚠️ THE SPLIT A PROFILE REPORTS IS THE DRAW AND NOT AN OBSERVED FREQUENCY. Since
      version 17 BOTH SIDES OF THE RULE ARE EXERCISED — `photo` and `scan` are paper and admit the
      `equals` form only, `screenshot` is electronic and draws either — so the realized split is now
      a mixture of a one-sided rule and a two-sided draw, weighted by a CAPTURE MIX that is itself
      an arbitrary placeholder (KL-11). Reading a frequency out of it measures the capture mix, not
      the world. Until version 16 the paper side was unexercised entirely, because `screenshot` was
      the only calibrated channel; a profile taken then reports the electronic draw alone.
    see_profile: run_profiles
    what_is_unknown: >
      🔴 THE HYPOTHESES, AND WHY THE DATA CANNOT DISCRIMINATE THEM. The obvious explanation — that
      it is each register's own configuration — is WEAKENED: two independent paper installations
      print the same form. That leaves two candidates, and they are confounded by construction:

        THE DELIVERY CHANNEL — a receipt shown on a screen is composed by different software from
        one printed on a till roll;
        THE ПРРО PROVIDER of the one online receipt — a provider's own formatting, which would have
        nothing to do with the channel.

      There is exactly ONE online receipt, so its channel and its provider are a single fact seen
      once. No amount of care with the existing sample separates them; it would take a second online
      receipt from a different provider, or a paper receipt from the first one's provider.
    consequence: >
      A consumer must not read a CAUSAL rule out of this corpus. "Electronic documents use the
      spaced form" is false of the generator and unsupported by the evidence; what the corpus
      contains is that paper never uses it. Nothing here licenses inferring a document's medium
      from its VAT row, in either direction.
    how_to_stratify: >
      By `vat_row_form`, which is exactly why the field is labelled. An extraction figure for the
      tax row split by this field distinguishes "cannot read the row" from "learned one of its two
      forms".
    fixed_by: >
      MORE INDEPENDENT INSTALLATIONS, not more receipts. Eight receipts from one advance report are
      one installation asked eight times — the mistake that produced the earlier unconditional form
      — so what would settle this is a second ELECTRONIC receipt from a different provider, or a
      paper receipt from the provider that produced the online one.


  - id: KL-11
    name: the capture mix is declared per class, and the weights are a decision, not a survey
    predictor: none — an arbitrary marginal, not a leak
    hurts: [reporting]
    subset: >
      EVERY DOCUMENT. Which channel carries a document follows `capture_mix` in config/policy.yaml
      since version 35 — per document class, with the born-medium constraints stated at the block
      (a till roll has no undamaged electronic original; a banking-app screen exists only as a
      screenshot). ⚠️ WITHIN THOSE CONSTRAINTS, NOTHING IS STILL KNOWN ABOUT HOW REAL
      REIMBURSEMENT EVIDENCE ARRIVES: no survey of the field was available, so the weights are a
      dataset-balance decision sized for per-channel measurability, not frequencies of a world.

      THIS ENTRY DESCRIBED A UNIFORM DRAW UNTIL VERSION 35 — every class a third per channel,
      including a flatbed scan of a phone screen and a screenshot of a till roll — and its
      `fixed_by` named exactly the fix that has now been made. What the fix removes is the
      IMPOSSIBLE combinations and the arbitrary equality; what it cannot supply is the survey.
    how_a_consumer_detects_it: >
      By reading `capture` across a class and finding the declared weights of `capture_mix` —
      shares that round, not a measured population. A real population of submitted evidence has
      some true shape nobody here knows; a corpus whose channel marginal equals a config block is
      reporting a decision, and the block is public precisely so the decision is legible.
    see_profile: run_profiles
    consequence: >
      ANY FIGURE AGGREGATED OVER THE WHOLE CORPUS IS WEIGHTED BY THIS MARGINAL, and the marginal
      is declared rather than true. A single accuracy number over a corpus whose channels differ
      in difficulty says as much about the mix as about the system. A consumer reporting one
      number must either report per channel as well, or state the mix it aggregated over — which
      is now one block of policy.yaml rather than "equal". It also propagates: `vat_row_form`'s
      realized split is a function of it (KL-10), because the medium follows the channel.
    how_to_stratify: >
      By `capture`, which is exactly why the field is labelled. Report per channel and the marginal
      stops mattering.
    fixed_by: >
      A SURVEY OF HOW REIMBURSEMENT EVIDENCE ACTUALLY ARRIVES, which is the one thing a config
      block cannot replace. The structural half of the old fix is done — the mix is declared in
      config/policy.yaml beside the other label-sizing shares, exactly where this entry said it
      belonged — so what remains is evidence, not plumbing: measured arrival frequencies would
      turn the declared weights from a defensible decision into a calibration.


  - id: KL-12
    name: the character error rate is defined on a subset, and the subset differs by channel
    predictor: none — a coverage gap in one metric, not a leak
    hurts: [reporting]
    subset: >
      🔴 THE DOCUMENTS WHOSE TEXT LEFT THE FRAME. `reference_text` is the reference side of a
      character error rate over the whole page, and that distance is meaningless where some of the
      text it references is not in the picture: a system that read everything visible would score as
      though it had failed. The affected documents are exactly those with `content_complete: false`,
      and they are concentrated in `photo` — a photographer cuts an edge, a flatbed does not.
    how_a_consumer_detects_it: >
      By `content_complete` and `content_lost_edges` on each document: the affected subset is
      LABELLED rather than inferred, which is the whole point of the two fields. Without them the
      symptom is indistinguishable from a bad reading — a system scoring poorly on a photograph
      looks like a system that cannot read a photograph, when part of what it was scored against was
      never in the picture. Group by `capture` and the concentration in one channel is immediate.
    see_profile: run_profiles
    consequence: >
      🔴 A CHARACTER ERROR RATE WITHOUT ITS DENOMINATOR IS NOT A RESULT. "CER on photo = X" conceals
      that X was computed on some fraction of that channel and says nothing about the rest; the
      honest form names both — "CER on the N of M photos whose content survived, the other M − N
      unmeasured". The denominator differs per channel by construction, so one denominator for the
      corpus will not do either.
    how_to_stratify: >
      Filter on `content_complete` before computing the rate, and report the size of what was
      filtered out, per channel. `run_profiles` records those counts for the runs it describes.
    fixed_by: >
      NOTHING, AND NOTHING SHOULD. A photograph that cuts an edge is a real capture and belongs in a
      corpus meant to be realistic; removing it would make the dataset easier than the world and
      would remove the one signal that tells a cropped capture from a bad reading. What is fixable
      is the reporting, which is what this entry is for.


  - id: KL-13
    name: the train / validation partition is not stratified, so a side may be missing a whole class
    predictor: none — an incomplete evaluation set, not a leak
    hurts: [reporting]
    subset: >
      🔴 WHATEVER THE VALIDATION SIDE HAPPENS NOT TO CONTAIN. Personas are assigned to the two sides
      at random and nothing balances the result, so a side can hold no claims of a verdict the
      corpus has and no documents of a class the corpus has. It is most acute on a small run, where
      one persona is a large fraction of a side, and it does not disappear at any size — it only
      becomes less likely.
    how_a_consumer_detects_it: >
      By grouping its own validation records by `verdict` and by `doc_type` BEFORE reporting
      anything per class, and comparing that against the corpus. The generator's balance report
      already names every verdict and class the corpus contains and a side does not, so the gap is
      stated rather than left to be discovered — but a consumer that re-partitions the data, or that
      receives only one side, has to re-derive it. The failure mode without that check is a
      per-class figure quietly computed on zero examples, or on far fewer than the corpus suggests.
    see_profile: run_profiles
    consequence: >
      A PER-CLASS METRIC ON THE VALIDATION SIDE HAS ITS OWN DENOMINATOR, WHICH IS NOT THE CORPUS'S.
      The per-class minimum applies to whatever is actually being measured: a class with 40
      documents in the corpus and 3 on the validation side supports no validation figure at all.
      Macro-averaging is where this does damage, because it weights every class equally regardless
      of how many examples the side holds — a class with three documents moves a macro average as
      much as one with three hundred.
    how_to_stratify: >
      By `split` together with `doc_type` and `verdict`. The generator deliberately does not do this
      for the consumer: stratifying the partition would TUNE the corpus, and the rule throughout
      this repository is that a shortfall is made visible rather than repaired.
    fixed_by: >
      A LARGER RUN, or a consumer's own stratified re-partition of the delivered corpus — which it
      can perform, because every record carries its `persona_id` join and its `split`. What must NOT
      fix it is the generator quietly balancing the sides: a report that cannot show an unbalanced
      partition is a report that says nothing about balance.

  - id: KL-14
    name: the sales slip occurs in exactly one claim shape, so its class predicts the verdict
    predictor: >
      doc_type — a claim containing a `non_fiscal_receipt` is `not_proof_of_payment` on this
      corpus, without any other field being read
    hurts: [training, evaluation]
    subset: >
      🔴 EVERY `non_fiscal_receipt` IN THE CORPUS IS THE WHOLE OF ITS CLAIM. The planner draws one
      only as the evidence of a `not_proof_of_payment` claim
      (`claim_planner.EvidenceIntent.PAYMENT_GAP`) and never as the subject half of a pair, because
      nothing settles a sales slip: 👁 a payment purpose names an invoice or a delivery note, and
      the invoice is the only class this generator gives a citable reference. So the CLASS and the
      VERDICT are in one-to-one correspondence in this direction, and a system that learns "a
      товарний чек means not proof of payment" scores perfectly here while having learnt a
      regularity of the corpus rather than the rule.

      ⚠️ THE OTHER DIRECTION DOES NOT HOLD, and that is what keeps the entry from being the whole
      verdict: a `not_proof_of_payment` claim may equally carry a bare INVOICE, which also appears
      in ordinary paired claims. So the verdict does not predict the class, and a consumer reading
      this entry as "the two are interchangeable" has it half right in the expensive direction.

      ⛔ IT IS NOT A LABELLING ERROR. The verdict really is decided from the document types — that
      is what `document_evidence` says — so the correspondence is sound on every claim. What is
      missing is the OTHER shape the world has: a slip submitted alongside a genuine payment
      document, where the claim is complete and the slip is merely the subject. Nothing in this
      corpus contains one.
    how_a_consumer_detects_it: >
      Group claims by the document classes they carry: every claim whose `documents` include a
      `non_fiscal_receipt` has exactly one document and the verdict `not_proof_of_payment`. The
      complement — a `non_fiscal_receipt` beside a `payment_confirmation` or a `bank_statement` —
      has a denominator of zero at any run size, so a scorecard row for it is unmeasured rather
      than perfect.
    see_profile: run_profiles
    when_it_appeared: >
      WITH THE CLASS ITSELF, in contract version 27. Every profile measured earlier counts
      `non_fiscal_receipt` as absent, correctly for the run it names.
    consequence: >
      A per-class figure for `non_fiscal_receipt` measured here is a figure about a document that
      is always alone. It evidences that a system can recognize the class and refuse the claim; it
      does not evidence that the system reads the slip as EVIDENCE OF THE SUBJECT when a payment
      document is beside it, which is the same document doing a different job.
    how_to_stratify: >
      By the SET of document classes on a claim rather than by `doc_type` per document. That is the
      grouping in which this limitation is visible at all — per document, the class simply occurs;
      per claim, it occurs in one shape only.
    fixed_by: >
      A DECISION ABOUT WHAT SETTLES A SALES SLIP, not a planner change on its own. Pairing one with
      a payment document means asserting a settlement relation no observation in this project
      supports, and the payment's purpose line would cite an invoice that does not exist. The
      honest route is an observation of how such a claim is actually filed; until then the
      one-shape corpus is the accurate one and this entry is its declaration.

  - id: KL-15
    name: the instalment term predicts `partially_paid`, in both directions
    predictor: >
      `instalment_amount` non-null on a claim's subject document — the verdict follows from that
      one field without any amount being compared
    hurts: [training, evaluation]
    subset: >
      🔴 EVERY INVOICE THAT PRINTS AN INSTALMENT TERM IS THE SUBJECT OF A `partially_paid` CLAIM,
      AND EVERY `partially_paid` CLAIM CARRIES ONE. The planner names a payment schedule for that
      verdict and for no other (`claim_planner.plan_claim`), so the correspondence is exact in both
      directions — unlike KL-14, whose other direction does not hold. A system that learns "the term
      is printed ⇒ partially paid" scores perfectly here while never having compared the payment
      against the part.

      ⛔ IT IS NOT A LABELLING ERROR, AND THE RULE IS NOT THE SHORTCUT. The verdict requires the
      payment to EQUAL the printed part and the part to be smaller than the whole; the corpus simply
      contains no claim where the term is printed and one of those fails. Two shapes the world has
      are therefore absent: an instalment invoice paid in full, and an instalment invoice paid an
      amount matching no part of it. The second is `amount_mismatch` and the corpus has plenty of
      it — but always on an invoice with NO term, so the discriminating comparison is never the
      thing that decides.

      ⚠️ AND THE WORDING ITSELF IS UNOBSERVED. Neither open invoice behind this class carried an
      instalment term, so the line is derived from general knowledge of the document rather than
      transcribed. A system trained here learns THIS phrasing; a real instalment invoice may word
      the same term differently, and nothing in this corpus would show that.
    how_a_consumer_detects_it: >
      Cross-tabulate `instalment_amount is not null` on the subject document against the claim
      verdict. Both off-diagonal cells are empty at any run size, so a scorecard row for either is
      unmeasured rather than perfect.
    see_profile: run_profiles
    when_it_appeared: >
      WITH THE FIELD ITSELF, in contract version 28. Every profile measured earlier counts
      `partially_paid` as absent, correctly for the run it names.
    consequence: >
      A per-class figure for `partially_paid` measured here evidences that a system can SPOT the
      term. It does not evidence that the system checks the payment against it, which is the half
      of the rule that separates this verdict from `amount_mismatch` — and that is the half a
      consumer's own engine has to implement from `partial_payment` in policy.yaml.
    how_to_stratify: >
      By the presence of the term on the subject document rather than by the verdict. That is the
      grouping in which the missing cells are visible; by verdict, each class simply looks complete.
    fixed_by: >
      TWO PLANNER SHAPES THAT DO NOT EXIST YET, not a change to the rule: an instalment invoice
      whose payment settles the WHOLE amount (an ordinary claim carrying the term), and one whose
      payment matches no part of it (`amount_mismatch` carrying the term). Both are buildable — the
      schedule and the mismatch delta are independent knobs — and neither is drawn, because a share
      for them would size a bucket nothing in policy.yaml declares. Adding them is a policy decision
      about the mix and not an implementation gap.

  - id: KL-16
    name: the payment purpose reads like a linkage key, and only its рахунок citation is one
    predictor: >
      none on the noise — ВН citations, generic nouns and unprinted lines carry no information
      about the verdict while disagreeing with the subject document on ordinary claims. The
      рахунок citation is not noise since version 33: it is the `subject` axis, compared and
      labelled (`subject_mismatch`), visible in the image by design like every content negative
    hurts: [training, evaluation]
    subset: >
      🔴 CLAIMS EVIDENCED BY A PAIR WHOSE PAYMENT DOCUMENT PRINTS A PURPOSE LINE, which is most of
      them and NOT ALL OF THEM. The line, where it is printed, is drawn from one pool of formulas
      whatever the claim was planned as (`payment_purposes` and `bank_statement.purposes` in
      config/generation.yaml), and TWO THINGS IN IT ARE DRAWN WITHOUT REFERENCE TO THE SUBJECT
      DOCUMENT, both visible to a reader:

      THE DOCUMENT CITED. Some formulas name a рахунок and are filled with the claim's own invoice
      number and date — except on a claim planned as `subject_mismatch`, where the number is drawn
      WRONG on purpose and labelled (see the ⛔ below); others name a ВН — a delivery note — whose
      number is DRAWN AND BELONGS TO NO DOCUMENT OF THE CLAIM (`content_builder._fill_reference`:
      `{delivery_note_no}` is never filled from the claim, deliberately, so that a linker matching
      on «№» without reading which class is named links the wrong document). So on a share of
      ordinary, fully covered claims the payment cites a document number the invoice beside it
      does not carry.

      THE GOODS NOUN. «за товар», «за обладнання», «за витратні матеріали» — generic, and drawn
      without reference to the claim's category, so a psychotherapy invoice may be settled by a
      payment "for consumables". Nothing in the pool names a category at all, which is why such a
      document CONFIRMS the `proves_subject: false` its type carries in policy.yaml's
      `document_evidence` rather than testing it — a value of that file, not a form's wording.

      ⚠️ AND THERE IS A THIRD CASE BESIDE A MATCHING CITATION AND ONE POINTING OUTSIDE THE CLAIM:
      NO PURPOSE LINE AT ALL. The internet-acquiring payment confirmation prints none —
      `acquiring.prints_purpose` is false in config/fiscal-rules.yaml and `content_builder` leaves
      the label field `null` on that branch — so a claim's payment document may carry nothing for a
      linker to read. It is the same variant KL-09 is about, at the rate
      `payment_confirmation.initiation_shares` declares, and a bank statement's labelled row always
      carries a purpose whatever the draw. A consumer that folds this case into "cites nothing of
      the claim" is measuring two different things under one name.

      ⛔ IT IS NOT A LABELLING ERROR — AND SINCE VERSION 33 ONE SLICE OF IT IS AN AXIS, WHILE THE
      REST REMAINS EXACTLY THE NOISE THIS ENTRY DESCRIBES. `cross_document_agreement` in
      config/policy.yaml now declares four axes, and the fourth — `subject` — compares ONLY the
      рахунок citation, structured as `cites_document_no`, against the subject document's own
      number: a рахунок citation naming a different invoice is `insufficient_evidence` with the
      cause `subject_mismatch`, deliberately visible in the image, exactly as a counterparty
      mismatch is. Everything else this entry lists stays OUTSIDE the axis, on purpose: 👁 an
      observed purpose line names an invoice OR a delivery note by number, a delivery note is a
      class no claim of this dataset holds, so a ВН citation pointing outside the claim is the
      ordinary form of the line rather than a defect in it — and the generic nouns and the
      unprinted lines state nothing at all. Every verdict on those claims is derived from the
      declared axes and is right on every one of them; absence is never a disagreement.
    how_a_consumer_detects_it: >
      Read the purpose line of a claim's payment document — where the document prints one; see the
      third case above — against the subject document's own number and against its line items. The
      mismatches are visible without any label, and they fall on
      claims of every verdict — including `covered` — while the `counterparty_mismatch` negative,
      whose only defect is the party, carries a purpose that cites the claim's own invoice
      correctly whenever the drawn formula cites a рахунок at all (`assembler`, at the payee draw:
      the citation is left alone on purpose, because a payment that went to the wrong provider while
      quoting the right invoice number is what the mistake actually looks like).

      HOW OFTEN EITHER HAPPENS IS A PROPERTY OF THE FORMULA POOL and not of a run's size — it
      follows from how many formulas of `payment_purposes` and `bank_statement.purposes` name a
      рахунок rather than a ВН. No profile in section 9b carries the count; where citations have
      actually been measured is `docs/cross-document-fields.md`, on a run that page names.
    see_profile: run_profiles
    what_prompted_it_and_what_it_corrects: >
      AN INDEPENDENT VERIFIER'S OBSERVATION ON A RUN OF 36 CLAIMS, kept because the author decided
      to keep the behaviour rather than because it was found to be wrong. That observation went
      further than the evidence: it read the mismatches as ANTICORRELATED with the traps — weak
      citations on positives against a perfect one on the negative it had examined — and inferred
      that a learner could read a perfect citation as a trap signal.

      ⚠️ THAT INFERENCE IS NOT SUPPORTED ON THE CLAIMS THIS ENTRY IS ABOUT, AND SAYING SO IS THE
      USEFUL PART. Among claims that HAVE a pair, the formula is drawn from the same pool on a
      planned negative as on an ordinary claim, and the counterparty negative's own realization
      touches the PARTY and nothing else — so ВН citations, generic nouns and unprinted lines are
      drawn INDEPENDENTLY OF THE LABEL and no correlation exists in either direction. What was
      seen at that size was a coincidence of the draw.

      🔴 SINCE VERSION 33 THERE IS EXACTLY ONE EXCEPTION, AND IT IS A LABEL, NOT A LEAK: on a
      `subject_mismatch` claim the рахунок citation itself is the planned defect, forced onto the
      page (`must_cite`) and compared by the `subject` axis. So a рахунок citation that RESOLVES
      says something now — it says the pair passes that axis — while the noise this entry lists
      goes on saying nothing. The limitation that survives is the independence of the NOISE: a
      system that treats a ВН citation or a generic noun as linkage evidence is still right by
      accident and wrong by accident in equal measure.

      ⛔ THE INDEPENDENCE IS NOT A CORPUS-WIDE CLAIM, AND ONE LABELLED CAUSE IS OUTSIDE IT ENTIRELY.
      An `insufficient_evidence` claim with the cause `subject_not_evidenced` carries a payment
      document ALONE (`claim_planner.EvidenceIntent.EVIDENCE_GAP`), so there is no subject document
      for a purpose to cite and `content_builder._fill_reference` fills the line with a drawn number
      belonging to nothing. A citation of the claim's own document is therefore IMPOSSIBLE on 100%
      of that cause — which is a property of the claim shape rather than of the purpose pool, and it
      is the reason the entry is scoped to pairs. A consumer computing "does the purpose cite a
      document of this claim" over the whole corpus is measuring, on that slice, whether the claim
      has a second document at all.
    consequence: >
      A SYSTEM MEASURED HERE IS TAUGHT TO IGNORE THE PURPOSE TEXT, and that lesson does not transfer.
      A learner that used purpose-text linkage would be penalized on the positives whose citation
      points elsewhere and unrewarded on the negatives whose citation is perfect, so the corpus's own
      gradient points at dropping the field — while in the world a payment purpose is one of the few
      places a payment says which obligation it settles.

      ⚠️ A LINKER'S RECALL BECAME MEASURABLE ON THE РАХУНОК SLICE IN VERSION 33, and only there:
      `cites_document_no` now says, structured, whether a рахунок citation was THERE TO BE FOUND
      and which number it names — the denominator the `cites_subject_document` flag was specified
      for in docs/cross-document-fields.md, delivered in a narrower and stronger form (the number
      itself rather than a boolean). The block that held that flag back — a contaminated share of
      the confirmation purpose pool — was repaired before this field shipped. ⛔ The ВН slice
      stays unmeasurable by design: a delivery-note number belongs to no document of the claim,
      so there is no "found it" for a recall figure to count.
    how_to_stratify: >
      INTO THREE BUCKETS, NOT TWO, AND THE FIRST OF THEM IS FREE. `payment_purpose` is a label
      field: `null` says the document PRINTS NO PURPOSE LINE, which is a different fact from a line
      that cites nothing of the claim, and a consumer that reports them together is measuring a
      linker against documents that gave it nothing to read.

      Of the documents that do print one, split by whether the line cites a рахунок —
      `cites_document_no` carries that structured since version 33; the ВН half still has to be
      parsed from `reference_text`. Report a linkage figure on each of the three shares and never
      as one number; a single figure moves with the pool's formula mix and with
      `payment_confirmation.initiation_shares`, both properties of a config file rather than of
      the system. And take the figure over claims that HAVE a pair: on a `subject_not_evidenced`
      claim there is nothing to cite, so a corpus-wide denominator scores that cause as a total
      linkage failure by construction.
    # ⚠️ MOVED HOME IN VERSION 33: this key sat under KL-17, the fx-rates entry, since the
    # revision that wrote it — a misfiled key, found while the version-33 change edited it.
    fixed_by: >
      NOTHING THAT SHOULD BE DONE BY WIDENING THE POOL, and the decision is the author's: 👁 the
      observed purpose lines name a delivery note as well as an invoice, and a corpus in which
      every payment cited its own invoice perfectly would put that field into the state
      `docs/cross-document-fields.md` calls ① — matching by construction, so a selector built on
      it measures the generator rather than the system. Both closures it once deferred were taken
      in version 33: the denominator is honest (`cites_document_no`), and document-number
      agreement IS the fourth axis of `cross_document_agreement` — as `subject`, scoped to the
      рахунок citation, with the ВН noise deliberately left outside it. The pool itself stays as
      observed, which is what keeps the field out of state ①.

  - id: KL-17
    name: currency conversion is exercised against static rates, and the world's are live
    predictor: none — the limitation is about what a measurement transfers to, not about a cue
    hurts: [evaluation]
    subset: every claim carrying a document not stated in the reporting currency
    what_the_corpus_does: >
      The oracle converts at the rates of config/fx-rates.yaml — STATIC BY DESIGN, as that
      file's own header says: a live rates API would destroy determinism, and reproducibility
      outranks realistic drift. Every conversion in the corpus therefore applies a rate that
      is the same for every transaction date, and the label records it (`fx_rates`).
    what_the_world_does: >
      A production system converts at a live rate for the transaction date. Rates drift daily;
      two documents weeks apart convert at genuinely different figures; the rate applied is an
      observation about the world, not a vendored constant.
    consequence: >
      🔴 A SYSTEM THAT PASSES THE CONVERSION SYMMETRY CHECK HERE HAS SHOWN IT IMPLEMENTS THE
      DECLARED ARITHMETIC, NOT THAT IT CONVERTS CORRECTLY AGAINST A LIVE SOURCE. What
      transfers is the mechanism — read the rate for the date, multiply once, quantize at the
      declared point; what does not transfer is everything a live source adds: retrieval
      failures, revision of published rates, date-boundary ambiguity (whose midnight?), and
      the choice of source itself. No figure measured on this corpus speaks to those. The gap
      is deliberate — the alternative was labels that change with the day they are generated
      on — and it is recorded here so it is inherited as a decision rather than as a silence.
    how_a_consumer_detects_it: >
      Compare `fx_rates[].rate` across documents of different dates: on this corpus they are
      equal for equal currencies, which is the signature of the static table. Any evaluation
      of date-sensitive conversion needs data this corpus deliberately does not contain.
    see_profile: run_profiles
    fixed_by: >
      NOTHING, BY DECISION: config/fx-rates.yaml is static because reproducibility outranks
      realistic drift, as its own header reasons. A corpus exercising date-sensitive conversion
      would need labels that change with the day they are generated on, which is the property
      this generator exists to refuse. The gap is inherited as a decision, not a backlog item.
      ⚠️ Until version 33 this key carried KL-16's `fixed_by` — a misfiled key, moved home.


# =============================================================================
# 9b. Run profiles — the measurements, kept apart from the limitations
# =============================================================================
#
# 🔴 WHY THIS SECTION EXISTS. A LIMITATION IS A PROPERTY OF THE CORPUS; A FIGURE IS A MEASUREMENT OF
# ONE RUN. While the two shared a record, every change to the draw forced rewriting the description
# of a property that had not changed — and the entries below `known_limitations` accumulated six
# "re-measured for version N" notes, which is not a record of diligence but the tell that the
# numbers were in the wrong place.
#
# So: a limitation describes itself QUALITATIVELY and REFERENCES a profile. It never quotes one. A
# profile is self-describing — its identity, its size, its distributions — and adding one rewrites
# nothing.
#
# 🔴 WHICH PROFILE IS AUTHORITATIVE FOR A CONSUMER: THE ONE THAT PRODUCED THE CORPUS THEY RECEIVED,
# and nothing else. The others are cheaply reproducible examples, published so that a reader can see
# how a quantity behaves at another size without regenerating anything. Two sets of numbers for the
# same quantity are NOT a contradiction in this file — they are two runs — and this sentence is what
# stops them reading as one.
#
# EVERY FIGURE CARRIES ITS DENOMINATOR, and every profile carries the identity of the run: the
# command, the seed and the sizes. A figure that cannot say which corpus it measured is a figure
# that will one day be read as describing a different one.
#
# `authoritative: false` on a profile is a statement about THIS repository rather than modesty:
# the generator ships configuration and a seed, not a corpus, so an example run recorded here is
# not the run a consumer holds. This paragraph read "on every profile here" until version 34 —
# stale from the moment RP-06 landed marked `authoritative: true`, which is exactly the "whoever
# generates the delivered corpus adds its profile and marks it" this paragraph used to promise.
# `authoritative_profile` below is the key that says which one it is.

run_profiles:
  status: emitted
  authoritative_profile: >
    RP-06, AND ONLY RP-06. It is the profile of the delivered production corpus — twice the size of
    the first production run and partitioned in half — so it is the one whose numbers describe the
    data in a consumer's hands, and it is the only profile marked `authoritative: true`.

    🔴 RP-05 WAS AUTHORITATIVE AND IS NOT ANY MORE, AND IT IS DEMOTED IN WRITING RATHER THAN
    QUIETLY. It records the first production run, at half the size and an 85/15 partition, and it
    stays here for the same reason every other profile does: a run that happened does not go stale.
    What changed is its STANDING, not its numbers — they were correct when taken and are correct
    now. Its own `superseded_by` key says so at the profile, so a consumer that opens RP-05 first
    learns it there and not only here. THE REASON IT WAS SUPERSEDED IS A MEASUREMENT: its corpus row
    cleared the per-class minimum and its VALIDATION side did not, and validation is where a figure
    is actually computed.

    EVERY OTHER PROFILE HERE IS AN EXAMPLE AND STAYS ONE. RP-01 through RP-04 record runs kept
    because a cheaply reproducible example of how a quantity behaves is worth having; none of them
    describes the delivered corpus. 🔴 SO SEVERAL SETS OF NUMBERS FOR THE SAME QUANTITY ARE SEVERAL
    RUNS AND NOT A CONTRADICTION — this key is what says which one to read, and without it the
    figures below would read as the file disagreeing with itself.

    This repository still ships the generator, its configuration and a seed, never a dataset. The
    corpus RP-06 describes is reproduced from the seed rather than committed, which is why the
    production profiles carry hashes: they are how a consumer checks that the directory they hold is
    the corpus this file is talking about.

  a_profile_describes_the_version_it_names: >
    🔴 FOUR PROFILES BELOW WERE TAKEN FROM THE SAME INVOCATION, AND SOME OF THEM CARRY DIFFERENT
    NUMBERS, AND THAT IS NOT A CONTRADICTION. RP-01, RP-03, RP-04 and RP-05 were all run as `--seed
    42 --personas 48 --claims-per-persona 8`. Version 17 added a per-document draw — the capture
    channel — so the same seed no longer produces the same documents:
    `generator_version_at_measurement` on each profile is what tells them apart, and the LATEST
    version's profile is the one that describes what the command does now.

    ⚠️ TWO OF THE FOUR NOW SPELL A `--split` THE OTHER TWO CANNOT, so the `command` strings are no
    longer identical even where the invocation was. RP-04 and RP-05 ran with a partition and had
    its fraction defaulted; RP-01 and RP-03 predate partitioning. See
    `a_command_that_predates_the_split_flag`.

  a_command_that_predates_the_split_flag: >
    🔴 A RECORDED COMMAND HAS TWO JOBS AND VERSION 24 PUT THEM IN CONFLICT FOR THREE PROFILES. It
    says what was run, and it is the handle by which a reader reproduces the run. `--split` became
    REQUIRED and lost its default in version 24 — the fraction is a decision about the measurement,
    and a default lets a run be performed without that decision ever having been declared — so a
    command with no `--split` no longer executes.

    THE PROFILES FALL INTO THREE CASES AND EACH IS TREATED DIFFERENTLY, ON THE HISTORY RATHER THAN
    ON INFERENCE:

      RP-06 passed the fraction explicitly. Nothing was done to it.

      RP-04 and RP-05 RAN WITH A DEFAULT IN EFFECT, and the value that was applied is knowable:
      0.85, at the `receipt-synth` commits those versions were taken on. Their commands now state
      it, so they reproduce the run they describe. Each says so at its own
      `the_command_states_a_fraction_the_run_inherited`.

      RP-01, RP-02 and RP-03 PREDATE THE FLAG ENTIRELY — there was no partition and no fraction to
      inherit. 🔴 THEIR COMMANDS ARE ACCURATE AND NOT RUNNABLE, AND THAT TENSION IS RECORDED RATHER
      THAN RESOLVED, because the two available resolutions are both worse than stating it. Adding a
      fraction would make a run claim a partition it never had, and for RP-03 would additionally
      make its command identical to RP-04's, collapsing two profiles onto one invocation. Deleting
      the profiles would destroy the record that the runs happened, which is the one thing a profile
      is evidence of.

    ⚠️ SO: A COMMAND ON RP-01, RP-02 OR RP-03 IS A HISTORICAL RECORD AND MUST NOT BE PASTED INTO A
    SHELL. It will be refused for want of `--split`, and that refusal is CORRECT — the run it
    describes had no such argument. RP-01 and RP-02 do not reproduce their corpora under any
    arguments in any case, the draw having moved in version 17; RP-03's documents are still
    current, and the way to reproduce them WITH a partition is RP-04's command.

    ⚠️ AND WHERE THE NUMBERS DO NOT DIFFER, THE PROFILES STILL DO. RP-03, RP-04 and RP-05 describe
    ONE corpus — the draw had not moved between their versions — so they agree count for count.
    What separates them is what each is FOR: RP-03 and RP-04 are examples, RP-05 is the FIRST
    production corpus. (This sentence called RP-05 "the authoritative one" until version 34, which
    had been false since RP-06 superseded it — `authoritative_profile` above and RP-05's own
    `superseded_by` already said so, and this paragraph was the one place left saying otherwise.)
    Agreement between profiles is not redundancy to be tidied away; deleting the older ones would
    destroy the record that the run happened.

    Earlier profiles are kept rather than refreshed. A profile is a record of a run that happened,
    and a run that happened does not go stale; rewriting one to match a newer version would destroy
    the only thing it is evidence of. A new version adds a profile.

  profiles:
    - id: RP-06
      authoritative: true
      purpose: >
