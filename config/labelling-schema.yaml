  - id: RC-06
    file: src/receipt_synth/schemas.py, content_builder.py
    status: done in version 10, and NARROWER than it was asked for
    change: >
      DONE, in a form the original entry got partly wrong. The payment-confirmation fields are
      carried as values — `payer`, `counterparty` (the payee), `payment_purpose`, `document_code`,
