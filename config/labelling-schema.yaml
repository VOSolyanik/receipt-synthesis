    blocked_on: decision

  - id: RC-15
    file: src/receipt_synth/schemas.py
    change: >
      Record each document's role in a linked claim (`proof_of_subject` / `proof_of_payment`)
      per document rather than only as a type-level default in policy.yaml's
      `document_evidence`.

      NOW LOAD-BEARING RATHER THAN MERELY ABSENT. `policy_engine.resolve_evidence` derives
      the role from the document's TYPE at evaluation time, which is the only thing
      `DocGroundTruth` carries. Two consequences follow, and neither existed while a claim
      had one document. First, an archetype whose evidence differs from its type's default —
      policy.yaml's own example is a bank confirmation whose payment purpose spells out what
      was bought — CANNOT BE REGISTERED, because the engine would go on applying the default
      and label the claim by a rule the plan had overridden; `claim_planner.Archetype` says
      so and carries no override fields for that reason. Second, a consumer holding only the
      labels has to re-derive the pairing the same way, since `documents` is a flat list of
      ids.

      The requirement's `DocumentLink` also expects the result of named cross-checks. Two of
      them — amount agreement and date order — are now performed and reported as
      `imperfection` causes on the claim; the rest need fields that do not exist. See
      `claim_label.linked.partly_closed`.
    blocked_on: decision

  - id: RC-16
    file: config/policy.yaml first, then src/receipt_synth/content_builder.py
    change: >
      MAKE `amount_due` DIFFER FROM `amount`, so that the field measures something. Two pieces,
      in this order and not the other:

      FIRST, POLICY. A discount applies to the basket while coverage is decided per line, so
      `covered_fraction` is undefined until policy.yaml states how a basket-level discount is
      DISTRIBUTED across covered and non-covered lines — pro rata by line value, against the
      non-covered lines first, or some other rule. This is a policy decision and cannot be
      taken in the generator: whichever rule the code picked would become ground truth for a
      question the policy never answered.

      THEN THE BUILDER. `PrroReceipt.discount` and `.rounding` are fixed at zero and
      `amount_due` is derived from them. The derivation and the sign of each term are pinned by
      `test_amount_due_is_the_total_less_the_discount_plus_the_rounding`, on a receipt whose
      adjustments are set by hand — so whoever unfixes the two values gets told if the
      arithmetic is wrong, which no test could see while both were zero. That is the extent of
      the claim: the plumbing is in place, not that the change is free.
      Two more places print `amount` today and must follow `amount_due` at that point rather
      than before: the `paid_amount` line of the payment block, and the amount in words. Both
      state what the customer parted with, so both are wrong the moment a discount is non-zero
      — and both are correct while it is zero, which is why they were left alone.

      Until then the field's accuracy is not a metric; see `document_label.amount_due`.
    blocked_on: decision

# Two items belong on the consumer's side and are recorded so they are not lost:
#
#   * The consumer's line-item guard routes a claim to `in_review` when the line-item array
#     is empty while `total > 0`, while the requirements document makes an empty array correct for
#     `payment_confirmation` and `bank_statement`. The guard has to be type-aware or those
#     two types always land in manual review. Recorded under
#     `document_label.line_items.cardinality`.
#
#   * The consumer's arithmetic guard checks `subtotal + Σtax ≈ total` and its line-item
#     guard checks `abs(Σline_items − subtotal)`, which require `subtotal` to be net in one
#     and gross in the other. On a VAT-inclusive Ukrainian receipt only the gross is
#     printed, and the generator emits no subtotal at all. Recorded under
#     `document_label.amount.no_subtotal`.
