      🔴 THE CONTRADICTION THIS NOTE USED TO RECORD IS RESOLVED AT VERSION 34.
      `document_types.payment_confirmation.status` read `forward_contract` — NOT PRESENT IN THE
      DATASET — while RP-06 counted the class by the hundred, and this note refused to move the
