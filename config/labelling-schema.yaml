  - id: RC-12
    file: src/receipt_synth/assembler.py, schemas.py, templates/ua_claim_bundle.html
    progress: >
      done in version 29 for the pattern this generator will contain, and CLOSED rather than
      narrowed for the pattern it will not — the second half is a decision, not an omission
    change: >
      DONE. Multi-document files are modelled and this generator is the source of ground truth for
      their boundaries, which is what this entry asked for. A share of eligible claims —
      `file_composition.bundle_share` in config/generation.yaml — is composed into ONE image, the
      subject document above the payment document, and each document keeps its own label file with
      the shared `source_file`, its own `file_region`, and every coordinate in the file's space.
      The whole file is degraded ONCE, so the regions and the boxes cannot desynchronize. The
      independent second relation landed with it: `page_count` and `page_regions` for a document
      that runs onto more than one sheet, and the combination of the two — a paginated statement
      inside a shared file — is produced and tested. The entry's own words for what was missing,
      "today one image is one document and no label describes a region of a file", are false in both
      halves as of version 29.

      ⛔ AND ONE PATTERN IS DELIBERATELY UNSUPPORTED, WHICH IS WHY THIS ENTRY CLOSES RATHER THAN
      LEAVING A REMAINDER. Three things a consumer must read as stated, not inferred:

      ONLY "THE DOCUMENTS OF ONE CLAIM IN ONE FILE" IS MODELLED. A claim is the unit a verdict is
      reached on, so a file spanning two claims would be evidence for two answers at once and no
      relation in this schema could say which part of the image belongs to which claim's label. It
      is refused by construction rather than deferred.

      "THE DOCUMENTS OF DIFFERENT CLAIMS IN ONE FILE" WILL NOT BE BUILT — the author's decision of
      31.07, on the ground that the product removes the manual-process incentive that produces such
      a file in the first place. THE CONSUMER'S GUARD IS NAMED HERE AS THE BOUNDARY, and it is
      consumer behaviour rather than anything this generator does: documents of one file that do not
      converge on one claim route that claim to MANUAL REVIEW. A dataset is therefore not the place
      that case is answered, and no label of this corpus describes one.

      A FILE HOLDS AT MOST THE DOCUMENTS OF ONE CLAIM — today at most TWO, since that is the largest
      evidence set the planner builds — AND NEVER THE CONSUMER'S "UP TO TWELVE". A segmentation step
      measured here is measured on one boundary at a time. That is a real limit on what a figure
      taken on this corpus supports, and it is stated rather than left to be discovered from a
      histogram.

      ⚠️ WHAT IS NOT CLOSED IS A DIFFERENT QUESTION AND HAS ITS OWN ENTRY: there is still no
      file-level record. `capture` — now drawn per FILE where a file holds two documents —
      `source_file` and the content-completeness fields all sit on the DOCUMENT, so two labels of
      one file repeat one file's facts. That is RC-11, whose `medium`-on-`ClaimFile` disagreement is
      the same modelling decision seen from one field.
    blocked_on: done
    blocked_on_note: >
      THE `src/` CHANGE IS MADE — see `change:` above — and `done` is the word for it under this
      file's own definitions, although the entry closes in TWO ways at once and the vocabulary has
      no word for that. Half of the ask was BUILT and half was WITHDRAWN by decision, which is
      `nothing`'s meaning; `nothing` alone would assert that a completed change had been dropped,
      which is the exact defect the fourth word was added to prevent at version 22. The word says
      the change was made and this note says what was decided instead of built, rather than a fifth
      word being invented to carry a single entry.

