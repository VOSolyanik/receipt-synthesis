          AUTHORITATIVE. Denominator: the whole 1315-document corpus, split 653 / 662.

          NOTHING IS TRAINED ON THIS DATASET. The familiar 85/15 comes from tasks where a model
          LEARNS on the larger side, and that side is large because learning consumes examples.
          Here the partition guards against fitting the MEASUREMENT instead: a consumer looks into
          documents, finds where classification or extraction errs, adjusts accordingly — and a
          figure does not count on the documents that were looked at and tuned against. Inspecting
          failures needs a few dozen documents, so the development side has no reason to be large
          and the measurement side has every reason to be.

