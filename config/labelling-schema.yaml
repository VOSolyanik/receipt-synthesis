# What this generator labels, what the consumer requires, and where the two disagree.
# A CONTRACT, not documentation.
#
# WHY IT EXISTS. A consumer of this dataset has an extraction step, which needs a
# structured-output schema, and a scorecard, which needs comparison rules. Agree the two
# separately and they disagree: this generator emits `counterparty`, the consumer's
# requirement names the field `seller_name`, and the scorecard reports zero accuracy on a
# system that works. Worse, it reports a plausible 40% on a system that reads every field
# correctly and writes dates the other way round — indistinguishable from a real
# regression. So name, type and comparison rule are settled here, once.
#
# TWO SIDES, AND THIS FILE CARRIES BOTH.
#
#   generator side — what `src/receipt_synth` emits today, verified against a real run.
#   consumer side  — what the extraction and evaluation requirements demand. This is the
#                    SOURCE OF TRUTH for what the dataset must eventually contain.
#
# A contract that documented only the generator would silently inherit every divergence
# instead of recording it. So wherever the two disagree, both names appear, marked
# `status: divergent`, and THIS FILE PICKS NEITHER. Resolving a divergence means either a
# change in `src/` or an amendment to the requirement, and both are the author's call.
# Every `src/` change a divergence implies is collected in `required_changes` at the foot
# of this file. None of them has been made.
#
# IT DUPLICATES NOTHING. Coverage rules, limits, the category vocabulary and the evidence
# matrix stay in policy.yaml; pipeline narrative stays in docs/architecture.md; the
# consumer's requirements stay in the consumer's own repository. All are referenced by
# name. Two copies of a rule become two rules the first time one is edited.
#
# NO CODE IN `src/` READS THIS FILE. There is no loader for it there, and adding one would be
# inventing a caller. It is consumed by downstream tooling; its accuracy is maintained by being
# re-checked against a freshly generated label file.
#
# TWO TESTS READ IT, and the sentence above used to say "nothing in this repository", which the
# first of them made false. Both read the SAME block — the payment-date mapping — because it is the
# one place where this file states something the generator has to obey rather than something it
# merely records:
#
#   `tests/test_payment_date_split.py` loads this file and config/policy.yaml together, to check
#   the property neither file can hold alone: the CONCEPT is named in the policy and the printed
#   captions only here, with no caption on the policy side.
#   `tests/test_payment_confirmation.py` checks that every date caption the generator PRINTS is one
#   this file accepts, and that none is one it refuses. Without it the mapping could be correct and
#   the documents could still carry a caption the contract says is not the payment date.
#
# Neither is a loader: nothing in the pipeline calls them, and `src/` still reads nothing here.

# Bumped to 19 by A PROFILE BECOMING AUTHORITATIVE. THREE consequences a consumer has to know about,
# and NO LABEL RECORD GAINED A KEY, NO RULE CHANGED AND THE DRAW DID NOT MOVE.
#
#   🔴 THE ANSWER TO "WHICH NUMBERS DESCRIBE MY CORPUS" HAS CHANGED. Version 15 declared that NO
#   profile in this file was authoritative, because the repository shipped a generator and a seed and
#   never a corpus. A production run has now been made and delivered, so `run_profiles` carries RP-05
#   with `authoritative: true` and `authoritative_profile` names it. A consumer that read the old
#   sentence and concluded "every figure here is an example" would carry that reading past the point
#   where it stopped being true — which is exactly the change a version number exists to flag.
#
#   ONE NEW PROFILE, RP-05, AND NOT ONE EDIT TO AN OLDER ONE. That is the profile split working as
#   designed: a profile is a record of a run that happened and does not go stale, so a new run adds
#   a profile and rewrites nothing. `known_limitations` is untouched for the same reason — a
#   limitation references the SECTION and never a profile id.
#
#   ⚠️ RP-05 DESCRIBES THE SAME DOCUMENTS AS RP-03 AND RP-04. The production command is the command
#   those profiles record, at the same seed, with a draw that has not moved since version 17 — so the
#   production run reproduced that corpus rather than enlarging it. The three agree count for count;
#   what differs is standing, and `authoritative_profile` is where that is said.
#
#   RP-05 CARRIES HASHES, which no earlier profile does: a manifest digest and two directory digests,
#   so a consumer can settle whether the corpus in hand is the one this file describes instead of
#   assuming it. The dataset is still not committed — it is reproduced from the seed — and the hashes
#   are what make "reproduced from the seed" checkable.
#
# Bumped to 18 by THE TRAIN / VALIDATION PARTITION. FOUR consequences a consumer has to know about,
# and the draw did not move for any of them.
#
#   ONE NEW LABEL FIELD, `split`, on BOTH the document record and the claim record: `train`,
#   `validation`, or `null` where no partition was computed. A claim and its documents can never
#   disagree, because the unit of the partition sits above both.
#
#   🔴 THE UNIT IS THE PERSONA, AND THE REASON IS A LABEL DEPENDENCY RATHER THAN A FEATURE LEAK.
#   Annual limits are cumulative per persona, so a claim labelled `partially_covered` with the cause
#   `limit_exhausted` CARRIES THAT LABEL BECAUSE OF THAT PERSONA'S EARLIER CLAIMS. Partition by
#   claim and a validation label becomes a function of training data — an objection no amount of
#   shuffling addresses. Keeping personas whole also keeps a claim's documents together and keeps a
#   persona's printed name and tax id off both sides at once.
#
#   ⚠️ IT IS NOT STRATIFIED, AND A SIDE MAY BE MISSING A WHOLE VERDICT OR CLASS. Deliberate:
#   stratifying would tune the corpus, and this generator's rule is that the balance report makes a
#   shortfall visible rather than repairing it. A consumer must check what its validation side
#   actually contains before reporting anything per class — the report names the gaps, and
#   `run_profiles` records them for the runs it describes. See `known_limitations` KL-13.
#
#   THE MANIFEST GAINED A `split` BLOCK carrying the DECISION — unit, requested fraction, realized
#   counts — and deliberately NOT the id lists: the ids are on the records, and a list beside a
#   field would be two statements of one fact.
#
#   THE DRAW DID NOT MOVE. Verified byte-identically against version 17's output for the same seed:
#   86 of 86 images identical, and every label file identical once `split` is removed. The partition
#   is seeded independently of the generator's own stream precisely so that it labels an existing
#   corpus instead of changing it.
#
# Bumped to 17 by THE OTHER TWO CAPTURE CHANNELS ARRIVING. FIVE consequences a consumer has to know
# about, and the first of them changes every image in the corpus.
#
#   `capture` NOW TAKES ALL THREE OF ITS DECLARED VALUES. `photo` and `scan` used to raise
#   `NotImplementedError`, so the vocabulary existed and two thirds of it was unreachable; both now
#   have recipes and the channel is drawn per document. A consumer that pinned "every document is a
#   screenshot" — or that inferred it from the data rather than from this file — meets paper media,
#   rotation, perspective and a cast shadow at once. 🔴 THE MEDIUM FOLLOWS: `photo` and `scan` are
#   PAPER, so the asymmetric VAT-row rule finally has documents on its paper side, where only the
#   `equals` form occurs. See `known_limitations` KL-10, whose detection note this version corrects.
#
#   ⚠️ `digital_pdf` IS STILL NOT A VALUE, AND THAT IS A POSITION RATHER THAN AN OMISSION. The
#   consumer's `medium` vocabulary has four members; a natively generated PDF is the UNDAMAGED
#   ORIGINAL — the absence of a capture channel, not one of them — so it cannot be produced by
#   adding a fourth recipe here. Four media, three channels. See RC-11.
#
#   ONE NEW LABEL FIELD, `content_lost_edges`, and one DERIVED field beside it,
#   `content_complete`. Per document: did all the printed TEXT survive the capture, and if not,
#   which edges of the image it crosses. The second is computed from the first inside the model, so
#   the two cannot disagree; `content_complete` is `null` where there is no extent to measure, which
#   is NOT `false`. ⚠️ Its scope is the scope of `content_bbox` — TEXT — so a capture that cut off a
#   QR while keeping every character reports complete, truthfully.
#
#   🔴 A BOUNDING BOX MAY NOW LIE PARTLY OUTSIDE THE IMAGE, and a consumer that assumed otherwise
#   has to clip. This is the change that makes the field above mean anything: Albumentations clips
#   every box to the frame on every path, so a box trimmed flush with the edge is what a document
#   that lost a tenth of its content looks like AND what a document that lost nothing looks like.
#   The generator therefore carries coordinates as corner keypoints and rebuilds the box itself. The
#   clipped form can be derived from what is emitted; the emitted form cannot be derived from the
#   clipped one.
#
#   🔴 THE CHARACTER ERROR RATE IS DEFINED ONLY ON A SUBSET, AND THE SIZE OF THAT SUBSET PER CHANNEL
#   IS PART OF THE RESULT. `reference_text` is the reference side of a distance over the whole page,
#   and that distance means nothing where the text is not in the picture. "CER on photo = X" is not
#   a result. See `known_limitations` KL-12, and the per-channel completeness counts in
#   `run_profiles`.
#
#   THE DRAW MOVED. The capture channel is drawn per document, so a seed produces different
#   documents from the ones it produced under version 16 — not different RULES, different DRAWS.
#   Every figure in `run_profiles` recorded before this version describes a corpus no seed now
#   reproduces; the profiles say which version they were taken on, and a new one is added rather
#   than the old ones edited.
#
# Bumped to 16 by THE COMPARISON RULES BECOMING EXECUTABLE. FOUR consequences a consumer has to
# know about, and none of them is a change to the data.
#
#   ONE NEW BLOCK, `conformance_vectors`, standing as section 2b directly after the `normalization`
#   rules it pins down: 43 cases over the 13 classes there marked `status: emitted`. Each case
#   names what an EXTRACTOR might return, what this dataset carries
#   for the same thing, whether the class's rule declares the two equal, and WHICH CLAUSE decides
#   it. 🔴 AN IMPLEMENTATION IS CONFORMANT WITH A CLASS WHEN IT AGREES WITH EVERY `equal` OF THAT
#   CLASS — a testable relationship where "strip the legal form" had been a sentence two readers
#   implement two ways. A rule agreed in prose is disagreed in code, and the disagreement arrives
#   as a scorecard reporting a fault in a system that works.
#
#   ⚠️ THE CASES ARE TYPED BY CLASS AND NOT BY FIELD, so a consumer looks a field's cases up
#   through its `normalize:` key rather than by the field's name. Attached to fields they would be
#   repeated once per field of the same class, and the copies would drift apart.
#
#   🔴 NOTHING IN THIS REPOSITORY RUNS THEM, AND THE BLOCK SAYS SO WHERE IT LIVES. The generator
#   emits one side of a comparison and never performs one, so there is no normalizer here to run
#   them against; writing one to match would prove only that the file agrees with itself. They are
#   for whoever writes the other side. What IS checked here is the FIXED POINT — that every value
#   this dataset emits is already in the canonical form its class declares, so an untrimmed name or
#   an unrounded amount fails loudly — together with the completeness of the block over every
#   emitted class, and one property of the file's own text: that the single input written as an
#   escape sequence is STILL an escape sequence. A vector for Unicode normalization has to carry a
#   string that is NOT normalized, and an editor, a terminal or a well-meant reformat would
#   normalize it silently, leaving a case that tests nothing while still looking like a test.
#
#   NO LABEL RECORD GAINED A KEY AND THE DRAW DID NOT MOVE. The rules themselves are unaltered —
#   the vectors restate as cases what `normalization` already stated in prose — so a consumer
#   holding data generated under version 15 can adopt them without regenerating anything.
#
# Bumped to 15 by TWO ADDITIONS THAT CHANGE NO DOCUMENT — one to the label, one to this file's own
# shape. FOUR consequences a consumer has to know about.
#
#   ONE NEW LABEL FIELD, `reference_text`: EVERY PRINTED CHARACTER of the page, in reading order,
#   read from the layout engine BEFORE rasterization. It is ground truth by construction, exactly as
#   the bounding boxes are — nothing was transcribed from an image. 🔴 IT IS NOT THE FIELDS:
#   `field_bboxes` covers the LABELLED fields while this covers ALL text, and the difference is what
#   a measurement of whether a capture survived degradation rests on. A document whose every
#   labelled field came through while a cropped footer took the fiscal wording with it would report
#   as complete measured on the fields alone.
#
#   ONE NEW LABEL FIELD, `content_bbox`: where that text is, as one box. ⚠️ Text and only text — a
#   QR, a stamp and a signature are ink it does not cover — so it and `reference_text` describe the
#   same thing. It travels through the degrader's geometry with the field boxes, so it can never
#   drift from them.
#
#   🔴 THE RUN FIGURES LEFT `known_limitations` AND NOW LIVE IN `run_profiles`. A consumer that
