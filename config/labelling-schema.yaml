# What this generator labels, what the consumer requires, and where the two disagree.
# A CONTRACT, not documentation.
#
# WHY IT EXISTS. A consumer of this dataset has an extraction step, which needs a
# structured-output schema, and a scorecard, which needs comparison rules. Agree the two
# separately and they disagree: this generator emits `counterparty`, the consumer's
# requirement names the field `seller_name`, and the scorecard reports zero accuracy on a
# system that works. Worse, it reports a plausible 40% on a system that reads every field
# correctly and writes dates the other way round — indistinguishable from a real
# regression. So name, type and comparison rule are settled here, once.
#
# TWO SIDES, AND THIS FILE CARRIES BOTH.
#
#   generator side — what `src/receipt_synth` emits today, verified against a real run.
#   consumer side  — what the extraction and evaluation requirements demand. This is the
#                    SOURCE OF TRUTH for what the dataset must eventually contain.
#
# A contract that documented only the generator would silently inherit every divergence
# instead of recording it. So wherever the two disagree, both names appear, marked
# `status: divergent`, and THIS FILE PICKS NEITHER. Resolving a divergence means either a
# change in `src/` or an amendment to the requirement, and both are the author's call.
# Every `src/` change a divergence implies is collected in `required_changes` at the foot
# of this file. None of them has been made.
#
# IT DUPLICATES NOTHING. Coverage rules, limits, the category vocabulary and the evidence
# matrix stay in policy.yaml; pipeline narrative stays in docs/architecture.md; the
# consumer's requirements stay in the consumer's own repository. All are referenced by
# name. Two copies of a rule become two rules the first time one is edited.
#
# NO CODE IN `src/` READS THIS FILE. There is no loader for it there, and adding one would be
# inventing a caller. It is consumed by downstream tooling; its accuracy is maintained by being
# re-checked against a freshly generated label file.
#
# TWO TESTS READ IT, and the sentence above used to say "nothing in this repository", which the
# first of them made false. Both read the SAME block — the payment-date mapping — because it is the
# one place where this file states something the generator has to obey rather than something it
# merely records:
#
#   `tests/test_payment_date_split.py` loads this file and config/policy.yaml together, to check
#   the property neither file can hold alone: the CONCEPT is named in the policy and the printed
#   captions only here, with no caption on the policy side.
#   `tests/test_payment_confirmation.py` checks that every date caption the generator PRINTS is one
#   this file accepts, and that none is one it refuses. Without it the mapping could be correct and
#   the documents could still carry a caption the contract says is not the payment date.
#
# Neither is a loader: nothing in the pipeline calls them, and `src/` still reads nothing here.

# Bumped to 10 by THE SECOND DOCUMENT CLASS ARRIVING: a bank payment confirmation has a template, a
# builder and label fields. SEVEN consequences a consumer has to know about, and the first is the
# one that changes what a label record looks like.
#
# Derived the same way as the lists below — a key-set diff of this file against the previous
# version, the printed-field inventory, and the `known_limitations` section.
#
#   SIX NEW KEYS ON EVERY LABEL RECORD, because there is one label model for every document class:
#   `fee`, `total_charged`, `payer`, `payment_purpose`, `document_code`, `auth_code`. They are
#   `null` on a fiscal receipt, which prints none of them. A consumer that pinned the key set of a
#   document label breaks on them — the same lesson as version 8's two new bbox keys, one level up.
#
#   🔴 `amount` ON A CONFIRMATION IS THE TRANSFER AND NOT THE LARGEST NUMBER ON THE PAGE. 👁 0 of 8
#   real confirmations carry a single amount: each prints the operation amount and the fee, and 1
#   of 8 also prints their sum, in the biggest type on the sheet. 📄 The National Bank's
#   instruction on non-cash settlements names the amount of the OPERATION as the requisite and does
#   not name the fee at all, and a fee buys a banking service that no benefit category covers. So
#   the salient number is the wrong one, deliberately, and `total_charged` is labelled beside
#   `amount` to make the disagreement measurable rather than invisible.
#
#   TWO FIELDS THIS TYPE NEVER HAD ARE GONE FROM ITS REQUIRED LIST: an RRN and a payment form.
#   👁 0 of 8. An RRN is a requisite of the CARD OPERATION printed inside a fiscal receipt — where
#   this generator does print it, so the earlier 0-of-8 finding was a misplacement rather than a
#   defect — and a payment form is a receipt requisite too. Deduplication for this class rests on
#   the bank's own document number, 👁 8 of 8 and 📄 mandatory; the authorization code cannot carry
#   it at six digits. See RC-06, amended.
#
#   THE FIELD SET VARIES WITHIN THE CLASS, BY HOW THE PAYMENT WAS INITIATED. A card operation
#   carries an authorization code and a card number; a transfer by account details carries neither.
#   👁 3 of 8 documents carry a card AND an authorization code AND a payment purpose at once, which
#   refuted an earlier plan to split the class into two archetypes. A consumer must not treat a
#   missing authorization code as an extraction failure.
#
#   `forward_contract` NOW MEANS "NOT IN THE DATASET" rather than "no template produces it". The
#   word is unchanged everywhere it is used and the promise a consumer relies on is unchanged; what
#   changed is that a class can now have a template and still not be in any run. See
#   `status_vocabulary`.
#
#   `normalization.identifier` NO LONGER SAYS THAT NOTHING CARRIES AN IDENTIFIER VALUE. Two do —
#   `document_code` and `auth_code` — so the rule it states has something to normalize for the
#   first time.
#
#   NO NEW `known_limitations` ENTRY, AND THE ABSENCE IS DELIBERATE. This class is narrower than
#   the observation in four named ways — one layout for four issuers among them — but every entry
#   in that section states a SHARE OF A REFERENCE RUN, and no run contains a document of this class
#   at all. A limitation of a dataset that does not yet hold the class would be a share of nothing.
#   The four narrowings are recorded on the type instead, under `narrower_than_observed`, and they
#   become `known_limitations` entries when a run first contains one.
#
# Bumped to 9 by THE PAYMENT DATE ACQUIRING A DEFINITION, which is a change of MEANING with no
# change of shape: no key of any label record is added, removed or retyped, so a consumer diffing
# the label structure sees nothing. FOUR consequences a consumer has to know about.
#
# Derived the same way as the two lists below — a key-set diff of this file against the previous
# version, plus the `known_limitations` section, which this version does not touch.
#
#   `date` ON A PAYMENT CONFIRMATION NOW HAS ONE ANSWER, WHERE IT PREVIOUSLY HAD SIX. A real bank
#   confirmation prints several dates under captions the law does not define; until now this file
#   said only "the calendar date of the transaction", which every one of them satisfies. The
#   caption preference order and the three refused captions are
#   `document_types.payment_confirmation.payment_date`. A consumer whose extraction takes the
#   first date on the page, or the one with a time beside it, is not extracting this field.
#
#   AND IT IS THE VERDICT THAT MOVES, NOT ONLY THE FIELD. The benefit period is checked on this
#   value and on no other (`claim_evidence.period_and_date`), so a consumer reading a different
#   printed date reaches a different verdict on any claim paid near a period boundary — while
#   every field it extracted looks correct. That is why the number moves for a change that adds
#   no key.
#
#   THE DEFINITION IS SPLIT ACROSS TWO FILES ON PURPOSE, AND A CONSUMER NEEDS BOTH. The CONCEPT —
#   the date the funds left the payer's account — is `period.payment_date` in config/policy.yaml,
#   which is the file a consumer vendors to reproduce the labels. The MAPPING of printed captions
#   onto it is here. Neither file names both, and neither is sufficient alone.
#
#   ONE PROSE CORRECTION AT THE HEAD OF THIS FILE, recorded rather than made quietly because it
#   was a claim about the repository: "nothing in this repository reads this file" is now "no code
#   in `src/` reads this file", one test having been added that loads it.
#
# Bumped to 8 by the `fiscal_receipt` CLASS GAINING TWO MORE ARCHETYPES, which changes what a
# document of that class may contain and what a fixed key set for it is worth. SIX consequences
# a consumer has to know about.
#
# Derived the same way as the version 7 list below — a key-set diff of this file against the
# previous version, the printed-field inventory, and the `known_limitations` section — because
# each omission from that list was found by deriving the delta rather than by re-reading it.
#
#   THE CLASS IS NO LONGER ONE RENDERING. `ua_prro_receipt` is joined by `ua_prro_receipt_58mm`,
#   the same software register on the narrow 58 mm roll, and by `ua_rro_receipt`, a classic
#   hardware register. All three carry `doc_type: fiscal_receipt` and the same labelled fields;
#   they differ in the paper width and in the fiscal identity printed at the foot. A consumer
#   that treated the class as one layout — a fixed image width, a fixed key set, a template match
#   on «ФН ПРРО» — meets all three now. See `printed_fields`.
#
#   TWO NEW BBOX KEYS, AND ONE OF THEM IS ON A MINORITY OF DOCUMENTS. `provider_name` is the
#   maker's name printed immediately after «ФІСКАЛЬНИЙ ЧЕК» — 📄 the same requisite of the form as
#   the wording, 👁 present on 11 of 11 open receipts, and absent from this generator's output
#   until now. `device_serial` is the «ЗН» factory serial, and it appears ONLY on the hardware
#   archetype: ⚠️ «ЗН» and «ФН» are not a pair. `mode_marker`, present on every document until
#   now, is absent from that same archetype. See `printed_fields.varies_with_the_kind_of_register`.
#
#   `fiscal_device_number` IS PREFIXED TWO WAYS AND `receipt_number` HAS TWO FORMATS. The
#   printed prefix is «ФН ПРРО» on a software register and «ФН» on a hardware one; the receipt
#   number is an eleven-character alphanumeric id on the first and four to six digits on the
#   second. Same keys, same meanings, two printed shapes — so a consumer validating either by
#   format needs both.
#
#   KL-02 IS WIDER, WHICH IS A LIMITATION SHRINKING RATHER THAN GROWING. `hygiene`, the fourth
#   excluded kind of the one category with an archetype, was absent from every document because
#   its templates named a brand the vocabulary could not supply per template. They now name a
#   size instead, the kind is drawn like any other, and the entry's `narrowed_further_by` block
#   is GONE — it described a state that no longer exists. A consumer that stratified on three
#   head-noun families will meet a fourth.
#
#   ONE NEW LEAK, INSIDE KL-02 RATHER THAN AS AN ENTRY OF ITS OWN. The brandless `hygiene`
#   templates carry no placeholder, so the kind contributes exactly TWO distinct strings against
#   8, 13 and 8 for the other three excluded kinds — and within that kind the STRING IS THE
#   LABEL. It sits in KL-02 as `a_second_leak_inside_one_kind` because it shares that entry's
#   subset and nothing else: its predictor is the exact string rather than the head-noun family,
#   so a consumer stratifying by family would not catch it. KL-02 also gains a `fixed_by` naming
#   the root repair — keying the placeholder vocabulary by TEMPLATE rather than by item kind in
#   config/generation.yaml — and saying plainly that the brandless form is the narrower fix taken
#   instead. Its per-kind figures now state occurrences and distinct strings separately; an
#   earlier draft gave one set without saying which, and they were occurrences.
#
#   NO NEW `known_limitations` ENTRY, AND THE ABSENCE IS A FINDING RATHER THAN AN OMISSION. The
#   obvious candidate is that the corpus now mixes three renderings while no label names which
#   one produced a document. It is not a limitation, because both axes are recoverable: the
#   register's kind from whether `device_serial` is among the bbox keys, and the paper width from
#   the image, whose width the degrader preserves. The reference-run counts are stated below so
#   the proportions are known without measuring them.
#
#   EVERY REFERENCE-RUN FIGURE IN `known_limitations` MOVED AGAIN, mechanisms unchanged. Both
#   changes of this version shift the seeded stream — a claim's receipt is now drawn from three
#   archetypes, and `hygiene` entering the excluded catalogue changes the basket draw — so the run
#   is 143 documents rather than 146. Each figure names its run and says what it was before.
#
# Bumped to 7 by the VAT-PAYER STATUS OF THE SELLER becoming a modelled property, which changes
# what a fiscal receipt CONTAINS. NINE consequences a consumer has to know about, and the first
# three would otherwise look like defects in the dataset.
#
# WHAT THIS LIST IS CHECKED AGAINST, since a completeness claim has to say what it covers: a
# key-set diff of this file against the previous version, the printed-field inventory, AND the
# `known_limitations` section — the last was missing from the claim while two new limitations
# were being added, so the summary was complete on the axis it named and silent on the one it
# did not. Earlier drafts of it declared three of the nine, then six, then seven; each omission
# was found by deriving the delta rather than by re-reading the summary, which is the argument
# for deriving it:
#
#   THE SELLER'S TWO IDENTIFIER LINES ARE NOT ALTERNATIVES, and an earlier draft of THIS FILE
#   said they were. Every seller prints an identification code under «ІД» — ЄДРПОУ (8 digits) for
#   a legal entity, РНОКПП (10) for a sole trader, so the length follows the TYPE OF PERSON. A
#   registered seller prints its VAT-payer number under «ПН» IN ADDITION: 12 digits for a legal
#   entity, of which the first 8 are its ЄДРПОУ — OBSERVED ON ONE DOCUMENT, one of one that
#   carries both lines, and not stated as a requirement by any source — and for a sole trader
#   THE SAME 10-DIGIT РНОКПП its «ІД» line carries. So both bbox keys may be present; two identifier fields bearing
#   identical digits is CORRECT on a sole trader's receipt; a 12-digit value is not a malformed
#   ЄДРПОУ; and registration is read from the presence of «ПН», never from «ІД». The draft
#   reading came from a published table of the form; real ПРРО output refuted it and observation
#   decides. A consumer that built a validation rule from the old sentence will now reject
#   correct documents. See `document_types.fiscal_receipt`.
#
#   AN INVARIANT IS LIFTED. `vat_letter: null` is now legitimate on a Ukrainian receipt — this
#   file used to state that it was a builder bug, so the contract FORBADE the correct
#   behaviour. A seller that is not registered for ПДВ prints no letter on any line and no tax
#   row at all. See `normalization.vat_letter.nullability`.
#
#   `field_bboxes` IS NO LONGER THE SAME KEY SET ON EVERY DOCUMENT. A registered seller prints a
#   `seller_vat_number` line IN ADDITION to the `seller_tax_code` line every seller prints, and
#   the VAT keys are absent from an unregistered seller's document entirely. A key's absence is
#   now information rather than an error. See `printed_fields`.
#
#   ONE NEW LABEL FIELD, `amount_due`, WHICH MUST NOT BE SCORED YET. The merged "СУМА ДО
#   СПЛАТИ" line became the four lines the form actually defines. The field equals `amount`
#   in this version, so it discriminates nothing; the entry says so and says why the
#   divergence is deferred.
#
#   TWO NEW BBOX KEYS ON EVERY RECEIPT, `discount` and `rounding` — the two amount lines
#   between `СУМА` and `ДО СПЛАТИ`. Both are zero in this version and neither carries a
#   labelled value. A consumer that vendored version 6 and asserted a fixed key set for the
#   archetype breaks on them, which is the same lesson as the entry above: derive the key set
#   from the document rather than pinning it. See `printed_fields.bbox_only`.
#
#   ONE BBOX GEOMETRY CHANGED: `tax_line_<i>` now spans the full width of its row rather than
#   hugging its text on the left, because the VAT amount moved into the receipt's amount column
#   with the other amounts. Same key, same content, wider box — an IoU comparison against
#   version 6 boxes will not agree. See `printed_fields.tax_row_geometry`.
#
#   ONE NEW `required_changes` ENTRY, RC-16: make `amount_due` differ from `amount`, blocked on
#   a policy decision about distributing a discount across covered and non-covered lines.
#   RC-07 is amended in the same breath, its `amount_due` half no longer being open.
#
#   TWO NEW `known_limitations`, BOTH CREATED BY THIS VERSION'S OWN CHANGES. KL-04: `vat_letter`
#   became nullable, and its nullability is fully predicted by the counterparty string on 73% of
#   the corpus — 34 of 34 stored vendor names are registered payers, so the shortcut holds at any
#   size. KL-05: every document prints an identification code while only 1 of 3 real receipts
#   does, so the corpus OVERSTATES that field's presence; it is printed as the superset and the
#   overstatement is declared rather than left for a consumer to discover.
#
#   EVERY REFERENCE-RUN FIGURE IN `known_limitations` MOVED, mechanisms unchanged. The seller's
#   identifiers are built differently now, so the same seed reaches the basket draw in a
#   different state: the run is 146 documents rather than 147. Each figure names its run and says
#   what it was before.
#
# Bumped to 6 by TWO CHANGES that arrived together, stated separately because they are
# separate and a consumer that regresses needs to know which one to look at.
#
#   A CHANGE OF LABEL, not of shape: a claim whose payment falls outside the benefit period is
#   now `rejected` rather than `insufficient_evidence`. No field was added or removed and the
#   `outside_period` cause is unchanged, so a consumer diffing structure alone would see
#   nothing — which is exactly why the number has to move. A scorecard pinned to the old
#   verdict scores every such claim as a miss. See `verdicts.rejected.by_when_it_was_paid` for
#   the reasoning and for the alternative that was rejected.
#
#   A RESTRUCTURE OF THE DEFINITIONS, changing no label at all: every evidence verdict is now
#   defined by its own slot of `document_evidence` instead of as the case that is not its
#   neighbour. Nothing a consumer scores changes, but TWO KEYS DEPARTED — one renamed, one
#   removed, both declared under
#   `verdicts.not_proof_of_payment.why_this_was_once_unreachable`, which a consumer diffing key
#   sets should read first. The rule itself is
#   `verdict_notes.definitions_name_their_own_slot`.
#
# Version 5 was a CLAIM-LEVEL SHAPE CHANGE: a claim's evidence is resolved into transactions
# before any verdict is derived, `imperfection` gained four causes, and `covered_fraction`
# became genuinely nullable. See `claim_evidence` below. A consumer that vendors this file
# compares versions before diffing it, so a change of either size under an unchanged number
# would be a change nobody looked for.
version: 10

# One status vocabulary. Every section that describes a LABEL carries a `status`, and
# wherever anything below says whether a thing exists yet or is disputed it uses these four
# words and no others — there is no second spelling of the distinction anywhere in this
# file. Individual fields carry a `status` only where they differ from their section, or
# inside a `divergence` block. Section 9 describes the DATASET rather than a label: nothing
# in it exists or fails to exist, so it carries measurements instead of a status.
status_vocabulary:
  emitted: >
    Observed in the output of a real run, checked field by field. A consumer may rely on
    it being in the dataset today.
  forward_contract: >
    Required by the consumer side, or called for by the design, and NOT PRESENT IN THE DATASET. A
    consumer may build against it; a consumer may not conclude that the current dataset contains
    it.

    AMENDED IN VERSION 10, and the amendment is the difference between a promise about code and a
    promise about data. This word used to say "not produced by any template yet", which stopped
    being true of `payment_confirmation`: a template, a builder and the label fields all exist,
    while no run contains such a document, because a claim needs both facts and this class proves
    one. The operative half was always the second sentence, so the definition now turns on the
    DATASET. A consumer reads this word as "do not expect to find it in the labels", and that
    reading is unchanged.
  divergent: >
    Both sides exist and disagree — on a name, a type, or a definition. Neither is chosen
    here. See `required_changes`.
  undecided: >
    Neither side settles it, and guessing would be indistinguishable from a decision.

sources:
  generator: >
    src/receipt_synth/schemas.py (the label models), content_builder.py (the values),
    policy_engine.py (the derived claim labels), claim_planner.py (the archetype registry),
    degrader.py (capture modes), and config/policy.yaml (the labelling policy).
  reference_run: >
    Every `status: emitted` statement below was verified against
    `generate-dataset --seed 42 --personas 2 --claims-per-persona 4`. The generator version
    is not repeated in this file: every label record carries its own `generator_version`,
    and a copy here would be a second thing to keep in step.
  consumer: >
    The neighbouring product requirements document — its extraction fields per document
    type and its entity model, its classifier classes and metric, its extraction
    thresholds and field names, its rules for QR content, fiscality markers and fiscal
    schemes, its validation and line-item guards, its duplicate detection and its
    cross-document checks — together with the concept note on the open language and
    currency scope. THAT DOCUMENT IS NOT IN THIS REPOSITORY AND NEVER WILL BE. Individual
    requirements are therefore restated below in substance and on their own authority,
    never cited by an address into it — neither requirement number nor section number: an
    address an outside reader cannot resolve carries nothing while still reading as a
    precise reference, and it rots besides, a renumbered requirement pointing silently at
    the wrong rule and a reorganized section vanishing outright. That document remains
    authoritative for its own contents and is never edited from here.


# =============================================================================
# 1. The document-type vocabulary
# =============================================================================
#
# `document_types` keys are the `DocType` members in schemas.py, which are also the keys of
# `document_evidence` in policy.yaml. What each type PROVES — subject, payment, or both —
# is that block in policy.yaml and is not copied here.
#
# `classifier_role` follows the consumer's classifier vocabulary — four target classes plus
# an `other` catch-all — which settles it. There is no per-type narrative below:
# what each document class is belongs to docs/architecture.md#document-archetypes.
#
# `prd_required_fields` is the requirements document's table of the fields a consuming system
# must extract from this document type, EXPRESSED IN THE SHAPE THE REQUIREMENT DEMANDS rather
# than in the generator's current shape, with the generator's counterpart named beside it.
# That is what makes a divergence visible instead of inherited.

document_types:

  fiscal_receipt:
    classifier_role: target_class
    status: emitted
    emitted_archetypes:
      # The registry is `ARCHETYPES` in claim_planner.py. All three print the same labelled
      # fields and differ in the paper width and in the fiscal identity at the foot — see
      # `printed_fields.varies_with_the_kind_of_register`.
      - slug: ua_prro_receipt
        jurisdiction: UA
        language: uk
        categories: [vitamins_nutrition]
        register: software        # ПРРО, 80 mm
      - slug: ua_prro_receipt_58mm
        jurisdiction: UA
        language: uk
        categories: [vitamins_nutrition]
        register: software        # ПРРО, 58 mm — the narrow roll
      - slug: ua_rro_receipt
        jurisdiction: UA
        language: uk
        categories: [vitamins_nutrition]
        register: hardware       # classic РРО, 80 mm — the only archetype printing «ЗН»
    prd_required_fields:
      - prd: total
        generator: amount
        status: emitted
        note: >
          The receipt prints FOUR amounts under the items — `СУМА`, `ЗНИЖКА`, `ЗАОКРУГЛЕННЯ`,
          `ДО СПЛАТИ` — and `amount` is the first. `amount_due` is the last; see its entry
          under `document_label`, and read the warning there before scoring it.
      - prd: date
        generator: date
        status: emitted
      - prd: seller_name
        generator: counterparty
        status: divergent
        see: divergence_counterparty_name
      - prd: seller tax / fiscal number
        generator: >
          none — `seller_tax_code` and `seller_vat_number` exist as bbox keys with no labelled
          value. THE REQUIREMENT NAMES ONE FIELD AND THE DOCUMENT CARRIES UP TO TWO NUMBERS
        status: forward_contract
        note: >
          `content_builder.Seller.tax_code` and `.vat_number` already hold them and
          `ground_truth()` discards both. Mechanical to add; see RC-04.

          TWO LINES, NOT A CHOICE BETWEEN TWO. Every seller prints an identification code under
          «ІД» (bbox key `seller_tax_code`) — a checksum-correct eight-digit ЄДРПОУ for a legal
          entity, a ten-digit РНОКПП for a sole trader, so the LENGTH FOLLOWS THE TYPE OF PERSON
          rather than the prefix. A seller registered for ПДВ prints, IN ADDITION, its VAT-payer
          number under «ПН» (bbox key `seller_vat_number`): twelve digits for a legal entity, of
          which the first eight are its ЄДРПОУ; and for a sole trader THE SAME TEN-DIGIT РНОКПП
          its ІД line carries — one number under two prefixes.

          THE PREFIX RELATION RESTS ON ONE DOCUMENT — one of the one observed receipt that
          carries both lines. It is a construction this generator applies so that its two printed
          identifiers cannot contradict each other, NOT a rule any source states, and a consumer
          must not validate real documents against it. The LENGTHS are the certain part.

          Consequences for a consumer, none of them cosmetic: a document may legitimately carry
          BOTH keys; two identifier fields bearing identical digits is correct on a sole
          trader's receipt and must not be deduplicated; a twelve-digit value is not a malformed
          ЄДРПОУ; and the absence of «ПН» rather than the presence of «ІД» is what says the
          seller is not registered. If the requirement keeps one scalar field for the seller's
          tax number, it cannot represent a registered company at all, and which of the two
          numbers it should hold is undecided here.

          AN EARLIER VERSION OF THIS CONTRACT SAID THE TWO WERE MUTUALLY EXCLUSIVE, on a
          published table of the form that lists them as rows 4 and 5 with alternative example
          values. Real ПРРО output prints both together, and observation decides. Recorded
          rather than quietly amended, because a consumer that built a validation rule from the
          old sentence will now reject correct documents.
      - prd: FiscalScheme — the JURISDICTION of the fiscal scheme plus that scheme's own requisites
        prd_vocabulary: [ua_prro, pl_paragon, ar_factura, pt_atcud, sk_ekasa, hr_fiskalizacija, none, unknown]
        generator: has_fiscal_number (boolean)
        status: divergent
        note: >
          The consuming system requires the jurisdiction of the fiscal scheme rather than a
          boolean, on the reasoning that UA ПРРО, PL paragon, AR Factura, PT ATCUD, SK
          eKasa and HR fiskalizacija are all fiscal in their own systems by different
          requisites; a boolean `is_fiscal` is forbidden in that model. The generator emits
          no jurisdiction at all; `has_fiscal_number` is a boolean about one requisite of
          one scheme. TWO SEPARATE PROBLEMS — the shape, and the fact that the requirement's
          own vocabulary has NO member for Germany or Spain, whose archetypes this generator
          plans to build. A DE Kassenbon could only be labelled `unknown`, and an unknown
          fiscal scheme is routed to `in_review`. See RC-02.
      - prd: VAT amounts per letter — TaxAmount(letter, rate, amount), explicitly not a scalar tax
        generator: none
        status: forward_contract
        note: >
          `content_builder._build_tax_lines` computes exactly this — `TaxLine(letter, rate,
          gross, vat)`, one row per letter present — and `DocGroundTruth` has no field to
          put it in, so it is rendered and thrown away. Mechanical; see RC-05.

          AND THERE IS A DOCUMENT WITH NO SUCH ROW AT ALL: a seller that is not registered for
          ПДВ prints no tax block, so the correct extraction is an EMPTY collection rather than
          a zero-rate row. A consumer whose model requires at least one TaxAmount per fiscal
          receipt cannot represent that document.
      - prd: line items, required only where the category carries exception rules
        generator: line_items
        status: emitted
      - prd: DECODED QR CONTENT plus its type (fiscal_link / promotional / payment / unknown)
        generator: has_qr, qr_is_fiscal (two booleans)
        status: divergent
        note: >
          The consuming system requires the decoded payload and its type, on the ground
          that mere presence is unusable as a fiscality signal — bank confirmations
          routinely carry promotional QR codes, so a document with a QR code says nothing
          about whether it is fiscal. `qr_is_fiscal` is a boolean collapse of a four-value
          type and cannot express `payment` or `unknown`. `PrroReceipt.qr_payload` already
          holds the decoded string and `ground_truth()` discards it. See RC-03.
      - prd: fiscality markers found in the text, positive and negative, with their position
        generator: none
        status: forward_contract
        note: >
          A rule of the consuming system: a NEGATIVE marker («НЕ ФІСКАЛЬНИЙ ЧЕК», «KOPIA
          DLA SPRZEDAWCY», an empty receipt-number field) OVERRIDES every positive
          fiscality signal, however many of those a document carries — a slip may hold a
          QR code, a tax number and a total and still declare itself not a fiscal receipt.
          No generator field records a marker and no archetype prints one yet. See RC-08.

  payment_confirmation:
    classifier_role: target_class
    status: forward_contract
    archetypes:
      # ONE ARCHETYPE, AND IT IS IN NO RUN YET. `ua_bank_payment_confirmation` is registered in
      # `ARCHETYPES` in claim_planner.py, has a template and a stylesheet, and produces every label
      # field listed below. No dataset contains one, and the reason is structural rather than an
      # oversight: a claim needs BOTH facts — what was bought and that it was paid for — this class
      # proves one, and the class that proves the other (an invoice) is not written. So
      # `documentable_categories` reports no category as documentable through it, and the type's
      # `status` stays `forward_contract` in the amended sense of that word.
      - slug: ua_bank_payment_confirmation
        jurisdiction: UA
        language: uk
        # EVERY category of policy.yaml, which is a consequence of the class rather than a generous
        # guess: the document lists no items, so nothing on it can contradict a category. A test
        # checks the tuple against policy.yaml so a category added there cannot drop out.
        categories: all
        paper: A4 — 210 × 297 mm, unlike the till rolls the fiscal class is printed on
    narrower_than_observed: >
      FOUR WAYS THIS CLASS IS NARROWER THAN WHAT WAS OBSERVED, recorded here rather than under
      `known_limitations` because every entry there states a share of a reference run and no run
      contains this class yet. They move there when one does.

      ONE LAYOUT FOR FOUR ISSUERS. Three real banks were reviewed and their layouts differ; one
      arrangement of the fields they all carry is modelled. Field-set variation is what extraction
      has to cope with and it IS modelled; visual diversity between issuers is not, so a consumer
      must not read robustness to bank layouts off a score on this corpus.

      THE MERCHANT-DOMAIN VALUE OF THE TERMINAL FIELD IS NOT PRODUCED. 👁 That field carries three
      incompatible kinds of value — a system named in words, an uppercase mnemonic, and a
      merchant's internet domain. The domain is left out because printing one beside a named payee
      asserts that the payee owns it, which is a claim about a real firm.

      AN EMPTY RECIPIENT NAME IS NOT PRODUCED. 👁 Observed once, and it is the field a cross-check
      between a seller and a payee would rest on. `counterparty` is a required label field, so
      emitting an empty one would assert that the document names no counterparty — a case whose
      comparison rule this file has not settled. The other captioned-but-empty field observed on
      that same document, the recipient's bank, IS produced.

      A THIRD PERSON'S NAME IN THE PAYMENT PURPOSE IS NOT PRODUCED. 👁 1 of 7 purposes contained
      one, written by the payer. Left out: it would put a personal name in free text on a published
      image for no gain this step needs.
    line_items: >
      EMPTY BY DESIGN. The requirements document states plainly that this type has no line
      items — it is proof of one transaction. Settled by the requirement, not an open
      question.

    # WHICH OF THE PRINTED DATES IS THIS DOCUMENT'S `date`, AND WHY THE ANSWER IS SPLIT ACROSS
    # TWO FILES.
    #
    # A real Ukrainian bank payment confirmation does not print one date. 👁 Of eight reviewed,
    # five carry two or more; ten different captions across the eight reduce to six distinct
    # concepts. 📄 HALF OF THOSE SIX ARE NOT DEFINED TERMS AT ALL: the National Bank's
    # instruction on non-cash settlements (Resolution 163 of 29.07.2022, as amended) defines
    # composition, execution and valuation, and does not define carrying-out, processing or
    # "the operation". 📄 And of the two temporal requisites that instruction makes mandatory,
    # one — the date the payment was accepted for execution — is 👁 printed on 0 of 8 under any
    # caption. The documents do not carry what the law prescribes, so no caption can simply be
    # trusted to mean it.
    #
    #   config/policy.yaml, `period.payment_date`, names THE CONCEPT — the date the funds left
    #   the payer's account — and names no caption.
    #   This block gives THE MAPPING of printed captions onto that concept, and defines no
    #   concept of its own.
    #
    # Neither half works alone, and the split is why this file exists. A consumer builds its
    # own engine against policy.yaml; had that file named only "the payment date", two
    # independent and equally correct implementations would pick DIFFERENT captions
    # legitimately. The period is checked on this value, so they would disagree about the
    # VERDICT, and the disagreement would arrive as a scorecard reporting a date error against
    # a system that read the document correctly.
    payment_date:
      # `forward_contract` in the amended sense: the mapping is what the archetype PRINTS — every
      # caption it prints is one of the three accepted, checked by a test — while no run contains
      # such a document, so a consumer may not look for one in the labels yet.
      status: forward_contract
      concept: >
        config/policy.yaml, `period.payment_date`. Not restated here — a second statement of a
        definition becomes a second definition the first time one of them is edited.
      derived_from: >
        THE MEANING OF THE TERMS, NOT A COUNT. The frequencies below are recorded because they
        say what an extractor will meet, but they decided nothing: the most common caption of
        the six is one this block accepts only as a third choice, and one of the refused
        captions is as frequent as two of the accepted ones. Written as an ordered list plus a
        refusal list so that a disagreement has a line to argue with rather than the decision
        as a whole.
      accept_in_order:
        - caption: "Дата виконання"
          also_printed_as: []
          why: >
            The literal counterpart of the concept: the payment instruction has been EXECUTED,
            so the funds have gone. 📄 A defined term of the instruction, entered by the payer's
            payment service provider. 👁 2/8.
        - caption: "Дата проведення"
          also_printed_as: []
          why: >
            A common synonym of execution in bank usage. ⛔ Not a defined term of the
            instruction. 👁 2/8.
        - caption: "Дата операції"
          also_printed_as: ["Дата і час операції", "Дата та час операції"]
          why: >
            Taken as the same thing WHEN NEITHER OF THE TWO ABOVE IS PRINTED, and third for
            that reason alone: it names the operation without saying which end of it. ⛔ Not a
            defined term, and 👁 the most frequent of the six — 4/8.
      never:
        - caption: "Дата валютування"
          also_printed_as: []
          why: >
            AN ACCOUNTING CONVENTION, NOT THE MOMENT OF DEBIT. 📄 The Ukrainian law on payment
            services (Law 1591-IX), article 1, defines it as the date from which the funds pass
            into the RECIPIENT's ownership — the far end of the transfer — and the banks' own
            published explanations of it describe exactly the gap: debited from the payer on one
            date, credited to the recipient on another. So it MAY DIFFER BY A DAY, and across a
            month boundary that is a different benefit period. 👁 2/8.
        - caption: "Дата складання"
          also_printed_as: ["Дата і час складання"]
          why: >
            THE DATE OF THE OBLIGATION, NOT OF THE EXPENSE — when the payment instruction was
            drawn up. Accepting it would be the same error as dating a claim by its invoice,
            which `claim_evidence.period_and_date` refuses in the same words. 📄 A defined term,
            which is what makes it tempting: being defined is not being the right definition.
            👁 2/8.
        - caption: "Дата обробки"
          also_printed_as: ["Дата оброблення", "Дата обробки операції"]
          why: >
            AN INTERNAL BANK EVENT. ⛔ Not a defined term, and no source relates it to the debit
            at all, so a value under it cannot be known to satisfy the concept even when it
            happens to. 👁 2/8.
      observed_divergence: >
        NORMATIVE, NOT MEASURED, and stated that way round on purpose. 👁 Of the five documents
        carrying two or more dates, 0 show two dates falling on different days — the only
        difference observed is that one caption prints a time to the second and another does
        not. 📄 The gap is nonetheless provided for by statute, through valuation. So the
        preference order above is a guard against a divergence the norm permits and the sample
        of eight does not exhibit; a consumer must not read the counts as evidence that the
        choice does not matter.
      if_no_accepted_caption_is_printed: >
        A REQUIREMENT ON THE TEMPLATE, NOT A FALLBACK — AND IT IS NOW MET. The archetype
        `ua_bank_payment_confirmation` draws its caption from `accept_in_order` and from nothing
        else, so no document it produces can carry a date this file refuses to read;
        `tests/test_payment_confirmation.py` holds it to that in both directions, sweeping the
        printed captions against the accepted list and against the refused one.

        The case remains undefined for a REAL document that prints none of the three, and this file
        still does not invent a rule for it: nothing generated exhibits it, so any rule stated here
        would be untested by construction.
    prd_required_fields:
      - prd: amount
        generator: amount — THE TRANSFER, and not the largest number printed
        status: forward_contract
        note: >
          🔴 THE ONE FIELD OF THIS CLASS A CORRECT-LOOKING SYSTEM GETS WRONG. 👁 0 of 8 real
          confirmations print a single amount: each prints the operation amount and the fee
          separately, and 1 of 8 also prints their sum in the largest type on the page. 📄 The
          National Bank's instruction on non-cash settlements names the amount of the OPERATION as
          the requisite and does not name a fee anywhere, and a fee is a charge for a banking
          service rather than for anything a benefit category covers. So `amount` is the transfer,
          `fee` and `total_charged` are labelled beside it, and an extractor that takes the most
          prominent figure is wrong by exactly the fee — measurably, which is the point.
      - prd: date
        generator: date
        status: forward_contract
        see: document_types.payment_confirmation.payment_date
      - prd: payer / payee
        generator: payer, counterparty
        status: forward_contract
        note: >
          THE DIVERGENCE IS RESOLVED, and this entry used to record it: `counterparty` is one
          party and could not carry two. `payer` now carries the other. `counterparty` keeps its
          meaning — the party opposite the claimant — which on this class is the PAYEE, exactly as
          on a bank statement.

          ⚠️ Two forms of emptiness, and they are not one case. 👁 A payer field may print a HYPHEN
          as its value, which OCR returns as the string "-"; a captioned field may be printed with
          nothing under it, which returns nothing. `payer` is `null` only where the class names one
          party — never for an unidentified payer, whose label carries the hyphen.
      - prd: payment purpose
        generator: payment_purpose
        status: forward_contract
        note: >
          🔴 IT NEVER NAMES WHAT WAS BOUGHT — 👁 0 of 7 documents that carry the field. It names
          another DOCUMENT (an invoice by number, a delivery note), or a generic category, or
          nothing but the movement of money. That is the strongest confirmation available of
          `proves_subject: false` for this type in policy.yaml.

          AN EARLIER VERSION OF THIS ENTRY SAID THE OPPOSITE OF WHAT IT NOW SAYS, and the
          correction is recorded rather than made quietly. It called the field load-bearing because
          "the one documented override is a confirmation whose payment purpose spells out what was
          bought" — an archetype-level evidence override. That override does not exist, cannot be
          labelled (see `claim_evidence.what_is_not_recorded`), and the observation refutes the
          premise it rested on. The field is load-bearing for a different reason: it is what a
          consumer must NOT read a subject out of.
      - prd: authorization code
        generator: auth_code
        status: forward_contract
        note: >
          👁 4 of 8 — the card operations, six digits in 4 of 4 of them. OPTIONAL BY NATURE: a
          transfer by account details has no card operation to authorize, so its absence is
          information and not an extraction failure.

          ⚠️ NOT A DEDUPLICATION KEY. Six digits is a space of a million and the code is unique
          only within an issuer and a time window; 👁 it is also absent from half the documents, and
          a key missing from half the cases is not a key. See `document_code`.
      - prd: bank document code
        generator: document_code
        status: forward_contract
        note: >
          👁 8 of 8, 📄 mandatory as "the number of the payment instruction", and 📄 the key the
          official check services take. THIS is the deduplication key of the class. Three formats
          are 👁 observed and all three are produced, so a consumer validating the field by shape
          needs every one of them: four groups of four, a letter prefix followed by digits, and a
          bare run of eight to ten digits.
      - prd: >
          NOT ON THIS CLASS — an RRN and a payment form. Both were in an earlier field list for this
          type and 👁 neither appears on any of the eight documents reviewed.
        generator: none, and none is wanted
        status: forward_contract
        note: >
          RECONCILED RATHER THAN SIMPLY DROPPED, because the earlier 0-of-8 finding read as a defect
          in this generator and is not one. An RRN IS a requisite of a card operation — as printed
          inside a FISCAL RECEIPT, where this repository does print it, and 👁 where a real sole
          trader's receipt carries one. It is not a requisite of a bank confirmation. A payment form
          (cash / card) is a receipt requisite too, carried over by the same mistake. A consumer
          cross-checking a payment form between linked documents has nothing on this class to read
          it from.

  bank_statement:
    classifier_role: target_class
    status: forward_contract
    line_items: >
      EMPTY BY DESIGN. The requirements document gives this type no line items, as it gives
      none to `payment_confirmation`. Settled by the requirement, not an open question.
    prd_required_fields:
      - prd: amount
        generator: amount
        status: forward_contract
      - prd: date
        generator: date
        status: forward_contract
      - prd: payee
        generator: counterparty
        status: divergent
        see: divergence_counterparty_name
      - prd: payment purpose
        generator: none
        status: forward_contract
    undecided: >
      Whether a multi-page statement produces one label for the statement or one per
      transaction, and how `amount` and `date` are then defined. Neither side settles it.

  invoice:
    classifier_role: target_class
    status: forward_contract
    prd_required_fields:
      - prd: total
        generator: amount
        status: forward_contract
      - prd: date
        generator: date
        status: forward_contract
      - prd: seller plus tax number
        generator: counterparty (name only)
        status: divergent
        see: divergence_counterparty_name
      - prd: subject / line items
        generator: line_items
        status: forward_contract
      - prd: PAYMENT STATUS (e.g. "Оплачено" / "Zapłacono") and amount due
        generator: none
        status: forward_contract
        note: >
          No counterpart of any kind exists in `DocGroundTruth`. This is the field the
          `not_proof_of_payment` verdict turns on for this type — an invoice reading
          "Zapłacono: 0,00" is the canonical example — and also what `partially_paid` would
          be read from. See RC-07.

  act:
    classifier_role: other
    status: forward_contract
    note: >
      The consumer's classifier vocabulary folds the act of services rendered into `other`
      explicitly, and the required-field table gives it no row of its own.

  order_screenshot:
    classifier_role: other
    status: forward_contract
    note: >
      The consumer's `other` class is "contract, act and everything else", which absorbs
      this type. It still matters for linking: it establishes the subject and never the
      payment.

  non_fiscal_receipt:
    classifier_role: undecided
    status: forward_contract
    undecided: >
      The consumer's `other` class is defined as "everything else", which mechanically
      absorbs this type — but the requirement's `other` row says such a document gets
      classification only and the claim goes straight to `in_review`, while the fiscality-marker
      rule requires exactly these documents (a sales slip with full requisites marked
      non-fiscal, a terminal slip with an RRN and an empty receipt-number field) to be
      DETECTED AND REASONED ABOUT: a negative marker must override positive fiscality
      signals, and the stated test is that such a document is not classified as a fiscal
      receipt. Being reasoned about specifically and being routed
      to manual review as an unrecognized type are different outcomes, and no source names a
      class for this one. Left open.

# The consumer's classification metric, stated here because a consumer that computes a
# different metric than the one being reported has no way to discover the difference from
# the field lists alone.
classifier_metric:
  status: forward_contract
  target_classes: [fiscal_receipt, payment_confirmation, bank_statement, invoice]
  target: macro-F1 >= 0.90 over those four classes
  other_class: >
    `other` IS REPORTED SEPARATELY AS A PER-CLASS F1 AND DOES NOT ENTER THE TARGET
    MACRO-F1. It is a catch-all with blurred edges, so failing the threshold through it
    would say nothing about the system. A consumer that folds `other` into the macro average
    computes a different number than the one being reported.
  missing_from_doctype: >
    `DocType` in schemas.py has NO `contract` member and NO `other` member, while the
    consumer's required-field table names both — `contract` with its own row (subject,
    parties, validity period, amount; exploratory extraction, no threshold) and `other` as
    the catch-all. The generator therefore cannot label a document as either. See RC-14.

# The consumer's per-field extraction thresholds, for the same reason: a threshold applied
# to the wrong slice is not a smaller number, it is a different measurement.
extraction_thresholds:
  status: forward_contract
  scope: printed documents of the four target classes; handwritten reported separately
  per_field:
    amount: F1 >= 0.85
    date: F1 >= 0.85
    seller_name: F1 >= 0.75
  contract_extraction: exploratory, no target threshold — `contract` is not a target class
  line_item_extraction: >
    Reported without a target threshold, as three separate numbers: extraction F1, the
    accuracy of the covered / not-covered call per line, and the error on the final
    reimbursable amount.
  language_slice: >
    TARGET THRESHOLDS ARE SET ONLY ON THE UKRAINIAN-LANGUAGE PART OF THE SET. Every other
    language is reported separately as an exploratory slice. A consumer that averages over
    all languages is not measuring against these thresholds. See `normalization.open_enum`
    for why the set is wider than the plan.


# =============================================================================
# 2. Normalization rules
# =============================================================================
#
# The rules a scorecard applies to BOTH sides before comparing. Named here and referenced by
# `normalize:` on each field, so a rule is written once and no field acquires a variant.
#
# `decided_here` marks a rule that is this file's own decision rather than something
# determined by the generator or by a requirement. A consumer may disagree with one, but
# then it has to say so too.

normalization:

  identity:
    status: emitted
    applies_to: opaque dataset keys — doc_id, claim_id, persona_id, source_file
    rule: exact byte-for-byte comparison, no folding
    why: >
      Not extractable content. Nothing prints them and no extractor produces them; they
      exist so a label can be joined to an image and a claim to its documents.

  closed_enum:
    status: emitted
    applies_to: doc_type, capture, verdict, verdict_basis members, imperfection members
    form: lower_snake_case ASCII
    rule: exact match against the closed vocabulary declared in this file
    why: a value outside the vocabulary is an error, not a near miss to be scored partially

  policy_vocabulary:
    status: emitted
    applies_to: item_kind, category, benefit_categories
    form: lower_snake_case ASCII
    rule: exact match against the vocabulary policy.yaml declares
    why: >
      Open in the same sense policy.yaml is: replacing that file retargets the generator at
      a different benefit plan and the vocabulary changes with it. Not copied here for that
      reason.

  open_enum:
    status: divergent
    applies_to: language, currency, home_currencies, languages
    label_side: >
      Always a concrete code. The generator builds the document, so it knows the language
      and the currency exactly and never needs a fallback. Today: `uk` and `UAH` only. Both
      fields are plain `str` in schemas.py, not enums, so the type already permits any code.
    extraction_side: >
      THE ENUM IS OPEN. It carries an `other` value with a free-text qualifier, and amount
      normalization accepts an ARBITRARY currency code.
    why: >
      The consumer's concept note records that the real flow is wider than the plan. Planned
      languages were uk/pl/de/es/en; also observed are Portuguese, Bulgarian, Slovak,
      Croatian, Montenegrin, Italian and Russian. Planned currencies were UAH/PLN/EUR/USD;
      also observed are BGN, GEL, BRL, GBP and ARS. Closing either enum would make a correct
      extraction unrepresentable.
    form: >
      `language` is ISO 639-1 where one exists. It does not always exist — Montenegrin has
      no two-letter code — which is itself an argument for the free-text qualifier rather
      than a longer closed list. `currency` is ISO 4217, three uppercase letters.
    rule: >
      Compare case-sensitively after trimming; `currency` uppercase, `language` lowercase.
      An extraction of `other` never matches a concrete label code — score it as a miss and
      read the qualifier only when investigating one.
    metric_consequence: see `extraction_thresholds.language_slice`; the slice is not the whole set

  iso_date:
    status: emitted
    applies_to: DocGroundTruth.date
    label_form: "YYYY-MM-DD"
    printed_form: >
      Per jurisdiction, from `date_format` in fiscal-rules.yaml: DD.MM.YYYY in UA, PL and
      DE; DD/MM/YYYY in ES; YYYY-MM-DD in the EU block. An extractor reads the printed form,
      the label carries the ISO one.
    rule: parse both sides to a calendar date and compare dates, never strings
    timezone: >
      None, and no time component. The label is a naive calendar date. A ПРРО receipt does
      print a time beside the date, but no ground-truth field carries it, so a time cannot
      be scored.
    why: DD.MM versus MM/DD is the most common way for a correct extraction to score zero.

  money:
    status: emitted
    applies_to: DocGroundTruth.amount, LineItem.price, ClaimGroundTruth.reimbursable_amount
    label_form: >
      A JSON number. Amounts are exact `Decimal` inside the generator and are serialized
      through `float()`, so TRAILING ZEROS ARE LOST: 2607.80 is written 2607.8 and 1139.10
      is written 1139.1. Never a fixed-width string.
    precision: two decimal places (`KOPIYKA` in content_builder.py)
    rule: >
      Round both sides half-up to two decimal places and compare numerically. Never compare
      serialized text, never compare floats for exact equality.
    printed_form: >
      Grouped by the jurisdiction's `thousands_separator` — a NO-BREAK SPACE (U+00A0) in UA
      and PL, a full stop in DE and ES — with the jurisdiction's decimal separator. In UA
      the separator is drawn PER DOCUMENT from ["." , ","], because real ПРРО vendors print
      both, so a parser must accept either within one jurisdiction. No currency symbol is
      printed beside an amount.
    currency: >
      Never part of the amount; the `currency` field carries the code, and per `open_enum`
      that code may be one the generator has never emitted.
    decided_here: half-up rounding. The generator never rounds a comparison, because it never compares.

  quantity:
    status: emitted
    applies_to: LineItem.qty
    label_form: a JSON number, serialized as money is
    printed_form: "formatted with %g — an integral quantity prints as `1`, not `1.0`"
    rule: compare numerically
    observed: >
      Every quantity produced so far is integral; the draw is from (1, 1, 1, 2). Fractional
      quantities are not generated and this file promises no precision for them.

  text_name:
    status: emitted
    applies_to: LineItem.name
    rule: >
      Unicode NFC, trim, collapse internal whitespace runs to one space, then compare
      exactly and CASE-SENSITIVELY.
    why: >
      The name is printed verbatim from its template, so the only differences a correct
      extraction can introduce are whitespace and composition. Folding case would hide a
      real transcription error.

  party_name:
    status: emitted
    applies_to: DocGroundTruth.counterparty
    rule: >
      Unicode NFC, trim, collapse internal whitespace, strip the legal-form prefix and any
      enclosing quotation marks, then compare case-insensitively (Unicode casefold).
    why: >
      THE LABEL AND THE PRINTED FORM ARE NOT THE SAME STRING. `counterparty` carries the
      bare trading name; the document prints the name with its legal form inside guillemets.
      An invented example of the pair:
        printed on the document:   ТОВ «Вітамін Плюс»
        counterparty in the label: Вітамін Плюс
      `_LEGAL_FORM_PREFIX` in content_builder.py SUPPORTS three Ukrainian forms — ТОВ, ФОП,
      ПрАТ. TWO OF THE THREE ARE PRODUCED, and ФОП is the majority: in the reference run 6 of
      the 50 counterparties are named ТОВ vendors and the other 44 are ФОП sole traders, whose
      printed form is `ФОП Прізвище І. Б.` — no guillemets, because the name is a person's. ПрАТ
      is not produced: vendors.json carries ПрАТ entries, but none of them sells the one category
      the registered archetypes cover.

      (This paragraph said "only ТОВ has ever been PRODUCED" through version 7, which was false —
      ФОП receipts were the larger half of every run. It was corrected in version 8 on a measured
      count. The comparison rule below is unaffected either way: it strips the legal form
      whichever form that is.) Non-Ukrainian forms in vendors.json
      (SA, SL, SP_ZOO, GMBH, EK) have no prefix mapping and would render as the raw key.
    decided_here: >
      Which side is authoritative. This file makes the bare name authoritative and requires
      the comparison to strip the legal form, because the legal form is a property of the
      seller's registration rather than of the merchant identity a claim is about. Scoring
      the legal form needs a separate field, and none exists.
    see: divergence_counterparty_name

  vat_letter:
    status: emitted
    applies_to: LineItem.vat_letter
    rule: compare code points exactly, after NFC. Do not fold case, do not transliterate.
    why: >
      The Ukrainian VAT letters are Cyrillic, and two of the four are homoglyphs of Latin
      letters — А is U+0410, not U+0041; В is U+0412, not U+0042. (Б and Г have no Latin
      twin.) The Polish PTU letters A–E and the German A–B genuinely are Latin. A pipeline
      that normalizes Cyrillic to Latin turns a correct read of А into a mismatch; one that
      does the reverse turns a wrong read into a match. Hence code points.
    nullability: >
      `null` in TWO legitimate cases, and neither is an error to be repaired by a consumer.

      FIRST, where the jurisdiction prints no per-line letter at all —
      `line_item_letter_position: none`, the ES and EU case.

      SECOND, and new in version 7: WHERE THE SELLER IS NOT REGISTERED FOR ПДВ. Such a receipt
      carries no VAT block whatever — no letter after the line amount, no `ПДВ …%` row under
      the totals, and no "Без ПДВ" in their place. `null` therefore means the ABSENCE OF THE
      WHOLE BLOCK and never an empty letter beside a present zero-rate row.
    invariant_lifted_in_version_7: >
      THIS FILE PREVIOUSLY FORBADE THE CORRECT BEHAVIOUR. It stated that a null letter on a UA
      receipt was a builder bug and that content_builder raised on one — which was true of the
      code and wrong about Ukrainian receipts, and it made every sole trader in the dataset a
      simplified-system seller printing a rate group it cannot have assigned. The raise has
      become two narrower guards, both still builder bugs: a null letter on a REGISTERED
      seller's receipt, and a letter present on a non-payer's. Recorded here rather than
      silently amended because a consumer that built a validation rule from the old sentence
      will now reject correct documents.
    why_observation_decided_it: >
      The sources conflict, and the conflict is recorded in full at the head of
      config/generation.yaml: the Положення requires the letter with no reservation for
      non-payers, the tax service's own clarification permits non-payers to leave the fields of
      that tax unfilled, and the one open photograph of a real sole trader's receipt has no VAT
      block at all. Observation decides, because the dataset's job is to look like what a
      verifier actually receives.

  identifier:
    status: forward_contract
    applies_to: >
      The registration and transaction identifiers a document prints — tax code, VAT number,
      receipt number, RRN, authorization code, terminal id, and the bank's own document code.

      TWO OF THEM NOW CARRY A LABELLED VALUE, so this rule has something to normalize for the first
      time: `document_code` and `auth_code` on a payment confirmation. The receipt's identifiers
      still appear in `field_bboxes` as geometry only. The rule below was written before anything
      carried a value and is unchanged by their arrival — which is the useful part, since a
      comparison rule agreed in advance is one nobody had to fit to a field.
    rule: >
      Strip everything outside [0-9A-Za-z], then compare case-insensitively. Separators, spacing
      and the prefix printed beside an identifier (ІД and ПН on a Ukrainian receipt, which may
      both be present — see `document_types.fiscal_receipt` — and the leading country letters of
      a VAT number) are formatting, not identity.

      THE PREFIX IS NOT PART OF THE VALUE BUT IT IS PART OF THE FIELD'S IDENTITY: «ІД 1234567890»
      and «ПН 1234567890» on one sole trader's receipt are the same digits under two requisites,
      so normalizing them into one string and comparing would make two distinct fields
      indistinguishable.
    decided_here: >
      All of it. Two identifiers are emitted as values now (see `applies_to`); the rule predates
      them and was not adjusted for them.

  fraction:
    status: emitted
    applies_to: ClaimGroundTruth.covered_fraction
    label_form: >
      A JSON number in [0, 1], quantized to SIX decimal places before serialization
      (`ClaimEvaluation.fraction_as_label`). Observed: 1.0, 0.600109, 0.500048.
    rule: compare with an absolute tolerance of 1e-6

  bbox:
    status: emitted
    applies_to: DocGroundTruth.field_bboxes values
    label_form: "[x, y, width, height] in image pixels — the COCO convention"
    frame_of_reference: >
      The SHIPPED image, after degradation. Geometric transforms carry the boxes with them,
      so a box aligns with the artifact on disk and not with the clean intermediate render,
      which is never written out.
    rule: >
      No matching rule is stated here. IoU thresholds, and whether boxes are scored at all,
      are the consumer's evaluation decision; the boxes come from the browser's layout engine
      rather than from OCR, so there is no annotation noise for a threshold to absorb.

  string_list_unordered:
    status: emitted
    applies_to: ClaimGroundTruth.imperfection, ClaimGroundTruth.verdict_basis
    rule: compare as SETS
    why: >
      The emitted order is stable because it is append order in policy_engine.py, but
      nothing makes that order meaningful and a consumer must not score it.

  prose_not_comparable:
    status: emitted
    applies_to: ClaimGroundTruth.policy_trace
    rule: >
      DO NOT COMPARE LITERALLY, in whole or line by line. The trace is prose, its wording is
      free to change between generator versions, and an exact-match score over it measures
      nothing.
    intended_use: >
      A reference for judging EXPLANATION quality against a system's own justification —
      which is the shape the consumer's `DecisionTrace` takes.


# =============================================================================
# 3. The document label
# =============================================================================
#
# One record per rendered document, written to `labels/<doc_id>.json` and repeated in the
# `documents` array of `ground_truth.json`. Model: `DocGroundTruth`.
#
# ONE MODEL FOR EVERY DOCUMENT TYPE. Nothing in schemas.py varies the field set by
# `doc_type`, so the list below is the field list for all seven types. The consumer's
# required-field table is per type; this is not, and that gap is what
# `document_types.*.prd_required_fields` records above. A per-type label shape would make the
# label depend on the answer to the classification question, which is one of the things being
# evaluated — so the divergence is recorded rather than resolved.
#
# EVERY KEY IS PRESENT IN EVERY RECORD. `required: false` means the VALUE may be null or an
# empty container, never that the key is missing.

document_label:
  status: emitted
  file: "labels/<doc_id>.json"

  fields:

    - name: doc_id
      type: string
      required: true
      normalize: identity
      note: >
        Unique within a dataset, formed today as `<claim_id>_d<n>`. Treat it as opaque:
        joining on a parsed substring depends on a format that is the assembler's business.

    - name: source_file
      type: string
      required: true
      normalize: identity
      note: the image file name, relative to the run's `images/` directory
      divergence:
        name: divergence_one_file_one_document
        status: divergent
        generator: >
          One image is one document; `source_file` and `doc_id` are 1:1, and no label
          describes a region of a file.
        consumer: >
          The consuming system makes file-to-document segmentation a pipeline step in its
          own right, on the ground that one file may hold up to twelve separate receipts,
          and it names THIS GENERATOR as the source of ground truth for the boundaries. It
          separates `ClaimFile` (the binary, with a `medium` and a content hash) from
          `ClaimDocument` (a logical document, with a page or region reference into the
          file).
        note: nothing in the generator models a multi-document file. See RC-12.

    - name: doc_type
      type: enum
      required: true
      normalize: closed_enum
      vocabulary: see `document_types`
      note: the classification target; see `classifier_metric` for how it is scored

    - name: language
      type: string
      required: true
      normalize: open_enum
      observed: ["uk"]

    - name: currency
      type: string
      required: true
      normalize: open_enum
      observed: ["UAH"]
      note: >
        Every archetype emits `reporting_currency` from policy.yaml, and the policy engine
        REFUSES a document in anything else rather than converting it — a converted amount
        would be a number in the ground truth that nothing in the dataset can prove. The
        consumer converts to a base currency at approval time using the transaction date,
        which is why the original amount, currency and date are all kept per document.

    - name: amount
      type: number
      required: true
      normalize: money
      meaning: the total payable, gross, VAT inclusive
      invariant: >
        Equals Σ(qty × price) over `line_items`, exactly. Fraud and trap archetypes will
        break this deliberately, and the break is then named in the claim's `imperfection`.
      printed_twice: >
        A ПРРО receipt prints this value as the total due and again as the amount paid
        (`total` and `paid_amount` among the printed fields). One value, two boxes.
      no_subtotal:
        status: undecided
        note: >
          THERE IS NO NET SUBTOTAL FIELD, and on a VAT-inclusive Ukrainian receipt no net
          subtotal is printed either — the tax block states the VAT contained within the
          gross. The consumer's arithmetic guard checks `subtotal + Σtax ≈ total` and its
          line-item guard checks `abs(Σline_items − subtotal)`, which require `subtotal` to
          be net in the first and gross in the second. The two cannot both hold in a
          VAT-inclusive jurisdiction, and this file cannot reconcile them. Raised as a
          question for the requirement, not as a generator change.

    - name: amount_due
      type: number or null
      required: false
      normalize: money
      status: emitted
      meaning: >
        ДО СПЛАТИ — what the customer actually pays: the basket total less any discount, plus
        cash rounding. `null` on a document type whose form has no such line; populated on
        every `fiscal_receipt`.
      do_not_report_its_accuracy: >
        🔴 THE FIELD DISCRIMINATES NOTHING IN THIS VERSION AND ITS ACCURACY IS NOT TO BE
        REPORTED AS A METRIC. Discount and rounding are both zero, so `amount_due` equals
        `amount` on every document produced — which means an extractor satisfies it perfectly
        by echoing the total, having read nothing, and any F1 or exact-match figure quoted for
        it measures the total again under a second name. Score it once the dataset contains
        documents where the two differ, and not before. Same refusal as the one that keeps a
        bank statement's four summary totals printed but unlabelled: a number nobody can get
        wrong is not a measurement.
      why_the_divergence_is_deferred: >
        NOT because the printing is hard, and not because the oracle is delicate — BECAUSE THE
        POLICY IS SILENT. Coverage is decided per line item, the line items sum to `СУМА`, and a
        discount applies to the BASKET; reaching a genuine `ДО СПЛАТИ` therefore requires a rule
        for DISTRIBUTING that discount between covered and non-covered lines, and policy.yaml
        contains no such rule. Choosing one here would wire an interpretation the policy does
        not have into the ground truth, which is the one thing a label-first generator must
        never do. See RC-16 for what closing it needs.
      why_the_line_is_printed_at_all: >
        Because the form has both: `СУМА` is line 20 and `ДО СПЛАТИ` line 24, they differ by
        `ЗНИЖКА` and `ЗАОКРУГЛЕННЯ`, and the observed receipt prints all four. The generator
        printed ONE merged "СУМА ДО СПЛАТИ" line until version 7, which is neither of the two
        requisites — a defect on every image, and one no label could have revealed.

    - name: date
      type: string
      required: true
      normalize: iso_date
      meaning: the calendar date of the transaction

    - name: counterparty
      type: string
      required: true
      normalize: party_name
      meaning: >
        The other party to the transaction — the seller on a receipt, and THE PAYEE on a payment
        confirmation or a bank statement. The claimant's own side, where a document names it, is
        `payer` below.
      divergence:
        name: divergence_counterparty_name
        status: resolved
        note: >
          THREE NAMES FOR ONE THING — the failure this file exists to prevent, found live:
            `counterparty` — the field the generator emits in every document label;
            `seller_name`  — the field the consumer's extraction metric names, and the one
                             the F1 >= 0.75 threshold was stated against;
            `seller_name`  — the `data-field` bbox key in templates/ua_fiscal_receipt.jinja, the
                             body every UA fiscal-receipt archetype shares, covering the printed
                             string WITH its legal form.
          The second and third are spelled the same and mean different things: the metric
          field is the merchant identity, the bbox key is the rendered text.
        resolution: >
          RESOLVED IN FAVOUR OF `counterparty`, and the requirement is amended rather than
          this generator. `seller_name` is semantically wrong for half of the four target
          classes: on a `payment_confirmation` the party is a payer or a payee, and on a
          `bank_statement` a payee — neither is a seller. `counterparty` is the only one of
          the two words that is true of all four. The F1 >= 0.75 threshold therefore applies
          to `counterparty`, under whatever name the requirement spells it.
        bbox_key_unchanged: >
          The `seller_name` bbox key stays as it is. Printed keys are a separate vocabulary
          from label field names — that is stated once, for every field, and this is an
          instance of it rather than an exception to it.

    # ------------------------------------------------------------------------
    # SIX FIELDS THAT ARE `null` ON A FISCAL RECEIPT, added in version 10 with the second document
    # class. One label model serves every class, so a field a class does not print is null on its
    # records rather than absent — `required: false` here means the VALUE may be null, never that
    # the key is missing.
    # ------------------------------------------------------------------------

    - name: fee
      type: number or null
      required: false
      normalize: money
      meaning: >
        The bank's charge for executing the payment — комісія. NEVER REIMBURSABLE: it pays for a
        banking service rather than for anything a benefit category covers, so no annual limit
        reaches it and it is not part of a claim's amount.
      cardinality:
        forward_contract: >
          👁 Non-zero on 3 of 8 real confirmations — about 37% — and generated at that rate. A field
          that were always zero would discriminate nothing, which is the state `amount_due` is in
          and says so; this one is not in that state.
      null_on: every class but `payment_confirmation`

    - name: total_charged
      type: number or null
      required: false
      normalize: money
      meaning: >
        `amount` + `fee`: everything that left the payer's account. 👁 Printed on 1 of 8, where it
        is the LARGEST NUMBER ON THE PAGE — and 📄 it is not the amount of the operation.
      why_it_is_labelled_apart: >
        SO THAT THE DIVERGENCE IS MEASURABLE. An extractor trained to reach for the most salient
        figure returns this and not `amount`, and the difference is exactly the fee. Folding the two
        would hide, in a single number, whether a system resists salience. Derived rather than
        stored inside the generator — see `content_builder.PaymentConfirmation.total_charged` — so
        the three amounts cannot drift apart.
      null_on: every class but `payment_confirmation`

    - name: payer
      type: string or null
      required: false
      normalize: party_name
      meaning: >
        The claimant's own side of the payment, where the class names both parties.
      two_forms_of_emptiness: >
        ⚠️ `null` MEANS THE CLASS NAMES ONE PARTY, and it is not the same as an unidentified payer.
        👁 One observed confirmation prints a HYPHEN as the payer's value, and OCR returns the string
        "-" for it, so the label carries that string. A label that merged the two would make
        accuracy on empty fields unmeasurable, which is the whole reason both forms are produced.
      null_on: every class but `payment_confirmation`

    - name: payment_purpose
      type: string or null
      required: false
      normalize: text_name
      meaning: >
        Призначення платежу — free text written by the payer. 🔴 It NEVER names what was bought:
        👁 0 of 7 observed purposes do, naming an invoice, a delivery note, a generic category, or
        the movement of money itself. A consumer must not read a subject out of it; that is what
        `proves_subject: false` for this type means in practice.
      null_on: >
        every class but `payment_confirmation` — and 👁 1 of 8 confirmations has no such field at
        all, an internet-acquiring document, so null occurs within the class too

    - name: document_code
      type: string or null
      required: false
      normalize: identifier
      meaning: >
        The bank's own number for the document. 👁 8 of 8 and 📄 mandatory as "the number of the
        payment instruction", and 📄 the key the official check services take.
      deduplication: >
        THIS is the decisive key for this class. Not the authorization code, which is six digits,
        unique only within an issuer and a window, and 👁 absent from half the documents; and not an
        RRN, which 👁 is not on this class at all. See RC-06.
      null_on: every class but `payment_confirmation`

    - name: auth_code
      type: string or null
      required: false
      normalize: identifier
      meaning: >
        Код авторизації — 👁 six digits on 4 of 4 card operations, and 👁 absent from 4 of 8
        documents, because a transfer by account details has no card operation to authorize.
      null_on: >
        every class but `payment_confirmation`, and within the class wherever the payment was not a
        card operation. Its absence is information, not an extraction failure.

    - name: line_items
      type: array of line_item
      required: true
      normalize: see `line_item`
      cardinality:
        emitted: at least one on every document produced so far
        forward_contract: >
          EMPTY for `payment_confirmation` and `bank_statement`: the requirements document
          gives neither type line items. Settled by the requirement — this is not an open
          question. Two places in `src/` currently treat an empty array as wrong:
          `validate_line_item_sum` returns False for it, and
          `policy_engine` raises on a claim whose total is zero. See RC-09 and RC-10.
        consumer_interaction: >
          The consumer's line-item guard routes a claim to `in_review` with reason
          `line_items_unreliable` when the line-item array is empty while `total > 0`, on
          the ground that a document with a total and no lines is more likely to have been
          read badly than to have no lines. Read together with the requirement above that
          those two types carry no line items at all, THAT GUARD MUST BE TYPE-AWARE or every
          payment confirmation and every bank statement lands in manual review.
          This is the consumer's to fix, not the generator's; it is recorded
          here because the two requirements only contradict each other when read side by
          side, which is what this file is for.

    - name: has_qr
      type: boolean
      required: true
      observed: always true
      divergence:
        name: divergence_qr
        status: divergent
        generator: two booleans — `has_qr` and `qr_is_fiscal`
        consumer: >
          The consuming system requires the DECODED CONTENT and a four-value type
          (fiscal_link / promotional / payment / unknown), presence being unusable as a
          fiscality signal. See `document_types.fiscal_receipt` and RC-03.

    - name: qr_is_fiscal
      type: boolean
      required: true
      observed: always true
      see: divergence_qr

    - name: has_fiscal_number
      type: boolean
      required: true
      observed: always true
      divergence:
        name: divergence_fiscal_scheme
        status: divergent
        consumer: >
          The consuming system requires the fiscal SCHEME JURISDICTION plus that scheme's
          requisites, and forbids a boolean `is_fiscal` in the model. See
          `document_types.fiscal_receipt` and RC-02.

    - name: capture
      type: enum
      required: true
      normalize: closed_enum
      vocabulary: [screenshot, photo, scan]
      meaning: how the document reached the verifier
      observed: >
        `screenshot` ONLY, and the other two are not merely unused: `degrader.degrade`
        RAISES `NotImplementedError` for any capture mode other than `screenshot`. The
        vocabulary exists; the recipes do not.
      label_invariance: >
        Capture mode changes pixels and boxes, never content — so one rendered document may
        yield several examples sharing every other field of this record.
      divergence:
        status: divergent
        consumer: >
          The requirement calls this `medium` and puts it on `ClaimFile` (the binary) rather
          than on the logical document, with FOUR values: digital_pdf / screenshot / photo /
          scan. `digital_pdf` has no counterpart in `Capture`, and a natively generated PDF
          is not a degradation mode at all — it is the absence of one. See RC-11.

    - name: field_bboxes
      type: map<string, [number, number, number, number]>
      required: true
      normalize: bbox
      keys: see `printed_fields`
      note: >
        A key is present only when its element was rendered, AND SINCE VERSION 7 THAT IS NO
        LONGER THE SAME SET ON EVERY DOCUMENT. A missing key is information — the element is not
        on that document — and never an omission to be repaired.

        THREE KEY FAMILIES VARY, and all three vary together, with the seller's ПДВ
        registration: `seller_vat_number`, `item_<i>_vat_letter` and `tax_line_<i>` are present
        for a registered seller and absent for an unregistered one.

        `seller_tax_code` DOES NOT VARY. It is on every document this generator produces, which
        is why a consumer must read registration from the presence of `seller_vat_number` and
        never from the absence of `seller_tax_code`.

        An earlier draft of this note said the two identifier keys were alternatives. Measured on
        the version 7 run of 146 documents: `seller_tax_code` 146 of 146, `seller_vat_number` 125
        of 146, and BOTH TOGETHER on 125 of 146 — so the draft was false on the majority of the
        corpus, and its count of varying keys corresponded to nothing. On the version 8 run of 143
        the same shape holds: `seller_tax_code` 143 of 143, `seller_vat_number` 116 of 143, both
        together on those same 116. See
        `printed_fields.varies_with_vat_payer_status`.

    - name: synthetic
      type: boolean
      required: true
      value: always true
      note: >
        With `generator_version`, this is what keeps the provenance of an individual file
        unambiguous once it leaves this repository.

    - name: generator_version
      type: string
      required: true
      normalize: identity

  # ---------------------------------------------------------------------------
  # Printed fields: geometry without a value
  # ---------------------------------------------------------------------------
  #
  # The keys of `field_bboxes` are a DIFFERENT VOCABULARY from the label field names, and
  # they are not the same names for the same things:
  #
  #   printed `total`        <->  label `amount`
  #   printed `seller_name`  <->  label `counterparty`, and the printed string carries the
  #                               legal form while the label string does not
  #   printed `date`         <->  label `date`, in the jurisdiction's format
  #
  # Most printed keys have NO corresponding label field. They carry a box and nothing else,
  # so a scorecard can measure whether a system located them and cannot measure whether it
  # read them. Several are REQUIRED FIELDS on the consumer side — see
  # `document_types.*.prd_required_fields` and `required_changes`.
  printed_fields:
    status: emitted
    # THREE ARCHETYPES, ONE CLASS. They print the same labelled fields; what differs is the
    # paper width and the fiscal identity at the foot — see `varies_with_the_kind_of_register`.
    archetypes: [ua_prro_receipt, ua_prro_receipt_58mm, ua_rro_receipt]
    with_a_labelled_value:
      seller_name: counterparty          # differs by legal form and quotation marks
      total: amount
      amount_due: amount_due             # equal to `amount` in this version — do not score it
      paid_amount: amount                # the same value, printed a second time
      date: date                         # printed DD.MM.YYYY, labelled YYYY-MM-DD
      item_<i>_name: line_items[i].name
      item_<i>_qty: line_items[i].qty
      item_<i>_price: line_items[i].price
      item_<i>_vat_letter: line_items[i].vat_letter   # absent on a non-payer's receipt
    bbox_only:
      # No ground-truth value exists for any of these. Indices are zero-based and dense.
      - seller_address
      - seller_tax_code                  # «ІД» + ЄДРПОУ (8) or РНОКПП (10), checksum-correct.
                                         # On EVERY receipt this generator builds — oftener than
                                         # reality, see KL-05
      - seller_vat_number                # «ПН». 12 digits for a legal entity, whose first 8 are
                                         # its ЄДРПОУ (a construction from ONE observed document,
                                         # not a rule — see `document_types.fiscal_receipt`); the
                                         # same РНОКПП as `seller_tax_code` for a sole trader.
                                         # REGISTERED PAYER ONLY
      - item_<i>_sum                     # qty × price
      - tax_line_<i>                     # one row per VAT letter; none at all for a non-payer.
                                         # Box spans the whole row — see `tax_row_geometry`
      - discount                         # ЗНИЖКА — zero in this version
      - rounding                         # ЗАОКРУГЛЕННЯ — zero in this version
      - payment_method                   # payment form; consumer-required on payment_confirmation
      - acquirer
      - terminal_id
      - operation
      - card_masked                      # ЕПЗ — електронний платіжний засіб, the masked card
      - auth_code                        # the consumer requires it; a decisive duplicate key
      - rrn                              # the consumer requires it; a decisive duplicate key
      - amount_in_words
      - receipt_number                   # 11 alphanumeric characters from a software register,
                                         # 4 to 6 digits from a hardware one
      - time
      - fiscal_device_number             # 10 digits, prefixed «ФН ПРРО» by a software register
                                         # and «ФН» by a hardware one
      - device_serial                    # «ЗН» — the factory serial, 2 letters and 8 digits.
                                         # HARDWARE REGISTER ONLY: ⚠️ ЗН and ФН are not a pair
      - title
      - provider_name                    # the maker printed immediately after «ФІСКАЛЬНИЙ ЧЕК»
                                         # — 📄 part of the same requisite of the form. A
                                         # software provider or a device manufacturer, per
                                         # archetype. INVENTED NAMES, see `receipt.registrars`
                                         # in config/fiscal-rules.yaml for why and for what the
                                         # alternative would have cost
      - mode_marker                      # Онлайн / Офлайн. SOFTWARE REGISTER ONLY — 📄 the mode
                                         # marker is a ПРРО requisite
      - qr
      - footer_text
    tax_row_geometry:
      status: emitted
      changed_in_version_7: >
        `tax_line_<i>`'s BOX GREW, while its key and its content stayed the same. The row used
        to be a single string starting at the left margin — "ПДВ А 20% 111,32" — and its box
        hugged that text. The VAT amount now sits in the same right-hand column as `total`,
        `discount`, `rounding` and `amount_due`, so the box spans the full width of the row,
        from the label to the amount, in the way `operation` in the acquiring block already did.

        A consumer comparing boxes across versions by IoU will see a mismatch here and nowhere
        else. The label content of the row is unchanged, so nothing that reads text is affected.
      why: >
        The amount is a COLUMN on the paper rather than part of the label, and folding it into
        the label string left the VAT amounts floating mid-line between two right-aligned
        totals — visibly wrong on every registered seller's receipt, and invisible to every
        label. `receipt.totals_labels` and `tax_line_label_format` in config/fiscal-rules.yaml
        are where the wording of both now lives.

    varies_with_vat_payer_status:
      status: emitted
      note: >
        THE ONE CONDITIONAL THAT IS OBSERVED RATHER THAN PLANNED, unlike the acquiring block
        below. Both varieties are produced today, because config/vendors.json carries sellers of
        each kind in the one category that has an archetype.

        EVERY receipt carries `seller_tax_code` — the ІД identification code. That is MORE OFTEN
        THAN REALITY: only 1 of 3 observed real receipts prints the line at all, and KL-05
        declares the overstatement. It is printed as the superset so the field can be exercised.

        A REGISTERED ПДВ PAYER carries, IN ADDITION, `seller_vat_number`, one
        `item_<i>_vat_letter` per line, and one `tax_line_<i>` per letter present.

        A SELLER THAT IS NOT REGISTERED carries none of those three families: its lines end at
        the amount and there is no tax block under the totals.

        So a fiscal receipt's key set answers a question about the seller, and code that asserts
        a fixed key set for the archetype is wrong rather than strict. The status itself is not
        in the label; a consumer reads it from the PRESENCE OF `seller_vat_number`, never from
        `seller_tax_code`, which says nothing about registration because every seller has one.
        An earlier version of this entry made the two identifier keys alternatives and would have
        had a consumer read the status off which one appeared — see
        `document_types.fiscal_receipt`.

    varies_with_the_kind_of_register:
      status: emitted
      note: >
        THE SECOND OBSERVED CONDITIONAL, and it partitions the class rather than the sellers.
        ⚠️ «ЗН» and «ФН» are NOT a pair: 👁 the observed ПРРО receipts print the fiscal number
        alone, 👁 both published hardware samples print the factory serial as well. So the set of
        fiscal identity lines says which kind of cash register issued the document.

        A HARDWARE REGISTER (`ua_rro_receipt`) carries `device_serial` and NO `mode_marker`, its
        `fiscal_device_number` is prefixed «ФН», and its `receipt_number` is four to six digits.

        A SOFTWARE REGISTER (`ua_prro_receipt`, `ua_prro_receipt_58mm`) carries `mode_marker` and
        NO `device_serial`, its `fiscal_device_number` is prefixed «ФН ПРРО», and its
        `receipt_number` is eleven alphanumeric characters.

        This is the axis a consumer stratifies the class on, and `device_serial`'s presence among
        the bbox keys is how: nothing in the labels names the archetype. The paper width is the
        other axis and comes from the image — 464 px for the 58 mm roll, 640 px for the 80 mm one,
        both preserved by the degrader.

        As with the VAT-payer conditional above, a fixed key set for this archetype is wrong
        rather than strict, and for a second independent reason: the two conditionals compose, so
        four combinations of key set exist in the class.

    acquiring_block_is_conditional:
      status: forward_contract
      note: >
        The template omits `acquirer`, `terminal_id`, `operation`, `card_masked`,
        `auth_code` and `rrn` when a document was not paid by card. NO SUCH DOCUMENT IS
        PRODUCIBLE: `build_prro_receipt` constructs the acquiring block unconditionally, so
        all six keys appear on every document today. The conditional is a forward contract,
        not an observation.


# =============================================================================
# 4. The line item
# =============================================================================
#
# Coverage is decided PER LINE, which is why a line item is a labelled structure rather than
# a string. Model: `LineItem`. The consumer persists the same thing as `ReceiptLineItem`,
# normalized rather than inside a JSON blob, so it can be re-scored after a rule change.

line_item:
  status: emitted

  fields:

    - name: name
      type: string
      required: true
      normalize: text_name
      meaning: the line as printed

    - name: item_kind
      type: string
      required: true
      normalize: policy_vocabulary
      vocabulary: >
        The item-kind keys of the CLAIMED CATEGORY in policy.yaml — the union of its
        `covered_items`, `excluded_items` and `ambiguous_items`. Not copied here.
      never_printed: >
        NO SUCH KIND APPEARS ON ANY DOCUMENT. The receipt prints a product name and
        something has to decide whether that name is reimbursable; the kind is the
        ground-truth label space that decision lands in. An extractor predicts it and can
        never read it.
      scoped_to_the_category: >
        The same kind is classified differently in different categories —
        `sports_nutrition` is excluded under `sport` and ambiguous under
        `vitamins_nutrition`. A name-to-kind mapping that ignores the claimed category is
        wrong.

    - name: qty
      type: number
      required: true
      normalize: quantity

    - name: price
      type: number
      required: true
      normalize: money
      meaning: >
        THE UNIT PRICE. The line total is qty × price and the document prints it
        (`item_<i>_sum`), but no label field carries it — a scorecard comparing line totals
        computes them.

    - name: covered
      type: boolean
      required: true
      meaning: >
        Whether this line is reimbursable in the claimed category, per policy.yaml. The
        policy engine resolves the answer from the category's buckets and treats this flag as
        an assertion to check against that resolution.
      ambiguous_bucket: >
        Kinds from `ambiguous_items` never appear with this flag set either way; both the
        builder and the engine refuse to invent an answer policy.yaml declines to give.

    - name: vat_letter
      type: string or null
      required: false
      normalize: vat_letter
      meaning: ПДВ-літера — the VAT rate code printed at the end of the line
      null_is_legitimate: >
        AND IS THE WHOLE OF THE VAT BLOCK BEING ABSENT, not an unread letter. Every line of a
        receipt issued by a seller that is not registered for ПДВ carries `null`, and that
        document has no tax rows either. See `normalization.vat_letter.nullability`, which
        also records that this file forbade the case until version 7.
      not_a_shortcut_to_coverage: >
        The coverage boundary deliberately does not coincide with the VAT boundary, so a
        consumer cannot derive `covered` from this field and has to read the line.
      aggregate_is_missing: >
        Per-line letters are labelled; the per-letter VAT AMOUNTS the consumer requires are not. See
        `document_types.fiscal_receipt` and RC-05.


# =============================================================================
# 5. The verdict vocabulary
# =============================================================================
#
# `verdicts` keys are the `Verdict` members in schemas.py. The consumer's `Decision` enum is
# wider and names one of the shared concepts differently; each entry records its
# counterpart, and `verdict_decision_mapping` below states the whole correspondence in one
# table. The notes that follow are a SIBLING block so that a consumer generating an enum
# from these keys gets six values.

verdicts:

  covered:
    status: emitted
    means: fully reimbursable — every line qualifies and the annual limit absorbs it
    consumer_counterpart: auto_approved
    divergence:
      status: divergent
      note: >
        SAME CONCEPT, DIFFERENT WORD. The consumer's `Decision` verdict for a claim that
        passed with no flags is `auto_approved`, and a scorecard comparing verdict strings
        would score every correct decision as wrong. `verdict_decision_mapping` below now
        states the correspondence; neither name is changed. See RC-13.

  partially_covered:
    status: emitted
    means: >
      Part of the amount qualifies. Two causes, kept apart in `imperfection` because they
      differ in what a consumer can possibly know.
    consumer_counterpart: partially_covered
    note: >
      The consumer treats `partially_paid` and `partially_covered` as DIFFERENT AXES — part
      of the amount versus part of the lines — which may hold at once, each carrying its own
      reimbursable amount. The generator's `Verdict` is single-valued and cannot express both
      on one claim.

  not_proof_of_payment:
    status: forward_contract
    means: >
      THE SLOT: that MONEY MOVED. This verdict is what the claim gets when that one fact of
      `document_evidence` is not established, and it is decided from the DOCUMENT TYPE — every
      document the claim carries is of a type whose entry in policy.yaml says
      `proves_payment: false`. An invoice, an act, an order screenshot, a non-fiscal receipt,
      alone or in any combination. Amounts, baskets and dates are not consulted.

      NO CAUSE in `imperfection`: the verdict says the whole of it. There is one slot and one
      way to fail it, so there is nothing left for a cause to distinguish.
    consumer_counterpart: not_proof_of_payment
    agreement_across_the_sources: >
      All three sources read it this way: policy.yaml's `document_evidence`, the verdict table
      in docs/architecture.md, and the consumer's own definition, whose canonical example is an
      invoice reading "Zapłacono: 0,00".
    derived_but_not_built: >
      `policy_engine.evaluate_claim` NOW LABELS THIS CASE: a claim none of whose documents is a
      payment-proving type comes back `not_proof_of_payment` with an empty `imperfection`. No
      archetype produces such a document, so the verdict still reaches no dataset and the
      status above stays `forward_contract`.
    why_this_was_once_unreachable: >
      HISTORY, kept because it has gone wrong twice. This verdict used to be written as what it
      was NOT, and under that construction it lost its own territory: policy.yaml's `coverage`
      block wrote a zero covered amount as `not_proof_of_payment / rejected`, and
      docs/architecture.md's imperfection catalogue listed "no proof of payment" under a second
      verdict as well as under this one — between them, nothing was left that reached this name.
      Both are fixed by every verdict naming its own slot of `document_evidence`; see
      `verdict_notes.definitions_name_their_own_slot`, which is the rule, and
      `verdict_notes.why_this_boundary_slips` for why this particular pair invites the error.

      TWO KEYS DEPARTED FROM THIS VERDICT IN THIS REVISION, declared together because a consumer
      diffing key sets sees two absences and this file should not leave it guessing which is
      which. No content was lost; each sentence's new home is named.

        `not_the_same_as_a_missing_subject` was RENAMED to this key. A key whose NAME is a
        complement keeps the construction alive in the one place a reader converting the prose
        would not look. Its content is the paragraph above, less the sentence that defined this
        verdict by contrast with its neighbour, which the slot form makes unnecessary.

        `built_only_through_the_document_type` was REMOVED, not renamed. Its substance — that the
        document type is the one mechanism — is now the FIRST thing `means` says ("decided from
        the DOCUMENT TYPE — every document … says `proves_payment: false`"), so the key had become
        a second copy of the definition, and two copies of a rule become two rules the first time
        one is edited. Its other sentence, that the item-coverage route to this name is closed
        because that case is `rejected`, is in the `decided` block below, which this revision
        leaves unchanged and which is where that decision belongs.
    # -----------------------------------------------------------------------
    # WAS UNDECIDED. NOW DECIDED — recorded here so the reasoning survives the decision.
    # -----------------------------------------------------------------------
    decided: >
      THE QUESTION: what a claim with ZERO covered amount is called — a basket bought wholly
      outside the claimed category. policy.yaml's `coverage` block wrote that case as
      `not_proof_of_payment / rejected`, which is two different answers, and `rejected` was
      not a member of the `Verdict` enum at all, so `policy_engine.verdict_for` RAISED rather
      than choosing.

      THE DECISION: the policy was right and the enum was incomplete. `rejected` is now a
      member of `Verdict` and a zero covered amount maps to it; see `verdicts.rejected`.

      WHY: the two are different outcomes and always were. A pharmacy receipt listing nothing
      but medicines establishes payment perfectly well — it is about the wrong subject, which
      is a coverage failure and not an evidence failure. The consumer's own `Decision`
      vocabulary carries BOTH `rejected` ("the policy plainly does not cover it", example:
      paid for the wrong subject) and `not_proof_of_payment`, and the requirements state
      explicitly that collapsing any of the finer verdicts into `rejected` is a defect —
      "the claim failed" is not a decision a claimant can act on. Two names on both sides,
      for two outcomes: the generator was missing one of them, and the slash in policy.yaml
      was the symptom.

      READ WITH `verdicts.rejected.by_when_it_was_paid`, which moved the out-of-period case
      INTO `rejected` and is not the defect this paragraph forbids. Collapsing would be
      letting `rejected` absorb a verdict whose own definition fitted a case; this moved a
      case out of a verdict whose definition did not fit it, and left that verdict with every
      mechanism it does fit. The test is the same one applied here — does the verdict's
      one-line definition cover the case — and it is what both changes were decided by.

      WHAT DID NOT CHANGE: `_reimbursable` still raises for a claim wholly beyond an
      exhausted annual limit (`policy_engine._reimbursable`). `rejected` does not close that
      gap — there the policy DOES cover the purchase, in part or in full, and the persona has
      simply drawn the annual maximum already, which is a different state and still has no
      name in policy.yaml. It stays open, and the planner still refuses to produce such a
      claim.

  insufficient_evidence:
    status: forward_contract
    means: >
      THE SLOTS: that a PURCHASE WAS MADE, and that the payment and the purchase are ONE
      TRANSACTION. This verdict is what the claim gets when either of those two facts of
      `document_evidence` is not established, and `imperfection` says which — THREE CAUSES over
      two slots:

        WHAT WAS BOUGHT is not established — no document of the claim is of a type that states
        it, so that slot has no document at all. Cause `subject_not_evidenced`. A bare transfer.

        ONE TRANSACTION is not established — a subject document and its payment both exist and
        fail a cross-check: the amounts differ (`amount_mismatch`), or the payment is dated
        before the document it settles (`payment_precedes_subject`).

      Those two slots are the whole of this verdict. Which slot is unestablished is read off the
      claim's own documents; no comparison with any other verdict is involved in reaching it.
    consumer_counterpart: insufficient_evidence
    what_moved_out: >
      A payment dated outside the benefit period WAS a fourth cause of this verdict and is
      now a cause of `rejected`. The name did not fit: for an out-of-window expense every
      fact is established — the purchase happened, the proof is flawless, only the date does
      not match — so "a required fact was not established" was false of it. See
      `verdicts.rejected.by_when_it_was_paid`. A consumer that keyed on
      `insufficient_evidence` to mean "go and ask for another document" was being sent after
      a document that does not exist.
    why_a_disagreement_is_this_verdict_and_not_a_new_one: >
      Both facts are present separately, and the claim still does not establish that THIS
      payment paid for THIS subject — which is a linkage a claim has to prove, so the
      evidence is insufficient by the verdict's own name. Recorded as a cause rather than as
      a new enum member, following the precedent `partially_covered` sets: one verdict,
      several named causes, told apart because a consumer can know different things about
      each. Here the distinguishing fact is whether a second document exists at all — a
      missing document versus two that contradict each other.
    never_a_flag_on_a_coverage_verdict: >
      Load-bearing. Were the cause hung off a coverage-determined verdict, a claim whose
      documents contradict each other would come out `covered` with a flag beside it, and
      every number derived from the verdict would be computed off evidence that does not
      hold together.
    note: >
      The policy engine labels all three causes correctly; what is missing is a planner path
      that produces a claim carrying only half its evidence, which needs archetypes that do
      not exist. No dataset contains this verdict.

  partially_paid:
    status: forward_contract
    means: payment was made in installments and only part of the amount has been settled
    consumer_counterpart: partially_paid
    depends_on: >
      The invoice payment-status and amount-due fields, which no model field carries. See
      `document_types.invoice` and RC-07.

  rejected:
    status: forward_contract
    means: >
      The documents establish everything they need to, and the policy plainly does not cover
      the claim. TWO MECHANISMS, answering the same question on different axes — by WHAT was
      bought and by WHEN it was paid. `verdict_basis` is `["documents"]` for both: each is
      entirely visible in the image.
    consumer_counterpart: rejected
    by_what_was_bought: >
      The documents prove payment perfectly well, and NOTHING on them is covered by the
      claimed category — the covered amount is zero. A property of the LINE ITEMS, resolved
      against the category's `covered_items` and `excluded_items` in policy.yaml. Carries NO
      cause in `imperfection`: the verdict says the whole of it.
    by_when_it_was_paid: >
      The claim's PAYMENT falls outside `period` in policy.yaml. Carries the cause
      `outside_period`, which is what tells the two mechanisms apart without parsing
      `policy_trace`.

      HISTORY, NOT PART OF THE DEFINITION ABOVE. The paragraph above decides this route on its
      own; everything from here down is for a reader who has already classified and is checking
      themselves, and that is the only reason it may name another verdict at all. Two other
      artifacts fence this same history the same way: `policy_engine`'s module docstring does it
      at rule 4, and the `Verdict` class docstring in `schemas.py` does it in the paragraph that
      follows this verdict's two axis bullets.

      WAS `insufficient_evidence` UNTIL THIS REVISION, AND THE CHANGE IS A CONTRACT CHANGE —
      a consumer that pinned the old verdict for this case scores it as a miss until it
      re-vendors. The old label was wrong by the other verdict's own name: that verdict says
      a required fact was not established, and for an out-of-window expense ALL of them are —
      the purchase happened, the proof is flawless, only the date does not match. Meanwhile
      `rejected` means the policy plainly does not cover it, and an out-of-window
      expense is plainly not covered, by *when* rather than by *what*, symmetrically to the
      wrong-subject case above. Nothing was collapsed into `rejected`: a CASE moved from a
      badly fitted verdict to a well fitted one, and every mechanism that did fit
      `insufficient_evidence` stayed there (see `verdicts.insufficient_evidence`).

      REJECTED ALTERNATIVE: a seventh member of the enum meaning "outside period". It would
      pull a share into `verdict_mix` and cost the downstream contract another revision, and
      it buys no precision a named cause on a fitting verdict does not already give.
    # THIS BLOCK IS ALLOWED TO CONTRAST, and the reason is not that it comes after the
    # definition — position licenses nothing. It is that the block is NOT LOAD-BEARING: `means`
    # and the two axis keys above decide the verdict on their own, so a reader classifying a
    # claim never has to come here, and one who skips the block entirely still gets the right
    # answer. It warns a reader who has already classified and is checking themselves. The rule
    # in `verdict_notes.definitions_name_their_own_slot` governs the text a reader MUST consult;
    # everything in it must be positive. Optional neighbours may contrast, and a key name that
    # announces itself as disambiguation is where they belong. If any entry below ever becomes
    # something a reader needs in order to classify, it stops qualifying and has to be rewritten
    # positively or folded into an axis key.
    not_to_be_confused_with:
      not_proof_of_payment: >
        A property of the DOCUMENT TYPE (`proves_payment: false`), not of item coverage. The
        canonical separating case is a pharmacy receipt listing nothing but medicines: it
        establishes payment, so it is not `not_proof_of_payment`, and it covers nothing, so
        it is `rejected`.
      exhausted_annual_limit: >
        A claim that covers something and is paid nothing because the persona has already
        drawn the annual maximum is NOT this verdict — the policy covers that purchase.
        policy.yaml names no verdict for it and `policy_engine._reimbursable` still raises.
      in_review: >
        The consumer's catch-all for a guard firing. A runtime outcome, not a label; see
        `verdict_decision_mapping`.
    emitted: >
      NOT YET, BY EITHER MECHANISM. `policy_engine` labels both today and no dataset produced
      so far contains this verdict: `content_builder` always draws at least one covered line,
      and `claim_planner._draw_date_in_period` draws every date inside the window.

      The scope of that is the DRAWN path, not every path. `plan_claim`'s `issued_at` is a
      public parameter with no guard on the period, so a caller naming an out-of-window date
      gets a plan the engine labels `rejected` — which is why the claim above is about what
      the generator draws rather than about what it can be made to produce.
      `claim_planner._UNREALIZABLE_REASONS` records what each mechanism waits for.
    share: >
      `verdict_mix` in policy.yaml declares this member with NO SHARE — `null`, which the
      loader returns as `None` and never as 0. Acquiring a second mechanism did not change
      that: the share is decided together with whichever mechanism first builds such a claim,
      and a number set before then would size a bucket nothing can fill. A consumer reading
      `verdict_mix` as weights must treat an undeclared share as absent rather than as zero,
      and the assembler's balance report therefore reports the absent fraction of the mix as
      a LOWER BOUND.

# The two enums, side by side. Stated as a table because the alternative is a consumer
# comparing verdict strings and scoring every correct decision as wrong — the exact failure
# `divergence_counterparty_name` was found live for, one field over.
verdict_decision_mapping:
  status: divergent
  mapping:
    covered: auto_approved
    partially_covered: partially_covered
    not_proof_of_payment: not_proof_of_payment
    insufficient_evidence: insufficient_evidence
    partially_paid: partially_paid
    rejected: rejected
  renamed:
    covered_vs_auto_approved: >
      THE ONLY RENAMING. Same concept, different word: the consumer's decision for a claim
      that passed with no flags is `auto_approved`, and the generator's label for a claim
      every line of which qualifies is `covered`. Neither name is wrong for its own side —
      `covered` is a statement about the claim, `auto_approved` about what was done with it —
      so this file maps them rather than choosing. See RC-13.
  consumer_only:
    in_review: >
      NO GENERATOR COUNTERPART, AND THERE SHOULD NOT BE ONE. `in_review` is the runtime
      outcome of a guard firing — arithmetic inconsistent, line items unreliable,
      segmentation uncertain, an unknown fiscal scheme — i.e. a statement about the
      consumer's own confidence, not about the claim. Generation is label-first: the verdict
      is chosen and then documents are built to realize it, and there is nothing in a chosen
      ground truth from which "a human should look at this" could be derived. A dataset
      cannot label a claim `in_review`; it can only contain claims that a given system's
      guards happen to route there, which is a measurement of that system.
    consequence_for_scoring: >
      An `in_review` decision matches no label. Score it as its own outcome — the rate at
      which the system defers, reported against the true verdict it deferred on — never as a
      miss on the verdict axis, or a system that correctly refuses to guess reads as one that
      guessed wrong.
  see: verdicts, for what each generator-side member means

verdict_notes:

  definitions_name_their_own_slot:
    # NO `status`, deliberately. Every value in `status_vocabulary` says something about whether
    # a LABEL exists or is disputed, and this key is a construction rule for this file's own
    # prose — nothing in a dataset corresponds to it. `emitted` in particular would tell a
    # consumer filtering on it that a style rule was observed in a run and may be relied upon.
    # The file's convention is that a `status` belongs to a section describing a label; this
    # section does not.
    note: >
      HOW THE EVIDENCE VERDICTS IN `verdicts` ABOVE ARE CONSTRUCTED, and the rule for amending
      them. `document_evidence` carries TWO facts plus the LINKAGE between them — three slots.
      Each slot has a name, and each definition states ITS OWN SLOT and nothing else.
    slots: |
      fact not established            verdict                 cause in `imperfection`
      ------------------------------  ----------------------  ---------------------------
      that MONEY MOVED                not_proof_of_payment    none - the verdict says it all
      that a PURCHASE was made        insufficient_evidence   subject_not_evidenced
      that the two are ONE            insufficient_evidence   amount_mismatch,
      TRANSACTION                                             payment_precedes_subject
    the_test_an_edit_must_pass: >
      A BARE INVOICE MUST BE CLASSIFIABLE FROM `verdicts.not_proof_of_payment.means` ALONE, with
      no mention of any other verdict in it. An invoice is a `proves_payment: false` type, the
      money-moved slot is therefore unestablished, and that is the answer — reached without
      consulting a second definition. Apply the mirror test to each of the others. If definition
      A has to mention B to work, it is still relational, and the next edit to B moves A.
    no_exception_clauses: >
      A definition must carry no clause of the form "and case X is NOT this verdict". Under the
      three-slot form such a clause excludes nothing that was ever included — a bare invoice
      fails the money-moved slot and no other, so it never fell under `insufficient_evidence` to
      be excluded from it. Such a clause is not a harmless safety rail: it re-introduces exactly
      the cross-reference the structural form exists to remove, while looking like care. One was
      added to three artifacts during this very repair and then deleted for that reason.
    what_the_rule_governs_and_what_it_does_not: >
      THE CRITERION IS WHETHER THE TEXT IS LOAD-BEARING FOR CLASSIFICATION, and it is the only
      criterion. The rule governs text a reader must consult to decide what a claim is called —
      `means`, and anything a definition folds into itself. Such text must be positive: it must
      name its own slot and reach the answer without reading another verdict's entry.

      Text that is NOT load-bearing may contrast freely. The example in this file is the
      `not_to_be_confused_with` block on `verdicts.rejected`: that verdict's `means` together with
      its two axis keys is self-sufficient, so classification never enters the block, and a reader
      who skips it
      entirely still arrives at the right verdict. It exists to warn a reader who has already
      classified correctly and is checking themselves. Being optional is what makes the contrast
      safe, and a key whose NAME announces it as disambiguation is where such text belongs.

      NOT A CRITERION: where the text SITS. "It comes after a positive definition" licenses
      nothing — `not_the_same_as_a_missing_subject` also sat after a positive definition and was
      renamed, because it was reached while classifying and its name presented a complement as
      the thing to know. Position is not a property; reachability is. Ask what a reader must read
      to answer the question, and require every sentence in that set to be positive.
    why_it_is_not_style: >
      Both evidence verdicts were once written as "the one that is not the other". Under that
      construction, editing the boundary of either SILENTLY MOVES the boundary of the other, and
      nothing local to the edit reveals it. It has gone wrong twice: once when
      docs/architecture.md's imperfection catalogue listed "no proof of payment" under a second
      verdict as well, leaving `not_proof_of_payment` unreachable by any mechanism either source
      described; and again when a later repair narrowed `insufficient_evidence` to "a document is
      missing" and thereby reclaimed the bare-invoice case — written, at the time, while actively
      guarding against the first. A sharper boundary buys time. A slot buys the property.

      THE GENERAL FORM, which is not specific to verdicts: whenever several names partition a
      space, define each by its own position in the structure being partitioned. **A definition
      of the form "X is the case that is not Y" is a defect even when it is, at that moment,
      accurate** — its accuracy depends on a sentence elsewhere that nothing links it to.

  why_this_boundary_slips:
    status: divergent
    note: >
      WHY THIS PARTICULAR PAIR INVITES THE ERROR, recorded so the next recurrence is expected
      rather than surprising. The split is ASYMMETRIC. The payment slot has a verdict of its own,
      `not_proof_of_payment`; the purchase slot has no verdict of its own and lives as a CAUSE,
      `subject_not_evidenced`, under `insufficient_evidence`. Two facts of equal standing in
      `document_evidence`, at two different levels of the label.

      THE ASYMMETRY IS NOT THIS GENERATOR'S CHOICE. It comes from the CONSUMER'S vocabulary,
      which carries `not_proof_of_payment` and carries no counterpart for the subject half — so
      the generator cannot make the partition symmetric without inventing a verdict the consumer
      cannot receive. Marked `divergent` for that reason: it is a property of the two sides, not
      a defect in either.

      THE CONSEQUENCE FOR EDITORS: an asymmetric partition is harder to state than a symmetric
      one, so every prose edit TENDS TO LEVEL IT — "a document is missing" is the symmetric
      sentence, and it is wrong precisely because it covers both halves. Both recurrences took
      that shape. This deserves a check of its own on any edit to either definition, not a
      general resolve to be careful.

  missing_from_the_generator:
    status: divergent
    note: >
      One member of the consumer's `Decision` enum has no counterpart in `Verdict`, and only
      one: `in_review`. `rejected` used to be the other and no longer is — it was added to
      `Verdict`; see `verdicts.not_proof_of_payment.decided`. The full correspondence, and
      why `in_review` is not a gap to be closed, are in `verdict_decision_mapping`. What is
      left of RC-13 is the `covered` / `auto_approved` naming and the two-axis question under
      `verdicts.partially_covered`.

  realizability:
    status: emitted
    note: >
      Only `covered` and `partially_covered` can be built today
      (`claim_planner.REALIZABLE_VERDICTS`); the other four are refused rather than
      approximated. A realized distribution from a current run is therefore CONDITIONAL on
      that subset, and the assembler's balance report says so. Do not read it as this
      dataset's balance against `verdict_mix`.

  distribution:
    status: emitted
    note: >
      `verdict_mix` in policy.yaml is a DATASET-BALANCE decision, not an estimate of any
      real-world distribution, and no production class prior is defined anywhere in this
      repository — that assumption belongs to a consumer's evaluation configuration. The full
      reasoning, and the obligation it places on anyone measuring against this dataset, is in
      policy.yaml above `verdict_mix` and in config/README.md; it is not repeated here.


# =============================================================================
# 6. The claim label
# =============================================================================
#
# One record per claim, written to `labels/<claim_id>.claim.json` and repeated in the
# `claims` array of `ground_truth.json`. Model: `ClaimGroundTruth`; the derived values come
# from `policy_engine.evaluate_claim`. Every key is present in every record.

# ---------------------------------------------------------------------------
# 6a. How a claim's documents become its amount
# ---------------------------------------------------------------------------
#
# A CLAIM'S AMOUNT IS NOT THE SUM OF ITS DOCUMENTS, and a consumer that computes it as one
# gets a plausible verdict off a doubled figure. This block states the rule the labels were
# derived under, because nothing in the label files makes it visible: `documents` is a flat
# list of ids and does not say which of them describe the same money.
#
# The rule is read off `document_evidence` in policy.yaml and nothing else. A document that
# proves payment attests to a movement of money; a document that proves only the subject
# describes money some payment document already attests. So:
#
#   * an invoice plus the payment confirmation that settles it are ONE transaction. The
#     claim's line items are the invoice's, counted once, and the payment adds no money of
#     its own — it supplies the amount the invoice is CROSS-CHECKED against.
#   * several fiscal receipts are several transactions, and their money does add. Each is
#     its own payment. That is the same rule, not an exception to it.
#
# Implemented in `policy_engine.resolve_evidence`, whose `Transaction` pairs a subject
# document with the payment that settles it.

claim_evidence:
  status: emitted

  shapes_the_generator_can_resolve:
    self_contained: >
      Every payment document proves its own subject and no other document is present. One
      transaction per document; their amounts add. THE ONLY SHAPE ANY DATASET CONTAINS
      TODAY, since the single registered archetype is a fiscal receipt.
    one_split_pair: >
      Exactly one document proves the subject, exactly one proves the payment, and they are
      different documents. One transaction described twice, counted once.

  shapes_that_are_refused:
    status: emitted
    note: >
      `policy_engine` RAISES rather than labelling, because the guess would decide the
      claim's amount. A fiscal receipt beside an invoice is either the same purchase
      described twice or two purchases one of which was never paid; one invoice beside two
      payments leaves open which payment settles it. `document_evidence` answers neither.
    bank_statement: >
      REFUSED OUTRIGHT, and worth stating separately because it is the one type that
      genuinely adds money: a statement lists several transactions while its label carries
      a single `amount` for the whole document, so nothing identifies the row a given claim
      is about. That is the same question left open under
      `document_types.bank_statement.undecided` — whether a statement is labelled once or
      once per transaction — and it has to be settled before a statement archetype lands.

  cross_checks:
    status: emitted
    note: >
      Applied to a split pair only; a self-contained document cannot disagree with itself
      about which payment settled it. Failing either is `insufficient_evidence` with the
      cause in `imperfection` — NOT a flag on a coverage-determined verdict, which would
      let a claim whose documents contradict each other come out `covered`.
    amount: >
      The subject document and its payment state the same amount, compared to two decimal
      places. Cause `amount_mismatch`.
    order: >
      The payment is not dated BEFORE the document it settles. Strictly before: paying an
      invoice on the day it is issued is ordinary. Cause `payment_precedes_subject`.
    not_checked_here: >
      Whether a document's own stated `amount` equals the sum of its own line items. That
      is a DOCUMENT invariant, owned by `content_builder.validate_line_item_sum`,
      deliberately without a caller on the honest path, and it belongs to the fraud
      archetypes that will break it on purpose. See `document_label.amount.invariant`.

  period_and_date:
    status: emitted
    claim_date: >
      A claim is dated by its PROOF OF PAYMENT — the earliest payment document where it
      carries several — and not by its earliest document. A limit is consumed when money
      moves; the earliest document is the invoice, which is the date of the obligation. The
      claim label carries no date field, so this is visible only in the ORDER claims consume
      a persona's annual balance in.
    period: >
      Checked on the PAYMENT DATE ONLY. A December invoice paid in January is an ordinary
      January expense, not a period failure — the subject document's date is checked for
      order instead (see `cross_checks.order`). A payment that does fall outside the window
      makes the claim `rejected` with the cause `outside_period`, and NOT
      `insufficient_evidence`, which it was labelled until this revision: see
      `verdicts.rejected.by_when_it_was_paid`.

  what_is_not_recorded:
    status: divergent
    note: >
      WHICH DOCUMENT PROVED WHAT IS NOT IN THE LABEL. The pairing above is derived at
      evaluation time from `document_evidence` and the document's TYPE; no field of
      `ClaimGroundTruth` or `DocGroundTruth` carries a document's role in the claim, so a
      consumer holding only the labels re-derives it the same way. `policy_trace` names the
      pairing in prose, and prose is not comparable. See RC-15.
    consequence_for_archetypes: >
      Because the role is type-level, an archetype whose evidence DIFFERS from its type's
      default — policy.yaml's example is a bank confirmation whose payment purpose spells
      out what was bought — cannot be labelled correctly and must not be registered. The
      override is described in policy.yaml and exists nowhere in `src/`;
      `claim_planner.Archetype` says so at its head.

claim_label:
  status: emitted
  file: "labels/<claim_id>.claim.json"

  fields:

    - name: claim_id
      type: string
      required: true
      normalize: identity

    - name: persona_id
      type: string
      required: true
      normalize: identity
      note: >
        The only link from a claim to the person who filed it; document labels carry no
        persona reference. The join is document -> claim -> persona. See `persona_record`.

    - name: category
      type: string
      required: true
      normalize: policy_vocabulary
      vocabulary: the `id` of a category in policy.yaml
      answers: which benefit the claim is made against — the scope every coverage answer is relative to

    - name: documents
      type: array of string
      required: true
      normalize: identity per element
      answers: which document labels make up the evidence
      cardinality: >
        At least one; exactly one in every run so far, and that is a property of the
        ARCHETYPE REGISTRY rather than of a claim — the one registered template is a fiscal
        receipt, which proves both facts, so no claim needs a second document yet. Nothing
        in the pipeline assumes the count is one.
      ordering: >
        The order the assembler wrote them in, which for a split claim is subject first and
        payment second. Do NOT read a role off the position: the pairing is derived from
        `document_evidence` and the document's type. See `claim_evidence`.
      joining: >
        A document belongs to exactly one claim, and this list is the join. Do not pair the
        `claims` and `documents` arrays of `ground_truth.json` positionally — that only
        works while every claim has one document.

    - name: verdict
      type: enum
      required: true
      normalize: closed_enum
      vocabulary: see `verdicts`
      authority: >
        Derived by `policy_engine` from the documents actually built and the persona's
        ledger — not the verdict the planner aimed at. Where the two differ the engine wins
        and the balance report says so, so no label reaches the dataset that nothing derived.

    - name: covered_fraction
      type: number or null
      required: false
      normalize: fraction
      answers: HOW MUCH OF THE DOCUMENT BELONGS TO THE CATEGORY
      definition: covered amount over total amount, from the line items and nothing else
      note: >
        Reported, never used as a tolerance — the coverage rule is strict. A claim held back
        only by an exhausted limit reads 1.0 alongside `verdict: partially_covered`, which is
        two facts kept apart rather than a contradiction. The reasoning is in
        docs/architecture.md#ground-truth.
      absence: >
        `null` means nothing derived a fraction. TWO CAUSES NOW, and they are different
        states: an undecided claim, which is what the default of the model is for; and a
        claim with NO LINE ITEMS to compute a fraction from — one evidenced by a payment
        and nothing saying what it bought. `null` is emphatically not `0`, which says the
        lines were read and none of them is covered. Present and non-null on every record
        written so far, because no archetype produces a claim of the second kind.
      definition_across_documents: >
        Covered amount over total, over the line items of the claim's SUBJECT documents,
        counted once per transaction — not over every document's lines. An invoice and the
        payment that settles it describe one purchase. See `claim_evidence`.

    - name: reimbursable_amount
      type: number or null
      required: false
      normalize: money
      answers: HOW MUCH THE PLAN ACTUALLY PAYS OUT
      definition: >
        The covered amount, capped by what is left of the annual limit, in policy.yaml's
        `reporting_currency`. It is the only field that distinguishes a limit-bound claim
        numerically.
      divergence:
        status: divergent
        note: >
          DIFFERENT ARITHMETIC FOR THE SAME QUANTITY. The generator computes Σ(covered
          lines). The consuming system is required to compute `total − Σ(excluded lines)`,
          deliberately, so that a MISSED line surfaces as a discrepancy instead of a silent
          underestimate. THE TWO AGREE EXACTLY ON THIS DATASET, because the ground truth
          satisfies Σ(all lines) = total by construction; they diverge only when extraction
          loses a line, which is the case that subtraction exists for. No generator change
          follows — this is recorded so a consumer does not read the agreement as a licence
          to compute it the generator's way.
      absence: same as `covered_fraction`. Present on every record written so far.

    - name: linked
      type: boolean
      required: true
      answers: whether the evidence is split across more than one document
      definition: "`len(documents) > 1`, exactly"
      observed: always false — linked claims need archetypes that do not exist yet
      note: >
        The consumer models this richly: `DocumentLink` carries the result of named
        cross-checks (amount, date order, counterparty tax number, payment form, contract
        party against payee, date within period), and each `ClaimDocument` carries its role
        in the link (`proof_of_subject` / `proof_of_payment`). The generator has the role
        information at TYPE level in policy.yaml's `document_evidence` and records nothing
        per document. See RC-15.
      partly_closed: >
        TWO of the consumer's cross-checks are now PERFORMED, though still not recorded per
        document: amount agreement and date order between a subject document and the payment
        that settles it. A claim failing either is `insufficient_evidence` with the cause in
        `imperfection` — see `claim_evidence.cross_checks`. Counterparty tax number, payment
        form and contract party against payee are not performed, because no generator field
        carries any of them (see `document_types.payment_confirmation`).

    - name: imperfection
      type: array of string
      required: false
      normalize: string_list_unordered
      answers: >
        WHY the verdict is what it is, where the verdict alone does not say. One verdict,
        several named causes — a consumer can know different things about each, so neither
        absorbs the other.
      vocabulary:
        # Causes of `partially_covered`. These two, and only these two, are declared in
        # policy.yaml — as `partially_covered_causes`, which exists to give them SHARES of
        # the dataset.
        mixed_items: a non-covered line is on the document — VISIBLE IN THE IMAGE
        limit_exhausted: the annual balance ran out — NOT VISIBLE IN THE IMAGE
        # Causes of `insufficient_evidence`, one per slot it owns: the WHAT-WAS-BOUGHT slot and
        # the ONE-TRANSACTION slot (see `verdict_notes.definitions_name_their_own_slot`).
        # POLICY.YAML NAMES NONE OF THESE: it declares a cause vocabulary only where shares are
        # being declared, and no share of a dataset is sized by them. The names are
        # `policy_engine`'s, exported as module constants, and this file is where they are
        # contracted.
        subject_not_evidenced: >
          The WHAT-WAS-BOUGHT slot: no document of the claim is of a type that states it — a
          bare transfer. That slot has no document at all.
        amount_mismatch: >
          The ONE-TRANSACTION slot: a subject document and the payment that settles it state
          different amounts, so the claim does not establish that THIS payment paid for THIS
          subject.
        payment_precedes_subject: >
          The ONE-TRANSACTION slot again: the payment is dated before the document it settles,
          an impossible order. Checked between the two documents of a pair, not against the
          benefit period, which is a different rule with a different verdict.
        # The one cause of `rejected`, and the only one that verdict needs: its other
        # mechanism, a basket the category covers none of, is the whole of what the verdict
        # already says.
        outside_period: >
          The PAYMENT falls outside `period` in policy.yaml, so the claim is `rejected` — the
          policy plainly does not cover it, by WHEN rather than by WHAT. Under
          `insufficient_evidence` until this revision; see
          `verdicts.rejected.by_when_it_was_paid`. The subject document's date is not checked
          against the period at all — see `claim_evidence.period_and_date`.
      cardinality: >
        Empty on a `covered` claim, empty on `not_proof_of_payment`, and empty on a `rejected`
        claim whose basket is what the policy does not cover — in each case the verdict says
        the whole of it. Several causes may appear on one claim: both `partially_covered`
        causes, for which policy.yaml declares no share, and both cross-check causes, where
        one pair of documents disagrees twice over.
      verdict_scope: >
        A cause never appears under a verdict it does not belong to. Three disjoint sets —
        two `partially_covered` causes, three `insufficient_evidence` causes, one `rejected`
        cause — so a cause always determines its verdict, and a consumer may key on the cause
        to recover the verdict.

        THE CONVERSE NO LONGER HOLDS EVERYWHERE, and this is the one asymmetry to read
        carefully. `partially_covered` and `insufficient_evidence` always carry a cause, so
        for those two the verdict and the cause induce the same partition. `rejected` does
        not: it arrives either through the period, carrying `outside_period`, or through zero
        coverage, carrying nothing. So a consumer keying on the cause must treat "no cause"
        as a value rather than as missing data, and must not assume every `rejected` claim
        names one.
      narrower_than_the_catalogue: >
        docs/architecture.md#imperfection-catalogue names fifteen mechanisms; only these six
        reach a label, because only these six are mechanisms whose verdict does not say by
        itself which of them applied — read PER ROUTE rather than per verdict, since
        `rejected` names a cause on its period route and none on its coverage route. Where the
        others will be recorded is not decided. The consumer's counterpart is
        `ValidationFlag` plus the guard reasons (`line_items_unreliable`,
        `arithmetic_inconsistent`, `segmentation_uncertain`), which are runtime outcomes
        rather than labels.

    - name: verdict_basis
      type: array of string
      required: false
      normalize: string_list_unordered
      answers: WHAT THE VERDICT DEPENDS ON
      vocabulary:
        documents: derivable from the images alone
        account_state: also requires the persona's spending history
      how_to_use_it: >
        No model can read a remaining annual balance off a receipt, so document-understanding
        metrics belong on the `["documents"]` subset only and end-to-end metrics on both.
      absence: an empty array means nothing derived a basis, not that the verdict rests on nothing

    - name: policy_trace
      type: array of string
      required: false
      normalize: prose_not_comparable
      answers: WHY the verdict is what it is, in human-readable form
      contents: >
        Only what the verdict rested on: a limit that did not bind is not mentioned, and a
        claim rejected for its date says so without arguing about coverage. An invented
        example of the limit-bound shape:
          - "category=<category id> ok"
          - "period ok"
          - "coverage 100% (all line items covered)"
          - "annual limit <category id> 9000.00 UAH: 8100.00 already reimbursed, 900.00 remaining"
          - "reimbursable 900.00 UAH of 2400.00 covered — annual limit exhausted"


# =============================================================================
# 7. The persona record
# =============================================================================
#
# `claim_label.persona_id` sends a consumer here, so the shape is documented rather than
# left to be discovered. Model: `Persona`. Personas appear ONLY in the `personas` array of
# `ground_truth.json` — there is no per-persona label file.
#
# NOT AN EXTRACTION TARGET. Nothing about a persona is printed on a document and none of
# these fields is scored. The record exists so that `verdict_basis: account_state` is
# auditable: a limit-bound verdict can be re-derived only if the person it belongs to is
# identifiable.
#
# Every value is invented. `city` and the given name come from Faker, the surname from the
# narrowed high-frequency set under `personal_names` in config/generation.yaml — see that
# block for why it is narrowed; `tax_id` is a checksum-correct РНОКПП generated from a drawn
# birth date — a well-formed identifier belonging to nobody.

persona_record:
  status: emitted
  location: "ground_truth.json -> personas[]"
  fields:
    - name: persona_id
      type: string
      normalize: identity
    - name: full_name
      type: string
    - name: location
      type: "object { country, city }"
      note: "`country` is the `Country` enum — UA, PL, DE, ES. `city` is free text."
    - name: home_currencies
      type: array of string
      normalize: open_enum
    - name: languages
      type: array of string
      normalize: open_enum
    - name: tax_id
      type: string
      note: РНОКПП in UA — the individual taxpayer number, checksum-correct
    - name: family
      type: "array of { relation, name, birth_date }"
      note: "`relation` is free text (spouse | child); empty on most personas"
    - name: benefit_categories
      type: array of string
      normalize: policy_vocabulary


# =============================================================================
# 8. Where the labels are
# =============================================================================

artifacts:
  status: emitted
  layout:
    "images/<doc_id>.png": the document as it would have been captured, after degradation
    "labels/<doc_id>.json": one `document_label` record
    "labels/<claim_id>.claim.json": one `claim_label` record
    "ground_truth.json": >
      The manifest for a run: `generator_version`, `seed`, `synthetic: true`, and the arrays
      `personas`, `claims`, `documents`. The claim and document arrays hold exactly the same
      records as the per-file labels — a second view, not a different set.
  encoding: UTF-8 JSON, two-space indent, non-ASCII written literally rather than escaped
  determinism: >
    Every run is fully determined by `--seed`, so a scorecard may rely on the same seed
    producing the same labels.


# =============================================================================
# 9. Known limitations of the dataset
# =============================================================================
#
# Where a label is recoverable from something other than reading the document properly.
# Sections 1–8 say what the labels ARE; this one says where measuring against them will
# flatter a consumer, so that nobody discovers it from a production regression instead.
#
# WHY IT IS IN THE CONTRACT AND NOT IN A CODE COMMENT. A consumer reads this file. It does
# not read `content_builder.py`, and it should not have to: a limitation recorded only in
# the generator's internals is a limitation nobody downstream will ever meet.
#
# TWO KINDS OF CONSUMER, HURT IN DIFFERENT WAYS, and the difference decides which entry
# below matters to whom:
#
#   A consumer that TRAINS on this dataset accumulates a shortcut across examples. Given a
#   predictor that correlates with the label, it can reach a good score without learning the
#   rule at all, and the loss shows up only on data where the correlation does not hold.
#   Every entry below is a live risk for such a consumer.
#
#   A consumer that PROMPTS a language model accumulates nothing: it sees one document per
#   call and carries no state between them, so it cannot learn "this seller means fully
#   covered". The leak does not reach the model — it reaches the SCORECARD, and through it
#   the human tuning prompts and thresholds against these numbers. A metric measured here is
#   then an estimate of behaviour on this dataset's distribution and not on an open world,
#   and the person adjusting a prompt until the number rises is the channel by which the
#   bias arrives. Entries marked `hurts: evaluation` are the ones that reach this consumer.
#
# This is the same obligation policy.yaml states for `verdict_mix`, applied to predictors
# rather than to class shares: report what was measured, and say on what.
#
# REFERENCE RUN for every share below — three archetypes are registered and all three are
# Ukrainian fiscal receipts for the one category that has any, so the whole dataset is
# pharmacy-and-nutrition receipts:
#   generate-dataset --seed 20260803 --personas 30 --claims-per-persona 5
#   -> 143 documents, 143 claims, 50 distinct counterparties,
#      31 documents carrying a visible non-covered line.
#
# BY ARCHETYPE, since the class is no longer one rendering: 54 `ua_prro_receipt` (80 mm software
# register), 46 `ua_prro_receipt_58mm` (58 mm, same register), 43 `ua_rro_receipt` (80 mm hardware
# register). The three are drawn with equal weight, so the split is a draw and not a target.
#
# RE-MEASURED FOR VERSION 8, and the figures moved because the seeded stream moved: a claim's
# receipt is now drawn from three archetypes rather than taken from one, `hygiene` entering the
# excluded catalogue changes the basket draw, and the maker's name is a further draw per document.
# Nothing about the mechanisms below changed — only which documents this seed produces. Version 7
# stated 146 documents, 46 counterparties and 35 with a non-covered line; version 6 stated 147 and
# 24. A figure quoted against a seed is only as stable as the stream, which is why each one names
# its run.
#
# HOW SENSITIVE THAT IS, MEASURED RATHER THAN ASSERTED, because it bounds what any figure here is
# worth: within this version, changing only the SIZE of the maker-name pools — nothing else, no
# mechanism and no other value — moved the run from 51 counterparties and 36 non-covered documents
# to 49 and 32, and a later change to the same pools — swapping invented names for public ones,
# which changed the pool sizes again — moved it to 50 and 31. Three measurements of one seed over
# one commit. A draw of a different arity consumes the generator differently and every later
# draw shifts. So these counts describe one run of one tree, and a reader must re-measure rather
# than expect them after any edit that adds or removes a draw.
#
# Of those 50 counterparties, 6 are named firms and 44 are sole traders whose names are
# DRAWN rather than stored — a fresh one per claim, since a `ФОП` entry in vendors.json
# denotes a sole trader of that trade and not one named person. So a sole trader carries
# exactly one document, and any statistic computed per counterparty is a sample of one for
# 44 of the 50. KL-01 below depends on that and says so.

known_limitations:

  - id: KL-01
    name: the counterparty can foretell full coverage
    predictor: counterparty
    hurts: training
    subset: >
      Documents issued by a vendor whose profile in config/vendors.json sells nothing the
      claimed category excludes. Such a vendor cannot produce a non-covered line, so every
      document it issues is fully covered by construction and its name alone settles the
      question.
    share_in_reference_run: >
      TWO FIGURES, AND THEY DIFFER BY A LOT. Structurally 0 of 143: the one category with a
      registered archetype has no covered-only vendor left, because `nutrition_practice`
      sells `medical_device` and its sole traders issue mixed receipts like any pharmacy.

      Empirically 36 of 143, on 36 of the 50 counterparties — and every one of those 36 is a
      sole trader carrying a single document. All 6 counterparties that carry more than one
      document appear on both fully covered and partially covered ones. (Re-measured for version
      8 on the run named above; version 7 stated 32 of 146 on 32 counterparties, version 6
      34 of 147. The shape is identical across all three — the stream moved, not the mechanism.)

      The gap is the whole point of stating both, and it widened when sole-trader names
      became a per-claim draw: a counterparty that appears once is trivially "never seen
      partially covered", so the cross-tabulation now produces 36 hits of which none is
      evidence of anything.

      A vendor that CANNOT sell an excluded kind is a permanent property of the data: it
      will never appear on a partially covered document, at any size, under any seed. A
      vendor that simply DID NOT is a sampling artifact: at n = 1 it is not even that. The
      first is leakage; the second is noise that looks identical in a single run's
      cross-tabulation. A consumer cannot tell them apart from the labels alone — the vendor
      profiles in config/vendors.json are what distinguishes them, and that is why both
      numbers are here rather than the flattering one.
    still_open_where: >
      `private_tutor` under language_courses and `online_learning_platform` under
      professional_development are covered-only today. Neither category has an archetype, so
      neither reaches a dataset yet; both must gain a vendor that can carry a mixed basket
      before their first template lands, or this entry stops being empty.
    how_to_stratify: >
      Do NOT group by the counterparty string. Most counterparties are sole traders whose
      names are drawn per claim, so grouping by the string produces buckets of one and a
      long list of counterparties that are "never partially covered" for no reason at all —
      36 of them in the reference run, none meaningful.

      Group by the VENDOR PROFILE instead: `config/vendors.json` maps each entry to a
      profile, and a profile that sells nothing the category excludes is the thing that
      actually leaks. Report those separately, or drop them from coverage metrics. Where a
      profile cannot be recovered — a consumer reading only the labels cannot — treat a
      counterparty with a handful of documents as uninformative rather than as a finding,
      and read the structural figure above instead of computing your own.
      Do not group by the counterparty string for KL-04 either, and for a different reason:
      there the string is informative, which is precisely the defect.
    fixed_by: >
      An affinity invariant enforced in the test suite: for every jurisdiction that has a
      registered archetype, every covered item kind must be sold by a vendor that also sells
      something the same category excludes.

  - id: KL-02
    name: every non-covered line comes from one of four item kinds
    predictor: the line item itself
    hurts: training, evaluation
    subset: >
      The whole dataset, without exception. Every registered archetype carries the same one
      category, so every claim is `vitamins_nutrition`, and every non-covered line on every
      document is a medicine, a blood-pressure monitor or glucose test strips, a face cream, or a
      shower gel or toothpaste. Four head-noun families, and a consumer that learns those four
      scores as well here as one that reads the article and resolves it against the policy.
    share_in_reference_run: >
      100% of non-covered lines. In the reference run 31 of 143 documents carried one: 58
      non-covered LINES between them, printing 31 DISTINCT strings, drawn from the 400 those four
      kinds can produce.

      BY KIND, AND THE TWO COUNTS ARE STATED SEPARATELY BECAUSE THEY ANSWER DIFFERENT QUESTIONS —
      occurrences say how often a consumer meets the kind, distinct strings say how much of the
      kind it ever sees. An earlier draft of this entry gave one set of per-kind numbers without
      saying which they were; they were occurrences, they summed to 58 against 31 unique, and a
      reader could not tell.

        medical_device   29 occurrences,  8 distinct strings
        cosmetics        13 occurrences, 13 distinct strings
        medicine          8 occurrences,  8 distinct strings
        hygiene           8 occurrences,  2 distinct strings

      RE-MEASURED FOR VERSION 8 on the run named above, and the reason it moved is BOTH of this
      version's changes rather than the arithmetic of one: the stream shifted, and `hygiene`
      became drawable. Version 7 stated 35 of 146 documents, 32 strings and 398 producible over
      three kinds; version 6 stated 24 of 147 and 26 strings.
    what_changed_in_version_8: >
      THE FOURTH FAMILY ARRIVED, AND THIS ENTRY USED TO CARRY A `narrowed_further_by` BLOCK
      SAYING IT COULD NOT. `hygiene` reached no document because both its templates named a
      brand, and the brand vocabulary in config/generation.yaml is keyed by ITEM KIND rather
      than by template — so one pool served the shower gel and the toothpaste, and a mark drawn
      for either was printed on the other. The generator declined to fill the kind rather than
      print an article under a mark chosen for a different one; the objection was the keying, not
      any claim about who manufactures what.

      The repair was a brandless template form — `Гель для душу 250 мл` rather than
      `Гель для душу {brand}`, which 👁 is how Ukrainian receipts most often print such articles.
      The kind is out of `unprintable_item_kinds` and drawn like any other, so the block is gone
      rather than reworded: it described a condition that no longer exists.

      WHAT THE FOURTH FAMILY IS WORTH, stated because it is small. `hygiene` contributes exactly
      TWO printable strings against the other three kinds' 398, since a brandless template has no
      placeholder to vary. The families went from three to four; the vocabulary went from 398 to
      400. A consumer stratifying by head noun gains a family, and one measuring string diversity
      gains almost nothing.

      `electronics` HAS THE SAME DEFECT AND KEEPS IT. It is an excluded kind of `hobby`, which has
      no archetype, so it reaches no dataset either way; the brandless form is not applied to it
      because the form is evidenced for hygiene articles and not for consumer electronics, where a
      real receipt line names a brand and a model. It remains declared in
      `unprintable_item_kinds`, and it is not a cause of any narrowing here.
    a_second_leak_inside_one_kind: >
      🔴 WITHIN `hygiene`, THE STRING IS THE LABEL — and this is a DIFFERENT leak from the one this
      entry is named for, not the same one measured another way. It has its own predictor and its
      own subset:

        predictor — the SPECIFIC STRING, not the head-noun family;
        subset    — the `hygiene` lines only. 8 occurrences on 7 of the 143 documents in the
                    reference run.

      A brandless template has no placeholder to vary, so the kind's two templates produce exactly
      TWO strings for the whole corpus, against 8, 13 and 8 distinct strings for the other three
      kinds. `Гель для душу 250 мл` and `Зубна паста 75 мл` are therefore not examples of a
      non-covered hygiene article — between them they ARE the non-covered hygiene article, and
      either string memorised gives the label with no reading of the policy at all.

      WHY IT IS NOT FOLDED INTO `share_in_reference_run`. The share figure is about four families
      standing in for an open world, and a consumer acts on it by stratifying on the family. This
      leak works only inside one kind and only on the exact string, so a consumer acting on the
      family would not catch it. Two mechanisms behind one visible column, as KL-01 and KL-04 are.

      THE CLASS, stated rather than cited, since nothing else in this file records an instance of
      it: a vocabulary narrow enough that a PARTICULAR STRING, and not the category it belongs to,
      predicts the label. What makes this instance easy to miss is that it is localized to one item
      kind instead of spread across the label space — the corpus-wide totals look healthy, 31
      distinct strings over four families, and the defect is entirely inside one of the four.

      HOW TO STRATIFY IT, which is not what the entry's own `how_to_stratify` says: exclude
      `hygiene` lines from any metric that would credit reading the article, or report them
      separately, until the vocabulary is keyed by template. Two strings cannot support a
      generalization claim about anything.
    fixed_by: >
      KEY THE PLACEHOLDER VOCABULARY BY TEMPLATE RATHER THAN BY ITEM KIND, in
      config/generation.yaml. That is the ROOT CAUSE of both this entry's second leak and of the
      original brand-crossover defect that kept `hygiene` out of the dataset altogether: the pool
      is keyed by kind, so a draw cannot see which of the kind's templates it is filling, and the
      shower gel and the toothpaste therefore cannot be given placeholders of their own. Key it by
      template and each article gets its own vocabulary — variety returns, the string stops being
      the label, and no brandless form is needed at all.

      THE BRANDLESS FORM IS THE NARROWER FIX, AND IT IS WHAT WAS TAKEN. It closes the crossover —
      no mark is printed on an article it was not chosen for — at the cost of two strings where
      there could have been dozens. It was preferred because it is one edit to a template and 👁
      it matches how Ukrainian receipts print such articles, whereas re-keying the vocabulary is a
      structural change to the shape of config/generation.yaml, a different concern from
      registering templates, and not something to do in the same commit. Recorded here so the real
      repair is not lost behind the narrower one that shipped.
    why_it_is_not_a_defect: >
      It IS the coverage rule of the one category that has an archetype, not an accident of
      the vendor data: `excluded_items` in policy.yaml is what the plan does not pay for. No
      configuration change widens it further — the file that would have to change is the policy,
      and widening the label space to make a metric look harder would be the wrong repair
      anyway. The fix is more categories with archetypes, which is a later wave of work. Note
      what the version 8 change was NOT: the four families are what the policy already declared,
      and the repair made the dataset match the label space rather than widening either.
    consequence: >
      Coverage metrics measured here are OPTIMISTIC relative to a real flow, where the
      non-covered article is drawn from an open world rather than from four families. This
      is the entry that reaches BOTH kinds of consumer: one that trains absorbs the four
      head nouns as a rule, and one that prompts a language model is scored on a
      distribution far narrower than production, so the number it reports is an estimate of
      the wrong thing rather than a noisy estimate of the right one.
    how_to_stratify: >
      Report coverage metrics together with the inventory of non-covered item kinds they
      were measured over, and treat them as conditional on it. Do not quote a single
      coverage F1 as an estimate of open-world behaviour. If an open-world estimate is
      needed, it has to come from documents this generator did not produce.

  - id: KL-03
    name: an item kind can foretell full coverage without the seller being read
    predictor: the line item itself
    hurts: training
    subset: >
      A covered item kind sold only by profiles that stock nothing the same category
      excludes. A line printing that kind then guarantees a fully covered document, and —
      unlike KL-01 — a consumer picks the shortcut up without ever looking at the
      counterparty.
    share_in_reference_run: >
      0 of 143. `online_course` and `certification_exam` had this shape (both selling
      profiles were covered-only) and `instrument_rent` likewise; the affinity data was
      changed so that a training centre also sells travel and a music school also sells
      refreshments. Neither kind reaches a dataset yet in any case. (Re-measured for version 8;
      version 7 stated 0 of 146. The denominator moved and the numerator is structurally zero.)
    still_open_where: >
      Nowhere, on this entry's own mechanism. The PL, DE and ES vendor lists do fail the
      enforced test, but for the SIBLING reason rather than this one: three covered kinds
      have no seller at all in those lists — `sport.pool_membership` in PL, and
      `vitamins_nutrition.nutritionist_visit` in DE and in ES. That is a kind missing from
      the dataset, which is the failure KL-01's invariant also guards against, and not a
      kind whose every seller is covered-only. There is no genuine covered-only-seller case
      in any non-UA list.

      Both must be closed before those jurisdictions get their first archetype, because the
      test is enforced only where one is registered. Recorded here rather than left to the
      test output because a reader of this section would otherwise attribute the failure to
      the leak this entry describes, which would be the wrong repair.
    how_to_stratify: >
      Cross-tabulate `item_kind` against `covered_fraction` over the whole dataset. Any kind
      appearing only on fully covered documents is a shortcut; exclude it, or report on it
      separately, before quoting a coverage metric.
    fixed_by: same invariant as KL-01, stated over item kinds rather than over vendors


  - id: KL-04
    name: the counterparty foretells whether the document has a VAT block
    predictor: counterparty
    hurts: training, evaluation
    subset: >
      Every document issued by a counterparty whose name is STORED in config/vendors.json. All
      of them are registered ПДВ payers, so a stored name guarantees a per-line `vat_letter`, a
      tax block and a `seller_vat_number` box — and their absence is guaranteed by a name that is
      not in that file. New in version 7: before it, `vat_letter` was never null, so there was
      nothing to predict.
    share_in_reference_run: >
      TWO FIGURES, AS KL-01 STATES THEM, AND HERE THEY AGREE INSTEAD OF DIVERGING.

      STRUCTURALLY 34 of 34: every vendor entry in the UA lists that states a `name` carries
      `vat_payer: true`, and there is not one named non-payer. The cross-tabulation of all 44
      entries is (TOV, payer) 28, (ПрАТ, payer) 6, (ФОП, non-payer) 9, (ФОП, payer) 1 — so
      NAMED implies PAYER with no exceptions, at any size, under any seed. That is leakage in
      KL-01's sense: a permanent property of the data rather than a sampling artifact.

      EMPIRICALLY 99 of 143 documents carry a stored name, and 99 of those 99 have a VAT
      block — zero exceptions on 69% of the corpus. The other 44 documents carry drawn
      sole-trader names and are mixed: 17 payers, 27 non-payers. (Re-measured for version 8;
      version 7 stated 106 of 146 with 40 drawn, 19 payers to 21. The structural figures above are
      unchanged, config/vendors.json not having been touched.)
    the_leak_is_one_directional: >
      Worth stating because it bounds what a consumer can do with it. A STORED name implies a VAT
      block with certainty; a DRAWN name implies nothing, being 17 payers to 27 non-payers. So a
      model can shortcut the positive case only — which is the larger half, and enough to inflate
      any metric conditioned on the VAT block.
    how_to_stratify: >
      Report anything that depends on `vat_letter`, on the tax block or on `seller_vat_number`
      SEPARATELY for documents with a stored counterparty and documents with a drawn one, and
      never as a single figure over the corpus. The two subsets are 69% and 31% here and neither
      is representative. A consumer reading only the labels cannot tell the two apart — the
      vendor file is what distinguishes them, exactly as in KL-01 — so the split has to be taken
      from config/vendors.json rather than computed from the labels.
    fixed_by: >
      NOTHING TODAY, and the obvious fix is blocked for a reason worth knowing. Closing it means
      a named vendor that is not a ПДВ payer, and such an entry asserts of a real-sounding firm
      that it is not VAT-registered — a claim about its turnover and tax regime. One existed and
      was removed for exactly that reason; `$note_vat_payer_departures` in config/vendors.json
      carries the argument. So the honest routes are a stored name that cannot designate any real
      firm, or more drawn entries on both sides, and neither is a decision this file takes.
    why_it_is_not_the_same_as_KL_01: >
      KL-01 is about COVERAGE being foretold by the counterparty; this is about the VAT BLOCK.
      They share a predictor and nothing else: a document can be fully covered and have no VAT
      block, or partially covered and have one. Two mechanisms behind one visible string.

  - id: KL-05
    name: the dataset overstates how often a receipt prints an identification code
    predictor: none — a distribution gap rather than a label leak
    hurts: training, evaluation
    subset: >
      EVERY document. All of them print the «ІД» identification code (bbox key
      `seller_tax_code`), while of the real ПРРО receipts examined only 1 of 3 carries one: two
      of three print no such line at all.
    share_in_reference_run: >
      143 of 143 documents, against an observed real-world 1 of 3. All three archetypes print the
      line; version 7 stated 146 of 146.
    why_it_is_deliberate: >
      «ІД» is printed because it is the SUPERSET. A field that is present can be looked for and
      scored; a field the corpus never prints cannot be exercised at all, and its absence would
      be indistinguishable from an extractor that simply never finds it. The cost is this entry.
    consequence: >
      A system tuned on this corpus will expect an identification code where most real receipts
      have none, and will read the field's absence as a defect rather than as the ordinary case.
      Any measured recall on it is measured on a distribution the real flow does not have. This is
      the same refusal as `document_label.amount_due` not being scoreable and as a bank
      statement's four summary totals being printed but unlabelled: state what the corpus does
      not represent, rather than letting a number stand for something it never measured.
    why_this_entry_breaks_the_template: >
      It carries `predictor: none`, and the other four entries in this section all name one. That
      is informative rather than untidy: the other entries say "something in the document gives
      the label away", and this one says "the document population is not the real population".
      Fitting it to the template by inventing a predictor would have hidden the difference.
    how_to_stratify: >
      Nothing to stratify — there is no subset without the field. Do not report presence or
      recall figures for `seller_tax_code` as estimates of real-world behaviour, and treat any
      model that learned to require the line as untested against the majority of real receipts.
    fixed_by: >
      A FURTHER TEMPLATE THAT PRINTS NO «ІД» LINE. The axis of the variation is the ПРРО
      software provider — three observed receipts, three providers, and exactly one prints it —
      so it is NOT a property of the seller and must not become a flag on a vendor entry, which
      would model the wrong level and put a provider's layout choice on the merchant.
      `content_builder.Seller.tax_code` is already nullable for precisely this, so the template
      is the whole of the remaining work. Named as one gap in config/fiscal-rules.yaml.

      NONE OF THE THREE ARCHETYPES ADDED IN VERSION 8 IS IT, and the entry is not narrower for
      their arrival: they vary the paper width and the kind of cash register, and all three print
      «ІД». More templates of a class do not by themselves vary a provider's optional requisites.


# =============================================================================
# 10. Required changes to src/ — NONE OF THEM MADE
# =============================================================================
#
# Every divergence above that can only be closed by editing this repository, collected in one
# place. NOTHING IN THIS LIST HAS BEEN IMPLEMENTED. Each says which file, what would change,
# and whether it is mechanical or waits on a decision — because a change that waits on a
# decision must not be made by whoever happens to read this next.
#
#   blocked_on: decision  — the author must choose between two defensible answers
#   blocked_on: none      — mechanical; the data already exists and is discarded
#   blocked_on: nothing   — withdrawn: the divergence was settled the other way, and nothing
#                           in this repository changes. The entry stays so its id keeps
#                           resolving and the decision stays visible.

required_changes:

  - id: RC-01
    file: none — nothing changes in this repository
    change: >
      WITHDRAWN. The counterparty naming divergence was settled in favour of the name this
      generator already emits: `counterparty` stays, and the requirement is amended instead.
      `seller_name` is semantically wrong for half of the four target classes — a payer or
      payee on a payment confirmation, a payee on a bank statement, a seller on neither.
    because: see divergence_counterparty_name, which carries the full reasoning
    blocked_on: nothing
    kept_because: >
      The id is retained rather than removed so that references to RC-01 elsewhere, and in
      anything already written against this file, keep resolving. A withdrawn entry that
      explains itself is cheaper than a renumbered list.

  - id: RC-02
