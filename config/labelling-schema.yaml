# What this generator labels, what the consumer requires, and where the two disagree.
# A CONTRACT, not documentation.
#
# WHY IT EXISTS. A consumer of this dataset has an extraction step, which needs a
# structured-output schema, and a scorecard, which needs comparison rules. Agree the two
# separately and they disagree: this generator emits `counterparty`, the consumer's
# requirement names the field `seller_name`, and the scorecard reports zero accuracy on a
# system that works. Worse, it reports a plausible 40% on a system that reads every field
# correctly and writes dates the other way round — indistinguishable from a real
# regression. So name, type and comparison rule are settled here, once.
#
# TWO SIDES, AND THIS FILE CARRIES BOTH.
#
#   generator side — what `src/receipt_synth` emits today, verified against a real run.
#   consumer side  — what the extraction and evaluation requirements demand. This is the
#                    SOURCE OF TRUTH for what the dataset must eventually contain.
#
# A contract that documented only the generator would silently inherit every divergence
# instead of recording it. So wherever the two disagree, both names appear, marked
# `status: divergent`, and THIS FILE PICKS NEITHER. Resolving a divergence means either a
# change in `src/` or an amendment to the requirement, and both are the author's call.
# Every `src/` change a divergence implies is collected in `required_changes` at the foot
# of this file. That sentence used to close "None of them has been made", which version 29
# withdraws: it stopped being true at version 22, when RC-06 was recorded as `done`, and
# RC-12 is the second entry to close. Of the sixteen entries, TWO are `done`, one is
# withdrawn and thirteen are open — `blocked_on:` on each entry is what says which, and no
# count of them is kept anywhere else.
#
# IT DUPLICATES NOTHING. Coverage rules, limits, the category vocabulary and the evidence
# matrix stay in policy.yaml; pipeline narrative stays in docs/architecture.md; the
# consumer's requirements stay in the consumer's own repository. All are referenced by
# name. Two copies of a rule become two rules the first time one is edited.
#
# NO CODE IN `src/` READS THIS FILE. There is no loader for it there, and adding one would be
# inventing a caller. It is consumed by downstream tooling; its accuracy is maintained by being
# re-checked against a freshly generated label file.
#
# TESTS READ IT, and the sentence above used to say "nothing in this repository", which the first
# of them made false. They fall in TWO GROUPS, and the difference decides what a failure means.
#
# THE FIRST GROUP CHECKS THE GENERATOR AGAINST THIS FILE. Both read the SAME block — the
# payment-date mapping — because it is the one place where this file states something the
# generator has to obey rather than something it merely records:
#
#   `tests/test_payment_date_split.py` loads this file and config/policy.yaml together, to check
#   the property neither file can hold alone: the CONCEPT is named in the policy and the printed
#   captions only here, with no caption on the policy side.
#   `tests/test_payment_confirmation.py` checks that every date caption the generator PRINTS is one
#   this file accepts, and that none is one it refuses. Without it the mapping could be correct and
#   the documents could still carry a caption the contract says is not the payment date.
#
# THE SECOND GROUP CHECKS THIS FILE AGAINST ITSELF and names no generator behaviour at all:
#
#   `tests/test_conformance_vectors.py` — every emitted normalization class carries cases, and no
#   case names a class that does not exist.
#   `tests/test_contract_indexes.py` — new in version 21. Every index this file offers a consumer
#   resolves: a field's `normalize` names a real rule, every rule is named by at least one field,
#   every `status` is a word of `status_vocabulary`, every `blocked_on` a word of
#   `blocked_on_vocabulary` (version 22), every `hurts:` a LIST of words of `hurts_vocabulary`
#   (version 23), each vocabulary's every word carried by something, and
#   every `generator:` cell of a `prd_required_fields` table a list of real label field names. It
#   exists because a HAND-MAINTAINED index diverged from what it indexed eight times while under
#   active attention, and the repair was to delete the index and keep the checks.
#
# None is a loader: nothing in the pipeline calls them, and `src/` still reads nothing here.

# Bumped to 29 by A FILE CEASING TO BE A DOCUMENT, IN BOTH DIRECTIONS AT ONCE. Until this version
# every image held exactly one document and every document occupied exactly one image, so "the
# file" and "the document" were one thing under two words. They are now TWO RELATIONS — the
# documents OF a file, and the pages OF a document — THREE NEW LABEL FIELDS carry them, and neither
# relation implies the other. SEVEN consequences, and the first is the one that breaks a reader of
# coordinates.
#
#   🔴 EVERY COORDINATE IS IN THE SPACE OF THE FILE `source_file` NAMES, AND THAT IS NO LONGER
#   ALWAYS THIS DOCUMENT'S OWN PAGE. `file_region` says where this document sits inside that file:
#   `null` is the statement that the document IS the whole file — the ordinary case, and every case
#   before this version — and a box says the file holds another document besides. WHERE IT IS A
#   BOX, `field_bboxes`, `content_bbox` AND `page_regions` ARE ALREADY IN THE FILE'S COORDINATES,
#   so a consumer that crops by `file_region` and then indexes with a field box applies the offset
#   twice. A consumer diffing v28 against v29 must decide, per record, whose pixel space it is in
#   before it reads a single box — and `file_region is null` is that test.
#
#   🔴 `page_count` AND `page_regions` ARE THE SECOND RELATION, AND THEY ARE INDEPENDENT OF THE
#   FIRST. How many sheets THIS document runs to, and where each of them is, in reading order.
#   `page_regions` is present exactly when `page_count > 1` and holds exactly that many entries;
#   `null` at one page, because a single page has nothing to add over `file_region`. THE TWO
#   RELATIONS COMBINE AND THE GENERATOR PRODUCES THE COMBINATION: a two-sheet bank statement
#   carried in one file with the invoice it settles has a `file_region`, a `page_count` of 2 and
#   two `page_regions` inside that region. A consumer that implemented either as the other's
#   special case meets the combination on the first such claim.
#
#   🔴 A SHARED FILE IS NAMED AFTER THE CLAIM, AND `images/<doc_id>.png` IS NO LONGER THE WHOLE
#   RULE. Such a file is `images/<claim_id>.png` and BOTH labels of that claim carry it in
#   `source_file`. A consumer that reconstructed an image path from `doc_id` — the field this file
#   tells a consumer to treat as opaque, in that field's own entry — now builds the name of a file
#   that does not exist.
#   `source_file` is the join, and it always was.
#
#   🔴 `capture` IS DRAWN PER FILE WHERE A FILE HOLDS TWO DOCUMENTS, so both records carry the same
#   channel: a stapled pair is photographed once, not photographed and scanned. The field still
#   sits on the DOCUMENT record, which is precisely the shape RC-11 disputes — the consumer puts
#   `medium` on the file — and this is the first evidence in this dataset that it is right about
#   the home, since two records now carry one file's fact. ⚠️ `content_lost_edges` and
#   `content_complete` are measured against the FILE's frame for the same reason: the file is what
#   a consumer receives, and a document whose sheet fell off the photograph lost its content
#   exactly as a single-document capture does.
#
#   ⚠️ A REGION IS AN AXIS-ALIGNED HULL AFTER DEGRADATION, AND IS NOT A CUT LINE. It carries the
#   caveat `field_bboxes` and `content_bbox` already carry, because it is carried by the same
#   transform in the same call: under `photo` or `scan`, which rotate, each rectangle is rebuilt as
#   the smallest axis-aligned box containing its four moved corners. So a region is larger than the
#   document it covers, TWO ADJACENT `file_region`s MAY OVERLAP — on the `photo` channel two thirds
#   of them do, by 17 px typically and 85 px at the worst on the run measured at the field's own
#   entry, while `screenshot` and `scan` stay at nothing and at a few pixels — and a region may
#   extend past the frame with a negative coordinate. A segmentation step scored pixel for pixel
#   against these is being scored against an annotation convention as much as against itself.
#
#   RC-12 IS CLOSED, AND ONE HALF OF IT IS CLOSED BY A DECISION RATHER THAN BY CODE. The generator
#   models multi-document files and is the source of ground truth for their boundaries, which is
#   what that entry asked for. ⛔ ONLY THE DOCUMENTS OF ONE CLAIM EVER SHARE A FILE: the pattern
#   "documents of DIFFERENT claims in one file" is deliberately unsupported, files hold at most one
#   claim's documents — today two — and never the consumer's "up to twelve". The entry states the
#   boundary and names the consumer's own guard for the case. ONE NEW `known_limitations` ENTRY,
#   KL-16, and it is a DELIBERATE KEEP rather than a defect found: a payment's purpose text may
#   cite a document number, or name a kind of goods, that the subject document does not, on claims
#   whose label is perfectly ordinary.
#
#   ⛔ `config/policy.yaml` IS NOT TOUCHED BY THIS VERSION, so this is not an I-2 event and no
#   share moved. Both new knobs are in config/generation.yaml —
#   `bank_statement.two_page_share: 0.15` and `file_composition.bundle_share: 0.25` — by that
#   file's own rule: they size no verdict bucket and no label depends on their value. NO CLAIM'S
#   VERDICT, CAUSE, AMOUNT, DATE OR PARTY CHANGES because a file is shared; the bundling draw is
#   seeded independently of every other draw, and at `bundle_share: 0` a run reproduces the corpus
#   of the commit before it byte for byte — measured, not asserted. ⚠️ THAT IS NOT THE SAME
#   STATEMENT ABOUT PAGINATION: `two_page_share` changes what a statement PRINTS, so a corpus
#   generated at version 29 is not version 28's corpus at any share, and any figure measured on an
#   earlier run is a figure about a different one.
#
