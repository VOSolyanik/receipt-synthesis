      NOT DONE, and needing no `src/` change: `covered` and `auto_approved` are the same
      concept under different words, mapped in `verdict_decision_mapping` rather than
      renamed; `in_review` has no counterpart and should not acquire one, being a runtime
      outcome of a guard rather than a ground-truth label.

      STILL OPEN and needing a decision: the consumer treats `partially_paid` and
      `partially_covered` as independent axes that may hold at once, which a single-valued
