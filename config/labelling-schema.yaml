      🔴 STILL OPEN, AND NARROWED BY WHAT THAT ARCHETYPE TURNED OUT TO CARRY. The signal on it is
      NOT the string this file names for Ukraine: ⛔ no public source found shows «НЕ ФІСКАЛЬНИЙ
      ЧЕК» printed on a SALES document (the one observed Ukrainian denial, «! НЕ ФІСКАЛЬНИЙ !», is
      on a ПРРО SERVICE document — a cash movement). What the sources evidence is two things: a
      positive self-identifying TITLE standing where the fiscal wording stands, and an ABSENCE —
