        WHAT SEPARATES THIS PROFILE FROM THOSE IS NOT ITS NUMBERS BUT ITS STANDING. RP-03 and RP-04
        are examples; RP-05 is the delivered corpus, carries the hashes that identify it, and
        records the threshold as CHECKED rather than as extrapolated.
      size:
        personas: 48
        claims_ordered: 384
        claims_built: 359
        documents: 666
        note: >
          Denominator: the whole run. The 25 claims ordered and not built ran out of annual balance —
          every documentable category of that persona had its limit spent, which is the limit
          mechanism working rather than a failure.
      document_types:
        invoice: 307
        bank_statement: 154
        payment_confirmation: 153
        fiscal_receipt: 52
        note: >
          🔴 DENOMINATOR 666 DOCUMENTS, AND THE MINIMUM OF 30 PER BUILDABLE CLASS IS CHECKED ON THIS
          RUN AND MET BY ALL FOUR — 52, 153, 154, 307. It is recorded as a MEASUREMENT of the
          delivered corpus and not as arithmetic on a smaller one: sizing a run by extrapolation is
          how a class lands at 28 and the threshold fails after the expensive part.

          The mix is uneven and nothing tuned it. `config/policy.yaml` declares `verdict_mix` and
          refuses a document mix, so a class count falls out of which verdicts are realizable and
          which archetypes exist. macro-F1 weights classes equally and therefore needs sufficient n
