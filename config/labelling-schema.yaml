    blocked_on: none

  - id: RC-10
    file: src/receipt_synth/policy_engine.py
    change: >
      `covered_fraction` and `evaluate_claim` raise when the line-item total is zero. A claim
      evidenced only by a payment confirmation has no lines and must still be evaluable.
      Related to RC-09 but not the same: this one changes what a verdict can be derived from.
    blocked_on: decision

  - id: RC-11
    file: src/receipt_synth/degrader.py, schemas.py
    status: the recipes are done in version 17; the naming and the fourth value are not
    change: >
      DONE: `degrade` no longer raises. `photo` and `scan` have calibrated recipes, the channel is
      drawn per document, and all three values of `Capture` occur in the data.

      STILL OPEN, and it is one question rather than two. The consumer calls the field `medium`,
      puts it on `ClaimFile` (the binary) rather than on the logical document, and gives it FOUR
      values including `digital_pdf`.

      🔴 THE FOURTH VALUE CANNOT BE CLOSED BY A FOURTH RECIPE, and this entry used to imply it
      could. Every member of `Capture` names a way a document was DAMAGED on its way to the
      verifier; a natively generated PDF is the undamaged original — the absence of a capture
      channel, not one of them. Adding it to this enum would put "nothing happened" in a
      vocabulary of things that happen. Four media, three channels. What it actually needs is
      either a separate field on the file, or the consumer's shape adopted whole, and that is a
      modelling decision rather than a missing branch.
    blocked_on: >
      decision — for the field's name, its home (file or document), and how the undamaged case is
      expressed. The recipes are no longer part of this entry.

  - id: RC-12
    file: src/receipt_synth/assembler.py, schemas.py
    change: >
      Model multi-document files. The consumer makes file-to-document segmentation a
      pipeline step and names this generator as the source of ground truth for the
      boundaries; today one image is one document and no label describes a region of a file.
    blocked_on: decision

  - id: RC-13
    file: src/receipt_synth/schemas.py
    change: >
      Reconcile `Verdict` with the consumer's `Decision` enum. PARTLY DONE, and what is done
      is recorded rather than removed, because the rest is a different question.

      DONE: `rejected` had no counterpart, and its definition matched the zero-coverage case
      the sources disagreed about. It is now a member of `Verdict`, `policy_engine` labels
      that case with it, and `verdict_mix` carries it with the share still undecided. See
